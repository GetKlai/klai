[project]
name = "klai-connector"
version = "0.1.0"
description = "External source connectors for Klai Knowledge via Unstructured.io"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.7.0",
    "unstructured[docx,pptx,xlsx]>=0.16.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "httpx[http2]>=0.28.0",
    "apscheduler>=3.10.0",
    "cryptography>=44.0.0",
    "gidgethub>=5.3.0",
    "PyJWT[crypto]>=2.9.0",
    "structlog>=25.0",
    "notion-sync-lib @ git+https://github.com/mvletter/notion-sync-lib.git",
    "minio>=7.2.0",
    "filetype>=1.2.0",
    "msal>=1.31",
    "trafilatura>=2.0,<3.0",
    # lxml is used directly by app/adapters/confluence.py via
    # BeautifulSoup(..., "lxml"). Was previously transitive-only via
    # trafilatura > {htmldate, justext} > lxml — making the import an
    # implicit dependency. Pinned ≥6.1.0 to clear CVE-2026-41066 (XXE in
    # iterparse / ETCompatXMLParser) per SPEC-CI-TRIVY-POLICY-001 PR #2.
    "lxml>=6.1.0",
    "klai-connector-credentials",
    "klai-image-storage",
    # SPEC-SEC-INTERNAL-001 REQ-4 + REQ-10: shared secret-scrubbing helpers used
    # by every upstream-error log/persist call site (incl. sync_run.error_details).
    "klai-log-utils",
    "pyairtable>=3.3.0",
    # Upper-bounded at <5: v5 split Confluence into Cloud/Server classes and
    # dropped ``get_page_by_id`` from the Cloud client, which is the method
    # ConfluenceAdapter.fetch_document() calls. Verified against 5.0.3:
    # Confluence(url=..., cloud=True).get_page_by_id -> AttributeError
    # ("'Cloud' object has no attribute 'get_page_by_id'"). The adapter test
    # patches the SDK class, so CI cannot catch this. Lift the bound only
    # together with a v5 migration of app/adapters/confluence.py.
    "atlassian-python-api>=4.0.7,<5",
    "html2text>=2025.4.15",
    "redis>=5.0",
    # SPEC-SEC-IDENTITY-ASSERT-003 REQ-2: replace JWT resourceowner trust
    # with portal /internal/identity/verify. IdentityAsserter provides
    # the canonical caller pattern (60s LRU cache, fail-closed,
    # structlog telemetry).
    "klai-identity-assert",
]

[tool.uv.sources]
klai-connector-credentials = { path = "../klai-libs/connector-credentials", editable = true }
klai-image-storage = { path = "../klai-libs/image-storage", editable = true }
klai-log-utils = { path = "../klai-libs/log-utils", editable = true }
klai-identity-assert = { path = "../klai-libs/identity-assert", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "G", "LOG", "ARG"]
ignore = ["B008"]  # Depends() in FastAPI endpoint defaults is standard pattern

[tool.ruff.lint.per-file-ignores]
# Unused arguments in tests are structural, not bugs: pytest fixtures are
# injected for their side effect (not read), and mock/stub signatures must
# mirror the real callable they replace even when a given test ignores some
# parameters. Enforcing ARG here would force churn without catching anything.
"tests/**" = ["ARG"]
# BaseAdapter.list_documents/get_cursor_state/post_sync share one call
# signature so sync_engine can invoke every adapter uniformly (see the
# adapter-framework-bleed pitfall in .claude/rules/klai/pitfalls). Airtable
# and Confluence are full-scan (no incremental cursor), so cursor_context is
# unused there; both cursor-state methods just return a timestamp, so
# connector is unused; the base class's post_sync default no-op takes
# connector only to keep every override's signature identical.
"app/adapters/airtable.py" = ["ARG002"]
"app/adapters/base.py" = ["ARG002"]
"app/adapters/confluence.py" = ["ARG002"]
"app/adapters/github.py" = ["ARG002"]
"app/adapters/json_feed.py" = ["ARG002"]
"app/adapters/notion.py" = ["ARG002"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.9",
]
