# Per-service Trivy ignore-list for klai-connector.
# Schema: SPEC-CI-TRIVY-POLICY-001 REQ-5 (id + ≥40-char statement + expired_at).

# 2026-09-25 re-evaluation: `trivy image --ignore-unfixed` against the
# current python:3.12-slim base (debian 13.7) reports 0 OS findings.
# CVE-2026-29111 (systemd, fixed at 257.13-1~deb13u1) and CVE-2026-4878
# (libcap2, fixed at 1:2.75-10+deb13u1) are both resolved at the installed
# version already — entries removed. CVE-2025-69720 (ncurses) remains
# unfixed upstream and is renewed below.
vulnerabilities:
  - id: CVE-2025-69720
    statement: |
      ncurses out-of-bounds read in tic compiler (terminfo description
      compiler). Affects ncurses-bin / ncurses-base / libtinfo6 /
      libncursesw6, installed version 6.5+20250216-2 in the current
      python:3.12-slim (debian 13.7) base. Debian's security tracker
      lists this "no-dsa" (minor issue, no fix planned) for trixie — no
      fixed_version exists, so the STRICT-tier scan's `--ignore-unfixed`
      flag already excludes it from gating; this entry documents the
      finding for Security-tab visibility per docs/runbooks/
      trivy-policy.md troubleshooting table. klai-connector runs uvicorn
      as the only entrypoint and never invokes the tic compiler or any
      ncurses-using TUI. Re-evaluate when Debian's security tracker
      records a fixed_version for trixie.
    expired_at: 2027-03-25
  - id: CVE-2026-112940
    statement: |
      filelock 3.32.7, ReadWriteLock: SQLite reopens the lock database by
      name, so a planted symlink or journal file can redirect a write. Fixed
      only in filelock 4.2.1, and unstructured (latest 0.27.35) requires
      filelock<4, so lock file maintenance cannot move it. Not reachable:
      the only filelock call in the image is unstructured's plain FileLock
      in unstructured/nlp/tokenize.py, klai-connector imports none, and
      ReadWriteLock is never constructed. pip-audit ignores the same ID in
      .github/workflows/klai-connector.yml. Remove both when unstructured
      allows filelock 4.
    expired_at: 2027-01-28
