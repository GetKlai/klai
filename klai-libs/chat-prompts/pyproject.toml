[project]
name = "klai-chat-prompts"
version = "0.1.0"
description = "Shared chat system-prompt constants for Klai services (SPEC-RAG-MULTILINGUAL-CHAT-001)."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Klai" }]

# langid powers klai_chat_prompts.language (conversation-level language
# decisions): BSD, pure Python, model embedded in the package, needs numpy.
# The LiteLLM container cannot pip-install, so it carries a vendored copy of
# langid next to the flat module instead (see NOTICES.md). All other consumers
# (portal-backend, retrieval-api) get langid through this path-dependency.
dependencies = ["langid>=1.1.6"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["klai_chat_prompts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]
ignore = [
    "S101",  # assert is fine in tests
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
