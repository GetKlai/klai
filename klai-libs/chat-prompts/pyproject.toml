[project]
name = "klai-chat-prompts"
version = "0.1.0"
description = "Shared chat system-prompt constants for Klai services (SPEC-RAG-MULTILINGUAL-CHAT-001)."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Klai" }]

# This library has zero runtime dependencies — it exposes string
# constants only. Keeping it dependency-free means consumers can import
# without dragging in extra wheels at install time.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["klai_chat_prompts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]
ignore = [
    "S101",  # assert is fine in tests
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
