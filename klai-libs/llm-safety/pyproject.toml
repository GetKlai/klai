[project]
name = "klai-llm-safety"
version = "0.1.0"
description = "Shared LLM input/context/output safety policy for Klai services."
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Klai" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyyaml>=6",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["klai_llm_safety"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]
ignore = [
    "S101",
]

[tool.ruff.lint.per-file-ignores]
# The homoglyph translate table in policy.py intentionally uses look-alike
# Cyrillic/Greek/fullwidth characters as KEYS — that's the whole point of the
# fold. Disable RUF001/RUF003 for that file.
"klai_llm_safety/policy.py" = ["RUF001", "RUF003"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
