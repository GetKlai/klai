<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Widget preview</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #fffef2; font-family: system-ui, -apple-system, sans-serif; }
    #klai-fullscreen-chat { position: fixed; inset: 0; }
    .klai-preview-error { padding: 24px; color: #C0392B; font-size: 14px; }
  </style>
</head>
<body>
  <div id="klai-fullscreen-chat"></div>
  <script>
    // Read widget params from URL — set by the portal test page that
    // iframes this file. Static HTML means klai-chat.js sees its own
    // <script> tag as document.currentScript (works reliably; the React
    // dynamic-createElement path made it null and inline mode failed).
    (function () {
      var p = new URLSearchParams(location.search);
      var widgetId = p.get('widget_id');
      var title = p.get('title') || '';
      var welcome = p.get('welcome') || '';
      if (!widgetId) {
        document.body.innerHTML = '<div class="klai-preview-error">Missing widget_id query parameter.</div>';
        return;
      }
      var s = document.createElement('script');
      s.src = 'https://my.getklai.com/widget/klai-chat.js';
      s.setAttribute('data-widget-id', widgetId);
      s.setAttribute('data-mode', 'inline');
      s.setAttribute('data-container', '#klai-fullscreen-chat');
      if (title) s.setAttribute('data-title', title);
      if (welcome) s.setAttribute('data-welcome', welcome);
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
