# Per-service Trivy ignore-list for portal-api.
# Schema reference: https://trivy.dev/v0.69/docs/configuration/filtering/
# Policy: SPEC-CI-TRIVY-POLICY-001 REQ-5 — every entry SHALL include
#   `id`, `statement` (concrete rationale, not "low priority"),
#   and `expired_at` (YYYY-MM-DD, ≤12 months from creation).
#
# This file is referenced by .github/workflows/portal-api.yml via
# `trivyignores:` (added in PR #3 of SPEC-CI-TRIVY-POLICY-001).

vulnerabilities:
  - id: GHSA-6v7p-g79w-8964
    statement: |
      msgpack 1.1.2 lives in the python:3.13-slim base-image site-packages
      (bundled interpreter tooling), NOT in portal-api's uv.lock — the app
      venv is built by uv and contains no msgpack. The vulnerable code path
      (Unpacker reuse after a caught error) requires the application to
      deserialise msgpack input, which portal-api never does.

      Re-evaluate when the python:3.13-slim base image ships msgpack >= 1.2.1
      or drops the package.
    expired_at: 2026-11-01
    purls:
      - "pkg:pypi/msgpack@1.1.2"

  - id: CVE-2025-47273
    statement: |
      setuptools 70.3.0 lives in the python:3.13-slim base-image
      site-packages (interpreter tooling), NOT in portal-api's uv.lock. The
      vulnerable path (PackageIndex.download path traversal) only triggers
      when installing packages at runtime; the container never invokes
      setuptools/pip after the image is built — uv resolves everything at
      build time.

      Re-evaluate when the python:3.13-slim base image ships
      setuptools >= 78.1.1.
    expired_at: 2026-11-01
    purls:
      - "pkg:pypi/setuptools@70.3.0"

  - id: CVE-2026-97687
    statement: |
      urllib3 2.7.0 lives in the python:3.13-slim base-image site-packages
      (pip's own dependency), NOT in portal-api's uv.lock, which pins
      urllib3 2.8.0 in the application venv (bumped 2026-09-30 for the same
      advisories). The container never invokes pip after the image is built;
      the application's HTTP clients import the venv's copy.

      Re-evaluate when the python:3.13-slim base image ships urllib3 >= 2.8.0.
    expired_at: 2027-04-12
    purls:
      - "pkg:pypi/urllib3@2.7.0"

  - id: CVE-2026-97689
    statement: |
      Same base-image copy of urllib3 2.7.0 as CVE-2026-97687 above; the
      application venv has 2.8.0 and pip is never run in the container.

      Re-evaluate when the python:3.13-slim base image ships urllib3 >= 2.8.0.
    expired_at: 2027-04-12
    purls:
      - "pkg:pypi/urllib3@2.7.0"
