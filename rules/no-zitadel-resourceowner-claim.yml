# SPEC-SEC-IDENTITY-ASSERT-002 REQ-5.2 + SPEC-003 REQ-3 — block
# reintroduction of the urn:zitadel:iam:user:resourceowner:id JWT claim
# in production code.
#
# Why: per .claude/rules/klai/platform/zitadel.md:99-100 the claim is not
# always present in Klai access tokens (the BFF never requests the scope
# that emits it). Any auth/authz path that reads it inherits a latent
# bug: it works for users whose IdP happens to emit the claim and
# silently fails for everyone else. The authoritative org-resolution
# pattern is sub → portal_users → portal_orgs.
#
# This rule pattern-matches the literal claim string. Comments and
# documentation that *reference* the claim by name (to explain why we
# don't use it) live in test files, the SPEC document, and the
# zitadel.md rule — all on the allow-list below.

id: no-zitadel-resourceowner-claim
language: python
severity: error
message: |
  urn:zitadel:iam:user:resourceowner:id is unreliable (the BFF never
  requests the scope that emits it). Per SPEC-SEC-IDENTITY-ASSERT-002
  resolve org via portal_users + portal_orgs join keyed on
  zitadel_user_id (the OIDC sub). See
  .claude/rules/klai/platform/zitadel.md:99-100 for the canonical pattern.

rule:
  pattern: '"urn:zitadel:iam:user:resourceowner:id"'

# Apply to all Klai service production code. SPEC-002 cleaned
# portal-api + scribe-api + portal /api/me; SPEC-003 cleaned
# klai-retrieval-api + klai-connector. After SPEC-003 this rule has
# FULL coverage of the active codebase — no service is scoped out.
files:
  - klai-portal/backend/app/**/*.py
  - klai-scribe/scribe-api/app/**/*.py
  - klai-knowledge-mcp/**/*.py
  - klai-libs/identity-assert/klai_identity_assert/**/*.py
  - klai-mailer/app/**/*.py
  - klai-retrieval-api/retrieval_api/**/*.py
  - klai-connector/app/**/*.py

# Test fixtures + regression guards may name the claim string to verify
# that production code IGNORES it. Keep this list narrow.
ignores:
  - "**/tests/**"
  - "**/test_*.py"
