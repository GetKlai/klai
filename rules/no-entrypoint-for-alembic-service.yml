# SPEC-INGEST-ALEMBIC-001 AC-5
# Guard: if a service has an alembic/ directory, it MUST have an entrypoint.sh
# that calls alembic upgrade head before exec-ing the app.
# This rule detects Dockerfiles that have CMD but no ENTRYPOINT pointing to
# an entrypoint.sh -- the scribe-deploy-no-alembic pitfall.
#
# Implementation note: ast-grep matches shell/Dockerfile syntax at file level.
# This rule targets Dockerfiles: it fires when CMD appears without ENTRYPOINT.
# Run: sg scan --rule rules/no-entrypoint-for-alembic-service.yml <Dockerfile>
id: no-entrypoint-for-alembic-service
message: >
  Service has alembic/ but Dockerfile uses CMD without ENTRYPOINT.
  Add an entrypoint.sh that runs "alembic upgrade head" before exec "".
  See scribe-deploy-no-alembic pitfall in .claude/rules/klai/pitfalls/process-rules.md.
severity: error
language: Dockerfile
rule:
  pattern: CMD 224354
  not:
    any:
      - has:
          kind: instruction
          regex: ENTRYPOINT
note: >
  Every klai service with alembic/ MUST have an entrypoint.sh that auto-migrates.
  Pattern: entrypoint.sh runs "alembic upgrade head" then "exec ".
  Reference services: klai-connector, portal-api, scribe-api.
