name: Deploy-script tests

# The shell that runs the deploys had no pre-merge coverage.
#
# deploy-compose.yml, litellm-hook-deploy.yml and deploy-librechat-config.yml
# all run test suites, and all three are push-to-main only — they SSH to
# production, so a pull_request trigger is not something to hand out. The
# consequence was that a change to compose-up.sh, which decides whether every
# service deploy counts as successful, reached main with its tests never having
# run, and the first execution of the new code was the one installing it on
# core-01.
#
# This job is the pre-merge half: same suites, no secrets, no SSH, no deploy.
# The push-triggered runs stay exactly as they are — this does not replace them,
# it stops them from being the first time anyone finds out.

on:
  pull_request:
    paths:
      - 'deploy/scripts/**'
      - 'scripts/mistral-api-probe.sh'
      - 'scripts/widget-probe.py'
      - 'scripts/check-vexa12-deploy-preconditions.sh'
      - '.github/workflows/**'
      - 'deploy/librechat/tests/**'
      - 'deploy/tests/test-portal-api-oneoff.sh'
      - 'deploy/tests/test-retrieval-api-oneoff.sh'
      - '**/Dockerfile'
      - '**/Dockerfile.*'
      - '.claude/hooks/klai/container-hygiene-preflight.sh'
      - '.claude/hooks/klai/tests/**'
      - '.github/workflows/deploy-scripts-tests.yml'
      - 'renovate.json5'
      - 'deploy/docker-compose.yml'
      - 'scripts/test-renovate-config.sh'
      - 'scripts/check-version-drift.sh'
      - 'scripts/tests/check-version-drift.test.sh'
      - 'scripts/check-expand-contract.py'
      - 'scripts/tests/test_check_expand_contract.py'
  push:
    branches: [main]
    paths:
      - 'deploy/scripts/**'
      - 'scripts/mistral-api-probe.sh'
      - 'scripts/widget-probe.py'
      - 'scripts/check-vexa12-deploy-preconditions.sh'
      - '.github/workflows/**'
      - 'deploy/librechat/tests/**'
      - 'deploy/tests/test-portal-api-oneoff.sh'
      - 'deploy/tests/test-retrieval-api-oneoff.sh'
      - '**/Dockerfile'
      - '**/Dockerfile.*'
      - '.claude/hooks/klai/container-hygiene-preflight.sh'
      - '.claude/hooks/klai/tests/**'
      - '.github/workflows/deploy-scripts-tests.yml'
      - 'renovate.json5'
      - 'deploy/docker-compose.yml'
      - 'scripts/test-renovate-config.sh'
      - 'scripts/check-version-drift.sh'
      - 'scripts/tests/check-version-drift.test.sh'
      - 'scripts/check-expand-contract.py'
      - 'scripts/tests/test_check_expand_contract.py'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Syntax first: a script that does not parse cannot be installed, and the
      # error is clearer here than three steps into a deploy.
      - name: Parse every deploy script
        run: |
          set -e
          for script in deploy/scripts/*.sh; do
            bash -n "$script"
          done

      # The shell inside the workflows themselves had no parser either. An edit
      # to deploy-compose.yml dropped an `esac` on 2026-09-18: YAML still parsed,
      # every check stayed green, and the break would have surfaced on core-01
      # mid-deploy — after the new compose file was in place and before anything
      # was recreated.
      - name: Parse the shell inside every workflow
        run: python3 scripts/check-workflow-shell-syntax.py

      # renovate.yml runs this contract before every Renovate run, but only on
      # main: on 2026-09-24 a comment quoting a checked setting broke it, and
      # every scheduled run failed for 18 hours before anyone saw it.
      - name: Renovate configuration contracts
        run: sh scripts/test-renovate-config.sh

      # The drift alarm is what makes a stuck Renovate update visible; a filter
      # that stops matching would silence it without any run turning red.
      - name: Version drift alarm
        run: bash scripts/tests/check-version-drift.test.sh

      # Renovate automerges Twenty one minor per PR, but nothing orders the
      # merges. Only the next hop may go green; see check-twenty-hop.sh.
      - name: Twenty moves one minor at a time
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git show FETCH_HEAD:deploy/docker-compose.yml > "$RUNNER_TEMP/base-compose.yml"
          bash deploy/scripts/check-twenty-hop.sh "$RUNNER_TEMP/base-compose.yml" deploy/docker-compose.yml

      - name: Twenty hop and upgrade-check suites
        run: |
          bash deploy/scripts/tests/check-twenty-hop.test.sh
          bash deploy/scripts/tests/check-twenty-upgrade.test.sh

      - name: public script ownership suite
        run: bash deploy/scripts/tests/status-monitoring.test.sh

      # The probe is the only signal that a customer gets an answer; a probe
      # that mis-reads a good or a bad answer is worse than none.
      - name: widget probe verdict suite
        run: bash deploy/scripts/tests/widget-probe.test.sh

      - name: compose-up.sh verification suite
        run: bash deploy/scripts/tests/compose-up-verify.test.sh

      - name: env-drift recreate suite
        run: bash deploy/scripts/tests/compose-env-drift-recreate.test.sh

      # The rollback path only runs when a deploy has already failed, so it is
      # the one branch production never exercises by accident.
      - name: deploy-with-rollback suite
        run: bash deploy/scripts/tests/deploy-with-rollback.test.sh

      # Gate 4 reads VictoriaLogs after a green deploy: a query error must not
      # roll back, a real breach must.
      - name: post-deploy error-watch suite
        run: bash deploy/scripts/tests/post-deploy-error-watch.test.sh

      # The weekly rehearsal's verdict logic: a bad image that deploys as
      # healthy must end red, not green.
      - name: rollback-rehearsal assertion suite
        run: bash deploy/scripts/tests/rollback-rehearsal-assert.test.sh

      # A red gate in deploy-compose.yml puts the previous files back; a helper
      # that restores the wrong set of files turns a bad deploy into a worse one.
      - name: compose rollback suite
        run: bash deploy/scripts/tests/compose-rollback.test.sh

      # The E2E-triggered replay: which ledger lines it undoes, and that it
      # never undoes the same deploy twice.
      - name: rollback-since replay suite
        run: bash deploy/scripts/tests/rollback-since.test.sh

      # Its data half: a restore that drops the wrong database, or restores past
      # the 30-minute window, loses customer writes.
      - name: datastore rollback suite
        run: bash deploy/scripts/tests/datastore-rollback.test.sh

      - name: LibreChat regenerate suite
        run: bash deploy/scripts/tests/tenant-config-regenerate.test.sh

      # A shipped image that does not patch its base OS is a deploy the Trivy
      # gate will block — for whoever happens to touch that service next, not
      # for whoever left it unpatched.
      - name: base-image security-update guard suite
        run: bash deploy/scripts/tests/check-dockerfile-security-updates.test.sh

      - name: assert-safe-to-prune guard suite
        run: sh deploy/scripts/tests/assert-safe-to-prune.test.sh

      - name: klai-librechat digest guard suite
        run: sh deploy/scripts/tests/check-klai-librechat-digest.test.sh

      # The orphan audit and the preflight hook are the two things standing
      # between a cleanup pass and the librechat-voys incident. Both gained a
      # container class today; neither had coverage before.
      - name: orphan-audit managed-class suite
        run: bash deploy/scripts/tests/docker-orphan-audit-klasse-c.test.sh

      - name: orphan-audit caddy-route suite
        run: bash deploy/scripts/tests/docker-orphan-audit-caddy-routes.test.sh

      - name: orphan-audit hand-edit suite
        run: bash deploy/scripts/tests/docker-orphan-audit-hand-edits.test.sh

      - name: bot host-isolation suite (SPEC-SEC-022)
        run: bash deploy/scripts/tests/harden-docker-user-bot-isolation.test.sh

      - name: backup retention suite
        run: bash deploy/scripts/tests/backup-retention.test.sh

      # Local retention drops to 7 day-sets, so the budget is small enough that
      # the partial directories a failed night leaves behind could spend it.
      - name: backup retention partial-set suite
        run: bash deploy/scripts/tests/backup-retention-partial-sets.test.sh

      # A Redis-protocol dump is copied only after its BGSAVE has finished.
      - name: backup BGSAVE wait suite
        run: bash deploy/scripts/tests/backup-bgsave-wait.test.sh

      # Two runs on one date leave a complete-looking broken set; the second refuses.
      - name: backup single-run lock suite
        run: bash deploy/scripts/tests/backup-single-run.test.sh

      - name: portal-api deploy disk-guard suite
        run: bash deploy/scripts/tests/deploy-portal-api-disk-guard.test.sh

      # The portal-api rollback runs only after its migrations already landed,
      # so it is the one branch where an image rollback meets a newer schema.
      - name: portal-api deploy rollback suite
        run: bash deploy/scripts/tests/deploy-portal-api-rollback.test.sh

      # The expand-then-contract check guards what that rollback relies on.
      - name: expand-then-contract check suite
        run: python3 -m unittest scripts/tests/test_check_expand_contract.py

      - name: portal-api one-off clone suite
        run: bash deploy/tests/test-portal-api-oneoff.sh

      - name: retrieval-api one-off clone suite
        run: bash deploy/tests/test-retrieval-api-oneoff.sh

      # The Vexa host-readiness checks are run by hand over SSH, which is
      # precisely why they rotted unnoticed: a guard nobody executes on a
      # schedule cannot report that it stopped working. Its third check reported
      # OK for a week against a container deleted in #914.
      - name: vexa12 host-readiness suite
        run: bash deploy/scripts/tests/check-vexa12-preconditions.test.sh

      - name: container-hygiene preflight suite
        run: bash .claude/hooks/klai/tests/container-hygiene-preflight.test.sh
