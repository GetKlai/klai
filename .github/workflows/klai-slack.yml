name: Build and push klai-slack

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'klai-slack/**'
      - 'klai-libs/log-utils/**'
      - '.github/workflows/klai-slack.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  # Opt in early to Node 24 for all JS-based actions (Node 20 EOL Sept 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Lint -> types -> tests, all gating the image build. pip-audit mirrors the
  # mailer: external deps only, klai-log-utils is an editable path dep.
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: klai-slack
    # The repository tests (migrations up and down, purge) need a real
    # PostgreSQL; without it they skip and a broken migration only shows at deploy.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: klai
          POSTGRES_PASSWORD: klai
          POSTGRES_DB: klai_slack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U klai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (pyright)
        run: uv run pyright

      - name: Dependency vulnerability scan (pip-audit)
        run: uv run --with pip-audit pip-audit --skip-editable

      - name: Test (pytest)
        run: uv run pytest -q --tb=short

      - name: Test against PostgreSQL (migrations, repository)
        env:
          SLACK_TEST_DATABASE_URL: postgresql+asyncpg://klai:klai@localhost:5432/klai_slack
        run: uv run pytest -q --tb=short -m postgres

  build-push:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # SPEC-SEC-INTERNAL-001 REQ-6: ban `==` / `!=` on secret-shaped variables
      # across the whole klai-slack app tree. Each rule's own `files:` filter
      # already scopes to klai-slack/app/**/*.py and ignores tests; this step
      # broadens the action's scan path so the rules are actually exercised.
      - name: Guard — no string-compare on secret (SPEC-SEC-INTERNAL-001 REQ-6)
        uses: ast-grep/action@cf62e780f0c88301228978d593a7784427a097a6  # v1.5.0
        with:
          config: sgconfig.yml
          paths: klai-slack/app

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build and push klai-slack
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          # SPEC-LOGGING-EXTRACT-001: build from repo root so the Dockerfile
          # can COPY the shared klai-libs/log-utils path dep.
          context: .
          file: klai-slack/Dockerfile
          push: true
          # `:latest` is published only for main. The SHA tag stays
          # unconditional so non-main builds cannot overwrite production's
          # mutable tag.
          tags: |
            ghcr.io/getklai/klai-slack:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/getklai/klai-slack:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
    steps:
      # Checkout is required so trivy-action can find .trivy.yaml + the
      # service's .trivyignore.yaml (paths are relative to repo root).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # STRICT-tier scan per SPEC-CI-TRIVY-POLICY-001 (REQ-2).
      #
      # Direct CLI invocation bypasses an aquasecurity/trivy-action
      # bug (0.35.0/0.36.0): with `format: sarif` the `severity` filter
      # is honoured for the SARIF body but NOT for the exit-code, so
      # a MEDIUM/LOW finding triggers exit-code 1 even when we asked
      # for CRITICAL+HIGH gating. trivy CLI's `--severity` flag is
      # honoured for both detection AND exit-code. .trivy.yaml stays
      # in the repo as the canonical policy reference until the
      # action lands proper config-file precedence.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          version: v0.76.1
          cache: true

      - name: Run Trivy vulnerability scanner
        run: |
          trivy image \
            --format sarif \
            --output trivy-results.sarif \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --scanners vuln \
            --exit-code 1 \
            ghcr.io/getklai/klai-slack:${{ github.sha }}
      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  deploy:
    # Opt-in until the secrets are in place: every klai-slack secret is a
    # startup validator, so rolling the image before the SOPS entries and the
    # klai_slack database exist is a restart loop (the klai-mailer incident of
    # 2026-05-05 had the same shape). Set the repository variable
    # KLAI_SLACK_DEPLOY=true after the first manual deploy in
    # docs/runbooks/slack-integration.md has gone green.
    if: github.ref == 'refs/heads/main' && vars.KLAI_SLACK_DEPLOY == 'true'
    # `needs: scan` lets the Trivy gate block the rollout.
    needs: [build-push, scan]
    runs-on: ubuntu-latest

    steps:
      # Start time of the deploy, so the rollback report fetched afterwards
      # can be told apart from one left by an earlier attempt of the same commit.
      - name: Mark deploy start
        id: deploy-start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Deploy only on main-branch pushes, never from PR builds.
      - name: Deploy to core-01
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        with:
          host: ${{ secrets.CORE01_HOST }}
          username: klai
          key: ${{ secrets.CORE01_DEPLOY_KEY }}
          script: |
            set -e
            source /opt/klai/.env
            # SPEC-INFRA-CONTAINER-HYGIENE-001 REQ-3
            # SPEC-INFRA-AUTO-ROLLBACK-001: deploys the exact sha, rolls back on a red gate.
            test -x /opt/klai/scripts/deploy-with-rollback.sh
            /opt/klai/scripts/deploy-with-rollback.sh klai-slack ghcr.io/getklai/klai-slack:${{ github.sha }} --probe http://klai-slack:8000/health

      # SPEC-INFRA-AUTO-ROLLBACK-001 S4: hand the rollback report to
      # ci-failure-notice.yml. The report file stays on core-01 between runs, so
      # only one written by this attempt counts (this commit, written after the
      # deploy step started); a green deploy, or one that never reached the
      # script, leaves no artifact.
      - name: Fetch rollback report
        id: rollback-report
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        with:
          host: ${{ secrets.CORE01_HOST }}
          username: klai
          key: ${{ secrets.CORE01_DEPLOY_KEY }}
          capture_stdout: true
          script: cat /opt/klai/deploy-reports/klai-slack.json 2>/dev/null || true

      - name: Keep rollback report
        continue-on-error: true
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REPORT: ${{ steps.rollback-report.outputs.stdout }}
          STARTED: ${{ steps.deploy-start.outputs.at }}
        run: |
          [ -n "$STARTED" ] || exit 0
          report="$(printf '%s\n' "$REPORT" | grep -m1 '^{' || true)"
          if printf '%s' "$report" | jq -e --arg sha "$GITHUB_SHA" --arg since "$STARTED" '.commit == $sha and .ts >= $since and .outcome != "deployed"' >/dev/null 2>&1; then
            printf '%s\n' "$report" > rollback-report.json
          fi

      - name: Upload rollback report
        continue-on-error: true
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rollback-report
          path: rollback-report.json
          retention-days: 30
          if-no-files-found: ignore
