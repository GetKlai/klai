name: Deploy LiteLLM hooks

on:
  push:
    branches: [main]
    paths:
      - 'deploy/litellm/**'
      - '.github/workflows/litellm-hook-deploy.yml'
  # A compose change reaches core-01 through deploy-compose.yml only (it keeps
  # the .prev copies, takes the data-store snapshots and runs the gates, slice
  # S3/S8a). Until 2026-10-28 this workflow also ran on deploy/docker-compose.yml
  # and rsynced the file itself, faster than the sync, so the sync saw no
  # change, kept no previous copy and took no snapshot. It now runs after a
  # green sync and recreates LiteLLM from the file the sync installed.
  workflow_run:
    workflows: ['Sync docker-compose.yml + config + smoke-test to core-01']
    types: [completed]
    branches: [main]

# Never beside the compose sync: both recreate containers on core-01.
concurrency:
  group: deploy-compose-core-01
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # This workflow is the second place compose-up.sh is installed on core-01
      # (the sync step below), so it has to be the second place its tests run.
      # Otherwise whichever workflow wins the race can put an untested version
      # of the script that decides every deploy's verdict onto the server.
      - name: Test compose-up.sh
        run: bash deploy/scripts/tests/compose-up-verify.test.sh

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555  # v0.10.0
        with:
          ssh-private-key: ${{ secrets.CORE01_DEPLOY_KEY }}

      - name: Add core-01 to known_hosts
        run: ssh-keyscan -H ${{ secrets.CORE01_HOST }} >> ~/.ssh/known_hosts

      # core-01 sshd runs MaxStartups 10:30:100; pre-auth scanner load made it
      # randomly drop new handshakes on 2026-09-09 (three deploy failures in a
      # row, 21:28-21:31, all `Connection closed by ... port 22` = exit 255).
      # One dropped connection must not fail a production deploy, so every
      # rsync/ssh below runs through this retry helper. It is written and
      # tested here and sourced by each deploy step, so the loop exists once.
      - name: Test retry helper
        run: |
          cat > "$RUNNER_TEMP/ssh-retry.sh" <<'EOF'
          # retry CMD...: run CMD; on exit 255 (ssh/rsync connection drop)
          # try up to 5 attempts with a growing pause. Any other non-zero
          # exit fails immediately, as before.
          retry() {
            local attempt delay=${RETRY_BASE_DELAY:-5} rc
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              rc=$?
              [ "$rc" -ne 255 ] && return "$rc"
              [ "$attempt" -eq 5 ] && return "$rc"
              echo "retry $attempt/5: command exited 255, sleeping ${delay}s: $*" >&2
              sleep "$delay"
              delay=$((delay * 2))
            done
          }
          EOF
          export RETRY_BASE_DELAY=0
          source "$RUNNER_TEMP/ssh-retry.sh"

          attempts=0
          flaky_255() {
            attempts=$((attempts + 1))
            if [ "$attempts" -lt 3 ]; then
              return 255
            fi
            return 0
          }
          rc=0
          retry flaky_255 || rc=$?
          if [ "$rc" -ne 0 ] || [ "$attempts" -ne 3 ]; then
            echo "FAIL: 255-then-success: rc=$rc after $attempts attempts (want rc=0 after 3)" >&2
            exit 1
          fi

          attempts=0
          exit_1() {
            attempts=$((attempts + 1))
            return 1
          }
          rc=0
          retry exit_1 || rc=$?
          if [ "$rc" -ne 1 ] || [ "$attempts" -ne 1 ]; then
            echo "FAIL: exit-1: rc=$rc after $attempts attempts (want rc=1 after 1)" >&2
            exit 1
          fi
          echo "retry helper ok"

      - name: Sync hook files to core-01
        run: |
          source "$RUNNER_TEMP/ssh-retry.sh"
          retry rsync -av deploy/litellm/ klai@${{ secrets.CORE01_HOST }}:/opt/klai/litellm/
          # SPEC-SEC-SERVICE-AUTH-002 removed the vendored ZitadelTokenClient;
          # the rsync above has no --delete, so drop the now-orphaned host file.
          retry ssh klai@${{ secrets.CORE01_HOST }} 'rm -f /opt/klai/litellm/klai_service_auth.py'
          # docker-compose.yml and compose-up.sh are installed by deploy-compose.yml.

      # SPEC-INFRA-CONTAINER-HYGIENE-001 REQ-3 — use the canonical
      # compose-up wrapper (already used by caddy, klai-connector,
      # klai-mailer, knowledge-ingest, klai-knowledge-mcp, docs-app).
      #
      # Why not `docker compose restart litellm`: `restart` keeps the
      # existing container env intact — it ignores docker-compose.yml
      # mount + env-var changes, so a new bind-mount is silently dropped
      # and the proxy crashloops on ImportError.
      #
      # Why --force-recreate: stock `docker compose up -d` only recreates
      # when the compose DEFINITION diffs (volume list, env-vars, image
      # tag). It does NOT detect bind-mount FILE CONTENT changes. The
      # litellm container imports custom_router.py / klai_context.py / the
      # PII hooks at module load — without --force-recreate, an
      # rsync of a new Python file is followed by a no-op `up -d` and
      # Python keeps the cached module from the previous boot. Net
      # effect: PR merged → CI green → live container still runs the
      # OLD code until someone manually recreates. See
      # pitfall `bind-mount-content-vs-python-module-cache`.
      #
      # Keep docker-compose.yml synced in this workflow too. New LiteLLM
      # Python modules are bind-mounted explicitly, so a hook-only deploy must
      # not recreate the container against a stale compose file that does not
      # expose the new module at /app.
      - name: Recreate LiteLLM container
        run: |
          source "$RUNNER_TEMP/ssh-retry.sh"
          retry ssh klai@${{ secrets.CORE01_HOST }} "/opt/klai/scripts/compose-up.sh --force-recreate litellm"

      - name: Smoke LiteLLM hook imports
        run: |
          source "$RUNNER_TEMP/ssh-retry.sh"
          retry ssh klai@${{ secrets.CORE01_HOST }} \
            "docker exec klai-core-litellm-1 python -c 'import custom_router, klai_context, klai_pii_enforce; print(\"litellm hook imports ok\")'"
