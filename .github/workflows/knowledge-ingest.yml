name: Build and push knowledge-ingest

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'klai-knowledge-ingest/**'
      - 'klai-libs/connector-credentials/**'
      - 'klai-libs/image-storage/**'
      - 'klai-libs/kb-slugs/**'
      - 'klai-libs/llm-throttle/**'
      - 'klai-libs/graphiti-compat/**'
      - '.github/workflows/knowledge-ingest.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  # Opt in early to Node 24 for all JS-based actions (Node 20 EOL Sept 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # knowledge-ingest had NO automated test gate: its ~1100 pytest tests only ran
  # locally, so changes merged + auto-deployed to prod without CI ever running
  # them (the suite had drifted red, unnoticed, for an unknown period). This job
  # closes that gap and gates the build/deploy on a green suite. All external
  # services (Postgres/Qdrant/TEI/FalkorDB/LiteLLM/portal) are mocked, so no
  # service containers are needed.
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: klai-knowledge-ingest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.6"
          python-version: "3.12"
          enable-cache: true
      # Dependency vulnerability gate. This service had 8 findings that went
      # unnoticed for weeks because nothing scanned it — Renovate only bumps
      # DECLARED deps in pyproject.toml, so vulnerable TRANSITIVE pins in
      # uv.lock (h2, idna, ...) drift silently. Mirrors portal-api /
      # knowledge-mcp: runs against the locked tree before pytest, so a
      # regression in any direct or transitive package surfaces here.
      # --skip-editable keeps the gate on external deps; internal klai-libs
      # are editable path deps, not PyPI releases.
      #
      # The two --ignore-vuln entries have NO fix available upstream and are
      # not reachable in our usage. Re-check when ragas ships a release:
      #   PYSEC-2026-3046  ragas   SSRF in the MULTI-MODAL faithfulness
      #                            collection. We import only the text metrics
      #                            (AnswerRelevancy, ContextPrecision,
      #                            ContextRecall, Faithfulness) in
      #                            knowledge_ingest/eval/judge_client.py.
      #   PYSEC-2026-2447  diskcache  unsafe pickle deserialization, pulled in
      #                            transitively by ragas. Local attack vector
      #                            (AV:L) + user interaction; the cache dir is
      #                            container-internal and not attacker-writable.
      - name: Lint (ruff)
        run: uv run --frozen --extra dev ruff check .

      - name: Format check (ruff)
        run: uv run --frozen --extra dev ruff format --check .

      - name: Dependency vulnerability scan (pip-audit)
        run: >
          uv run --with pip-audit pip-audit --skip-editable
          --ignore-vuln PYSEC-2026-3046
          --ignore-vuln PYSEC-2026-2447

      - name: Test (pytest)
        run: uv run --frozen --extra dev pytest -q --tb=short -n auto

  durability-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: klai-knowledge-ingest
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_USER: klai
          POSTGRES_PASSWORD: klai
          POSTGRES_DB: checkpoint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U klai -d checkpoint_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://klai:klai@localhost:5432/checkpoint_test
      CRAWL_CHECKPOINT_TEST_DSN: postgresql://klai:klai@localhost:5432/checkpoint_test
      KNOWLEDGE_INGEST_SECRET: test-secret-value-123
      PORTAL_INTERNAL_TOKEN: test-portal-internal-token-456
      GITEA_WEBHOOK_SECRET: test-gitea-webhook-secret-789
      ENRICHMENT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.6"
          python-version: "3.12"
          enable-cache: true
      - name: Prepare Alembic version schema
        run: psql "$CRAWL_CHECKPOINT_TEST_DSN" -v ON_ERROR_STOP=1 -c "CREATE SCHEMA knowledge"
      - name: Migrate fresh PostgreSQL
        run: uv run --frozen --extra dev alembic upgrade head
      - name: Test durable crawl recovery against PostgreSQL
        run: >-
          uv run --frozen --extra dev pytest
          tests/integration/test_crawl_checkpoint_postgres.py
          -q --tb=short

  build-push:
    needs: [quality, durability-postgres]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # SPEC-SEC-CORS-001 REQ-6 — CORSMiddleware must be the LAST add_middleware
      # call in this service's entry module. Rule lives at
      # rules/cors_middleware_last.yml, configured by sgconfig.yml at repo root.
      # `uses:` steps ignore the job's defaults.run.working-directory and run
      # from $GITHUB_WORKSPACE, so the relative paths resolve correctly.
      - name: Guard — CORSMiddleware must be last (SPEC-SEC-CORS-001 REQ-6)
        uses: ast-grep/action@cf62e780f0c88301228978d593a7784427a097a6  # v1.5.0
        with:
          config: sgconfig.yml
          paths: klai-knowledge-ingest/knowledge_ingest/app.py

      # SPEC-INGEST-QUEUE-SEPARATION-001 REQ-1 + REQ-4 — every Procrastinate
      # task module must use a constant from knowledge_ingest.queues, never
      # a string literal. Catches the regression class that bit
      # SPEC-CONNECTOR-DELETE-LIFECYCLE-001 PR #253.
      # Rule: rules/knowledge_ingest_queue_constants.yml.
      - name: Guard — Procrastinate task queue must be a queues.* constant
        uses: ast-grep/action@cf62e780f0c88301228978d593a7784427a097a6  # v1.5.0
        with:
          config: sgconfig.yml
          paths: klai-knowledge-ingest/knowledge_ingest/

      # See .claude/rules/klai/infra/deploy.md. Two PRs
      # each adding a migration with the same down_revision both build
      # green individually but the second-merging one creates two
      # alembic heads, blocking `alembic upgrade head` at container
      # start. This offline guard runs on every PR + push and rejects
      # any state with > 1 head before merge instead of in production.
      #
      # The guard runs alembic via ``uv run`` so it uses the version
      # pinned in ``pyproject.toml`` / ``uv.lock`` — keeps the CI check
      # in lockstep with the version that runs at container entrypoint
      # rather than drifting against a hardcoded pin.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.6"
          enable-cache: true

      - name: Guard — single alembic head (knowledge schema)
        working-directory: klai-knowledge-ingest
        env:
          # Alembic's env.py loads sqlalchemy.url from DATABASE_URL but only
          # ``alembic heads`` (script-graph walk) is offline and never opens
          # a connection. Stub URL keeps env.py from crashing on missing var.
          DATABASE_URL: postgresql://x:x@localhost/x
        run: |
          set -euo pipefail
          uv sync --frozen --quiet
          heads=$(uv run --frozen alembic heads 2>&1 | grep -E "\(head\)$" | wc -l | tr -d ' ')
          if [ "$heads" -ne 1 ]; then
            echo "::error::Multiple alembic heads detected (got $heads, expected 1)"
            uv run --frozen alembic heads
            echo
            echo "Hotfix: rebase the second-merging migration's down_revision"
            echo "onto the first head, OR add a no-op merge migration with"
            echo "down_revision = (head_a, head_b). See"
            echo ".claude/rules/klai/infra/deploy.md"
            exit 1
          fi
          echo "OK — single alembic head"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push knowledge-ingest
        uses: docker/build-push-action@v7
        with:
          # SPEC-CRAWLER-004 Fase 0: build from repo root so the Dockerfile can
          # COPY the shared klai-libs/connector-credentials path dep.
          context: .
          file: klai-knowledge-ingest/Dockerfile
          push: true
          # `:latest` is published only for main. The SHA tag stays
          # unconditional so non-main builds cannot overwrite production's
          # mutable tag.
          tags: |
            ghcr.io/getklai/knowledge-ingest:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/getklai/knowledge-ingest:latest' || '' }}
          # GHA layer cache disabled: it failed to invalidate on source code changes.
          # Builds are fast enough (~1 min) without caching.

  scan:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
    steps:
      # Checkout is required so trivy-action can find .trivy.yaml + the
      # service's .trivyignore.yaml (paths are relative to repo root).
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # STRICT-tier scan per SPEC-CI-TRIVY-POLICY-001 (REQ-2).
      #
      # Direct CLI invocation bypasses an aquasecurity/trivy-action
      # bug (0.35.0/0.36.0): with `format: sarif` the `severity` filter
      # is honoured for the SARIF body but NOT for the exit-code, so
      # a MEDIUM/LOW finding triggers exit-code 1 even when we asked
      # for CRITICAL+HIGH gating. trivy CLI's `--severity` flag is
      # honoured for both detection AND exit-code. .trivy.yaml stays
      # in the repo as the canonical policy reference until the
      # action lands proper config-file precedence.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          version: v0.74.0
          cache: true

      - name: Run Trivy vulnerability scanner
        run: |
          trivy image \
            --format sarif \
            --output trivy-results.sarif \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --scanners vuln \
            --exit-code 1 \
            ghcr.io/getklai/knowledge-ingest:${{ github.sha }}
      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  deploy:
    if: github.ref == 'refs/heads/main'
    # `needs: scan` ensures the Trivy gate from SPEC-CI-TRIVY-POLICY-001 REQ-2
    # can actually block the rollout: this step used to be the tail of
    # build-push, so a failing scan could not stop it from deploying.
    needs: [build-push, scan]
    runs-on: ubuntu-latest

    steps:
      # 2026-05-05 mailer-incident class: this step previously had no `if:`
      # gate, so PR builds also auto-deployed `:latest` to prod. Same
      # pattern that bit klai-mailer post PR #319 → hotfix #322.
      - name: Deploy to core-01
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CORE01_HOST }}
          username: klai
          key: ${{ secrets.CORE01_DEPLOY_KEY }}
          script: |
            set -e
            source /opt/klai/.env
            echo "$GHCR_READ_PAT" | docker login ghcr.io -u mvletter --password-stdin
            docker pull ghcr.io/getklai/knowledge-ingest:latest
            # SPEC-INFRA-CONTAINER-HYGIENE-001 REQ-3
            /opt/klai/scripts/compose-up.sh knowledge-ingest
