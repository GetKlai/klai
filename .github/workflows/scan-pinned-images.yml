name: Scan pinned external images

# Weekly CVE scan of every external Docker image pinned in our compose files.
# Complements Trivy scans during our own image builds by covering the 25+
# external images (redis, mongo, grafana, zitadel, …) that we don't build
# ourselves.
#
# The code-scanning tab is the action list, not the scanner's raw output. On
# 2026-11-24 it held 1,275 open alerts and nobody acted on any of them, so each
# image's result now goes through scripts/triage-image-findings.py before it is
# uploaded: findings from a stale SBOM inside the image and components covered
# by .vex/unused-components.json are dropped, and of the rest only what is in
# the CISA KEV catalog, has EPSS >= 0.1, is critical on an exposed or
# content-consuming image, or is an overdue fixable critical is uploaded. The
# full Trivy result and the per-image triage stay as workflow artifacts, and
# the run summary has one row per image (total, kept, why).
#
# Not a pull-request gate: pushes are never blocked. The run ends red when a
# KEV finding remains on an image that runs in production, which makes
# ci-failure-notice.yml open (or update) one issue; image-pin-triage.yml is the
# gate for pull requests that change a pin. Runbook: docs/runbooks/trivy-policy.md.

on:
  schedule:
    - cron: '0 7 * * 1'  # Monday 07:00 CET — runs AFTER Renovate (05:00)
  workflow_dispatch:      # Manual trigger for ad-hoc scans
  push:
    branches: [main]
    paths:
      # Re-scan on any compose change so new pins get scanned immediately
      - 'deploy/docker-compose.yml'
      - 'docker-compose.dev.yml'
      - '.github/workflows/scan-pinned-images.yml'
      - 'scripts/triage-image-findings.py'
      - 'scripts/trivy-scan-image.sh'
      - 'deploy/image-exposure.json'
      - '.vex/**'

permissions:
  contents: read
  security-events: write

env:
  # Opt in early to Node 24 for all JS-based actions (Node 20 EOL Sept 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  enumerate:
    name: Enumerate external image targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.parse.outputs.targets }}
      uploads: ${{ steps.parse.outputs.uploads }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Extract external images and stale categories
        id: parse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Targets: every external image in both compose files, grouped by
          # image, with a service-derived key and category (rules and their
          # reasons in scripts/triage-image-findings.py `targets`). GitHub
          # correlates alerts by tool and category, so the category must not
          # contain the image tag.
          mkdir -p inputs
          yq -o=json deploy/docker-compose.yml > inputs/deploy.json
          yq -o=json docker-compose.dev.yml > inputs/dev.json
          python3 scripts/triage-image-findings.py targets \
            --deploy inputs/deploy.json --dev inputs/dev.json \
            --crawl4ai-dockerfile deploy/crawl4ai/Dockerfile > inputs/targets.json

          # Categories this scan job uploaded once and no target uploads now
          # (a renamed key, a removed service). Their alerts never close on
          # their own; the scan job uploads an empty result for each, which is
          # GitHub's "re-run the out-of-date configuration" with nothing found.
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&tool_name=Trivy&ref=refs/heads/main&per_page=100" \
            > inputs/alerts.json
          python3 scripts/triage-image-findings.py stale \
            --alerts inputs/alerts.json --targets inputs/targets.json > inputs/stale.json

          echo "Found targets:"
          jq -r '.[] | "\(.key): \(.image)"' inputs/targets.json
          echo "Stale categories to close:"
          jq -r '.[].category' inputs/stale.json
          echo "targets=$(jq -c 'map(. + {stale: false})' inputs/targets.json)" >> "$GITHUB_OUTPUT"
          echo "uploads=$(jq -c --slurpfile stale inputs/stale.json 'map(. + {stale: false}) + $stale[0]' inputs/targets.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: triage-inputs
          path: |
            inputs/deploy.json
            inputs/dev.json
            inputs/targets.json
            inputs/stale.json
          retention-days: 30

  trivy:
    name: Trivy ${{ matrix.target.key }}
    needs: enumerate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        target: ${{ fromJSON(needs.enumerate.outputs.targets) }}
      fail-fast: false  # One bad image shouldn't skip the rest
      max-parallel: 6   # Avoid hammering Trivy DB + Docker Hub with 30+ pulls at once
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          version: v0.76.2
          cache: true

      # WARN tier of SPEC-CI-TRIVY-POLICY-001: never fails on findings.
      - name: Trivy scan
        run: sh scripts/trivy-scan-image.sh '${{ matrix.target.image }}' 'trivy-${{ matrix.target.key }}.json'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: trivy-${{ matrix.target.key }}
          path: trivy-${{ matrix.target.key }}.json
          retention-days: 30

  feeds:
    name: Fetch KEV and EPSS
    needs: trivy
    # Runs when some scans failed too: their images just get no upload, while
    # every other image is still triaged.
    if: always() && (needs.trivy.result == 'success' || needs.trivy.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: trivy-*
          path: scans
          merge-multiple: true

      # One download of the KEV feed and batched EPSS calls for every id of
      # the run. Fails after three attempts per feed instead of reporting
      # "nothing exploited"; the red run then reaches the failure notice.
      - name: Fetch feeds
        run: python3 scripts/triage-image-findings.py feeds --scans scans --out feeds.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: feeds
          path: feeds.json
          retention-days: 30

  # Keeps the job id `scan` and the matrix variable `target`: the upload's
  # analysis key is `<workflow>:<job id>`, and an alert belongs to one tool,
  # analysis key and category. A new id would orphan every open alert.
  scan:
    name: Scan ${{ matrix.target.key }}
    needs: [enumerate, trivy, feeds]
    if: always() && needs.feeds.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        target: ${{ fromJSON(needs.enumerate.outputs.uploads) }}
      fail-fast: false
      max-parallel: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: triage-inputs
          path: inputs

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: feeds
          path: inputs

      # A target whose Trivy job failed has no artifact, so this step fails and
      # nothing is uploaded: its alerts stay as they were instead of closing.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        if: ${{ !matrix.target.stale }}
        with:
          name: trivy-${{ matrix.target.key }}
          path: scans

      - name: Triage
        if: ${{ !matrix.target.stale }}
        run: |
          python3 scripts/triage-image-findings.py triage \
            --scan 'scans/trivy-${{ matrix.target.key }}.json' \
            --targets inputs/targets.json --key '${{ matrix.target.key }}' \
            --feeds inputs/feeds.json --deploy inputs/deploy.json --dev inputs/dev.json \
            --out-dir triage
          cp 'triage/${{ matrix.target.key }}.triaged.json' upload.json

      - name: Empty result for a stale category
        if: ${{ matrix.target.stale }}
        run: |
          printf '{"SchemaVersion": 2, "ArtifactName": "%s", "ArtifactType": "container_image", "Results": []}\n' \
            '${{ matrix.target.category }}' > upload.json

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          version: v0.76.2
          cache: true

      - name: Convert to SARIF
        run: trivy convert --format sarif --output upload.sarif upload.json

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          sarif_file: upload.sarif
          category: ${{ matrix.target.category }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ !matrix.target.stale }}
        with:
          name: triage-${{ matrix.target.key }}
          path: triage/
          retention-days: 30

  report:
    name: Report
    needs: [enumerate, scan]
    if: always() && needs.enumerate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: triage-*
          path: triage

      - name: Summarise
        env:
          UPLOADS: ${{ needs.enumerate.outputs.uploads }}
        run: |
          set -euo pipefail
          {
            echo "## Scan summary"
            echo ""
            echo "The [code-scanning tab](${{ github.server_url }}/${{ github.repository }}/security/code-scanning) holds only the kept findings. Full Trivy results: the \`trivy-*\` artifacts; per-image triage and OpenVEX: \`triage-*\`."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          stale=$(jq -r '[.[] | select(.stale) | .category] | join(", ")' <<<"$UPLOADS")
          [ -z "$stale" ] || echo "Stale categories closed with an empty result: $stale" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # Fails the run (and so opens or updates the one failure-notice
          # issue) when a KEV finding remains on an image that runs in
          # production. The report artifact carries only ids and image names.
          status=0
          python3 scripts/triage-image-findings.py summary --summaries triage \
            --markdown summary.md --report findings-report.json --fail-on-kev || status=$?
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: findings-report
          path: findings-report.json
          if-no-files-found: ignore
          retention-days: 30
