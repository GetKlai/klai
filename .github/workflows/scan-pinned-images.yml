name: Scan pinned external images

# Daily CVE scan of every external image the stack can start: `image:` keys in
# the three compose files, images pinned in environment values (the meeting
# bot, the tenant chat image and its per-tenant overrides) and the portal's
# image setting defaults. Complements Trivy scans during our own image builds.
#
# Daily, not weekly: a vulnerability that enters the CISA KEV catalog shows up
# here within a day instead of up to seven. A full run took 18 runner minutes
# and 5 minutes wall clock on 2026-11-24 (39 jobs, the longest 1.7 minutes).
#
# The code-scanning tab is the action list, not the scanner's raw output. On
# 2026-11-24 it held 1,275 open alerts and nobody acted on any of them, so each
# image's result now goes through scripts/triage-image-findings.py before it is
# uploaded: findings from a stale SBOM inside the image and components covered
# by .vex/unused-components.json are dropped, and of the rest only what is in
# the CISA KEV catalog, has EPSS >= 0.1, is critical on an exposed or
# content-consuming image, or is an overdue fixable critical is uploaded.
#
# This repository is public, and so are its logs, step summaries and
# artifacts. Nothing in them lets a reader tell a kept finding or which image
# has one: no vulnerability id, package version or per-image count. The detail
# exists only in the code-scanning tab. Raw scan results, triage output and
# OpenVEX documents stay on the runner, and the report job counts what the tab
# holds through the API, so no per-image result travels as an artifact.
#
# Not a pull-request gate: pushes are never blocked. The run ends red with a
# generic message when a KEV finding remains on an image that runs in
# production, which ci-failure-notice.yml reports as its usual issue;
# image-pin-triage.yml is the gate for pull requests that change a pin.
# Runbook: docs/runbooks/trivy-policy.md.

on:
  schedule:
    - cron: '0 7 * * *'  # daily 07:00 UTC
  workflow_dispatch:      # Manual trigger for ad-hoc scans
  push:
    branches: [main]
    paths:
      # Re-scan on any compose change so new pins get scanned immediately
      - 'deploy/docker-compose.yml'
      - 'docker-compose.dev.yml'
      - 'deploy/crawl4ai/**'      # the crawl4ai target is built from here
      - 'deploy/docker-compose.gpu.yml'
      - 'klai-portal/backend/app/core/config.py'
      - '.github/workflows/scan-pinned-images.yml'
      - 'scripts/triage-image-findings.py'
      - 'scripts/trivy-scan-image.sh'
      - 'deploy/image-exposure.json'
      - '.vex/**'

permissions:
  contents: read
  security-events: write

env:
  # Opt in early to Node 24 for all JS-based actions (Node 20 EOL Sept 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  enumerate:
    name: Enumerate external image targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.parse.outputs.targets }}
      uploads: ${{ steps.parse.outputs.uploads }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Extract external images and stale categories
        id: parse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Targets: every external image in both compose files, grouped by
          # image, with a service-derived key and category (rules and their
          # reasons in scripts/triage-image-findings.py `targets`). GitHub
          # correlates alerts by tool and category, so the category must not
          # contain the image tag.
          mkdir -p inputs
          yq -o=json deploy/docker-compose.yml > inputs/deploy.json
          yq -o=json docker-compose.dev.yml > inputs/dev.json
          yq -o=json deploy/docker-compose.gpu.yml > inputs/gpu.json
          python3 scripts/triage-image-findings.py targets \
            --deploy inputs/deploy.json --dev inputs/dev.json --gpu inputs/gpu.json > inputs/targets.json

          # Categories this scan job uploaded once and no target uploads now
          # (a renamed key, a removed service). Their alerts never close on
          # their own; the scan job uploads an empty result for each, which is
          # GitHub's "re-run the out-of-date configuration" with nothing found.
          # The alert list stays on this runner; only category names go on.
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&tool_name=Trivy&ref=refs/heads/main&per_page=100" \
            > "$RUNNER_TEMP/alerts.json"
          python3 scripts/triage-image-findings.py stale \
            --alerts "$RUNNER_TEMP/alerts.json" --targets inputs/targets.json > inputs/stale.json

          echo "Found targets:"
          jq -r '.[] | "\(.key): \(.image)"' inputs/targets.json
          echo "Stale categories to close:"
          jq -r '.[].category' inputs/stale.json
          echo "targets=$(jq -c 'map(. + {stale: false})' inputs/targets.json)" >> "$GITHUB_OUTPUT"
          echo "uploads=$(jq -c --slurpfile stale inputs/stale.json 'map(. + {stale: false}) + $stale[0]' inputs/targets.json)" >> "$GITHUB_OUTPUT"

      # Compose (already public in the repository), the target list and the
      # stale category names: architecture, no findings.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: triage-inputs
          path: |
            inputs/deploy.json
            inputs/dev.json
            inputs/gpu.json
            inputs/targets.json
            inputs/stale.json
          retention-days: 30

  kev:
    name: Fetch the KEV catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # One download of the official feed per run, shared with every scan
      # job. It is CISA's public catalog, so the artifact reveals nothing
      # about our images. Fails after three attempts instead of reporting
      # "nothing exploited"; the red run then reaches the failure notice.
      - name: Fetch
        run: python3 scripts/triage-image-findings.py kev --out kev.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: kev
          path: kev.json
          retention-days: 2

  # Keeps the job id `scan` and the matrix variable `target`: the upload's
  # analysis key is `<workflow>:<job id>`, and an alert belongs to one tool,
  # analysis key and category. A new id would orphan every open alert.
  # Scan, triage and upload happen in one job so the detail never has to
  # travel between jobs as an artifact.
  scan:
    name: Scan ${{ matrix.target.key }}
    needs: [enumerate, kev]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        target: ${{ fromJSON(needs.enumerate.outputs.uploads) }}
      fail-fast: false  # One bad image shouldn't skip the rest
      max-parallel: 6   # Avoid hammering Trivy DB + Docker Hub with 30+ pulls at once
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: triage-inputs
          path: inputs

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: kev
          path: inputs

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          version: v0.76.2
          cache: true

      # The crawler is built on the host and never pushed, so this job builds
      # deploy/crawl4ai and scans that build from the local Docker daemon.
      # Scanning the upstream FROM image instead counted the build checkout
      # our Dockerfile deletes: 302 of its 308 findings came from a stale
      # SBOM inside it.
      - name: Build the image we deploy
        if: ${{ !matrix.target.stale && matrix.target.build != '' }}
        env:
          IMAGE: ${{ matrix.target.image }}
          CONTEXT: ${{ matrix.target.build }}
        run: docker build -t "$IMAGE" "$CONTEXT"

      # WARN tier of SPEC-CI-TRIVY-POLICY-001: never fails on findings. A
      # failed scan fails the job before any upload, so that image's alerts
      # stay as they were instead of closing.
      - name: Trivy scan
        if: ${{ !matrix.target.stale }}
        env:
          IMAGE: ${{ matrix.target.image }}
          IMAGE_SRC: ${{ matrix.target.build != '' && 'docker' || 'remote' }}
        run: sh scripts/trivy-scan-image.sh "$IMAGE" "$RUNNER_TEMP/scan.json" "$IMAGE_SRC"

      # Prints nothing about the findings; EPSS is fetched here in batches
      # for this image's ids. --check-images re-reads the evidence of a VEX
      # statement from the image when its pin moved since verification.
      - name: Triage
        if: ${{ !matrix.target.stale }}
        run: |
          python3 scripts/triage-image-findings.py triage \
            --scan "$RUNNER_TEMP/scan.json" \
            --targets inputs/targets.json --key '${{ matrix.target.key }}' \
            --kev inputs/kev.json --deploy inputs/deploy.json --dev inputs/dev.json --gpu inputs/gpu.json \
            --check-images --out-dir "$RUNNER_TEMP/triage"
          cp "$RUNNER_TEMP/triage/${{ matrix.target.key }}.triaged.json" "$RUNNER_TEMP/upload.json"

      - name: Empty result for a stale category
        if: ${{ matrix.target.stale }}
        run: |
          printf '{"SchemaVersion": 2, "ArtifactName": "%s", "ArtifactType": "container_image", "Results": []}\n' \
            '${{ matrix.target.category }}' > "$RUNNER_TEMP/upload.json"

      - name: Convert to SARIF
        run: trivy convert --format sarif --output "$RUNNER_TEMP/upload.sarif" "$RUNNER_TEMP/upload.json"

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          sarif_file: ${{ runner.temp }}/upload.sarif
          category: ${{ matrix.target.category }}


  report:
    name: Report
    needs: [enumerate, kev, scan]
    if: always() && needs.enumerate.result == 'success' && needs.kev.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: triage-inputs
          path: inputs

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: kev
          path: inputs

      # Counts what the code-scanning tab now holds for these targets, read
      # through the API after every upload finished processing. Whole-run
      # counts only. Fails the run with a generic message when a KEV finding
      # remains on an image that runs in production; ci-failure-notice.yml
      # then opens or updates its usual issue for a failed workflow.
      - name: Summarise
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOADS: ${{ needs.enumerate.outputs.uploads }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&tool_name=Trivy&ref=refs/heads/main&per_page=100" \
            > "$RUNNER_TEMP/alerts.json"
          {
            echo "## Scan summary"
            echo ""
            echo "Kept findings are on the [code-scanning tab](${{ github.server_url }}/${{ github.repository }}/security/code-scanning); nothing here names one or the image it is on."
            echo ""
            echo "Stale categories closed with an empty result: $(jq '[.[] | select(.stale)] | length' <<<"$UPLOADS")"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          python3 scripts/triage-image-findings.py report --alerts "$RUNNER_TEMP/alerts.json" \
            --targets inputs/targets.json --kev inputs/kev.json \
            --deploy inputs/deploy.json --dev inputs/dev.json --gpu inputs/gpu.json \
            --markdown summary.md || status=$?
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
