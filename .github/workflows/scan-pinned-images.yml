name: Scan pinned external images

# Weekly CVE scan of every external Docker image pinned in our compose files.
# Complements Trivy scans during our own image builds by covering the 25+
# external images (redis, mongo, grafana, zitadel, …) that we don't build
# ourselves. Results go to the Security tab; no PR gate — this is a
# notification surface, not a blocker.

on:
  schedule:
    - cron: '0 7 * * 1'  # Monday 07:00 CET — runs AFTER Renovate (05:00)
  workflow_dispatch:      # Manual trigger for ad-hoc scans
  push:
    branches: [main]
    paths:
      # Re-scan on any compose change so new pins get scanned immediately
      - 'deploy/docker-compose.yml'
      - 'docker-compose.dev.yml'
      - '.github/workflows/scan-pinned-images.yml'

permissions:
  contents: read
  security-events: write

env:
  # Opt in early to Node 24 for all JS-based actions (Node 20 EOL Sept 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  enumerate:
    name: Enumerate external image targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.parse.outputs.targets }}
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Extract external images
        id: parse
        run: |
          # Extract every external image target from every compose file, then
          # filter out internal + local builds we scan via per-service
          # workflows.
          #
          # Keep a stable service-derived key for the SARIF category instead
          # of using the image tag. GitHub correlates code-scanning alerts by
          # tool/category; if the category contains the old image tag, every
          # version bump leaves stale alerts behind under the previous
          # category. We still group exact duplicate images so shared images
          # like glitchtip are scanned once per run.
          #
          # Excluded patterns (with rationale):
          #   ghcr.io/getklai/*                — our own CI-built images; scanned per service
          #   */klai                           — legacy on-server local builds (vexa-*:klai)
          #   */local                          — legacy on-server local builds (retrieval-api:local)
          #   *:*-local-YYMMDD-HHMM            — current convention for locally-built tags
          #                                      per .claude/rules/klai/infra/container-hygiene.md
          #                                      "Verify image pullable before pinning a tag" rule
          #                                      (e.g. vexaai/transcription-service:0.10.6-local-260503-0858).
          #                                      SKIP-tier of SPEC-CI-TRIVY-POLICY-001 REQ-4: these
          #                                      images do not exist on Docker Hub so a `docker
          #                                      manifest inspect` always 404s.
          #   mendableai/firecrawl             — built locally from source on the server
          TARGETS=$(
            {
              yq -o=json eval '.services | to_entries | map({"source": "deploy", "service": .key, "image": .value.image})' deploy/docker-compose.yml
              yq -o=json eval '.services | to_entries | map({"source": "dev", "service": .key, "image": .value.image})' docker-compose.dev.yml
            } \
              | jq -sc '
                  add
                  | map(select(.image != null and .image != "~"))
                  | map(select(.image | test("^(ghcr\\.io/getklai/|ghcr\\.io/mendableai/firecrawl|[^:]+:klai$|[^:]+:local$|[^:]+:.*-local-[0-9]{6}-[0-9]{4}$)") | not))
                  | sort_by(.image)
                  | group_by(.image)
                  | map({
                      key: (map(.source + "_" + .service) | sort | join("__")),
                      services: (map(.source + "/" + .service) | sort),
                      image: .[0].image
                    })
                  | sort_by(.key)
                '
          )

          echo "Found targets:"
          echo "$TARGETS" | jq -r '.[] | "\(.key): \(.image)"'
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

  scan:
    name: Scan ${{ matrix.target.key }}
    needs: enumerate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        target: ${{ fromJSON(needs.enumerate.outputs.targets) }}
      fail-fast: false  # One bad image shouldn't skip the rest
      max-parallel: 6   # Avoid hammering Trivy DB + Docker Hub with 30+ pulls at once
    steps:
      # Checkout is required so trivy-action can find .trivy.yaml
      # (`trivy-config:` resolves relative to repo root).
      - uses: actions/checkout@v6

      - name: Sanitize image name for artefact
        id: safe
        run: |
          # SARIF uploads need a unique category per image and a filename
          # that doesn't contain slashes or colons.
          SAFE=$(printf '%s' '${{ matrix.target.key }}' | tr -c 'A-Za-z0-9_.-' '_')
          echo "name=$SAFE" >> "$GITHUB_OUTPUT"

      # WARN-tier scan per SPEC-CI-TRIVY-POLICY-001 REQ-3.
      # `--exit-code 0` keeps this warn-only — Renovate handles upgrade
      # pressure on the external base-images we pin in compose.
      #
      # Direct CLI invocation bypasses an aquasecurity/trivy-action bug
      # (0.35.0/0.36.0): with `format: sarif` the `severity` filter is
      # honoured for the SARIF body but NOT for the exit-code. Keeping
      # the invocation consistent with STRICT-tier scans simplifies
      # operations.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e6c2c5e321ed9123bda567646e2f96565e34abe1  # v0.2.5
        with:
          version: v0.69.3
          cache: true

      - name: Trivy scan
        run: |
          for attempt in 1 2; do
            if trivy image \
              --format sarif \
              --output trivy-${{ steps.safe.outputs.name }}.sarif \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --scanners vuln \
              --image-src remote \
              --timeout 6m \
              --skip-version-check \
              --exit-code 0 \
              ${{ matrix.target.image }}; then
              exit 0
            fi

            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi

            echo "Trivy scan failed on attempt $attempt; retrying after 30s..."
            sleep 30
          done

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles(format('trivy-{0}.sarif', steps.safe.outputs.name)) != ''
        with:
          sarif_file: 'trivy-${{ steps.safe.outputs.name }}.sarif'
          category: 'pinned-service-${{ steps.safe.outputs.name }}'

  report:
    name: Report
    needs: [enumerate, scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarise
        run: |
          echo "## Scan summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Scanned $(echo '${{ needs.enumerate.outputs.targets }}' | jq 'length') pinned external image targets." >> "$GITHUB_STEP_SUMMARY"
          echo "Individual findings are in the [Security tab](${{ github.server_url }}/${{ github.repository }}/security/code-scanning)." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Targets scanned" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ needs.enumerate.outputs.targets }}' \
            | jq -r '.[] | (.services | join(", ")) as $services | "- `\($services)` -> `\(.image)`"' \
            >> "$GITHUB_STEP_SUMMARY"
