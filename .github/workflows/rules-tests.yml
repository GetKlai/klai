name: rules-tests (ast-grep lint integration)

# Audit 2026-05-05 finding F10: rules/tests/test_no_untenanted_syncrun_lint.py
# was the regression-guard for SPEC-SEC-PORTAL-RLS-001 REQ-3 ast-grep rule —
# but no GHA workflow runs `pytest rules/tests/` so the test silently
# skipped (or never ran) in CI. The test's `_ast_grep_cli()` helper has a
# fallback chain (sg → ast-grep → uvx); without `uv` available CI would
# have skipped even after wiring.
#
# This workflow installs `uv`, then pytest invokes the lint tests with
# the third fallback path reachable. The test no longer skips silently.

on:
  push:
    branches: [main]
    paths:
      - 'rules/**'
      - 'sgconfig.yml'
      - '.mcp.json'
      - '.conductor/settings.toml'
      - 'conductor.json'
      - '.gitignore'
      - 'Makefile'
      - 'scripts/code-tools-setup.sh'
      - 'docs/setup/**'
      - '.claude/scripts/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.agents/skills/**'
      - '.claude/agents/**'
      - '.claude/commands/**'
      - '.claude/hooks/**'
      - '.gitleaks.toml'
      - '.claude/rules/**'
      - '.claude/settings.json'
      - 'klai-website/AGENTS.md'
      - 'klai-website/CLAUDE.md'
      - 'klai-website/.claude/**'
      - 'scripts/check-agent-knowledge.sh'
      - '.github/SECURITY.md'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'rules/**'
      - 'sgconfig.yml'
      - '.mcp.json'
      - '.conductor/settings.toml'
      - 'conductor.json'
      - '.gitignore'
      - 'Makefile'
      - 'scripts/code-tools-setup.sh'
      - 'docs/setup/**'
      - '.claude/scripts/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.agents/skills/**'
      - '.claude/agents/**'
      - '.claude/commands/**'
      - '.claude/hooks/**'
      - '.gitleaks.toml'
      - '.claude/rules/**'
      - '.claude/settings.json'
      - 'klai-website/AGENTS.md'
      - 'klai-website/CLAUDE.md'
      - 'klai-website/.claude/**'
      - 'scripts/check-agent-knowledge.sh'
      - '.github/SECURITY.md'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv (so the test's uvx fallback is reachable)
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - name: Run rules/tests
        # Tests are stand-alone pytest invocations against ast-grep CLI;
        # no service .venv needed. uv brings pytest in via tool-run.
        run: uv tool run --with pytest --with pyyaml pytest rules/tests/ -v

      - name: Run hook guard tests
        # The public-github-mutation-guard is a security hook; its regression
        # suite is plain unittest with no dependencies.
        run: python3 .claude/hooks/klai/tests/public-github-mutation-guard.test.py

      - name: Run worktree guard tests
        # The worktree guard blocked its own documented escapes until this suite
        # existed; plain bash, no dependencies.
        run: bash .claude/hooks/klai/tests/worktree-no-main.test.sh

      - name: Check active agent knowledge
        run: bash scripts/check-agent-knowledge.sh
