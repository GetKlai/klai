name: Build and deploy portal-frontend

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'klai-portal/frontend/**'
      - 'klai-widget/src/**'
      - 'klai-widget/package.json'
      - 'klai-widget/package-lock.json'
      - 'klai-widget/vite.config.ts'
      - 'klai-portal/.github/workflows/portal-frontend.yml'
      - '.github/workflows/portal-frontend.yml'
jobs:
  # Split out of build-deploy on 2026-08-14 for two reasons:
  #
  #  1. This job is aggregated by the always-running Required quality workflow
  #     into the single required `quality` context on affected PRs.
  #  2. The 476 vitest tests were NOT running in CI at all. Lint and build ran;
  #     the test suite existed in the repo and nothing ever executed it.
  #
  # Deploy now gates on this job, so a red test blocks the rollout.
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: klai-portal/frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: klai-portal/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Locale mojibake check
        run: python3 scripts/fix-mojibake-locales.py --check
        working-directory: .

      - name: Dependency vulnerability scan (npm audit)
        run: npm run security:audit

      - name: Lint (ESLint)
        run: npm run lint

      # Paraglide generates src/paraglide at build time and it is gitignored,
      # so the suite cannot import `@/paraglide/messages` without this step —
      # every test file fails to load and the run reports a green-looking
      # "0 failed" while covering nothing.
      - name: Test (vitest)
        run: |
          npm run i18n:compile
          npm test

  build-deploy:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: klai-portal/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: klai-portal/frontend

      - name: Build widget bundle
        run: |
          cd klai-widget
          npm ci
          npm run build
          mkdir -p ../klai-portal/frontend/public/widget
          cp dist/klai-chat.js ../klai-portal/frontend/public/widget/klai-chat.js

      - name: Build
        run: npm run build
        working-directory: klai-portal/frontend
        env:
          VITE_OIDC_AUTHORITY: https://auth.getklai.com
          VITE_OIDC_CLIENT_ID: "362901948573220875"
          VITE_API_BASE_URL: ""
          VITE_CONNECTOR_API_BASE_URL: https://connector.getklai.com
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Set up SSH
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.CORE01_DEPLOY_KEY }}

      - name: Add core-01 to known_hosts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ssh-keyscan -H ${{ secrets.CORE01_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy dist to core-01
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          rsync -av --delete klai-portal/frontend/dist/ klai@${{ secrets.CORE01_HOST }}:/opt/klai/portal-dist/
          ssh klai@${{ secrets.CORE01_HOST }} "rsync -a --delete /opt/klai/portal-dist/ /srv/portal/"
