# Daily drift check: Zitadel OIDC redirect_uris vs the validator allowlist
# in klai-portal/backend/app/api/auth.py.
#
# Why: the 2026-04-30 chat-iframe SSO outage (PR #243) was a hand-curated
# list drifting from the live Zitadel config. The contract test
# `test_static_system_subdomains_set_includes_known_oidc_apps` catches
# drift between the auth.py code and the docstring expectation, but it
# does NOT catch drift between EITHER of those and the live Zitadel
# state. This workflow closes that gap.
#
# Trigger: cron daily + manual workflow_dispatch.
# Action on drift: fail loudly without publishing the live drift report. The
# detailed report must be reproduced and handled through a private operator
# channel; this repository and its Actions logs are public.
# Human signal: GitHub sends private email/web notifications for a failed
# scheduled workflow to the workflow creator. Keep Actions failure
# notifications enabled for that account; the notification links to the
# generic failure while the detailed report remains private.
#
# Required secret: ZITADEL_ADMIN_PAT (IAM_OWNER PAT for klai-admin-sa).
# Used read-only — the script only calls /apps/_search.

name: zitadel-oidc-drift

on:
  schedule:
    # 06:00 UTC daily — before working hours; gives operators a fresh
    # signal to act on at the start of the day.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run drift check
        id: drift
        env:
          ZITADEL_ADMIN_PAT: ${{ secrets.ZITADEL_ADMIN_PAT }}
        run: |
          set -o pipefail
          set +e
          python scripts/check_zitadel_oidc_drift.py \
            > drift-report.json \
            2> drift-stderr.txt
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          # Do not print live IAM drift details to this public repository's
          # Actions log. Operators can reproduce the report through the private
          # runbook path after the generic failure signal fires.
          echo "OIDC drift check completed with exit code $status; detailed output suppressed."
          # Re-emit the original exit code so the step status reflects it.
          exit $status
        continue-on-error: true

      - name: Fail the workflow on drift
        if: steps.drift.outputs.exit_code != '0'
        run: |
          echo "::error::OIDC drift check failed; detailed output is suppressed. Reproduce through the private operator path."
          exit 1
