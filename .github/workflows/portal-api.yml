name: Build and push portal-api

on:
  push:
    branches: [main]
    paths:
      - 'klai-portal/backend/**'
      - 'klai-libs/connector-credentials/**'
      - 'klai-libs/kb-slugs/**'
      - '.github/workflows/portal-api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'klai-portal/backend/**'
      - 'klai-libs/connector-credentials/**'
      - 'klai-libs/kb-slugs/**'
      - '.github/workflows/portal-api.yml'

permissions:
  contents: read
  packages: write
  security-events: write

env:
  # Opt in early to Node 24 for all JS-based actions (Node 20 EOL Sept 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: klai-portal/backend

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      # SPEC-SEC-024-R7 — block reintroduction of docker exec_run in portal-api
      # production code. Rule lives at rules/no-exec-run.yml, configured by
      # sgconfig.yml at repo root. `uses:` steps ignore the job's
      # defaults.run.working-directory and run from $GITHUB_WORKSPACE, so the
      # relative paths resolve correctly.
      #
      # The same step also picks up SPEC-SEC-INTERNAL-001 REQ-6 secret-compare
      # rules (no-string-eq-on-secret + no-string-neq-on-secret + their RHS
      # variants). Each rule has its own ``files:`` allow-list; ast-grep
      # applies only the matching rules per file.
      - name: Guard — no exec_run + no string-compare on secret (SPEC-SEC-024 + SPEC-SEC-INTERNAL-001)
        uses: ast-grep/action@cf62e780f0c88301228978d593a7784427a097a6  # v1.5.0
        with:
          config: sgconfig.yml
          paths: klai-portal/backend/app

      - name: Type check (pyright)
        run: uv run --with pyright pyright

      # CVE-2026-4539: ignored — package not directly exploitable in our context (sandboxed container,
      # no user-controlled input reaches the vulnerable code path). Re-assess Q3 2026.
      # See: https://github.com/GetKlai/klai/issues/62
      # CVE-2026-3219: advisory against pip 26.0.1 (the CI runner's bootstrap pip, not an app
      # dependency resolved by uv). Ignored until the Actions runner image bumps its default pip.
      - name: Dependency vulnerability scan (pip-audit)
        run: uv run --with pip-audit pip-audit --ignore-vuln CVE-2026-4539 --ignore-vuln CVE-2025-71176 --ignore-vuln CVE-2026-3219

      # Guards against the two classes of alembic mistakes we've been bitten by:
      # 1. Hand-typed rev ids (SPEC-KB-020: duplicate `a1b2c3d4e5f6` crashed
      #    `alembic upgrade head` in production).
      # 2. Orphan branches (SPEC-PROV-001 deploy: two heads caused
      #    `alembic heads` to report ambiguous state).
      # Enforced here so a PR that introduces either can never reach main.
      - name: Alembic integrity (single head, no duplicate rev ids)
        run: uv run python scripts/validate_alembic.py

      - name: Alembic post-deploy guard
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -e
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 origin main
            BASE_SHA="origin/main"
          fi
          CHANGED="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- 'klai-portal/backend/alembic/versions/*.py' | sed 's#^klai-portal/backend/##')"
          if [ -z "$CHANGED" ]; then
            echo "No changed Alembic Python migrations."
            exit 0
          fi
          uv run python scripts/check_migration_post_deploy.py $CHANGED

      - name: Test (pytest)
        run: uv run pytest -q --tb=short

  rls-policy-smoke-test:
    # Spins up a throwaway PostgreSQL, runs every post_deploy_*.sql
    # against it, then exercises the strict-RLS policies the way prod
    # uses them. Catches regressions in either the SQL migrations or
    # the policy expectations encoded in scripts/rls-smoke-test.sql
    # BEFORE the change reaches a real database.
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: klai
          POSTGRES_PASSWORD: klai
          POSTGRES_DB: klai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U klai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Bootstrap minimal schema
        env:
          PGPASSWORD: klai
        run: |
          # Minimal schema slice that the smoke test references.
          # We do not run alembic here — the smoke test only needs the
          # policy targets to exist, not the full app schema.
          psql -h localhost -U klai -d klai -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE portal_api LOGIN PASSWORD 'portal_api_test';
          GRANT CONNECT ON DATABASE klai TO portal_api;
          GRANT USAGE ON SCHEMA public TO portal_api;

          -- Tables referenced by the smoke test. Schemas mirror
          -- production columns relevant to RLS only.
          CREATE TABLE portal_users (
              id SERIAL PRIMARY KEY,
              org_id INTEGER NOT NULL,
              zitadel_user_id VARCHAR(64) NOT NULL UNIQUE
          );
          CREATE TABLE portal_knowledge_bases (
              id SERIAL PRIMARY KEY,
              org_id INTEGER NOT NULL,
              slug VARCHAR(64) NOT NULL,
              UNIQUE(org_id, slug)
          );
          CREATE TABLE portal_groups (id SERIAL PRIMARY KEY, org_id INTEGER NOT NULL);
          CREATE TABLE portal_group_products (id SERIAL PRIMARY KEY, org_id INTEGER NOT NULL, group_id INTEGER NOT NULL, product VARCHAR(32) NOT NULL);
          CREATE TABLE portal_group_kb_access (id SERIAL PRIMARY KEY, kb_id INTEGER NOT NULL);
          CREATE TABLE portal_kb_tombstones (id SERIAL PRIMARY KEY, org_id INTEGER NOT NULL);
          CREATE TABLE portal_user_kb_access (id SERIAL PRIMARY KEY, org_id INTEGER NOT NULL, kb_id INTEGER NOT NULL, user_id VARCHAR(64) NOT NULL);
          CREATE TABLE portal_retrieval_gaps (id SERIAL PRIMARY KEY, org_id INTEGER NOT NULL);
          CREATE TABLE portal_taxonomy_nodes (id SERIAL PRIMARY KEY, kb_id INTEGER NOT NULL);
          CREATE TABLE portal_taxonomy_proposals (id SERIAL PRIMARY KEY, kb_id INTEGER NOT NULL);
          CREATE TABLE portal_user_products (id SERIAL PRIMARY KEY, org_id INTEGER NOT NULL, zitadel_user_id VARCHAR(64) NOT NULL, product VARCHAR(32) NOT NULL);
          CREATE TABLE portal_connectors (id SERIAL PRIMARY KEY, org_id INTEGER NOT NULL);
          CREATE TABLE vexa_meetings (id UUID PRIMARY KEY, org_id INTEGER, status VARCHAR(32));
          CREATE TABLE partner_api_keys (id UUID PRIMARY KEY, org_id INTEGER NOT NULL);
          CREATE TABLE partner_api_key_kb_access (partner_api_key_id UUID NOT NULL, kb_id INTEGER NOT NULL, PRIMARY KEY (partner_api_key_id, kb_id));
          CREATE TABLE widgets (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), org_id INTEGER NOT NULL, widget_id VARCHAR(64) NOT NULL);
          CREATE TABLE widget_kb_access (widget_id UUID NOT NULL, kb_id INTEGER NOT NULL, PRIMARY KEY (widget_id, kb_id));
          -- SPEC-MCP-AUTH-001 Cat-D: portal_mcp_tokens (referenced by rls-smoke-test Test 8)
          -- portal_oauth_clients carries NO RLS by design (org-overstijgend) but still
          -- needs SELECT/INSERT grants to portal_api for the smoke-test to read it.
          CREATE TABLE portal_oauth_clients (id BIGSERIAL PRIMARY KEY, client_id VARCHAR(64) NOT NULL UNIQUE);
          CREATE TABLE portal_mcp_tokens (id BIGSERIAL PRIMARY KEY, org_id INTEGER NOT NULL, user_id INTEGER NOT NULL, client_id BIGINT NOT NULL);
          GRANT SELECT, INSERT, UPDATE, DELETE ON portal_oauth_clients TO portal_api;
          -- Product updates ("what's new"): global announcements (Cat global,
          -- USING true) + per-user read-state (Cat-D pure-tenant, referenced by
          -- rls-smoke-test Test 9). The tables are created here; RLS + policies
          -- are applied by the "Apply product-updates RLS post-deploy" step
          -- below (after _rls_current_org_id() exists).
          CREATE TABLE product_updates (id BIGSERIAL PRIMARY KEY, title TEXT NOT NULL, body TEXT NOT NULL, commit_shas VARCHAR(40)[] NOT NULL DEFAULT '{}'::varchar[], created_at TIMESTAMPTZ NOT NULL DEFAULT now());
          CREATE TABLE product_update_reads (product_update_id BIGINT NOT NULL, org_id INTEGER NOT NULL, user_id VARCHAR(64) NOT NULL, read_at TIMESTAMPTZ NOT NULL DEFAULT now(), PRIMARY KEY (product_update_id, org_id, user_id));
          GRANT SELECT, INSERT ON product_updates TO portal_api;
          GRANT SELECT, INSERT ON product_update_reads TO portal_api;
          GRANT USAGE, SELECT ON SEQUENCE product_updates_id_seq TO portal_api;

          -- Enable RLS + grant table access to portal_api (forced so klai
          -- superuser also obeys, mirroring production setup).
          DO $$
          DECLARE t text;
          BEGIN
              FOR t IN VALUES
                  ('portal_users'), ('portal_knowledge_bases'), ('portal_groups'),
                  ('portal_group_products'), ('portal_group_kb_access'),
                  ('portal_kb_tombstones'), ('portal_user_kb_access'),
                  ('portal_retrieval_gaps'), ('portal_taxonomy_nodes'),
                  ('portal_taxonomy_proposals'), ('portal_user_products'),
                  ('portal_connectors'), ('vexa_meetings'),
                  ('partner_api_keys'), ('partner_api_key_kb_access'),
                  ('widgets'), ('widget_kb_access'), ('portal_mcp_tokens')
              LOOP
                  EXECUTE format('ALTER TABLE %I ENABLE ROW LEVEL SECURITY', t);
                  EXECUTE format('ALTER TABLE %I FORCE ROW LEVEL SECURITY', t);
                  EXECUTE format('GRANT SELECT, INSERT, UPDATE, DELETE ON %I TO portal_api', t);
              END LOOP;
          END $$;

          -- Seed test data: one row per pure-tenant table, 2 orgs.
          INSERT INTO portal_knowledge_bases (org_id, slug) VALUES (1, 'org'), (1, 'personal-1'), (8, 'org'), (8, 'personal-2');

          -- Pre-existing legacy ALL policies on the cat-D tables so the
          -- forward script's DROP POLICY IF EXISTS sees something to
          -- drop (mirrors prod history).
          CREATE POLICY tenant_isolation ON portal_knowledge_bases FOR ALL USING (true);
          CREATE POLICY tenant_isolation ON portal_groups FOR ALL USING (true);
          CREATE POLICY tenant_isolation ON portal_group_products FOR ALL USING (true);
          CREATE POLICY tenant_isolation ON portal_group_kb_access FOR ALL USING (true);
          CREATE POLICY tenant_isolation ON portal_kb_tombstones FOR ALL USING (true);
          CREATE POLICY tenant_isolation ON portal_user_kb_access FOR ALL USING (true);
          CREATE POLICY tenant_isolation ON portal_retrieval_gaps FOR ALL USING (true);
          CREATE POLICY tenant_isolation ON portal_taxonomy_nodes FOR ALL USING (true);
          CREATE POLICY tenant_isolation ON portal_taxonomy_proposals FOR ALL USING (true);
          CREATE POLICY tenant_isolation ON portal_user_products FOR ALL USING (true);
          CREATE POLICY tenant_isolation ON portal_connectors FOR ALL USING (true);
          CREATE POLICY tenant_isolation ON portal_mcp_tokens FOR ALL USING (true);
          CREATE POLICY tenant_read ON vexa_meetings FOR SELECT USING (true);
          CREATE POLICY tenant_write ON vexa_meetings FOR INSERT WITH CHECK (true);
          CREATE POLICY tenant_update ON vexa_meetings FOR UPDATE USING (true);
          CREATE POLICY tenant_delete ON vexa_meetings FOR DELETE USING (true);
          CREATE POLICY partner_select ON partner_api_keys FOR SELECT USING (true);
          CREATE POLICY partner_insert ON partner_api_keys FOR INSERT WITH CHECK (true);
          CREATE POLICY partner_update ON partner_api_keys FOR UPDATE USING (true);
          CREATE POLICY partner_delete ON partner_api_keys FOR DELETE USING (true);
          CREATE POLICY kb_access_select ON partner_api_key_kb_access FOR SELECT USING (true);
          CREATE POLICY kb_access_insert ON partner_api_key_kb_access FOR INSERT WITH CHECK (true);
          CREATE POLICY kb_access_update ON partner_api_key_kb_access FOR UPDATE USING (true);
          CREATE POLICY kb_access_delete ON partner_api_key_kb_access FOR DELETE USING (true);
          CREATE POLICY widgets_select ON widgets FOR SELECT USING (true);
          CREATE POLICY widgets_insert ON widgets FOR INSERT WITH CHECK (true);
          CREATE POLICY widgets_update ON widgets FOR UPDATE USING (true);
          CREATE POLICY widgets_delete ON widgets FOR DELETE USING (true);
          CREATE POLICY widget_kb_access_select ON widget_kb_access FOR SELECT USING (true);
          CREATE POLICY widget_kb_access_insert ON widget_kb_access FOR INSERT WITH CHECK (true);
          CREATE POLICY widget_kb_access_delete ON widget_kb_access FOR DELETE USING (true);
          SQL

      - name: Apply forward RLS migration
        env:
          PGPASSWORD: klai
        working-directory: klai-portal/backend
        run: psql -h localhost -U klai -d klai -v ON_ERROR_STOP=1 < alembic/versions/post_deploy_rls_raise_on_missing_context.sql

      - name: Apply product-updates RLS post-deploy
        env:
          PGPASSWORD: klai
        working-directory: klai-portal/backend
        # Mirrors prod: deploy-portal-api.sh applies every post_deploy_*.sql
        # after the raise-on-missing-context bootstrap. product_update_reads
        # policies depend on _rls_current_org_id() created by the step above.
        run: psql -h localhost -U klai -d klai -v ON_ERROR_STOP=1 < alembic/versions/post_deploy_p1r2o3d4u5p6_product_updates_rls.sql

      - name: Run RLS smoke test
        env:
          PGPASSWORD: portal_api_test
        working-directory: klai-portal/backend
        # NOTICE messages go to stderr — capture both streams. set -o pipefail
        # so a psql failure isn't masked by tee's exit code.
        run: |
          set -o pipefail
          PGOPTIONS='--client-min-messages=NOTICE' \
            psql -h localhost -U portal_api -d klai -v ON_ERROR_STOP=1 -f scripts/rls-smoke-test.sql 2>&1 | tee /tmp/smoke.out
        # Verify expected NOTICE markers fired (a silently-skipped DO
        # block would not raise on its own).
      - name: Verify smoke-test assertions fired
        run: |
          set -e
          for marker in \
              "portal_knowledge_bases raised insufficient_privilege as expected" \
              "vexa_meetings UPDATE raised insufficient_privilege as expected" \
              "RLS smoke test complete"; do
              grep -Fq "$marker" /tmp/smoke.out || { echo "MISSING marker: $marker"; exit 1; }
          done
          echo "✓ All RLS smoke-test assertions fired."

      - name: Apply rollback migration (smoke-test rollback path too)
        env:
          PGPASSWORD: klai
        working-directory: klai-portal/backend
        run: psql -h localhost -U klai -d klai -v ON_ERROR_STOP=1 < alembic/versions/post_deploy_rls_rollback_to_nullif_pattern.sql

  zitadel-password-policy-drift:
    # Deployment gate for the fail-loud startup guard in
    # app.services.password_policy_guard. Without this, a Zitadel drift would
    # be discovered first by the new portal-api container and could crashloop
    # production. Keep this read-only: policy changes are still an explicit
    # operator/runbook action. The admin PAT deliberately comes from the same
    # core-01 env file used by production instead of a duplicate GitHub secret;
    # a missing/out-of-sync repository secret must not decide deploy safety.
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: klai-portal/backend

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Load Zitadel admin PAT from core-01
        env:
          CORE01_HOST: ${{ secrets.CORE01_HOST }}
          CORE01_DEPLOY_KEY: ${{ secrets.CORE01_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CORE01_DEPLOY_KEY" > ~/.ssh/core01_deploy_key
          chmod 600 ~/.ssh/core01_deploy_key
          ssh-keyscan -H "$CORE01_HOST" >> ~/.ssh/known_hosts

          PAT="$(
            ssh -i ~/.ssh/core01_deploy_key \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "klai@${CORE01_HOST}" \
              "sudo sed -n 's/^ZITADEL_ADMIN_PAT=//p' /opt/klai/.env | tail -n 1"
          )"
          PAT="${PAT%\"}"
          PAT="${PAT#\"}"
          PAT="${PAT%\'}"
          PAT="${PAT#\'}"

          if [ -z "$PAT" ]; then
            echo "::error::ZITADEL_ADMIN_PAT is missing from /opt/klai/.env on core-01"
            exit 1
          fi

          echo "::add-mask::$PAT"
          {
            echo "ZITADEL_ADMIN_PAT<<EOF"
            printf '%s\n' "$PAT"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Verify production Zitadel password policy
        env:
          ZITADEL_BASE_URL: https://auth.getklai.com
        run: uv run --with httpx python scripts/update_zitadel_password_policy.py

  build-push:
    needs: [quality, rls-policy-smoke-test, zitadel-password-policy-drift]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push portal-api
        uses: docker/build-push-action@v7
        with:
          # SPEC-CRAWLER-004 Fase 0: build from repo root so the Dockerfile can
          # COPY the shared klai-libs/connector-credentials path dep.
          context: .
          file: klai-portal/backend/Dockerfile
          push: true
          # `:latest` is published ONLY on push to main. PR builds publish
          # only the SHA tag so `docker pull :latest` cannot accidentally
          # pull PR-build code. Mirrors klai-connector / klai-mailer.
          tags: |
            ghcr.io/getklai/portal-api:${{ github.sha }}
            ${{ github.event_name == 'push' && 'ghcr.io/getklai/portal-api:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
    steps:
      # Checkout is required so trivy-action can find .trivy.yaml + the
      # service's .trivyignore.yaml (paths are relative to repo root).
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # STRICT-tier scan per SPEC-CI-TRIVY-POLICY-001 (REQ-2).
      #
      # Direct CLI invocation bypasses an aquasecurity/trivy-action
      # bug (0.35.0/0.36.0): with `format: sarif` the `severity` filter
      # is honoured for the SARIF body but NOT for the exit-code, so
      # a MEDIUM/LOW finding triggers exit-code 1 even when we asked
      # for CRITICAL+HIGH gating. trivy CLI's `--severity` flag is
      # honoured for both detection AND exit-code. .trivy.yaml stays
      # in the repo as the canonical policy reference until the
      # action lands proper config-file precedence.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e6c2c5e321ed9123bda567646e2f96565e34abe1  # v0.2.5
        with:
          version: v0.69.3
          cache: true

      - name: Run Trivy vulnerability scanner
        run: |
          trivy image \
            --format sarif \
            --output trivy-results.sarif \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --scanners vuln \
            --exit-code 1 \
            --ignorefile klai-portal/backend/.trivyignore.yaml \
            ghcr.io/getklai/portal-api:${{ github.sha }}
      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  deploy:
    # `needs: scan` ensures Trivy gate from SPEC-CI-TRIVY-POLICY-001 REQ-2
    # actually blocks production deploy: if scan job exits 1 on a HIGH/CRIT
    # finding, deploy is skipped. Previously deploy only depended on
    # build-push, so a failed scan would still let the image roll out.
    needs: [build-push, scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Audit 2026-05-05: defence-in-depth gate. The deploy job is gated
      # via `needs: build-push` (build-push is itself gated), but the
      # Pre-deploy env check step has no `if:` — if a future change
      # loosens the build-push gate, this step would SSH into prod from
      # PR context. Match the Deploy step's gate explicitly.
      - name: Pre-deploy env check
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CORE01_HOST }}
          username: klai
          key: ${{ secrets.CORE01_DEPLOY_KEY }}
          script: |
            set -e
            cd /opt/klai
            REQUIRED="ZITADEL_PAT PORTAL_SECRETS_KEY SSO_COOKIE_KEY DOMAIN"
            MISSING=""
            for VAR in $REQUIRED; do
              VALUE=$(docker compose config portal-api 2>/dev/null | grep -E "^\s+${VAR}:" | sed "s/.*: *//" | tr -d '"' | xargs || true)
              if [ -z "$VALUE" ]; then
                MISSING="$MISSING $VAR"
              fi
            done
            if [ -n "$MISSING" ]; then
              echo "DEPLOY BLOCKED: critical env vars are empty:$MISSING"
              echo "Push an update to klai-infra/core-01/.env.sops first."
              echo "The sync-env workflow will update the server automatically."
              exit 1
            fi
            echo "Pre-flight OK — all critical vars present."

      - name: Install portal-api deploy script on core-01
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.CORE01_HOST }}
          username: klai
          key: ${{ secrets.CORE01_DEPLOY_KEY }}
          source: deploy/scripts/deploy-portal-api.sh
          target: /opt/klai/scripts
          strip_components: 2
          overwrite: true

      # SPEC-SEC-CROSS-TENANT-FOLLOWUP-001 REQ-2: cohort gate.
      # Runs before the deploy to ensure the allow_any_origin data-migration
      # only affects internal widgets. Aborts if impacted_widgets > 5 or any
      # external tenant would be affected. The script exits 0 if safe.
      # REQ-2 widget cohort impact gate.
      # SQL is inlined here (not via `scripts/verify_widget_cohort.sh`) because
      # /opt/klai on core-01 has a sparse-checkout that does NOT include
      # klai-portal/backend/scripts/. The script-file remains in the repo as
      # a runbook entry / local-dev tool — its logic is mirrored here.
      # SPEC-DEPLOY-AUTO-MIGRATE-001 may consolidate this into a synced script.
      - name: REQ-2 widget cohort impact gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CORE01_HOST }}
          username: klai
          key: ${{ secrets.CORE01_DEPLOY_KEY }}
          script: |
            set -euo pipefail
            PLATFORM_ORG_SLUG="${{ vars.PLATFORM_ORG_SLUG || 'getklai' }}"
            MAX_IMPACTED="${{ vars.MAX_IMPACTED_WIDGETS || 5 }}"
            QUERY="SELECT \
              COUNT(*) FILTER (WHERE jsonb_array_length(COALESCE(widget_config->'allowed_origins', '[]'::jsonb)) = 0 AND public_share_enabled = false) AS impacted, \
              COUNT(DISTINCT w.org_id) FILTER (WHERE jsonb_array_length(COALESCE(widget_config->'allowed_origins', '[]'::jsonb)) = 0 AND public_share_enabled = false AND o.slug != '${PLATFORM_ORG_SLUG}') AS external \
              FROM widgets w JOIN portal_orgs o ON o.id = w.org_id;"
            RESULT=$(docker exec klai-core-postgres-1 sh -c "psql -U \$POSTGRES_USER -d \$POSTGRES_DB -t -A -F'|' -c \"$QUERY\"")
            echo "[cohort-gate] raw result: $RESULT"
            IMPACTED=$(echo "$RESULT" | cut -d'|' -f1 | tr -d ' ')
            EXTERNAL=$(echo "$RESULT" | cut -d'|' -f2 | tr -d ' ')
            echo "[cohort-gate] impacted=$IMPACTED external=$EXTERNAL platform_slug=$PLATFORM_ORG_SLUG threshold=$MAX_IMPACTED"
            if [ "$EXTERNAL" -gt 0 ]; then
              echo "::error::REQ-2 cohort gate: $EXTERNAL external tenant(s) impacted — abort. Open a follow-up SPEC with the 7-day customer-communication protocol."
              exit 1
            fi
            if [ "$IMPACTED" -gt "$MAX_IMPACTED" ]; then
              echo "::error::REQ-2 cohort gate: $IMPACTED widgets impacted (threshold $MAX_IMPACTED). Review the cohort and either bump MAX_IMPACTED_WIDGETS via repo vars or open a follow-up SPEC."
              exit 1
            fi
            echo "[cohort-gate] OK — $IMPACTED internal widget(s) impacted, safe to proceed."

      # 2026-05-05 mailer-incident class: this step previously had no `if:`
      # gate, so PR builds also auto-deployed `:latest` to prod. Same
      # pattern that bit klai-mailer post PR #319 → hotfix #322.
      #
      # 2026-05-24 portal-api incident class: do NOT let the app container be
      # the first process that discovers a broken Alembic/post-deploy path. Run
      # schema work from the freshly pulled image while the old API is still
      # serving traffic, then recreate the app container only after the DB is at
      # the expected shape.
      - name: Deploy to core-01
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CORE01_HOST }}
          username: klai
          key: ${{ secrets.CORE01_DEPLOY_KEY }}
          script: |
            set -e
            chmod +x /opt/klai/scripts/deploy-portal-api.sh
            /opt/klai/scripts/deploy-portal-api.sh

      # NOTE: post_deploy_a1c2d3e4f5b6.sql (REQ-2) and
