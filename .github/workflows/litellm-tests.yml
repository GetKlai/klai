name: litellm hook tests

# Tests for the LiteLLM gateway's own callbacks in deploy/litellm (Mistral
# failover pool, router, PII observe/enforce, prompt cache) against the
# litellm version the production image runs. They run here and not in a
# service workflow because deploy/litellm has no pyproject.

on:
  push:
    branches: [main]
    paths:
      - 'deploy/litellm/**'
      # The behavioral failover tests execute against the LiteLLM version
      # pinned by the production image in this Compose file.
      - 'deploy/docker-compose.yml'
      # This workflow file itself: a change to the job's dependency list or
      # command must be verified by running it. Without this path the fix for
      # a red run silently never executes, and main stays red.
      - '.github/workflows/litellm-tests.yml'
      # The language module is a byte-for-byte copy of this file; the drift
      # test must run when the canonical side changes, not only the copy.
      - 'klai-libs/chat-prompts/klai_chat_prompts/language.py'
  pull_request:
    paths:
      - 'deploy/litellm/**'
      - 'deploy/docker-compose.yml'
      - '.github/workflows/litellm-tests.yml'
      - 'klai-libs/chat-prompts/klai_chat_prompts/language.py'

jobs:
  litellm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.13"
      # deploy/litellm has no pyproject; the hooks' deps are supplied ad-hoc.
      # The tests import `from tests.klai_module_reset import …`, so they
      # must run from the deploy/litellm working directory.
      - name: Test (pytest)
        working-directory: deploy/litellm
        # pyyaml: test_litellm_config_provider_guard.py imports yaml; missing
        # dep kept this workflow red on main from 2026-06-18 to 2026-07-07.
        # redis: litellm 1.105.1's litellm.proxy.utils imports redis at module
        # load, which the CustomLogger contract test reads. The proxy image
        # ships redis 5.3.1 in both v1.96.2 and v1.105.1 (checked 2026-10-22).
        # The Redis budget test also builds a Router from router_settings,
        # which goes through redis-py.
        run: >
          uv run --no-project --python 3.13
          --with pytest --with pytest-asyncio --with httpx --with structlog
          --with pyyaml --with litellm==1.105.1 --with numpy
          --with "backoff>=2.2.1,<3.0" --with "fastapi>=0.136.3,<1.0"
          --with "orjson>=3.11.6,<4.0" --with redis==5.3.1
          python -m pytest tests/ -q --tb=short
