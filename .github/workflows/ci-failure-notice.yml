name: CI failure notice

# Makes a broken main branch impossible to miss.
#
# Until now nothing in this repo reported CI failures anywhere: a red deploy on
# main was visible only if somebody happened to open the Actions tab. That is
# survivable while a human merges every change by hand — it stops being
# survivable once Renovate merges dependency updates on its own.
#
# Two concrete cases this catches:
#   - A dependency update passes its tests, merges, and then fails at the
#     deploy step (image build, migration, container health).
#   - A previous failure blocks the NEXT person's deploy — the
#     "previous-deploy-failure-blocks-yours" pitfall this notice guards.
#
# One issue per workflow, reopened and re-commented rather than duplicated, so
# a flapping deploy does not bury the tab. Auto-closes when the same workflow
# goes green again, so the open-issue list IS the list of things that are
# currently broken.

on:
  workflow_run:
    # Everything that publishes an image or writes to core-01. The rule for
    # this list is "did main just fail to ship something", not "did a check go
    # red" — a red gate is already blocking at the PR, while a red deploy has
    # nothing else shouting about it.
    workflows:
      # Python + frontend services
      - Build and push portal-api
      - Build and deploy portal-frontend
      - Build and push knowledge-ingest
      - Build and push klai-connector
      - Build and push retrieval-api
      - Build and push klai-mailer
      - Build and push scribe-api
      - Build and push klai-knowledge-mcp
      # Images that are not a Python service but still ship
      - Build Klai LibreChat image
      - Build and push caddy-hetzner
      - Build and push whisper-server
      - Build and push klai-docker-authz
      - Build and deploy docs
      # Things that write directly to core-01
      - Sync compose and config to core-01
      - Sync LibreChat base config to core-01
      - Deploy LiteLLM hooks
      # The alarm for updates that stopped landing: red when a Renovate
      # automerge PR is stuck, the Dependency Dashboard lists errors or
      # Renovate has not run. Scheduled runs belong to the default branch, so
      # head_branch is main and the job condition below holds.
      - Version drift
      # The only check that walks the customer paths end to end after a deploy
      # (login, chat, KB ingest, the widget). It stayed green through the
      # 2026-10-23 widget outage because no journey asked the widget a
      # question (J06 does now), and the one run that did fail that morning
      # notified nobody. Over its last 60 runs (2026-10-22/23) it failed 7
      # times, none traced to a defect in the test, so it is watched like a deploy.
      - E2E prod-tenant
      # The weekly proof that automatic rollback still works. Red means the
      # rollback path itself (or the canary) is broken, which nobody would see
      # until a real deploy failed.
      - Rollback rehearsal
      # Restores every data store's snapshot into a throwaway; red means a
      # store's rollback point does not restore.
      - Datastore restore rehearsal
      # Rolls back what was deployed since the last green E2E run. It ends red
      # after every rollback, and its rollback-report artifact sets the label.
      - Auto-rollback
    types: [completed]

    # Deliberately NOT watched, so the open-issue list stays a list of real
    # breakage:
    #   - Semgrep / trivyignore validate / rules-tests / audit compose /
    #     env-scope-guard / tenant-isolation / alerting checks / litellm hook
    #     tests / LibreChat patch tests — these are PR gates. They block the
    #     merge, so a red one on main means somebody used --admin, and the
    #     conversation about that belongs on the PR.

permissions:
  contents: read
  issues: write
  # Reads the rollback-report artifact of the failed run (SPEC-INFRA-AUTO-ROLLBACK-001).
  actions: read

jobs:
  notice:
    # Only main matters: a red PR branch is the author's problem and already
    # visible on their PR. A red main is everybody's problem.
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Open, update or close the failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            // A cancelled or skipped run says nothing about health. E2E prod-tenant
            // is cancelled whenever a newer run supersedes it in its concurrency
            // group (32 of the last 60 runs), and treating that as "green again"
            // would close an open failure issue while the suite is still red.
            if (run.conclusion !== 'failure' && run.conclusion !== 'success') return;
            const failed = run.conclusion === 'failure';
            const title = `CI failure: ${run.name}`;

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
              per_page: 100,
            });
            const existing = open.find((i) => i.title === title);

            if (!failed) {
              // Green again — close the issue so the open list stays honest.
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `Recovered: [run ${run.id}](${run.html_url}) succeeded on \`${run.head_sha.slice(0, 9)}\`.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'closed',
                });
              }
              return;
            }

            // SPEC-INFRA-AUTO-ROLLBACK-001 S4: a deploy that rolled itself back
            // uploads its report as the `rollback-report` artifact. It is read
            // here as untrusted text: only two outcomes are accepted, and every
            // value is flattened to one short code-span-safe line before it is
            // put in an issue. A missing or unreadable artifact leaves the issue
            // exactly as it was before; the failure is still reported.
            const ROLLBACK_LABELS = {
              rolled_back: { name: 'auto-rollback', color: 'fbca04', description: 'Deploy failed and the previous version was put back automatically' },
              rollback_failed: { name: 'rollback-failed', color: 'b60205', description: 'Deploy failed and the automatic rollback failed too: a human is needed now' },
              not_started: { name: 'deploy-not-started', color: 'c5def5', description: 'The sync refused before any file changed (disk headroom or a snapshot that failed); nothing to roll back' },
            };
            const flat = (v) => String(v ?? '').replace(/[\r\n`]/g, ' ').slice(0, 200);
            let report = null;
            try {
              const { data: listed } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                name: 'rollback-report',
              });
              const artifact = listed.artifacts.find((a) => !a.expired);
              if (artifact) {
                const { data: zip } = await github.rest.actions.downloadArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                  archive_format: 'zip',
                });
                const zipPath = require('path').join(process.env.RUNNER_TEMP, 'rollback-report.zip');
                require('fs').writeFileSync(zipPath, Buffer.from(zip));
                const parsed = JSON.parse(require('child_process').execFileSync('unzip', ['-p', zipPath], { encoding: 'utf8' }));
                if (ROLLBACK_LABELS[parsed.outcome]) report = parsed;
                else core.warning(`rollback-report has an unknown outcome: ${flat(parsed.outcome)}`);
              }
            } catch (err) {
              core.warning(`could not read the rollback-report artifact: ${flat(err.message)}`);
            }

            const lines = [
              `**${run.name}** failed on \`main\`.`,
              '',
              `- Run: ${run.html_url}`,
              `- Commit: \`${run.head_sha.slice(0, 9)}\``,
              `- Started: ${run.run_started_at}`,
              '',
              'This blocks the next deploy of this service until it is green again',
              '(pitfall: previous-deploy-failure-blocks-yours).',
              '',
              'Closes itself automatically when this workflow next succeeds on `main`.',
            ];
            if (report) {
              lines.push(
                '',
                report.outcome === 'rollback_failed'
                  ? '**Automatic rollback failed. Production may be broken: a human is needed now.**'
                  : report.outcome === 'not_started'
                    ? '**Not started.** The sync refused before it replaced a single file; the host runs what it ran and the next sync tries again.'
                    : '**Rolled back automatically.** The previous version is serving again; the failing version is still on `main`.',
                '',
                `- Service: \`${flat(report.service)}\` (\`${flat(report.kind)}\`)`,
                `- Outcome: \`${flat(report.outcome)}\``,
                `- Failed gate: \`${flat(report.gate)}\``,
                `- From: \`${flat(report.from)}\``,
                `- To: \`${flat(report.to)}\``,
                `- Commit: \`${flat(report.commit)}\``,
                `- Time: \`${flat(report.ts)}\``,
                `- Log on core-01: \`${flat(report.log)}\``,
              );
            }
            const body = lines.join('\n');

            const base = { owner: context.repo.owner, repo: context.repo.repo };
            let number;
            if (existing) {
              number = existing.number;
              await github.rest.issues.createComment({ ...base, issue_number: number, body });
            } else {
              ({ data: { number } } = await github.rest.issues.create({ ...base, title, body, labels: ['ci-failure'] }));
            }

            // The labels follow the latest failure: a failure without a report
            // (an ordinary red deploy) must not keep an older rollback label.
            const dropLabel = async (name) => {
              try {
                await github.rest.issues.removeLabel({ ...base, issue_number: number, name });
              } catch (err) {
                if (err.status !== 404) throw err; // 404 = the issue did not carry it
              }
            };
            if (!report) {
              if (existing) for (const l of Object.values(ROLLBACK_LABELS)) await dropLabel(l.name);
            } else {
              // Swap, do not accumulate.
              const want = ROLLBACK_LABELS[report.outcome];
              try {
                await github.rest.issues.createLabel({ ...base, ...want });
              } catch (err) {
                if (err.status !== 422) throw err; // 422 = the label already exists
              }
              await github.rest.issues.addLabels({ ...base, issue_number: number, labels: [want.name] });
              for (const l of Object.values(ROLLBACK_LABELS)) if (l.name !== want.name) await dropLabel(l.name);
            }
