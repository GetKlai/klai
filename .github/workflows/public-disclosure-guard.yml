name: Guard public production disclosures

# This workflow intentionally uses pull_request_target so fork PRs receive a
# token that can mitigate their public title/body. It never checks out or
# executes PR-authored code. The untrusted title/body are read from the event
# file into a scanner's stdin and are never interpolated into shell source or
# logs. The GitLeaks config is fetched from the trusted default branch.

on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Scan title and body with the repository GitLeaks config
        id: secret-scan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          item_file="$RUNNER_TEMP/public-disclosure.txt"
          config_file="$RUNNER_TEMP/gitleaks.toml"
          jq -r '(.issue // .pull_request) as $item | [($item.title // ""), ($item.body // "")] | join("\n")' \
            "$GITHUB_EVENT_PATH" > "$item_file"

          default_branch="$(jq -r '.repository.default_branch' "$GITHUB_EVENT_PATH")"
          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/contents/.gitleaks.toml" \
            -f "ref=$default_branch" --jq '.content' | base64 --decode > "$config_file"

          set +e
          docker run --rm -i \
            -v "$config_file:/gitleaks.toml:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            stdin --config=/gitleaks.toml --redact=100 --no-banner --log-level=error \
            < "$item_file"
          scan_exit=$?
          set -e

          case "$scan_exit" in
            0) echo "detected=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "detected=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "GitLeaks failed with exit code $scan_exit" >&2; exit "$scan_exit" ;;
          esac

      - name: Request review with confidence-appropriate urgency
        id: mitigate
        uses: actions/github-script@v9
        env:
          GITLEAKS_DETECTED: ${{ steps.secret-scan.outputs.detected }}
        with:
          script: |
            const item = context.payload.issue ?? context.payload.pull_request;
            if (!item) {
              throw new Error('Expected an issue or pull_request event payload.');
            }

            // RFC1918 addresses disclose private network coordinates and are
            // never needed in a public PR description. Credential values and
            // private keys are classified by the repository's GitLeaks config.
            const highConfidencePatterns = [
              {
                category: 'private network address',
                pattern: /\b(?:10(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}|172\.(?:1[6-9]|2\d|3[01])(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){2}|192\.168(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){2})\b/,
              },
            ];
            // These names describe public architecture as well as potentially
            // sensitive context. They need human review, not destructive edits.
            const contextualPatterns = [
              {
                category: 'Klai hostname',
                pattern: /\b(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+getklai\.com\b/i,
              },
              {
                category: 'internal header name',
                pattern: /\b(?:x-internal-secret|x-klai-internal-secret|x-retrieval-api-internal-secret|x-scribe-api-internal-secret|x-internal-token|x-admin-api-key)\b/i,
              },
              {
                category: 'SSH host alias',
                pattern: /\b(?:core|gpu|public|monitor)-01\b/i,
              },
            ];

            const text = `${item.title ?? ''}\n${item.body ?? ''}`;
            const highConfidence = highConfidencePatterns
              .filter(({ pattern }) => pattern.test(text))
              .map(({ category }) => category);
            if (process.env.GITLEAKS_DETECTED === 'true') {
              highConfidence.unshift('credential or private key');
            }

            const contextual = contextualPatterns
              .filter(({ pattern }) => pattern.test(text))
              .map(({ category }) => category);
            const urgent = highConfidence.length > 0;
            const detected = urgent ? highConfidence : contextual;
            if (detected.length === 0) {
              core.info('No public disclosure indicators detected.');
              return;
            }

            const issueNumber = item.number;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['security'],
            });

            const commentMarker = urgent
              ? '<!-- public-disclosure-high-confidence-review -->'
              : '<!-- public-disclosure-review -->';
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 100,
              },
            );
            if (!comments.some(({ body }) => body?.includes(commentMarker))) {
              const reviewMessage = urgent
                ? [
                    commentMarker,
                    'The disclosure guard found high-confidence disclosure indicators',
                    `(${detected.join(', ')}). The title and body were not changed`,
                    'because GitHub had already received and distributed the text',
                    'before this workflow began. Please review this immediately,',
                    'rotate any exposed credential, and move sensitive details to',
                    '**Security → Report a vulnerability**.',
                  ]
                : [
                    commentMarker,
                    'The disclosure guard found contextual infrastructure references',
                    `(${detected.join(', ')}). The title and body were not changed.`,
                    'Please have a maintainer verify that the description does not',
                    'publish an actionable reproduction against an unfixed public',
                    'endpoint or private operational details.',
                  ];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: reviewMessage.join('\n'),
              });
            }
