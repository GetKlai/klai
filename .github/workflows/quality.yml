name: Required quality

# Branch protection requires the final `quality` job. This workflow must stay
# unfiltered: path-filtered reusable workflows are selected below, then their
# results are aggregated so unrelated checks cannot satisfy the requirement.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  pull-requests: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      portal_api: ${{ steps.filter.outputs.portal_api }}
      retrieval_api: ${{ steps.filter.outputs.retrieval_api }}
      knowledge_mcp: ${{ steps.filter.outputs.knowledge_mcp }}
      mailer: ${{ steps.filter.outputs.mailer }}
      slack: ${{ steps.filter.outputs.slack }}
      knowledge_ingest: ${{ steps.filter.outputs.knowledge_ingest }}
      scribe_api: ${{ steps.filter.outputs.scribe_api }}
      docs: ${{ steps.filter.outputs.docs }}
      docker_authz: ${{ steps.filter.outputs.docker_authz }}
      portal_frontend: ${{ steps.filter.outputs.portal_frontend }}
      connector: ${{ steps.filter.outputs.connector }}
      trivyignore: ${{ steps.filter.outputs.trivyignore }}
      graph_contract: ${{ steps.filter.outputs.graph_contract }}
      crawl4ai_contract: ${{ steps.filter.outputs.crawl4ai_contract }}
      caddy: ${{ steps.filter.outputs.caddy }}
      whisper_server: ${{ steps.filter.outputs.whisper_server }}
      bge_m3_sparse: ${{ steps.filter.outputs.bge_m3_sparse }}
      dockerfiles_files: ${{ steps.filter.outputs.dockerfiles_files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Detect affected workflows
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          # Lists the files matched by the `dockerfiles` filter for the image-scan
          # check at the end of this workflow.
          list-files: json
          filters: |
            portal_api:
              - 'klai-portal/backend/**'
              - 'klai-libs/chat-prompts/**'
              - 'klai-libs/citations/**'
              - 'klai-libs/connector-credentials/**'
              - 'klai-libs/kb-slugs/**'
              - '.github/workflows/portal-api.yml'
              - '.github/workflows/quality.yml'
            retrieval_api:
              - 'klai-retrieval-api/**'
              - 'klai-libs/identity-assert/**'
              - 'klai-libs/chat-prompts/**'
              - 'klai-libs/kb-slugs/**'
              - 'klai-libs/citations/**'
              - 'klai-libs/service-auth/**'
              - 'klai-libs/llm-safety/**'
              - 'klai-libs/graphiti-compat/**'
              - '.github/workflows/retrieval-api.yml'
              - '.github/workflows/quality.yml'
            knowledge_mcp:
              - 'klai-knowledge-mcp/**'
              - 'klai-libs/identity-assert/**'
              - 'klai-libs/kb-slugs/**'
              - '.github/workflows/klai-knowledge-mcp.yml'
              - '.github/workflows/quality.yml'
            mailer:
              - 'klai-mailer/**'
              - 'klai-libs/log-utils/**'
              - 'klai-libs/webhook-replay/**'
              - '.github/workflows/klai-mailer.yml'
              - '.github/workflows/quality.yml'
            slack:
              - 'klai-slack/**'
              - 'klai-libs/log-utils/**'
              - '.github/workflows/klai-slack.yml'
              - '.github/workflows/quality.yml'
            knowledge_ingest:
              - 'klai-knowledge-ingest/**'
              - 'klai-libs/connector-credentials/**'
              - 'klai-libs/image-storage/**'
              - 'klai-libs/kb-slugs/**'
              - 'klai-libs/llm-throttle/**'
              - 'klai-libs/graphiti-compat/**'
              - '.github/workflows/knowledge-ingest.yml'
              - '.github/workflows/quality.yml'
            scribe_api:
              - 'klai-scribe/scribe-api/**'
              - '.github/workflows/scribe-api.yml'
              - '.github/workflows/quality.yml'
            docs:
              - 'klai-docs/**'
              - '.github/workflows/docs.yml'
              - '.github/workflows/quality.yml'
            docker_authz:
              - 'klai-docker-authz/**'
              - 'klai-libs/log-utils/**'
              - '.github/workflows/klai-docker-authz.yml'
              - '.github/workflows/quality.yml'
            portal_frontend:
              - 'klai-portal/frontend/**'
              - 'klai-widget/**'
              - '.github/workflows/portal-frontend.yml'
              - '.github/workflows/quality.yml'
            connector:
              - 'klai-connector/**'
              - 'klai-libs/connector-credentials/**'
              - 'klai-libs/image-storage/**'
              - '.github/workflows/klai-connector.yml'
              - '.github/workflows/quality.yml'
            graph_contract:
              - 'klai-knowledge-ingest/**'
              - 'klai-retrieval-api/**'
              - 'klai-libs/graphiti-compat/**'
              - 'deploy/docker-compose.yml'
              - '.github/workflows/graph-contract.yml'
              - '.github/workflows/quality.yml'
            # Image workflows that used to run on main only. Unlike the filters
            # above they do not include quality.yml: each is a 5-15 minute image
            # build that an edit to this file should not start.
            crawl4ai_contract:
              - 'deploy/crawl4ai/**'
              - 'deploy/docker-compose.yml'
              - 'deploy/tests/crawl4ai-config-contract.sh'
              - 'deploy/tests/crawl4ai-cookie-contract.sh'
              - 'deploy/tests/crawl4ai-contract-step.sh'
              - 'deploy/tests/test-crawl4ai-contract-step.sh'
              - 'klai-knowledge-ingest/knowledge_ingest/crawl4ai_config.py'
              - 'klai-knowledge-ingest/knowledge_ingest/crawl4ai_client.py'
              - '.github/workflows/crawl4ai-contract.yml'
            caddy:
              - 'deploy/caddy/Dockerfile'
              - 'deploy/caddy/build.sh'
              - 'deploy/caddy/.trivyignore.yaml'
              - '.github/workflows/caddy.yml'
            whisper_server:
              - 'klai-scribe/whisper-server/**'
              - '.github/workflows/whisper-server.yml'
            bge_m3_sparse:
              - 'deploy/bge-m3-sparse/**'
              - '.github/workflows/bge-m3-sparse.yml'
            # Every Dockerfile; scripts/require-image-scans.py checks that each
            # changed one was scanned.
            dockerfiles:
              - '**/Dockerfile'
              - '**/Dockerfile.*'
            trivyignore:
              - '**/.trivyignore.yaml'
              - '**/.trivyignore.yml'
              - 'scripts/validate-trivyignore.sh'
              - 'scripts/_validate_trivyignore.py'
              - '.github/workflows/validate-trivyignore.yml'
              - '.github/workflows/quality.yml'

  portal-api:
    needs: changes
    if: needs.changes.outputs.portal_api == 'true'
    uses: ./.github/workflows/portal-api.yml
    secrets: inherit

  retrieval-api:
    needs: changes
    if: needs.changes.outputs.retrieval_api == 'true'
    uses: ./.github/workflows/retrieval-api.yml
    secrets: inherit

  knowledge-mcp:
    needs: changes
    if: needs.changes.outputs.knowledge_mcp == 'true'
    uses: ./.github/workflows/klai-knowledge-mcp.yml
    secrets: inherit

  mailer:
    needs: changes
    if: needs.changes.outputs.mailer == 'true'
    uses: ./.github/workflows/klai-mailer.yml
    secrets: inherit

  slack:
    needs: changes
    if: needs.changes.outputs.slack == 'true'
    uses: ./.github/workflows/klai-slack.yml
    secrets: inherit

  knowledge-ingest:
    needs: changes
    if: needs.changes.outputs.knowledge_ingest == 'true'
    uses: ./.github/workflows/knowledge-ingest.yml
    secrets: inherit

  scribe-api:
    needs: changes
    if: needs.changes.outputs.scribe_api == 'true'
    uses: ./.github/workflows/scribe-api.yml
    secrets: inherit

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/docs.yml
    secrets: inherit

  docker-authz:
    needs: changes
    if: needs.changes.outputs.docker_authz == 'true'
    uses: ./.github/workflows/klai-docker-authz.yml
    secrets: inherit

  portal-frontend:
    needs: changes
    if: needs.changes.outputs.portal_frontend == 'true'
    uses: ./.github/workflows/portal-frontend.yml
    secrets: inherit

  connector:
    needs: changes
    if: needs.changes.outputs.connector == 'true'
    uses: ./.github/workflows/klai-connector.yml
    secrets: inherit

  trivyignore:
    needs: changes
    if: needs.changes.outputs.trivyignore == 'true'
    uses: ./.github/workflows/validate-trivyignore.yml
    secrets: inherit

  graph-contract:
    needs: changes
    if: needs.changes.outputs.graph_contract == 'true'
    uses: ./.github/workflows/graph-contract.yml
    secrets: inherit

  crawl4ai-contract:
    needs: changes
    if: needs.changes.outputs.crawl4ai_contract == 'true'
    uses: ./.github/workflows/crawl4ai-contract.yml
    secrets: inherit

  caddy:
    needs: changes
    if: needs.changes.outputs.caddy == 'true'
    uses: ./.github/workflows/caddy.yml
    secrets: inherit

  whisper-server:
    needs: changes
    if: needs.changes.outputs.whisper_server == 'true'
    uses: ./.github/workflows/whisper-server.yml
    secrets: inherit

  bge-m3-sparse:
    needs: changes
    if: needs.changes.outputs.bge_m3_sparse == 'true'
    uses: ./.github/workflows/bge-m3-sparse.yml
    secrets: inherit

  quality:
    name: quality
    if: always()
    needs:
      - changes
      - portal-api
      - retrieval-api
      - knowledge-mcp
      - mailer
      - slack
      - knowledge-ingest
      - scribe-api
      - docs
      - docker-authz
      - portal-frontend
      - connector
      - trivyignore
      - graph-contract
      - crawl4ai-contract
      - caddy
      - whisper-server
      - bge-m3-sparse
    runs-on: ubuntu-latest
    steps:
      - name: Require every affected workflow to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          blocked = {
              name: data["result"]
              for name, data in needs.items()
              if data["result"] not in {"success", "skipped"}
          }
          selected = sorted(
              name
              for name, data in needs.items()
              if name != "changes" and data["result"] != "skipped"
          )
          print("Affected quality workflows:", ", ".join(selected) or "none")
          if blocked:
              for name, result in sorted(blocked.items()):
                  print(f"::error::{name} finished with {result}")
              sys.exit(1)
          PY

      # `skipped` passes above, which is right for a workflow no change selected.
      # It is wrong for an image scan: a pull request that changes a Dockerfile
      # must have run that image's Trivy scan, or the failure first shows on main
      # and blocks the deploy. 2026-11-23: two scans skipped on a base-image
      # change, both failed on main, neither service deployed for two days.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: always()

      - name: Require an image scan for every changed Dockerfile
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CHANGED_DOCKERFILES: ${{ needs.changes.outputs.dockerfiles_files }}
        run: python3 scripts/require-image-scans.py
