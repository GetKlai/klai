name: Auto-rollback

# SPEC-INFRA-AUTO-ROLLBACK-001 section 6, slice S6.
#
# Gate 3 of a deploy is the E2E prod-tenant run after it. That workflow holds no
# deploy key and should not get one, so the rollback lives here. When E2E
# prod-tenant ends red on main:
#   1. read the last green E2E run from the GitHub API;
#   2. start one confirmation run of E2E (run name "...: confirm for
#      auto-rollback run <id>") and wait up to 25 minutes. The suite failed 7 of
#      60 runs on 2026-10-22/23 for reasons outside the code, so one red run is
#      not enough to undo a day of deploys. Green or cancelled: nothing is rolled
#      back and this run ends green with a note;
#   3. red again: look up the evidence below, then
#      deploy/scripts/rollback-since.sh on core-01 puts back every
#      service deployed between the last green run and the creation of the red
#      one (ledger replay, one pass, never twice for the same deploys);
#   4. upload the report, start E2E once more ("...: after rollback by
#      auto-rollback run <id>") and end red, so ci-failure-notice.yml opens its
#      issue with the auto-rollback or rollback-failed label.
#
# Already red. From 2026-11-19 to 2026-11-22 an identity-provider setting kept
# E2E red, there was no green run to start the window at, and every later
# deploy was confirmed red and rolled back, CRM database restores included. The
# one proof that E2E is red for a reason outside the deploys is this workflow's
# own experiment: an earlier round rolled back and the E2E run it started after
# that (step 4) ended red, with no green run since
# (deploy/scripts/e2e-rollback-evidence.sh; manual, cancelled and skipped runs
# are no proof). When every deploy left in the window wrote its ledger line more
# than 15 minutes after that run completed (SERVING_MARGIN in rollback-since.sh:
# a deploy serves for minutes before its ledger line), rollback-since.sh
# changes nothing and exits 5 (outcome e2e_already_red); this run ends red with
# label e2e-already-red, the issue names the red run, and no E2E run follows.
# A deploy inside the margin, or no evidence, rolls back as before; so does a
# failed lookup, because blocking wrongly leaves a breaking deploy live while
# rolling back wrongly is the old behaviour. What a person does with
# e2e-already-red: docs/runbooks/auto-rollback.md. Until the next green run, a
# deploy that breaks something is caught only by its own deploy gates (probe
# and error watch in deploy-with-rollback.sh, the sync gates in
# compose-rollback.sh), not here.
#
# Which red runs count: workflow_run (after a deploy) and schedule (04:00). E2E
# runs after a deploy are often cancelled by the next one in their concurrency
# group, so the 04:00 run can be the first to see a deploy; with nothing deployed
# since the last green run it rolls back nothing (AT-6). Red workflow_dispatch
# runs are ignored, which covers both runs this workflow starts, so neither can
# start another round. A spec is also retried once inside every run
# (playwright.prod.config.ts).
#
# A red run that overlaps a `rollout` job of chat-image-rollout.yml is left to
# that workflow, which puts back the chat image it moved; see the step "Leave a
# red run during a chat image rollout to that rollout".
#
# workflow_dispatch has no inputs and only rehearses: it replays the
# rollback-canary service, so the whole chain (API lookup, ssh, replay, report,
# issue label) can be proven on production without touching a real service. Run
# rollback-rehearsal.yml first, which gives the canary a deployed ledger line
# after the last green E2E run. A manual full rollback is not a button: it is
# rollback-since.sh run by hand on core-01 (see the header of that script).

on:
  workflow_run:
    workflows: ['E2E prod-tenant']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # gh workflow run for the confirmation and post-rollback E2E runs.
  actions: write

# One replay at a time; a second red E2E run waits for the first replay.
concurrency:
  group: auto-rollback
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  rollback:
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.event != 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      # since: the time the last green run's job started; a deploy that landed
      # while it ran counts as untested. until: the creation of the red run; a
      # deploy after it is not what that run saw. A rehearsal uses now.
      - name: Find the last green E2E run
        id: green
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FAILED_CREATED: ${{ github.event.workflow_run.created_at }}
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$REPO/actions/workflows/e2e-prod-tenant.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0] | select(.) | "\(.id) \(.created_at)"')"
          if [[ -z "$latest" ]]; then
            echo "::error::no green E2E prod-tenant run on main; cannot tell what to roll back"
            exit 1
          fi
          read -r id created <<< "$latest"
          # A run created after the red one is green already: nothing to undo.
          if [[ -n "$FAILED_CREATED" && "$created" > "$FAILED_CREATED" ]]; then
            echo "::notice::E2E run $id (created $created) is green and newer than the red one; nothing to roll back"
            exit 0
          fi
          since="$(gh api "repos/$REPO/actions/runs/$id/jobs" --jq '[.jobs[].started_at | select(.)] | min // empty')"
          until="${FAILED_CREATED:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}"
          re='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
          if [[ ! "$since" =~ $re || ! "$until" =~ $re ]]; then
            echo "::error::window '$since'..'$until' is not YYYY-MM-DDTHH:MM:SSZ"
            exit 1
          fi
          echo "last green E2E run: $id, job started $since; window ends $until"
          printf 'since=%s\nuntil=%s\ncreated=%s\n' "$since" "$until" "$created" >> "$GITHUB_OUTPUT"

      # Chat image rollout (chat-image-rollout.yml) moves the E2E tenant to a
      # new chat image first and answers a red E2E run itself: it puts back what
      # it moved. A red run that overlaps its `rollout` job is therefore that
      # sequence's to handle, and undoing unrelated deploys for it would be
      # wrong. Matched on the job's own timestamps from the API, not on a run
      # name, and only the `rollout` job counts: the `plan` job moves nothing.
      # Deferred, not dropped: the window still starts at the last green run,
      # so the next red run still rolls back whatever else was deployed.
      - name: Leave a red run during a chat image rollout to that rollout
        id: chat-rollout
        if: steps.green.outputs.since != '' && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RED_CREATED: ${{ github.event.workflow_run.created_at }}
          RED_UPDATED: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -uo pipefail
          # Fails open like the evidence lookup below: a failed lookup means
          # this round goes ahead exactly as it did before the rollout existed.
          ids="$(gh api "repos/$REPO/actions/workflows/chat-image-rollout.yml/runs?branch=main&per_page=30" \
            --jq '.workflow_runs[] | select(.run_started_at <= "'"$RED_UPDATED"'" and .updated_at >= "'"$RED_CREATED"'") | .id')" \
            || { echo "::warning::could not list Chat image rollout runs; treating the red run as Auto-rollback's"; exit 0; }
          for id in $ids; do
            overlap="$(gh api "repos/$REPO/actions/runs/$id/jobs" --jq '[.jobs[]
              | select(.name == "rollout" and .started_at != null and .started_at <= "'"$RED_UPDATED"'"
                       and (.completed_at == null or .completed_at >= "'"$RED_CREATED"'"))] | length')" || overlap=0
            if [[ "$overlap" != 0 ]]; then
              echo "::notice::the red E2E run overlaps Chat image rollout run $id, which handles its own red; nothing rolled back"
              echo "owned=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

      - name: Confirm with a second E2E run
        id: confirm
        if: steps.green.outputs.since != '' && github.event_name != 'workflow_dispatch' && steps.chat-rollout.outputs.owned != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          reason="confirm for auto-rollback run $GITHUB_RUN_ID"
          title="E2E prod-tenant: $reason"
          gh workflow run e2e-prod-tenant.yml --repo "$GITHUB_REPOSITORY" --ref main -f reason="$reason"
          echo "started the confirmation run \"$title\""
          deadline=$(( SECONDS + 25 * 60 ))
          id="" status="" conclusion=""
          while (( SECONDS < deadline )); do
            sleep 30
            # A failed lookup is retried on the next pass; the deadline still holds.
            line="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow e2e-prod-tenant.yml --event workflow_dispatch --limit 20 \
              --json databaseId,displayTitle,status,conclusion \
              --jq "[.[] | select(.displayTitle == \"$title\")][0] // empty | \"\(.databaseId) \(.status) \(.conclusion)\"")" || true
            [[ -n "$line" ]] || continue
            read -r id status conclusion <<< "$line"
            [[ "$status" == completed ]] && break
          done
          if [[ "$status" != completed ]]; then
            echo "::error::the confirmation run (${id:-not found}) did not finish within 25 minutes; nothing rolled back"
            exit 1
          fi
          echo "confirmation run $id: $conclusion"
          if [[ "$conclusion" != failure ]]; then
            echo "::notice::confirmation run $id ended $conclusion, so the red run is not confirmed; nothing rolled back"
          fi
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

      - name: Check out the evidence lookup
        if: steps.confirm.outputs.conclusion == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Looked up after the confirmation, so a post-rollback run of the round
      # before that finished meanwhile counts. The lookup fails open: no
      # output means rollback-since.sh rolls back exactly as it did before the
      # evidence existed. Wrongly blocking would leave a breaking deploy live
      # with nothing else undoing it; wrongly rolling back is the behaviour
      # this workflow already had, and it is reported in the issue.
      - name: Find evidence that E2E is red for another reason
        id: evidence
        if: steps.confirm.outputs.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GREEN_CREATED: ${{ steps.green.outputs.created }}
        run: |
          read -r at run < <(bash deploy/scripts/e2e-rollback-evidence.sh "$GITHUB_REPOSITORY" "$GREEN_CREATED" || true) || true
          if [[ -n "${at:-}" ]]; then
            echo "E2E run $run, started after an earlier rollback, completed red at $at"
            echo "red_after=$at" >> "$GITHUB_OUTPUT"
            echo "red_run=$run" >> "$GITHUB_OUTPUT"
          fi

      # Host and runner clocks both follow NTP; marks which report on core-01
      # this run wrote.
      - name: Mark replay start
        id: replay-start
        if: steps.green.outputs.since != '' && (github.event_name == 'workflow_dispatch' || steps.confirm.outputs.conclusion == 'failure')
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Exit 0: nothing to roll back. 3: rolled back. 4: a rollback failed or
      # could not be attempted (needs a human). 5: E2E was already red before
      # the first deploy in the window, nothing rolled back. 3, 4 and 5 fail
      # this step and run.
      - name: Roll back on core-01
        id: replay
        if: steps.replay-start.outcome == 'success'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        with:
          host: ${{ secrets.CORE01_HOST }}
          username: klai
          key: ${{ secrets.CORE01_DEPLOY_KEY }}
          command_timeout: 30m
          script: |
            set -e
            source /opt/klai/.env
            test -x /opt/klai/scripts/rollback-since.sh
            rc=0
            /opt/klai/scripts/rollback-since.sh ${{ steps.green.outputs.since }} --until ${{ steps.green.outputs.until }} ${{ steps.evidence.outputs.red_after && format('--red-after {0}', steps.evidence.outputs.red_after) || '' }} ${{ github.event_name == 'workflow_dispatch' && '--rehearse' || '' }} || rc=$?
            # A rehearsal that rolled the canary back is the expected outcome and
            # ends green, so it opens no ci-failure issue (the 2026-10-28 proof
            # run opened #2111 that way); any other result is red.
            if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "$rc" = 3 ]; then
              echo "rehearsal: the canary was rolled back as expected"
              exit 0
            fi
            exit "$rc"

      # Same hand-off as the deploy workflows (S4): only a report written by this
      # replay counts.
      - name: Fetch rollback report
        id: rollback-report
        if: always() && steps.replay.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        with:
          host: ${{ secrets.CORE01_HOST }}
          username: klai
          key: ${{ secrets.CORE01_DEPLOY_KEY }}
          capture_stdout: true
          script: cat /opt/klai/deploy-reports/e2e-rollback.json 2>/dev/null || true

      - name: Keep rollback report
        id: keep
        if: always() && steps.replay.outcome == 'failure'
        continue-on-error: true
        env:
          REPORT: ${{ steps.rollback-report.outputs.stdout }}
          STARTED: ${{ steps.replay-start.outputs.at }}
          RED_RUN: ${{ steps.evidence.outputs.red_run }}
        run: |
          report="$(printf '%s\n' "$REPORT" | grep -m1 '^{' || true)"
          if printf '%s' "$report" | jq -e --arg since "$STARTED" '.kind == "e2e" and .ts >= $since and .outcome != "deployed"' >/dev/null 2>&1; then
            # The host does not know run ids; the issue names the red run.
            printf '%s\n' "$report" | jq -c --arg run "$RED_RUN" '. + {red_run: $run}' > rollback-report.json
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "outcome=$(jq -r .outcome rollback-report.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload rollback report
        if: always() && steps.keep.outputs.found == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rollback-report
          path: rollback-report.json
          retention-days: 30

      # Proof that the restored state is good. A workflow_dispatch run, which
      # this workflow ignores, so a red one cannot start a second round. After
      # e2e_already_red nothing was restored, so there is nothing to prove.
      - name: Run E2E prod-tenant after the rollback
        if: always() && steps.keep.outputs.found == 'true' && steps.keep.outputs.outcome != 'e2e_already_red' && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run e2e-prod-tenant.yml --repo "$GITHUB_REPOSITORY" --ref main -f reason="after rollback by auto-rollback run $GITHUB_RUN_ID"
