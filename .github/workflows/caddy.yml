name: Build and push caddy-hetzner

on:
  push:
    branches: [main]
    paths:
      # SPEC-INFRA-CADDY-CONFIG-DEPLOY-001 R2 — paths reduced from
      # `deploy/caddy/**` to image-relevant files only. Caddyfile sync
      # moved to deploy-compose.yml so config-only edits no longer
      # trigger a 5-10 min image rebuild. Pre-merge syntax validation
      # of the Caddyfile is in caddy-validate.yml (R3).
      - 'deploy/caddy/Dockerfile'
      - 'deploy/caddy/build.sh'
      - 'deploy/caddy/.trivyignore.yaml'
      - '.github/workflows/caddy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  # Opt in early to Node 24 for all JS-based actions (Node 20 EOL Sept 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push caddy-hetzner
        uses: docker/build-push-action@v7
        with:
          context: ./deploy/caddy
          push: true
          tags: |
            ghcr.io/getklai/caddy-hetzner:latest
            ghcr.io/getklai/caddy-hetzner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to core-01
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CORE01_HOST }}
          username: klai
          key: ${{ secrets.CORE01_DEPLOY_KEY }}
          script: |
            docker pull ghcr.io/getklai/caddy-hetzner:latest
            # SPEC-INFRA-CONTAINER-HYGIENE-001 REQ-3
            /opt/klai/scripts/compose-up.sh caddy

  scan:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
    steps:
      # Checkout is required so trivy-action can find .trivy.yaml + the
      # service's .trivyignore.yaml (paths are relative to repo root).
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # STRICT-tier scan per SPEC-CI-TRIVY-POLICY-001 (REQ-2).
      #
      # We invoke Trivy CLI directly instead of via aquasecurity/trivy-action
      # because that wrapper has a bug in 0.35.0 / 0.36.0 with `format: sarif`:
      # the `severity` filter is honoured for the SARIF body but NOT for the
      # exit-code — meaning a MEDIUM/LOW finding still triggers exit-code 1
      # even when we asked for CRITICAL+HIGH gating only. Caddy / docs /
      # whisper-server hit this bug on PR #3's first main run (e2303848)
      # because they had findings in the SARIF that the wrapper let through
      # to the exit-code check.
      #
      # Direct trivy CLI honours `--severity` for both detection and
      # exit-code, so the filter actually applies. Same flags map 1:1 to
      # `.trivy.yaml` keys and per-service `.trivyignore.yaml`. When
      # trivy-action lands a fix (issue: aquasecurity/trivy-action ?), we
      # can collapse this back to the wrapper.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e6c2c5e321ed9123bda567646e2f96565e34abe1  # v0.2.5
        with:
          version: v0.69.3
          cache: true

      - name: Run Trivy vulnerability scanner
        run: |
          trivy image \
            --format sarif \
            --output trivy-results.sarif \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --scanners vuln \
            --exit-code 1 \
            --ignorefile deploy/caddy/.trivyignore.yaml \
            ghcr.io/getklai/caddy-hetzner:${{ github.sha }}

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
