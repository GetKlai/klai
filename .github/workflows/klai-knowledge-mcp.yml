name: Build and push klai-knowledge-mcp

on:
  push:
    branches: [main]
    paths:
      - 'klai-knowledge-mcp/**'
      # SPEC-SEC-IDENTITY-ASSERT-001 Phase B: knowledge-mcp consumes
      # klai-libs/identity-assert as a path-dep, so library changes need
      # to retrigger this image build.
      - 'klai-libs/identity-assert/**'
      - '.github/workflows/klai-knowledge-mcp.yml'
  pull_request:
    branches: [main]
    paths:
      - 'klai-knowledge-mcp/**'
      - 'klai-libs/identity-assert/**'
      - '.github/workflows/klai-knowledge-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  # Opt in early to Node 24 for all JS-based actions (Node 20 EOL Sept 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  quality:
    # Mirrors the portal-api quality job: lint, format-check, type-check,
    # then tests. Build + image scan only run when this is green.
    # pip-audit is intentionally NOT wired here yet — there are 3 known
    # CVEs in transitive deps (cryptography, pygments, python-multipart)
    # that need triage before pip-audit can become a hard gate. Tracked
    # as a separate follow-up.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: klai-knowledge-mcp
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Install dependencies (incl. dev extras)
        # `uv sync` resolves the path-deps `klai-identity-assert` and
        # `klai-log-utils` from ../klai-libs/ — same pattern as the runtime
        # Dockerfile uses for editable installs.
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (pyright)
        run: uv run --with pyright pyright

      - name: Test (pytest)
        run: uv run pytest -q --tb=short

  build-push:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # SPEC-SEC-CORS-001 REQ-6 — CORSMiddleware must be the LAST add_middleware
      # call in this service's entry module. Rule lives at
      # rules/cors_middleware_last.yml, configured by sgconfig.yml at repo root.
      # `uses:` steps ignore the job's defaults.run.working-directory and run
      # from $GITHUB_WORKSPACE, so the relative paths resolve correctly.
      # Note: klai-knowledge-mcp uses FastMCP streamable_http_app() which has no
      # add_middleware calls — this step is a vacuous-pass per REQ-6.3 note.
      - name: Guard — CORSMiddleware must be last (SPEC-SEC-CORS-001 REQ-6)
        uses: ast-grep/action@cf62e780f0c88301228978d593a7784427a097a6  # v1.5.0
        with:
          config: sgconfig.yml
          paths: klai-knowledge-mcp/main.py

      # SPEC-SEC-INTERNAL-001 REQ-6: ban `==` / `!=` on secret-shaped variables
      # across the whole klai-knowledge-mcp tree.
      - name: Guard — no string-compare on secret (SPEC-SEC-INTERNAL-001 REQ-6)
        uses: ast-grep/action@cf62e780f0c88301228978d593a7784427a097a6  # v1.5.0
        with:
          config: sgconfig.yml
          paths: klai-knowledge-mcp

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push klai-knowledge-mcp
        uses: docker/build-push-action@v7
        with:
          # SPEC-SEC-IDENTITY-ASSERT-001 Phase B: build context is the repo
          # root so klai-libs/identity-assert is reachable as a Docker COPY
          # source. Same pattern as klai-knowledge-ingest.
          context: .
          file: klai-knowledge-mcp/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/getklai/klai-knowledge-mcp:latest
            ghcr.io/getklai/klai-knowledge-mcp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to core-01
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CORE01_HOST }}
          username: klai
          key: ${{ secrets.CORE01_DEPLOY_KEY }}
          script: |
            set -e
            source /opt/klai/.env
            echo "$GHCR_READ_PAT" | docker login ghcr.io -u mvletter --password-stdin
            docker pull ghcr.io/getklai/klai-knowledge-mcp:latest
            # SPEC-INFRA-CONTAINER-HYGIENE-001 REQ-3
            /opt/klai/scripts/compose-up.sh klai-knowledge-mcp

  scan:
    needs: build-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Trivy policy lives in .trivy.yaml at repo root (SPEC-CI-TRIVY-POLICY-001 REQ-1).
      # PR #1 wires the config; inline `severity` + `ignore-unfixed` stay until PR #3
      # removes them with `exit-code: '1'` + `limit-severities-for-sarif: 'true'`.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/getklai/klai-knowledge-mcp:${{ github.sha }}
          trivy-config: .trivy.yaml
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
