name: Build and push retrieval-api

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'klai-retrieval-api/**'
      # SPEC-SEC-IDENTITY-ASSERT-001 Phase D: retrieval-api consumes
      # klai-libs as path-deps; library updates retrigger
      # this image build.
      - 'klai-libs/identity-assert/**'
      - 'klai-libs/chat-prompts/**'
      - 'klai-libs/kb-slugs/**'
      - 'klai-libs/citations/**'
      - 'klai-libs/service-auth/**'
      - 'klai-libs/llm-safety/**'
      - 'klai-libs/graphiti-compat/**'
      - '.github/workflows/retrieval-api.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  # Opt in early to Node 24 for all JS-based actions (Node 20 EOL Sept 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # retrieval-api had NO automated test gate: its ~520 pytest tests only ran
  # locally, so changes (incl. security-critical middleware/auth.py) merged
  # without CI ever running them. This job closes that gap. All external
  # services (Redis/Qdrant/TEI/FalkorDB/portal) are mocked, so no service
  # containers are needed.
  #
  # The always-running Required quality workflow calls this workflow for
  # affected PRs and aggregates this job into the single required `quality`
  # context. Pushes to main still run this workflow directly.
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: klai-retrieval-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
        with:
          python-version: "3.13"
      # Dependency vulnerability gate — see knowledge-ingest.yml for the
      # rationale. This service carried a vulnerable cryptography + h2 for
      # weeks with nothing scanning it. Runs before pytest so a bad pin fails
      # fast. --skip-editable: internal klai-libs are editable path deps.
      - name: Dependency vulnerability scan (pip-audit)
        run: uv run --with pip-audit pip-audit --skip-editable

      # pyproject.toml's [tool.ruff.lint] select already included TRY (SPEC-SEC-HYGIENE-001
      # REQ-43.4, to catch logger.error(...) inside except blocks dropping the traceback)
      # but nothing in CI ran ruff, so the config was decorative. Two TRY400 violations had
      # already landed unnoticed before this gate was wired up.
      - name: Lint (ruff)
        run: uv run --extra dev ruff check .

      - name: Format check (ruff)
        run: uv run --extra dev ruff format --check .

      - name: Test (pytest)
        run: uv run --extra dev pytest -q --tb=short

  build-push:
    # Without this the image built and DEPLOYED regardless of the test result —
    # the suite ran alongside the build rather than gating it.
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # SPEC-SEC-CORS-001 REQ-6 — CORSMiddleware must be the LAST add_middleware
      # call in this service's entry module. Rule lives at
      # rules/cors_middleware_last.yml, configured by sgconfig.yml at repo root.
      # `uses:` steps ignore the job's defaults.run.working-directory and run
      # from $GITHUB_WORKSPACE, so the relative paths resolve correctly.
      - name: Guard — CORSMiddleware must be last (SPEC-SEC-CORS-001 REQ-6)
        uses: ast-grep/action@cf62e780f0c88301228978d593a7784427a097a6  # v1.5.0
        with:
          config: sgconfig.yml
          paths: klai-retrieval-api/retrieval_api/main.py

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build and push retrieval-api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          # SPEC-SEC-IDENTITY-ASSERT-001 Phase D: build context is the repo
          # root so klai-libs/identity-assert is reachable as a Docker COPY
          # source. Same pattern as klai-knowledge-mcp (Phase B).
          context: .
          file: klai-retrieval-api/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/getklai/retrieval-api:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/getklai/retrieval-api:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    needs: build-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
    steps:
      # Checkout is required so trivy-action can find .trivy.yaml + the
      # service's .trivyignore.yaml (paths are relative to repo root).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # STRICT-tier scan per SPEC-CI-TRIVY-POLICY-001 (REQ-2).
      #
      # Direct CLI invocation bypasses an aquasecurity/trivy-action
      # bug (0.35.0/0.36.0): with `format: sarif` the `severity` filter
      # is honoured for the SARIF body but NOT for the exit-code, so
      # a MEDIUM/LOW finding triggers exit-code 1 even when we asked
      # for CRITICAL+HIGH gating. trivy CLI's `--severity` flag is
      # honoured for both detection AND exit-code. .trivy.yaml stays
      # in the repo as the canonical policy reference until the
      # action lands proper config-file precedence.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
        with:
          version: v0.76.1
          cache: true

      - name: Run Trivy vulnerability scanner
        run: |
          trivy image \
            --format sarif \
            --output trivy-results.sarif \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --scanners vuln \
            --exit-code 1 \
            ghcr.io/getklai/retrieval-api:${{ github.sha }}
      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  deploy:
    if: github.ref == 'refs/heads/main'
    # `needs: scan` ensures the Trivy gate from SPEC-CI-TRIVY-POLICY-001 REQ-2
    # can actually block the rollout: this step used to be the tail of
    # build-push, so a failing scan could not stop it from deploying.
    needs: [build-push, scan]
    runs-on: ubuntu-latest

    steps:
      # Start time of the deploy, so the rollback report fetched afterwards
      # can be told apart from one left by an earlier attempt of the same commit.
      - name: Mark deploy start
        id: deploy-start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Deploy to core-01
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        with:
          host: ${{ secrets.CORE01_HOST }}
          username: klai
          key: ${{ secrets.CORE01_DEPLOY_KEY }}
          script: |
            set -e
            source /opt/klai/.env
            # SPEC-INFRA-CONTAINER-HYGIENE-001 REQ-3
            # SPEC-INFRA-AUTO-ROLLBACK-001: deploys the exact sha, rolls back on a red gate.
            test -x /opt/klai/scripts/deploy-with-rollback.sh
            /opt/klai/scripts/deploy-with-rollback.sh retrieval-api ghcr.io/getklai/retrieval-api:${{ github.sha }} --probe http://retrieval-api:8040/health --compose-tag klai/retrieval-api:local --error-watch 300

      # SPEC-INFRA-AUTO-ROLLBACK-001 S4: hand the rollback report to
      # ci-failure-notice.yml. The report file stays on core-01 between runs, so
      # only one written by this attempt counts (this commit, written after the
      # deploy step started); a green deploy, or one that never reached the
      # script, leaves no artifact.
      - name: Fetch rollback report
        id: rollback-report
        if: always() && github.event_name == 'push'
        continue-on-error: true
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        with:
          host: ${{ secrets.CORE01_HOST }}
          username: klai
          key: ${{ secrets.CORE01_DEPLOY_KEY }}
          capture_stdout: true
          script: cat /opt/klai/deploy-reports/retrieval-api.json 2>/dev/null || true

      - name: Keep rollback report
        continue-on-error: true
        if: always() && github.event_name == 'push'
        env:
          REPORT: ${{ steps.rollback-report.outputs.stdout }}
          STARTED: ${{ steps.deploy-start.outputs.at }}
        run: |
          [ -n "$STARTED" ] || exit 0
          report="$(printf '%s\n' "$REPORT" | grep -m1 '^{' || true)"
          if printf '%s' "$report" | jq -e --arg sha "$GITHUB_SHA" --arg since "$STARTED" '.commit == $sha and .ts >= $since and .outcome != "deployed"' >/dev/null 2>&1; then
            printf '%s\n' "$report" > rollback-report.json
          fi

      - name: Upload rollback report
        continue-on-error: true
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: rollback-report
          path: rollback-report.json
          retention-days: 30
          if-no-files-found: ignore
