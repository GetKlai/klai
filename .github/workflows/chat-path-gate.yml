name: Chat path gate

# A change to the files where the chat decides what a user gets must add its
# measurement to section 8 of docs/architecture/chat-quality-history-and-plan.md.
# See scripts/check-chat-path-measured.py for why this runs in CI and not on
# paper.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  measured:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test the gate itself
        run: pip install --quiet pytest && python3 -m pytest -q scripts/tests/test_check_chat_path_measured.py

      - name: A chat path change carries its measurement
        run: python3 -B scripts/check-chat-path-measured.py "origin/${{ github.base_ref }}"
