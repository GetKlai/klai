name: Audit compose (volumes + orphans)

on:
  pull_request:
    paths:
      - 'deploy/docker-compose.yml'
      - 'deploy/caddy/Caddyfile'
      - 'deploy/volume-mounts.yaml'
      - 'deploy/tests/**'
      - 'scripts/audit-compose-volumes.sh'
      - 'scripts/audit-compose-orphans.sh'
      - 'scripts/audit-docker-access.sh'
      - 'deploy/alloy/config.alloy'
      - 'deploy/tests/test_alloy_docker_access.sh'
      - 'scripts/test-audit-compose.sh'
      - 'scripts/test-audit-compose-orphans.sh'
      - 'klai-scribe/scribe-api/app/core/config.py'
      - '.github/workflows/audit-compose.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/docker-compose.yml'
      - 'deploy/caddy/Caddyfile'
      - 'deploy/volume-mounts.yaml'
      - 'deploy/tests/**'
      - 'scripts/audit-compose-volumes.sh'
      - 'scripts/audit-compose-orphans.sh'
      - 'scripts/test-audit-compose.sh'
      - 'scripts/test-audit-compose-orphans.sh'
      - 'klai-scribe/scribe-api/app/core/config.py'

jobs:
  audit:
    name: audit-compose-volumes-and-orphans
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install yq + jq
        env:
          YQ_VERSION: v4.47.1
          YQ_SHA256: 0fb28c6680193c41b364193d0c0fc4a03177aecde51cfc04d506b1517158c2fb
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y jq
          curl -fsSL \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -o /tmp/yq
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
          yq --version
          jq --version

      - uses: astral-sh/setup-uv@v7

      - name: Run volume audit
        run: bash scripts/audit-compose-volumes.sh

      - name: Run deploy contract tests
        run: uv run --with pytest --with pyyaml pytest deploy/tests -q

      - name: Volume regression test — bug must be caught
        run: bash scripts/test-audit-compose.sh

      - name: Run orphan audit (SPEC-INFRA-CONTAINER-HYGIENE-001 REQ-2c)
        run: bash scripts/audit-compose-orphans.sh

      - name: Run docker-access audit (SPEC-SEC-DOCKER-AUTHZ-001)
        run: bash scripts/audit-docker-access.sh

      - name: Alloy must not reach the raw Docker socket (REQ-U-002a)
        run: bash deploy/tests/test_alloy_docker_access.sh

      - name: Orphan regression test — fixtures must catch known anti-patterns
        run: bash scripts/test-audit-compose-orphans.sh
