name: Build and push scribe-api

on:
  push:
    branches: [main]
    paths:
      - 'klai-scribe/scribe-api/**'
      - '.github/workflows/scribe-api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'klai-scribe/scribe-api/**'
      - '.github/workflows/scribe-api.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  # Opt in early to Node 24 for all JS-based actions (Node 20 EOL Sept 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Until 2026-08-14 this service had NO quality job at all: 108 tests, ruff
  # config and a lockfile existed in the repo but nothing ever ran them, so
  # dependency drift and regressions were invisible. Mirrors the portal-api /
  # knowledge-mcp shape: lint -> vulnerability scan -> tests, all gating the
  # image build.
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: klai-scribe/scribe-api

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      # --skip-editable keeps the gate on external deps; internal klai-libs are
      # editable path deps, not PyPI releases to query by distribution name.
      - name: Dependency vulnerability scan (pip-audit)
        run: uv run --with pip-audit pip-audit --skip-editable

      - name: Test (pytest)
        run: uv run pytest -q --tb=short

  build-push:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # SPEC-SEC-CORS-001 REQ-6 — CORSMiddleware must be the LAST add_middleware
      # call in this service's entry module. Rule lives at
      # rules/cors_middleware_last.yml, configured by sgconfig.yml at repo root.
      # `uses:` steps ignore the job's defaults.run.working-directory and run
      # from $GITHUB_WORKSPACE, so the relative paths resolve correctly.
      - name: Guard — CORSMiddleware must be last (SPEC-SEC-CORS-001 REQ-6)
        uses: ast-grep/action@cf62e780f0c88301228978d593a7784427a097a6  # v1.5.0
        with:
          config: sgconfig.yml
          paths: klai-scribe/scribe-api/app/main.py

      # SPEC-SEC-INTERNAL-001 REQ-6: ban `==` / `!=` on secret-shaped variables
      # across the whole scribe-api app tree.
      - name: Guard — no string-compare on secret (SPEC-SEC-INTERNAL-001 REQ-6)
        uses: ast-grep/action@cf62e780f0c88301228978d593a7784427a097a6  # v1.5.0
        with:
          config: sgconfig.yml
          paths: klai-scribe/scribe-api/app

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push scribe-api
        uses: docker/build-push-action@v7
        with:
          # SPEC-SEC-INTERNAL-001 B4: build context is repo root so the
          # Dockerfile can COPY the shared klai-libs/log-utils path-dep.
          # Same pattern as klai-knowledge-mcp / klai-connector / portal-api.
          context: .
          file: klai-scribe/scribe-api/Dockerfile
          push: true
          # `:latest` is published ONLY on push to main. PR builds publish
          # only the SHA tag so `docker pull :latest` cannot accidentally
          # pull PR-build code. Mirrors klai-connector / klai-mailer
          # (post hotfix #322).
          tags: |
            ghcr.io/getklai/scribe-api:${{ github.sha }}
            ${{ github.event_name == 'push' && 'ghcr.io/getklai/scribe-api:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2026-05-05 mailer-incident class: this step previously had no `if:`
      # gate, so PR builds also auto-deployed `:latest` to prod. The first
      # PR build that produced a recreate after a long quiet period could
      # surface a hidden validator-env-parity regression as a 30+ minute
      # outage. Same pattern that bit klai-mailer post PR #319 → hotfix #322.
      - name: Deploy to core-01
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CORE01_HOST }}
          username: klai
          key: ${{ secrets.CORE01_DEPLOY_KEY }}
          script: |
            set -e
            source /opt/klai/.env
            echo "$GHCR_READ_PAT" | docker login ghcr.io -u mvletter --password-stdin
            docker pull ghcr.io/getklai/scribe-api:latest
            # SPEC-SEC-AUDIT-2026-04 C5: alembic upgrade head runs automatically
            # via /app/entrypoint.sh at container start (klai-scribe/scribe-api/entrypoint.sh).
            # SPEC-INFRA-CONTAINER-HYGIENE-001 REQ-3: compose-up.sh wraps
            # `docker compose up -d` with image-tag + resource-limit checks.
            /opt/klai/scripts/compose-up.sh scribe-api

  scan:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
    steps:
      # Checkout is required so trivy-action can find .trivy.yaml + the
      # service's .trivyignore.yaml (paths are relative to repo root).
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # STRICT-tier scan per SPEC-CI-TRIVY-POLICY-001 (REQ-2).
      #
      # Direct CLI invocation bypasses an aquasecurity/trivy-action
      # bug (0.35.0/0.36.0): with `format: sarif` the `severity` filter
      # is honoured for the SARIF body but NOT for the exit-code, so
      # a MEDIUM/LOW finding triggers exit-code 1 even when we asked
      # for CRITICAL+HIGH gating. trivy CLI's `--severity` flag is
      # honoured for both detection AND exit-code. .trivy.yaml stays
      # in the repo as the canonical policy reference until the
      # action lands proper config-file precedence.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e6c2c5e321ed9123bda567646e2f96565e34abe1  # v0.2.5
        with:
          version: v0.69.3
          cache: true

      - name: Run Trivy vulnerability scanner
        run: |
          trivy image \
            --format sarif \
            --output trivy-results.sarif \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --scanners vuln \
            --exit-code 1 \
            ghcr.io/getklai/scribe-api:${{ github.sha }}
      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
