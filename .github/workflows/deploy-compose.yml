name: Sync docker-compose.yml + config + smoke-test to core-01

on:
  push:
    branches: [main]
    paths:
      - 'deploy/docker-compose.yml'
      - 'deploy/docker-compose.override.yml'
      - 'deploy/caddy/Caddyfile'                  # SPEC-INFRA-CADDY-CONFIG-DEPLOY-001 R1 — sync Caddyfile to bind-mount source
      - 'deploy/alloy/config.alloy'               # SPEC-INFRA-CONFIG-SYNC-001 R3 — alloy log-pipeline config
      - 'deploy/searxng/settings.yml'             # SPEC-INFRA-CONFIG-SYNC-001 R3 — searxng search config
      - 'deploy/librechat/klai-entrypoint.sh'     # force light theme — synced before librechat-getklai recreate
      - 'deploy/librechat/getklai/entrypoint.sh'  # getklai-only LibreChat client polish canary
      - 'deploy/librechat/getklai/apply-canary-config.py'
      - 'deploy/grafana/provisioning/**'          # SPEC-SEC-024 M4.2 — alert rule + dashboard
      - 'deploy/check-image-pullable.sh'          # public self-host image pullability guard
      - 'deploy/check-image-tags.sh'              # compose image tag policy guard
      - 'deploy/check-klai-librechat-digest.sh'   # Klai LibreChat image must be digest-pinned
      - 'deploy/check-klai-presidio-digest.sh'    # Klai presidio-analyzer image must be digest-pinned
      - 'deploy/scripts/**'                       # Public-safe deploy scripts; operator health scripts live in klai-infra
      - 'scripts/mistral-api-probe.sh'            # authenticated provider heartbeat
      - 'deploy/systemd/mistral-api-probe.*'      # its unit + timer, staged in /opt/klai/systemd
      - 'scripts/widget-probe.py'                 # customer widget probe
      - 'deploy/systemd/widget-probe.*'           # its unit + timer, staged in /opt/klai/systemd
      - 'scripts/smoke-docker-socket-proxy.sh'    # SPEC-SEC-024 M4.3 — smoke-test
      - '.github/workflows/deploy-compose.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Opt in early to Node 24 for all JS-based actions (Node 20 EOL Sept 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# One sync at a time. Two runs started 5 s apart on 2026-10-28 (b5d01a88d and
# 811900b91): both worked in the same fixed clone directory, the second's
# `rm -rf` took the first run's working directory away mid-sync (rsync:
# getcwd(): No such file or directory), and both recreated containers on
# core-01 at once. Queued, never cancelled: a cancelled sync could leave the
# host half-synced.
concurrency:
  group: deploy-compose-core-01
  cancel-in-progress: false

jobs:
  sync-compose:
    # Production sync over SSH. Guarded on main for the same reason as every
    # deploy job: workflow_dispatch accepts any ref, and without this a
    # dispatch from a feature branch would sync that branch's compose and
    # config to core-01. A deliberate dispatch on main still works.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      rollback-report: ${{ steps.keep-report.outputs.report }}

    steps:
      - uses: actions/checkout@v7

      # A version pin that lives in two places drifts: the compose image
      # is what production runs, the litellm-tests workflow pin is what CI
      # tests the hooks against. Bumping the compose pin without the
      # workflow pin leaves CI green while testing the old library against
      # the new production. Add pairs in deploy/check-version-pin-agreement.py.
      - name: Check version pins agree between compose and CI workflows
        # --self-test first: a guard whose own tests never run is the same
        # class of problem this check exists to catch.
        run: |
          python3 deploy/check-version-pin-agreement.py --self-test
          python3 deploy/check-version-pin-agreement.py

      # Forcing function — fail loud BEFORE pushing to core-01 if any
      # public self-host image reference points at a tag that is not
      # pullable from the registry and not a locally-built convention.
      # This catches both private ghcr.io/getklai/* packages and broken
      # upstream tags. PR #269 (broken `:0.10.6` for transcription-service)
      # would have failed this gate.
      - name: Validate image tags + pullability
        run: |
          set -e
          chmod +x deploy/check-image-tags.sh deploy/check-image-pullable.sh \
                   deploy/check-klai-librechat-digest.sh deploy/check-klai-presidio-digest.sh
          sh deploy/check-image-tags.sh
          sh deploy/check-image-pullable.sh
          # The Klai LibreChat image must be pinned by digest: on 2026-08-14 the
          # tag v0.8.7-klai.1 was overwritten with different content, so a
          # tag-pinned canary could not be rolled back to what it ran.
          sh deploy/scripts/tests/check-klai-librechat-digest.test.sh
          sh deploy/check-klai-librechat-digest.sh
          # Same rule, same reason, for the Klai presidio-analyzer image
          # (SPEC-PRIVACY-MISTRAL-PII-001 Phase 1). Format-only: this does
          # NOT prove the digest is real/pullable — see
          # deploy/check-klai-presidio-digest.sh's own header comment.
          sh deploy/scripts/tests/check-klai-presidio-digest.test.sh
          sh deploy/check-klai-presidio-digest.sh
          sh deploy/librechat/check-patch-drift.sh
          # compose-up.sh decides whether a deploy counts as successful, for
          # every service. This job is the only thing that installs it on
          # core-01, so its tests belong here.
          bash deploy/scripts/tests/compose-up-verify.test.sh
          # compose-rollback.sh is sourced by the sync step below.
          bash deploy/scripts/tests/compose-rollback.test.sh
          # Its data half: snapshot before, restore on red (S8a).
          bash deploy/scripts/tests/datastore-rollback.test.sh
          # The env-drift sweep at the end of the sync step, installed here too.
          bash deploy/scripts/tests/compose-env-drift-recreate.test.sh
          # Installed here with the other deploy scripts; service workflows call it.
          bash deploy/scripts/tests/deploy-with-rollback.test.sh
          # The orphan audit decides which live containers look abandoned. A
          # class it does not know reads as a wees — that is the librechat-voys
          # incident. This job also installs it, so its tests belong here.
          bash deploy/scripts/tests/docker-orphan-audit-klasse-c.test.sh
          bash deploy/scripts/tests/docker-orphan-audit-caddy-routes.test.sh
          bash deploy/scripts/tests/docker-orphan-audit-hand-edits.test.sh
          bash deploy/scripts/tests/harden-docker-user-bot-isolation.test.sh
          bash deploy/scripts/tests/vexa12-transcription-path.test.sh
          # deploy-portal-api.sh runs migrations before it swaps the container,
          # so a mid-flight failure is the expensive kind. Its disk guard is
          # what keeps a full disk from producing one.
          bash deploy/scripts/tests/deploy-portal-api-disk-guard.test.sh
          # This job installs backup.sh on core-01, so its retention tests
          # belong here too — the second one covers the window shrinking to 7.
          bash deploy/scripts/tests/backup-retention.test.sh
          bash deploy/scripts/tests/backup-retention-partial-sets.test.sh
          bash deploy/scripts/tests/backup-bgsave-wait.test.sh
          bash deploy/scripts/tests/backup-single-run.test.sh

      # Host and runner clocks both follow NTP; this marks which report on
      # core-01 was written by this run (see "Keep rollback report" below).
      - name: Mark sync start
        id: sync-start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Sync docker-compose.yml + config + run smoke-test
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CORE01_HOST }}
          username: klai
          key: ${{ secrets.CORE01_DEPLOY_KEY }}
          script: |
            set -e
            # A directory of its own per run, so a run that overlaps (or a
            # leftover from a killed one) can never delete this run's cwd.
            SYNC_DIR="$(mktemp -d /tmp/klai-compose-sync.XXXXXX)"
            rm -rf /tmp/klai-compose-sync
            git clone --depth=1 --filter=blob:none --sparse \
              https://github.com/GetKlai/klai.git "$SYNC_DIR"
            cd "$SYNC_DIR"
            # SPEC-SEC-024 M4.2 + M4.3: also pull Grafana provisioning and
            # public-safe deploy scripts. Operator monitoring scripts
            # (push-health, gpu-health, monitor coverage) are owned by
            # GetKlai/klai-infra and are intentionally not synced here.
            git sparse-checkout set --skip-checks \
              deploy/docker-compose.yml \
              deploy/docker-compose.override.yml \
              deploy/caddy/Caddyfile \
              deploy/alloy/config.alloy \
              deploy/searxng/settings.yml \
              deploy/librechat/klai-entrypoint.sh \
              deploy/librechat/getklai \
              deploy/grafana/provisioning \
              deploy/scripts \
              deploy/systemd \
              scripts

            # SPEC-INFRA-AUTO-ROLLBACK-001 S3: every file this sync overwrites
            # gets a .prev copy (rb_keep), and a red gate (rb_gate) puts the
            # copies back, recreates through the same path and verifies again.
            # The run still ends red, with exit 3 (rolled back) or 4 (rollback
            # failed). Helper and rules: deploy/scripts/compose-rollback.sh.
            source deploy/scripts/compose-rollback.sh
            rb_init "$(git rev-parse HEAD)"
            # S8a: a Postgres image change, or one of an app that migrates its
            # own database (Twenty, GlitchTip, Zitadel), is dumped first, while
            # nothing has changed yet. Short on disk (twice the volume size) or a
            # failed dump ends the run here, exit 4, with every file untouched.
            ds_snapshot_changed /opt/klai/docker-compose.yml deploy/docker-compose.yml
            # Visible in the run log even when nothing changed, so a missed data-store
            # change (the 2026-10-28 umami proof found none without a trace) is
            # diagnosable from the log alone.
            echo "datastore change check: [$(ds_changed /opt/klai/docker-compose.yml deploy/docker-compose.yml | tr '\n' ' ')] snapshots this run: ${#DS_SNAPSHOTS[@]}"
            # Write-then-rename, not `cp` in place. cp truncates the target and
            # then writes it, and portal-api.yml and litellm-hook-deploy.yml run
            # `docker compose` against this same file — both can fire on the same
            # merge as this job. A read that lands between the truncate and the
            # last write parses a partial file and fails that deploy. rename(2)
            # on one filesystem is atomic, so a reader sees the old file or the
            # new one and never half of either. Same idiom this script already
            # uses for the deploy scripts below.
            for f in docker-compose.yml docker-compose.override.yml; do
              rb_keep "/opt/klai/$f"
              cp "deploy/$f" "/opt/klai/$f.tmp"
              mv -f "/opt/klai/$f.tmp" "/opt/klai/$f"
            done

            # Sync public-safe deploy scripts to /opt/klai/scripts/ for
            # service-deploy workflows and systemd timers. Operator health
            # scripts are synced from klai-infra.
            mkdir -p /opt/klai/scripts
            # *.py as well: retrieval-api-oneoff.sh bind-mounts its launch helper
            # from this directory, and a loop over *.sh alone left it behind on
            # 2026-10-23, so every one-off refused to start on the server.
            for script in deploy/scripts/*.sh deploy/scripts/*.py; do
              [[ -e "$script" ]] || continue
              name=$(basename "$script")
              case "$name" in
                push-health.sh|gpu-health.sh|audit-monitor-coverage.sh|push-component-health.sh) continue ;;
                # deploy-portal-api.sh is installed by portal-api.yml, from the
                # same checkout that is about to run it. Syncing it from here as
                # well gives the file two writers on different commits, and the
                # later one wins: on 2026-09-18 a portal-api run that started 92
                # seconds before a compose change merged scp'd its older copy 12
                # seconds after this loop had written the newer one, silently
                # reverting the file on the server while both workflows reported
                # success.
                deploy-portal-api.sh) continue ;;
              esac
              case "$name" in
                *.py) python3 -m py_compile "$script" ;;
                *) bash -n "$script" ;;
              esac
              rb_keep "/opt/klai/scripts/$name"
              install -m 0755 "$script" "/opt/klai/scripts/$name.tmp"
              mv -f "/opt/klai/scripts/$name.tmp" "/opt/klai/scripts/$name"
            done
            rb_keep /opt/klai/scripts/mistral-api-probe.sh /opt/klai/scripts/widget-probe.py
            install -m 0755 scripts/mistral-api-probe.sh /opt/klai/scripts/mistral-api-probe.sh.tmp
            mv -f /opt/klai/scripts/mistral-api-probe.sh.tmp /opt/klai/scripts/mistral-api-probe.sh
            install -m 0755 scripts/widget-probe.py /opt/klai/scripts/widget-probe.py.tmp
            mv -f /opt/klai/scripts/widget-probe.py.tmp /opt/klai/scripts/widget-probe.py
            test -x /opt/klai/scripts/backup.sh

            # The canary's four patch bind-mounts are gone (Phase 3): it runs the
            # Klai-owned image with the patches baked in, so there is nothing left
            # to sync here. Removing the sync AFTER the container stopped mounting
            # the files is the required order -- the reverse is what took 36 of 42
            # tenants down on 2026-08-14.
            rb_keep /opt/klai/librechat/getklai/librechat.yaml
            getklai_config_status=$(python3 deploy/librechat/getklai/apply-canary-config.py /opt/klai/librechat/getklai/librechat.yaml)
            echo "getklai LibreChat config patch: $getklai_config_status"

            # SPEC-INFRA-CONTAINER-HYGIENE-001 REQ-5 + REQ-6: sync systemd
            # units. Activation requires sudo and is one-time per host —
            # see docs/runbooks/container-hygiene-systemd-install.md.
            mkdir -p /opt/klai/systemd
            rb_keep /opt/klai/systemd/{docker-cleanup,orphan-audit,mistral-api-probe,widget-probe}.{service,timer}
            install -m 0644 deploy/systemd/docker-cleanup.service /opt/klai/systemd/docker-cleanup.service
            install -m 0644 deploy/systemd/docker-cleanup.timer /opt/klai/systemd/docker-cleanup.timer
            install -m 0644 deploy/systemd/orphan-audit.service /opt/klai/systemd/orphan-audit.service
            install -m 0644 deploy/systemd/orphan-audit.timer /opt/klai/systemd/orphan-audit.timer
            # Mistral key probe: same one-time symlink install, see
            # docs/runbooks/litellm-provider-auth-failed.md ("Probe unit").
            install -m 0644 deploy/systemd/mistral-api-probe.service /opt/klai/systemd/mistral-api-probe.service
            install -m 0644 deploy/systemd/mistral-api-probe.timer /opt/klai/systemd/mistral-api-probe.timer
            # Customer widget probe: same one-time symlink install, see
            # docs/runbooks/widget-probe.md ("Install").
            install -m 0644 deploy/systemd/widget-probe.service /opt/klai/systemd/widget-probe.service
            install -m 0644 deploy/systemd/widget-probe.timer /opt/klai/systemd/widget-probe.timer

            # SPEC-SEC-024 M4.2 — sync Grafana provisioning. Grafana loads
            # provisioning only at startup, so we need to restart when files
            # change. Use `up -d` instead of `restart`: `restart` keeps the
            # existing container env (docker-compose.yml + .env changes are
            # ignored), while `up -d` recreates the container with fresh env
            # if the compose file or .env drifted. Required for env-var
            # changes to grafana (e.g. VICTORIALOGS_AUTH_*, GF_SMTP_*).
            #
            # SPEC-OBS-001 Phase C — bind-mount-only changes detection.
            # `up -d` is a no-op when bind-mount source content changes but
            # the service definition (image, env, ports) is unchanged. Pure
            # provisioning-file edits (new alert rule YAML, dashboard JSON)
            # therefore land on disk but Grafana keeps running with the old
            # config until something else triggers a recreate. We capture
            # rsync's content-based diff (`-c` checksums, ignoring mtime
            # churn from the fresh git clone) and only force-recreate when
            # files actually changed. Falls back to plain `up -d` for the
            # service-definition path so env-var changes still recreate
            # naturally. Short downtime (~10s) is acceptable for an internal
            # observability tool; no user-facing impact.
            mkdir -p /opt/klai/grafana/provisioning
            rb_keep /opt/klai/grafana/provisioning
            # A function so a failed recreate goes through rb_gate: by now the
            # compose file is overwritten, and set -e would end the step with
            # no restore and no report.
            sync_grafana_provisioning() {
              local changes
              changes=$(rsync -ac --itemize-changes deploy/grafana/provisioning/ /opt/klai/grafana/provisioning/ | grep -E '^[<>*]' || true)
              if [ -n "$changes" ]; then
                echo "Grafana provisioning content changed:"
                echo "$changes"
                rb_touched grafana
                docker compose --project-directory /opt/klai up -d --force-recreate grafana || return 1
              else
                echo "Grafana provisioning unchanged; using plain up -d (recreates only on service-definition diff)"
                docker compose --project-directory /opt/klai up -d grafana || return 1
              fi
            }
            rb_gate grafana provisioning-recreate sync_grafana_provisioning

            # A provisioned alert that cannot read its datasource is worse than
            # no alert: it reports healthy forever. On 2026-08-14 four of six
            # Postgres-backed rules were blind -- two on a missing grant, one on
            # an RLS policy scoped to another role, and the fourth had shipped
            # broken that same afternoon. None of it was visible in Grafana,
            # because a query error with execErrState: OK looks exactly like
            # "nothing wrong". This runs after the sync so it judges what is
            # actually on disk, and fails the deploy on any rule that is blind
            # without a documented reason.
            rb_gate grafana alert-datasource-access python3 deploy/scripts/verify-alert-datasource-access.py \
              /opt/klai/grafana/provisioning/alerting

            # SPEC-INFRA-CONFIG-SYNC-001 R1 — bash helper for bind-mount
            # config sync. Replaces the inline Caddyfile block from
            # SPEC-INFRA-CADDY-CONFIG-DEPLOY-001 (which is now one of
            # four call-sites). See infra/deploy.md "Bind-mount config
            # sync — required pattern" for the canonical reference.
            #
            # Args:
            #   $1 = compose service name (for force-recreate + ps -q)
            #   $2 = source path in this sparse-checkout
            #   $3 = destination path on host (will mkdir -p its parent)
            #
            # Behaviour:
            #   - If rsync content diff is non-empty → force-recreate
            #     the service + run a 5×2s health check loop. Fail the
            #     workflow if the container does not reach `running`
            #     within 10s.
            #   - If rsync content diff is empty → skip (idempotent).
            #
            # Caddy has `admin off`, so `caddy reload --config` is not
            # available — container restart is the canonical reload.
            # Same applies to alloy/searxng/runtime-api: all four read
            # their config at startup and need a recreate to pick up
            # changes.
            sync_and_recreate() {
              local svc="$1"
              local src="$2"
              local dst="$3"
              mkdir -p "$(dirname "$dst")"
              rb_keep "$dst" || return 1
              local changes
              changes=$(rsync -ac --itemize-changes "$src" "$dst" | grep -E '^[<>*]' || true)
              if [ -z "$changes" ]; then
                echo "$svc config unchanged; skipping recreate."
                return 0
              fi
              echo "$svc config content changed:"
              echo "$changes"
              rb_touched "$svc"
              # return, not exit: rb_gate decides what a red recreate means.
              docker compose --project-directory /opt/klai up -d --force-recreate "$svc" || return 1

              echo "::group::$svc post-recreate health check"
              local healthy=0
              local i cid status
              for i in 1 2 3 4 5; do
                sleep 2
                cid=$(docker compose --project-directory /opt/klai ps -q "$svc" 2>/dev/null || true)
                if [ -z "$cid" ]; then
                  echo "$svc container not found (attempt ${i}/5)"
                  continue
                fi
                status=$(docker inspect --format '{{.State.Status}}' "$cid" 2>/dev/null || echo "missing")
                if [ "$status" = "running" ]; then
                  echo "$svc is running (attempt ${i})"
                  healthy=1
                  break
                fi
                echo "$svc state: $status (attempt ${i}/5)"
              done
              if [ "$healthy" -ne 1 ]; then
                echo "::error::$svc did not reach running state within 10s after recreate"
                docker compose --project-directory /opt/klai logs --tail 50 "$svc" || true
                return 1
              fi
              echo "::endgroup::"
            }

            # SPEC-INFRA-CONFIG-SYNC-001 R2 — apply helper to all four
            # single-file relative bind-mounts that lack a dedicated
            # service-deploy workflow. Note vexa's profiles.yaml is
            # mounted into the runtime-api compose service, NOT a
            # service named "vexa" — the asymmetry matters for the
            # force-recreate target.
            rb_gate caddy   sync-recreate sync_and_recreate caddy   deploy/caddy/Caddyfile      /opt/klai/caddy/Caddyfile
            rb_gate alloy   sync-recreate sync_and_recreate alloy   deploy/alloy/config.alloy   /opt/klai/alloy/config.alloy
            rb_gate searxng sync-recreate sync_and_recreate searxng deploy/searxng/settings.yml /opt/klai/searxng/settings.yml

            clear_librechat_config_cache() {
              local pattern="${1:-configs:*}"
              docker compose --project-directory /opt/klai exec -T redis sh -lc '
                set -e
                pattern="$1"
                keys=$(redis-cli -a "$REDIS_PASSWORD" --no-auth-warning --scan --pattern "$pattern")
                if [ -z "$keys" ]; then
                  echo "LibreChat config cache clear: pattern=$pattern deleted=0"
                  exit 0
                fi
                deleted=0
                printf "%s\n" "$keys" | while IFS= read -r key; do
                  redis-cli -a "$REDIS_PASSWORD" --no-auth-warning unlink "$key" >/dev/null
                  deleted=$((deleted + 1))
                  echo "$deleted" > /tmp/klai-librechat-cache-deleted
                done
                deleted=$(cat /tmp/klai-librechat-cache-deleted 2>/dev/null || echo 0)
                rm -f /tmp/klai-librechat-cache-deleted
                echo "LibreChat config cache clear: pattern=$pattern deleted=$deleted"
              ' sh "$pattern"
            }
            # Force-light-theme wrapper for the compose-managed getklai tenant.
            # Copies the script to the host THEN force-recreates the container,
            # so the bind-mount source exists before (re)create — no empty-dir
            # race. Per-tenant (provisioning-managed) containers pick it up on
            # their next recreate via _start_librechat_container.
            rb_gate librechat-getklai sync-recreate sync_and_recreate librechat-getklai deploy/librechat/getklai/entrypoint.sh /opt/klai/librechat/getklai/entrypoint.sh

            cleanup_stale_librechat_getklai_container() {
              local svc="librechat-getklai"
              local current_project_id
              local exact_name_id
              current_project_id=$(docker compose --project-directory /opt/klai ps -aq "$svc" 2>/dev/null || true)
              exact_name_id=$(docker ps -aq --filter "name=^/${svc}$" | head -n1)
              if [ -n "$exact_name_id" ] && [ -z "$current_project_id" ]; then
                echo "::warning title=${svc} stale container::Removing exact-name container not attached to the current /opt/klai Compose project before recreate."
                docker inspect --format 'stale container={{.Id}} name={{.Name}} image={{.Config.Image}} compose_project={{index .Config.Labels "com.docker.compose.project"}} compose_service={{index .Config.Labels "com.docker.compose.service"}}' "$exact_name_id" || true
                docker rm -f "$exact_name_id"
              fi
            }

            clear_librechat_config_cache "configs:*"
            echo "getklai LibreChat config cache cleared; force-recreating librechat-getklai via compose-up wrapper"
            cleanup_stale_librechat_getklai_container
            rb_touched librechat-getklai
            rb_gate librechat-getklai compose-up-verification /opt/klai/scripts/compose-up.sh --force-recreate librechat-getklai

            # SPEC-SEC-024 M4.3 — sync smoke-test script. `chmod +x` because
            # git clone on a Linux runner usually preserves the execute bit,
            # but this guards against core.filemode quirks.
            mkdir -p /opt/klai/scripts
            rb_keep /opt/klai/scripts/smoke-docker-socket-proxy.sh
            rsync -a scripts/smoke-docker-socket-proxy.sh /opt/klai/scripts/
            chmod +x /opt/klai/scripts/smoke-docker-socket-proxy.sh

            cd /tmp && rm -rf "$SYNC_DIR"
            echo "docker-compose.yml + grafana provisioning + scripts synced to /opt/klai/"

            # SPEC-MCP-RETRIEVAL-001 env-drift recreate, then the firewall
            # re-apply (also on failure). The incidents behind each part are in
            # the script; it was installed by the deploy/scripts loop above, so
            # it is the version from this commit.
            rb_gate compose compose-up-verification /opt/klai/scripts/compose-env-drift-recreate.sh
            # S8a: per snapshot of this run, recreate a changed store's consumers
            # (they hold pools to the old container) and probe its tables. Red
            # restores the snapshot within 30 minutes of it.
            ds_gates

            # SPEC-SEC-024 M4.3 — non-blocking post-deploy smoke-test. Prints
            # [OK]/[FAIL] per probe; warns on non-zero exit but does NOT
            # fail the workflow (initial rollout per SPEC). Flip this to
            # blocking once we've seen it stable for 2 weeks.
            echo "::group::SPEC-SEC-024 post-deploy smoke-test"
            set +e
            /opt/klai/scripts/smoke-docker-socket-proxy.sh
            SMOKE_EXIT=$?
            set -e
            echo "::endgroup::"
            if [ "$SMOKE_EXIT" -ne 0 ]; then
              echo "::warning title=SPEC-SEC-024 smoke-test::Returned $SMOKE_EXIT (non-blocking). Check [FAIL] lines in the smoke-test group above."
            else
              echo "SPEC-SEC-024 smoke-test: PASS"
            fi

            # Blocking: a Twenty image change is a schema migration, and its
            # entrypoint reports success even when the upgrade failed. Renovate
            # automerges Twenty, so this is what turns a failed migration red.
            rb_gate crm twenty-upgrade --reverify /opt/klai/scripts/check-twenty-upgrade.sh

            # Green end: ledger line, report, last-synced commit.
            rb_deployed

      # SPEC-INFRA-AUTO-ROLLBACK-001 S4: hand the rollback report to
      # ci-failure-notice.yml. The report file stays on core-01 between runs, so
      # only one written after the sync started counts (its commit is the clone's
      # HEAD, which can be newer than github.sha); a green sync, or one that
      # never reached the script, leaves no artifact.
      - name: Fetch rollback report
        id: rollback-report
        if: always()
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CORE01_HOST }}
          username: klai
          key: ${{ secrets.CORE01_DEPLOY_KEY }}
          capture_stdout: true
          script: cat /opt/klai/deploy-reports/compose.json 2>/dev/null || true

      - name: Keep rollback report
        id: keep-report
        continue-on-error: true
        if: always()
        env:
          REPORT: ${{ steps.rollback-report.outputs.stdout }}
          STARTED: ${{ steps.sync-start.outputs.at }}
        run: |
          [ -n "$STARTED" ] || exit 0
          report="$(printf '%s\n' "$REPORT" | grep -m1 '^{' || true)"
          if printf '%s' "$report" | jq -e --arg since "$STARTED" '.ts >= $since and .outcome != "deployed"' >/dev/null 2>&1; then
            printf '%s\n' "$report" > rollback-report.json
            echo "report=$report" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload rollback report
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rollback-report
          path: rollback-report.json
          retention-days: 30
          if-no-files-found: ignore

  # SPEC-INFRA-AUTO-ROLLBACK-001 S5: after a rollback the host runs the previous
  # compose file but main still names the bad version, so the next compose change
  # would deploy it again. When the rolled-back range holds Renovate image bumps,
  # this opens one PR (with the Klai Renovate app token, so CI runs on it) that
  # puts those image lines back and excludes each exact version in renovate.json5,
  # and arms auto-merge. Our own commits are never reverted (decision D3); a
  # rollback without a Renovate bump does nothing. Rules and edge cases:
  # scripts/renovate-revert-after-rollback.py.
  renovate-revert:
    needs: sync-compose
    if: always() && fromJSON(needs.sync-compose.outputs.rollback-report || '{}').kind == 'compose'
    runs-on: ubuntu-latest
    steps:
      - name: Mint a token for the Klai Renovate app
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
          owner: GetKlai
          repositories: klai

      # Full history: the range runs from the last green sync to the rolled-back
      # commit. The app token stays in the checkout for the branch push.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Open the revert PR for rolled-back Renovate bumps
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          REPORT: ${{ needs.sync-compose.outputs.rollback-report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          printf '%s\n' "$REPORT" > "$RUNNER_TEMP/rollback-report.json"
          python3 scripts/renovate-revert-after-rollback.py --report "$RUNNER_TEMP/rollback-report.json" \
            --run-id "$GITHUB_RUN_ID" --run-url "$RUN_URL" --workflow "$WORKFLOW"
