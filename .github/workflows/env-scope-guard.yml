name: env-scope-guard (SPEC-SEC-ENVFILE-SCOPE-001)

# SPEC-SEC-ENVFILE-SCOPE-001 REQ-4: block reintroduction of bare
# `env_file: .env` on any service in deploy/docker-compose.yml. The
# bare form (pointing at /opt/klai/.env, the merged SOPS-global file)
# leaks every Klai secret into the service's process env — see SPEC
# §Threat Model. Per-service paths like `env_file: ./klai-mailer/.env`
# are permitted by REQ-6 and explicitly allowed here.
#
# REQ-4.4: runs on every PR push, not only at merge — a late catch
# forces an extra commit.
# REQ-4.5: use one locally testable scanner for scalar, block-list, and
# flow-list YAML forms, including quoted values and trailing comments.

on:
  pull_request:
    paths:
      - 'deploy/docker-compose.yml'
      - 'deploy/docker-compose.gpu.yml'
      - 'deploy/check-env-file-scope.py'
      - 'deploy/tests/test_check_env_file_scope.py'
      - '.github/workflows/env-scope-guard.yml'
  # Re-run on main so a direct push (rare, but possible) is still gated.
  push:
    branches: [main]
    paths:
      - 'deploy/docker-compose.yml'
      - 'deploy/docker-compose.gpu.yml'
      - 'deploy/check-env-file-scope.py'
      - 'deploy/tests/test_check_env_file_scope.py'

permissions:
  contents: read

jobs:
  no-shared-env-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test env-file scope scanner
        run: python3 -B -m unittest deploy/tests/test_check_env_file_scope.py

      - name: Forbid bare env_file&#58; .env in deploy compose files
        run: |
          files=(deploy/docker-compose.yml)
          if [[ -f deploy/docker-compose.gpu.yml ]]; then
            files+=(deploy/docker-compose.gpu.yml)
          fi
          python3 -B deploy/check-env-file-scope.py "${files[@]}"
