suite: chat
description: |
  Conversational queries against Voys's support KB. Style mirrors how a Voys CS-medewerker
  would phrase a question to klai's chat. 30 queries with a curated mix:
    - 9 easy-lookup (regression canaries; expected_chunks populated)
    - 9 vague-pronoun (query-rewrite targets)
    - 6 multi-doc synthesis (parent-child targets)
    - 4 long-tail (recall test)
    - 2 edge cases (mixed-language + malformed)
  All queries target tenant Voys (org_zitadel_id 368884765035593759).
queries:
  # --- Easy-lookup canaries (9) — should always score ~1.0 ---
  - id: chat-easy-bubble-troubleshoot
    org_zitadel_id: "368884765035593759"
    user_zitadel_id: null
    query: "Hoe troubleshoot ik Bubble?"
    reference_answer: "Gebruik de Bubble troubleshoot-procedure: controleer de browserplugin, herstart of verbind Bubble opnieuw en volg de stappen voor bekende verbindings- of pluginproblemen."
    expected_topics: [bubble, troubleshoot]
    expected_chunks: ["Bubble troubleshoot"]
    mix: easy_lookup

  - id: chat-easy-yealink-firmware
    org_zitadel_id: "368884765035593759"
    user_zitadel_id: null
    query: "Welke Yealink firmware ondersteunen we?"
    reference_answer: "Het antwoord noemt de ondersteunde of nieuwste Yealink firmwareversie uit de firmwaredocumentatie en koppelt die aan de relevante telefonie- of toestelcontext."
    expected_topics: [yealink, firmware, telefonie]
    expected_chunks: ["latest Yealink firmware"]
    mix: easy_lookup

  - id: chat-easy-uitportering-afgehandeld
    org_zitadel_id: "368884765035593759"
    user_zitadel_id: null
    query: "Hoe verwerk ik een afgehandelde uitportering zonder verdere nummers?"
    reference_answer: "Volg de CS-procedure voor een afgehandelde uitportering zonder verdere telefoonnummers: rond de porting-out status af, leg vast dat er geen extra nummers zijn en sluit de klantactie volgens de interne stappen."
    expected_topics: [uitportering, customer-service, portering]
    expected_chunks: ["CS | Uitportering afgehandeld - Geen verdere telefoonnummers"]
    mix: easy_lookup

  - id: chat-easy-inloggegevens-kwijt
    org_zitadel_id: "368884765035593759"
    user_zitadel_id: null
    query: "Wat doe ik als een klant zijn inloggegevens kwijt is en geen toegang heeft tot Freedom?"
    reference_answer: "Help de klant met herstel van toegang tot Freedom door de identiteit te controleren en de procedure voor verloren inloggegevens of accounttoegang te volgen."
    expected_topics: [inloggegevens, freedom, klantaccount]
    expected_chunks: ["Klant is inloggegevens verloren en heeft geen toegang meer tot Freedom"]
    mix: easy_lookup

  - id: chat-easy-fraude-bedrijf
    org_zitadel_id: "368884765035593759"
    user_zitadel_id: null
    query: "Hoe handel ik fraude af waarbij onze klant zich voordoet als een ander bedrijf?"
    reference_answer: "Behandel dit als een fraude-scenario waarin een klant zich voordoet als een ander bedrijf: volg de fraudeprocedure, verzamel relevante gegevens en escaleer volgens de customer-service afspraken."
    expected_topics: [fraude, customer-service]
    expected_chunks: ["Fraude: Onze klant doet zich voor als een ander bedrijf"]
    mix: easy_lookup

  - id: chat-easy-opzeggingen
    org_zitadel_id: "368884765035593759"
    user_zitadel_id: null
    query: "Hoe verwerk ik een opzegging?"
    reference_answer: "Verwerk een opzegging via de cancellations-procedure: controleer klant- en contractgegevens, registreer de opzegging en voer de vereiste vervolgacties of bevestiging uit."
    expected_topics: [opzeggingen, customer-service]
    expected_chunks: ["3.011 Opzeggingen verwerken (Cancellations)"]
    mix: easy_lookup

  - id: chat-easy-buiten-openingstijden
    org_zitadel_id: "368884765035593759"
    user_zitadel_id: null
    query: "Wat is de werkwijze buiten openingstijden in de avond en het weekend?"
    reference_answer: "Het antwoord beschrijft de werkwijze buiten openingstijden voor avonden en weekenden, inclusief hoe binnenkomende klantvragen of storingen dan worden opgepakt of doorgeschakeld."
    expected_topics: [openingstijden, customer-service, weekend]
    expected_chunks: ["Werkwijze buiten openingstijden (avonden & weekenden)"]
    mix: easy_lookup

  - id: chat-easy-pipedrive-integratie
    org_zitadel_id: "368884765035593759"
    user_zitadel_id: null
    query: "Hoe werkt de Pipedrive integratie?"
    reference_answer: "Leg uit hoe de Pipedrive CRM-integratie met de telefooncentrale werkt, welke configuratie of koppeling nodig is en waar gebruikers de integratie voor gebruiken."
    expected_topics: [pipedrive, crm, integratie]
    expected_chunks: ["pipedrive"]
    mix: easy_lookup

  - id: chat-easy-bubble-mobiele-app
    org_zitadel_id: "368884765035593759"
