  # --- Brand-bridging canaries (7) — REQ-7 SPEC-RAG-LOW-CONFIDENCE-ABSTAIN-001 ---
  # These queries use third-party brand names that are NOT indexed as KB entities.
  # The brand-bridging rewrite prompt (REQ-5) must expand them to category terms so
  # retrieval can surface Bubble / RedCactus / CRM pages. The negative-class entry
  # (chat-brand-not-in-kb) must NOT produce a fabricated answer — the anti-hallucination
  # injection (REQ-2) must trigger and the model must ask for clarification instead.
  - id: chat-brand-salesforce-bridging
    org_zitadel_id: "368884765035593759"
    user_zitadel_id: null
    query: "Ik wil Voys Freedom graag koppelen aan Salesforce. Hoe werkt dat?"
    reference_answer: "Leg uit dat Salesforce-koppelingen via de CRM-ERP telefonie-integratiecontext lopen, verwijs naar Bubble of RedCactus waar relevant en beschrijf de globale koppeling met Voys Freedom."
    expected_topics: [bubble, redcactus, salesforce, integratie]
    expected_chunks: ["Bubble: Koppel je telefooncentrale aan je CRM-ERP"]
    mix: brand_bridging

