# synthetic-data: generator=hand-written seed=0 (invented tenant, invented
# documents, example.com URLs only).
#
# The production suites name a customer's internal documents, so they are not
# in this repository: the private infra repo places them on the host and
# RAG_EVAL_SUITES_DIR points the runner at them. This directory only holds this
# sample, for tests and local runs (`--suite _sample`).
suite: _sample
description: Three-query sample suite for TDD. Used by test_ragas_runner_integration.py.
queries:
  - id: sample-printer-1
    org_zitadel_id: "100000000000000001"
    user_zitadel_id: null
    query: "Hoe los ik een vastgelopen printer op?"
    reference_answer: "Zet de printer uit, verwijder het vastgelopen papier, zet hem weer aan en volg de stappen uit de printerhandleiding als de melding blijft."
    expected_topics:
      - printer
      - storing
    expected_chunks:
      - "https://help.example.com/printer-troubleshoot"
  - id: sample-leave-1
    org_zitadel_id: "100000000000000001"
    user_zitadel_id: null
    query: "Hoe vraag ik verlof aan?"
    reference_answer: "Verlof vraag je aan in het personeelsportaal; je leidinggevende keurt de aanvraag goed en het saldo wordt daarna bijgewerkt."
    expected_topics:
      - verlof
      - personeelsportaal
  - id: sample-expenses-1
    org_zitadel_id: "100000000000000001"
    user_zitadel_id: null
    query: "Hoe declareer ik reiskosten?"
    reference_answer: "Reiskosten declareer je maandelijks via het declaratieformulier met de bonnen als bijlage; de financiële afdeling betaalt ze uit met het salaris."
    expected_topics:
      - declaratie
      - reiskosten
