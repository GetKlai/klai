[alembic]
script_location = alembic
sqlalchemy.url = driver://user:pass@localhost/dbname

# Required so alembic/env.py can `from knowledge_ingest.config import settings`
# without callers having to set PYTHONPATH=. — matches portal-api's pattern
# (klai-portal/backend/alembic.ini) and the klai-connector pattern.
# The container entrypoint.sh exports PYTHONPATH=. before running
# `alembic upgrade head`, which has the same effect.
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
