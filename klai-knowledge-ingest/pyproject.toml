[project]
name = "knowledge-ingest"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",  # SPEC-INGEST-ALEMBIC-001
    "asyncpg>=0.30",
    "qdrant-client>=1.12",
    "pyyaml>=6.0",
    "cachetools>=5.5",
    # procrastinate 3.x: PsycopgConnector, open_async(), run_worker_async() all unchanged.
    # DB schema was already 3.x-compatible (queueing_lock + full status enum added in 2.15).
    "procrastinate>=3.0,<4",
    "structlog>=25.0",
    "scikit-learn>=1.3.0",
    "graphiti-core[falkordb]>=0.28,<0.29",
    "klai-connector-credentials",
    "klai-image-storage",
    "klai-identity-assert",  # SPEC-TI-003 AC-6: identity assertion
    # SPEC-CRAWLER-004 Fase A: image pipeline (Garage S3 + magic-byte MIME detection).
    "minio>=7.2",
    "filetype>=1.2",
    "ragas>=0.4.3",
    "lingua-language-detector>=2.2.0",
]

[tool.uv.sources]
klai-connector-credentials = { path = "../klai-libs/connector-credentials", editable = true }
klai-image-storage = { path = "../klai-libs/image-storage", editable = true }
klai-identity-assert = { path = "../klai-libs/identity-assert", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF", "G", "LOG"]
ignore = [
    "S101",  # assert is fine in tests
    "S105",  # hardcoded passwords — false positives on config defaults
]

[tool.ruff.lint.per-file-ignores]
"knowledge_ingest/crawl4ai_client.py" = ["E501"]  # JS strings in multiline literals
"alembic/versions/*.py" = ["E501"]  # SQL DDL lines legitimately exceed 100 chars
"tests/test_alembic_bootstrap.py" = ["E501", "S603", "S607"]  # test file calls subprocess with known-safe args

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.8",
]
