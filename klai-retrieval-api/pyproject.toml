[project]
name = "retrieval-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "qdrant-client>=1.12",
    "sse-starlette>=2.1",
    "graphiti-core[falkordb]>=0.29,<0.30",
    "structlog>=25.0",
    "prometheus-client>=0.21",
    "asyncpg>=0.30",
    # SPEC-SEC-010 — Zitadel JWT validation + Redis sliding-window rate limiter.
    "pyjwt[crypto]>=2.13",
    "redis>=5.0",
    # SPEC-SEC-IDENTITY-ASSERT-001 REQ-4 (Phase D): re-verify internal-secret
    # callers' body identity against portal-api. Editable install — same
    # pattern as klai-knowledge-mcp (Phase B) and klai-knowledge-ingest.
    "klai-identity-assert",
    # SPEC-RAG-MULTILINGUAL-CHAT-001 REQ-07: passive language detection
    # on user query + LLM response for the chat_synthesis_complete log
    # event. Same pin as knowledge-ingest's contextual.detect_language.
    "lingua-language-detector>=2.2.0",
    # SPEC-RAG-MULTILINGUAL-CHAT-001 REQ-02: shared chat-prompt constant.
    # Editable install — same pattern as klai-identity-assert.
    "klai-chat-prompts",
    # SPEC-RAG-PERSONAL-SCOPE-001 REQ-1: shared canonical personal-KB slug
    # helper. Same template as portal-api provisioning so server-side
    # scope=personal narrowing cannot drift from the provisioned value.
    "klai-kb-slugs",
    # Shared evidence context + deterministic citation/source helpers.
    "klai-citations",
    # Shared deterministic LLM safety policy for prompt-injection/content rails.
    "klai-llm-safety",
    # SPEC-SEC-SERVICE-AUTH-002 REQ-4b: canonical Zitadel project-role claim
    # parser (project_role_scopes) shared by every Phase C JWT receiver.
    "klai-service-auth",
]

[tool.uv.sources]
klai-identity-assert = { path = "../klai-libs/identity-assert", editable = true }
klai-chat-prompts = { path = "../klai-libs/chat-prompts", editable = true }
klai-kb-slugs = { path = "../klai-libs/kb-slugs", editable = true }
klai-citations = { path = "../klai-libs/citations", editable = true }
klai-llm-safety = { path = "../klai-libs/llm-safety", editable = true }
klai-service-auth = { path = "../klai-libs/service-auth", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "pytest-cov>=7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# SPEC-SEC-HYGIENE-001 REQ-43.4: TRY rules added so future regressions of
# `logger.error(...)` inside `except` (TRY400) or `error=str(exc)`-style
# traceback dropping (TRY401) are caught in CI.
select = ["E", "F", "I", "UP", "B", "S", "RUF", "G", "LOG", "TRY"]
ignore = [
    "S101",  # assert is fine in tests
    "S105",  # hardcoded passwords — too many false positives on config defaults
    "TRY003",  # raise-vanilla-args — too noisy for our HTTPException patterns
    "TRY300",  # try-consider-using-else — stylistic, not a safety issue
    "TRY301",  # raise-within-try — needed when wrapping/translating exceptions
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
