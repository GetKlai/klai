version: 1.3.13

cache: true

registration:
  socialLogins: []

# ── Interface ────────────────────────────────────────────────────────────────
# Stripped-down UI for Klai tenants. Everything non-essential is disabled at
# config level so new users start with the minimum surface area. Keep the list
# exhaustive — missing keys fall back to LibreChat defaults (usually `true`),
# and every LibreChat version so far has added interface keys that silently
# re-enable a surface we intended to hide (parameters, temporaryChat,
# peoplePicker, fileCitations, marketplace were all such cases pre-0.8.7).
#
# v0.8.7 bumped the config schema to 1.3.13 and genuinely added
# contextUsage, contextCost, retainAgentFiles, and sharedLinks to
# interfaceSchema (verified against the packaged
# packages/data-provider/src/config.ts in
# ghcr.io/danny-avila/librechat:v0.8.7, diffed against the same file in
# :v0.8.6 -- see .claude/rules/klai/platform/librechat.md). autoSubmitFromUrl,
# buildInfo, and skills were already present in 1.3.12's schema (not new in
# 0.8.7) but were never explicitly pinned here either -- closed the same gap
# while auditing. endpointsMenu and sidePanel, listed as disabled in the old
# 1.3.12 config below this comment, were CONFIRMED STRIPPED from 0.8.7's
# interfaceSchema entirely (zero references in config.ts) and removed here;
# setting a key the schema no longer parses is a stale no-op, not a guard.
#
# sharedLinks is intentionally NOT set to false like the rest of this list:
# Klai already relies on shared links being enabled (ALLOW_SHARED_LINKS /
# ALLOW_SHARED_LINKS_PUBLIC forced true for every tenant in
# klai-portal/backend/app/services/provisioning/infrastructure.py, plus the
# dedicated public-share sanitizer in patches/share.js). Upstream's own
# default for the new sharedLinks key is create/share/public: true, matching
# our existing intent, so the conservative choice here is to preserve that
# behaviour explicitly rather than accidentally regress a working feature by
# blindly defaulting every new key to false. snapshotFiles is a genuinely NEW
# capability with no pre-0.8.7 equivalent, so it stays false.
#
# Reference: https://www.librechat.ai/docs/configuration/librechat_yaml/object_structure/interface
interface:
  # Enabled surfaces
  webSearch: true
  mcpServers:
    use: true
    create: false
    share: false
  # Already enabled pre-0.8.7 via ALLOW_SHARED_LINKS(_PUBLIC) env flags and
  # the share.js patch; see comment above. snapshotFiles is new -- keep off.
  sharedLinks:
    create: true
    share: true
    public: true
    snapshotFiles: false

  # Disabled surfaces — keep in this list even if the key appeared in a later
  # LibreChat version; explicit false survives schema evolutions.
  #
  # agents.use MUST be true on LibreChat 0.8.5+ — the frontend fetches
  # /api/agents on chat-screen mount; a 403 leaves the UI stuck on
  # "Welkom terug" with no composer (incident 2026-05-20). agents.create
  # and agents.share stay false: users can chat but not author/share agents.
  agents:
    use: true
    create: false
    share: false
  prompts:
    use: false
    create: false
    share: false
  peoplePicker:
    users: false
    groups: false
    roles: false
  marketplace:
    use: false
  # New in 0.8.7 (1.3.13) -- see comment block above.
  skills:
    use: false
    create: false
    share: false
    defaultActiveOnShare: false
  memories: false
  bookmarks: false
  multiConvo: false
  presets: false
  fileSearch: false
  fileCitations: false
  runCode: false
  # modelSelect MUST be true on 0.8.5+ even with a default modelSpec.
  # When false, the auto-selected model is not "attached" to the new
  # conversation and the composer refuses to render — only "Welkom
  # terug" shows. Confirmed live 2026-05-20 incident.
  modelSelect: true
  parameters: false
  temporaryChat: false
  artifacts: true
  # Pre-existing gap (present since >=1.3.12, never pinned): a URL like
  # ?q=<prompt> auto-submits on load. Off by default in our stripped-down UI.
  autoSubmitFromUrl: false
  # Pre-existing gap (present since >=1.3.12, never pinned): version/commit
  # banner in the UI footer/about panel.
  buildInfo: false
  # New in 0.8.7 (1.3.13): context-window usage indicator in the composer.
  contextUsage: false
  # New in 0.8.7 (1.3.13): per-message cost display. Upstream already
  # defaults this to false; pinned explicitly so a future upstream default
  # change can't silently flip it on.
  contextCost: false
  # New in 0.8.7 (1.3.13): retain uploaded agent files after the run
  # completes instead of the previous ephemeral-only behaviour.
  retainAgentFiles: false

balance:
  enabled: false

# ── Web search ────────────────────────────────────────────────────────────────
# Search:   SearXNG (self-hosted, klai-net) — Startpage + DuckDuckGo engines
# Scraper:  firecrawl-api (self-hosted, klai-net) — full-page content extraction
# Reranker: Infinity (gpu-01 via SSH tunnel at 172.18.0.1:7998) — bge-reranker-v2-m3 (GPU)
#           Exposed as Jina-compatible /v1/rerank; no auth needed (network-isolated)
webSearch:
  searchProvider: "searxng"
  searxngInstanceUrl: "${SEARXNG_INSTANCE_URL}"
  scraperProvider: "firecrawl"
  firecrawlApiKey: "${FIRECRAWL_API_KEY}"
  firecrawlApiUrl: "${FIRECRAWL_API_URL}"
  rerankerType: "jina"
  jinaApiKey: "${JINA_API_KEY}"
  jinaApiUrl: "${JINA_API_URL}"
  firecrawlOptions:
    onlyMainContent: true
    formats:
      - markdown

# ── Klai Knowledge MCP ────────────────────────────────────────────────────────
# Exposes save_to_personal_kb to LibreChat agents.
# X-Org-Slug is per-tenant: set KLAI_ORG_SLUG in the tenant's .env and replace
# the placeholder below. One librechat.yaml per tenant is the current pattern.
mcpServers:
  klai-knowledge:
    type: streamable-http
    url: http://klai-knowledge-mcp:8080/mcp
    # LibreChat reaches this managed Klai server over the Docker network with
    # X-Internal-Secret. Public MCP clients use OAuth via mcp.getklai.com, but
    # this internal server entry must not trigger LibreChat's per-user OAuth flow.
    requiresOAuth: false
    headers:
      X-User-ID: "{{LIBRECHAT_USER_OPENIDID}}"
      X-Org-ID: "${KLAI_ZITADEL_ORG_ID}"
      X-Org-Slug: "${KLAI_ORG_SLUG}"
      X-Internal-Secret: "${KNOWLEDGE_INGEST_SECRET}"

mcpSettings:
  allowedDomains:
    - http://klai-knowledge-mcp:8080

# Disable built-in endpoints; all AI goes through LiteLLM
endpoints:
  openAI:
    disabled: true
  agents:
    capabilities:
      - 'deferred_tools'
      - 'web_search'
      - 'artifacts'
      - 'ocr'
      - 'tools'
  assistants:
    disabled: true
  google:
    disabled: true
  anthropic:
    disabled: true
  custom:
    - name: "Klai AI"
      apiKey: "${LITELLM_API_KEY}"
      baseURL: "http://litellm:4000/v1"
      models:
        default:
          - klai-primary
        fetch: false
      titleConvo: true
      titleModel: "klai-primary"
      summarize: false
      summaryModel: "klai-primary"
      forcePrompt: false
      modelDisplayLabel: "Klai AI"

modelSpecs:
  prioritize: true
  list:
    - name: "klai-primary"
      mcpServers:
        - "klai-knowledge"
      label: "Klai AI"
      default: true
      preset:
        endpoint: "Klai AI"
        model: "klai-primary"
        promptPrefix: >
          You are a helpful AI assistant.
          When answering questions that required a web search, be concise:
          summarize the key findings in clear, direct language and cite only
          the most relevant sources. Do not repeat information across sources
          unless they add distinct value.
