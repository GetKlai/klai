model_list:
  # Primary: Mistral Small — default for user-facing tasks
  # Routes through custom_router.py: may be upgraded to klai-large (tool calls)
  # or downgraded to klai-fast (web search content). Never use for internal services.
  - model_name: klai-primary
    litellm_params:
      model: mistral/mistral-small-2603
      api_key: os.environ/MISTRAL_API_KEY
    rpm: 500
    tpm: 400000

  # Fast: Mistral Small — bypasses custom_router.py routing
  # Use for lightweight, latency-sensitive user-facing calls
  - model_name: klai-fast
    litellm_params:
      model: mistral/mistral-small-2603
      api_key: os.environ/MISTRAL_API_KEY
    rpm: 500
    tpm: 400000

  # Large: Mistral Large — agentic / tool use flows
  # Auto-selected by custom_router.py when tool call history is detected
  - model_name: klai-large
    litellm_params:
      model: mistral/mistral-large-2512
      api_key: os.environ/MISTRAL_API_KEY
    rpm: 200
    tpm: 400000

  # Pipeline: Mistral Small — internal background services (Graphiti
  # extraction, enrichment, coreference). Bypasses custom_router.py
  # because the router only fires on klai-primary. Required by compose
  # env GRAPHITI_LLM_MODEL=klai-pipeline (deploy/docker-compose.yml).
  - model_name: klai-pipeline
    litellm_params:
      model: mistral/mistral-small-2603
      api_key: os.environ/MISTRAL_API_KEY
    rpm: 500
    tpm: 400000

  # Eval-judge: Mistral Large — used by SPEC-RAG-EVAL-001's RAGAS faithfulness
  # metric. Mistral Small (klai-fast / klai-pipeline) hits its 3072-token
  # output ceiling on RAGAS' multi-statement faithfulness JSON, leaving
  # ~28/30 rows with NaN. Mistral Large has a larger output window AND
  # produces more reliable structured JSON. Cost impact is small: only
  # one RAGAS metric uses this alias (~60 calls/night against Voys).
  - model_name: klai-eval-judge
    litellm_params:
      model: mistral/mistral-large-2512
      api_key: os.environ/MISTRAL_API_KEY
    rpm: 200
    tpm: 400000

  # Embeddings: BGE-M3 via TEI on gpu-01. RAGAS' AnswerRelevancy metric
  # needs an embeddings model to compare imaginary-question vectors with
  # the user's actual question. We expose the TEI endpoint (already used
  # by knowledge-ingest for chunk embeddings) through the proxy so RAGAS
  # can reach it via standard OpenAI-compatible /v1/embeddings.
  - model_name: klai-embeddings
    litellm_params:
      model: openai/bge-m3
      api_base: http://172.18.0.1:7997/v1
      api_key: "no-auth-needed"  # TEI does not require auth on the internal network
    rpm: 1000
    tpm: 1000000

router_settings:
  routing_strategy: simple-shuffle
  optional_pre_call_checks:
    - enforce_model_rate_limits  # Queue requests when provider budget is hit
  provider_budget_config:
    mistral:
      rpm_limit: 500
      tpm_limit: 400000

litellm_settings:
  drop_params: true             # vLLM/Ollama does not accept all OpenAI params
  request_timeout: 120
  num_retries: 2
  callbacks:
    - klai_knowledge.klai_knowledge_hook
    - custom_router.token_router

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
