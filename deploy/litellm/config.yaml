model_list:
  # Daily spend ceiling per Mistral deployment: max_budget (USD) per
  # budget_duration. LiteLLM 1.96.2 enforces this in
  # router_strategy/budget_limiter.py: a deployment whose spend in the current
  # window has reached max_budget is filtered out before selection, and with
  # no deployment left the request fails with "No deployments available -
  # crossed budget" (HTTP 500 at the proxy), which the
  # litellm_budget_exhausted alert pages on. klai-primary then falls back to
  # klai-large; the other aliases have no fallback.
  # Numbers, per deployment per day: Small was ~$5-12/day while background
  # ingest ran on klai-fast; ingest moved to klai-ingest on 2026-09-27, so
  # klai-fast 10 and klai-primary 10 (chat and portal utility calls). Large is ~$0-2/day and also absorbs klai-primary's
  # fallback: 10. Medium should only serve RAGAS faithfulness and the
  # in-turn answer grounding, paraphrase and Strict-risk calls (portal's
  # background judges and support analysis run on klai-judge): 8, tight
  # on purpose so a routing mistake that sends bulk traffic to Medium stops
  # within a day.
  # Prices are pinned per deployment because LiteLLM's bundled cost map has no
  # entry for mistral-small-2603 or mistral-medium-3.5; without these fields
  # their cost is only known when the startup fetch of the remote cost map
  # succeeds, and after a failed fetch no Small or Medium call would count.
  # Known limits: spend is counted in process memory (this proxy has no
  # Redis), so a restart resets it, and the window is 24h from the first call
  # after start rather than a calendar day. klai_mistral_pool keeps an alias
  # on order 1 until Mistral answers 402, so a spent order 1 stops the alias
  # and order 2's budget only comes into play after a 402: worst case two
  # budgets per alias per day. A budget that survives restarts needs Redis in
  # router_settings (redis_host/redis_port).

  # Primary: Mistral Small — default for user-facing tasks
  # Routes through custom_router.py: may be upgraded to klai-large (tool calls)
  # or downgraded to klai-fast (web search content). Never use for internal services.
  - model_name: klai-primary
    litellm_params:
      model: mistral/mistral-small-2603
      api_key: os.environ/MISTRAL_API_KEY_2
      order: 2
      input_cost_per_token: 1.5e-07
      cache_read_input_token_cost: 1.5e-08
      output_cost_per_token: 6.0e-07
      max_budget: 10
      budget_duration: 1d
    # Both organisations' limits from Mistral's x-ratelimit headers
    # (MISTRAL_API_KEY_2 on 2026-09-25, MISTRAL_API_KEY on 2026-09-27, equal):
    # small 1000 RPM / 500k TPM, medium 2000 / 1M, large 30 / 800k. rpm/tpm
    # here are 90% of that. Small is one upstream limit shared by klai-primary
    # and klai-fast, split evenly now that background ingest runs on
    # klai-ingest.
    rpm: 450
    tpm: 225000

  - model_name: klai-primary
    litellm_params:
      model: mistral/mistral-small-2603
      api_key: os.environ/MISTRAL_API_KEY
      # Order 1: the Klai organisation; order 2: the next Pro organisation.
      # Both are Pro with pay-as-you-go off, so each stops at its allowance
      # and Mistral answers 402, which moves traffic to the next account.
      order: 1
      input_cost_per_token: 1.5e-07
      cache_read_input_token_cost: 1.5e-08
      output_cost_per_token: 6.0e-07
      max_budget: 10
      budget_duration: 1d
    rpm: 450
    tpm: 225000


  # Fast: Mistral Small — bypasses custom_router.py routing
  # Use for lightweight, latency-sensitive user-facing calls
  - model_name: klai-fast
    litellm_params:
      model: mistral/mistral-small-2603
      api_key: os.environ/MISTRAL_API_KEY_2
      order: 2
      input_cost_per_token: 1.5e-07
      cache_read_input_token_cost: 1.5e-08
      output_cost_per_token: 6.0e-07
      max_budget: 10
      budget_duration: 1d
    rpm: 450
    tpm: 225000

  - model_name: klai-fast
    litellm_params:
      model: mistral/mistral-small-2603
      api_key: os.environ/MISTRAL_API_KEY
      order: 1
      input_cost_per_token: 1.5e-07
      cache_read_input_token_cost: 1.5e-08
      output_cost_per_token: 6.0e-07
      max_budget: 10
      budget_duration: 1d
    rpm: 450
    tpm: 225000


  # Large: Mistral Large — agentic / tool use flows
  # Auto-selected by custom_router.py when tool call history is detected
  - model_name: klai-large
    litellm_params:
      model: mistral/mistral-large-2512
      api_key: os.environ/MISTRAL_API_KEY_2
      order: 2
      input_cost_per_token: 5.0e-07
      cache_read_input_token_cost: 5.0e-08
      output_cost_per_token: 1.5e-06
      max_budget: 10
      budget_duration: 1d
    rpm: 27
    tpm: 720000

  - model_name: klai-large
    litellm_params:
      model: mistral/mistral-large-2512
      api_key: os.environ/MISTRAL_API_KEY
      order: 1
      input_cost_per_token: 5.0e-07
      cache_read_input_token_cost: 5.0e-08
      output_cost_per_token: 1.5e-06
      max_budget: 10
      budget_duration: 1d
    rpm: 27
    tpm: 720000


  # Medium: Mistral Medium 3.5 — middle-tier between klai-fast and klai-large.
  # Use for tasks where klai-fast hits its output-token ceiling but klai-large
  # is overkill. First consumer: SPEC-RAG-EVAL-001 RAGAS faithfulness metric
  # (Mistral Small truncates the multi-statement JSON output, leaving NaNs).
  # See docs/research/models/llm-selection-knowledge-graph.md.
  - model_name: klai-medium
    litellm_params:
      model: mistral/mistral-medium-3.5
      api_key: os.environ/MISTRAL_API_KEY_2
      order: 2
      input_cost_per_token: 1.5e-06
      cache_read_input_token_cost: 1.5e-07
      output_cost_per_token: 7.5e-06
      max_budget: 8
      budget_duration: 1d
    rpm: 1800
    tpm: 900000

  - model_name: klai-medium
    litellm_params:
      model: mistral/mistral-medium-3.5
      api_key: os.environ/MISTRAL_API_KEY
      order: 1
      input_cost_per_token: 1.5e-06
      cache_read_input_token_cost: 1.5e-07
      output_cost_per_token: 7.5e-06
      max_budget: 8
      budget_duration: 1d
    rpm: 1800
    tpm: 900000


  # Judge: Mistral Medium 3.5 — portal-api's background Medium work only (webchat
  # judge conversation_judge.py, LibreChat variant librechat_quality_judge.py,
  # support-case analysis support_case_analysis.py, which support gap
  # grouping, gap fold/regroup and the ingest-gap evaluation reuse), all via
  # settings.conversation_judge_model. Split off klai-medium on 2026-09-27
  # (#1762, mirrors klai-ingest, #1752): the nightly batch (01:00-06:00 UTC)
  # used to share klai-medium's $8/day cap with the daytime
  # answer_grounding_model check on every widget/internal answer, and could
  # spend the whole cap before anyone was awake, failing that check with
  # answer_grounding_call_failed.
  # Since 2026-09-28 it runs on the Klai organisation's Vibe allowance, like
  # klai-ingest: this work is background, so it has no reason to spend the
  # API allowance the chat turns run on. Mistral's registry answers
  # mistral-vibe-cli-latest with name mistral-medium-latest, aliases
  # mistral-medium-3.5 and mistral-medium-2604 (queried 2026-09-27), so the
  # same model as klai-medium. One deployment on the key klai-ingest uses and
  # no fallback entry: a full Vibe allowance (402) stops both aliases, which
  # is right because it is one allowance, and neither spills onto the chat
  # keys. Every Medium call made inside a user's chat turn (answer grounding
  # and repair, query paraphrase, partner_chat's Strict-risk upgrade) stays
  # on klai-medium.
  # Prices as Mistral's Vibe client prices it: $1.50 in / $7.50 out per 1M,
  # cache reads $0.15. Limits: Medium's Pro limits (2000 RPM / 1M TPM, as
  # measured for the API keys above; the Vibe key's own headers were only
  # read for vibe-cli-fast), rpm/tpm at 90% of that.
  # Reasoning: Medium 3.5 is a hybrid reasoning model and Mistral does not
  # document a default reasoning_effort (Vibe's client asks for high itself).
  # reasoning_effort "none" is pinned here so these calls never pay for a
  # thinking chunk. LiteLLM 1.96.2's mistral transformation only maps
  # reasoning_effort for model names containing "magistral" and drop_params
  # drops it otherwise; allowed_openai_params forwards it to Mistral as is.
  # tests/test_litellm_mistral_failover.py checks the outgoing request body.
  # Budget: this work was ~$2-3/day after the support-reanalysis fix. The
  # spike is a knowledge change that force-reanalyses 50 support cases at ~9
  # calls each (gap_rescorer.py); at an assumed ~5k input / ~500 output
  # tokens per call that is ~$5. $10 lets a normal day plus one such run
  # finish and stops a retry loop within the day, and together with
  # klai-ingest's $20 caps the Vibe allowance at $30/day.
  - model_name: klai-judge
    litellm_params:
      model: mistral/mistral-vibe-cli-latest
      api_key: os.environ/MISTRAL_VIBE_KEY
      order: 1
      reasoning_effort: none
      allowed_openai_params: ["reasoning_effort"]
      input_cost_per_token: 1.5e-06
      cache_read_input_token_cost: 1.5e-07
      output_cost_per_token: 7.5e-06
      max_budget: 10
      budget_duration: 1d
    rpm: 1800
    tpm: 900000


  # Ingest: knowledge-ingest's background LLM work (enrichment, Graphiti
  # extraction, taxonomy classification and labelling, RAG-eval judge) on
  # mistral-vibe-cli-fast with the Klai organisation's Vibe-scoped key, which
  # draws on that plan's Vibe allowance rather than its API allowance. One deployment and deliberately no entry in router fallbacks: when
  # this key is full (402) or its budget is spent, ingest fails and retries
  # later instead of spilling onto the chat keys. Interactive calls
  # knowledge-ingest makes while a user waits stay on klai-fast.
  # Limits from Mistral's x-ratelimit headers on 2026-09-27: 1000 RPM / 500k
  # TPM; rpm/tpm here are 90% of that, as for the other aliases. Prices as
  # Mistral's Vibe client (2.25.8) prices this model: $0.10 in / $0.30 out
  # per 1M tokens, cache reads at 10% of input like the other entries.
  # Budget: normal ingest is ~$1-3/day. knowledge-ingest paces itself at
  # 0.6 rps (36 rpm, llm_throttle), about 52k calls/day flat out; at a
  # typical ~2.5k input / ~250 output tokens per call a full backlog day
  # costs ~$17. $20 lets that day finish and stops a runaway (a retry loop
  # at the 237k TPM peak measured on klai-fast reaches it in ~14h).
  - model_name: klai-ingest
    litellm_params:
      model: mistral/mistral-vibe-cli-fast
      api_key: os.environ/MISTRAL_VIBE_KEY
      order: 1
      input_cost_per_token: 1.0e-07
      cache_read_input_token_cost: 1.0e-08
      output_cost_per_token: 3.0e-07
      max_budget: 20
      budget_duration: 1d
    rpm: 900
    tpm: 450000


  # Embeddings: BGE-M3 via TEI on gpu-01. Distinct model TYPE (not a
  # text-completion tier) — exposes the TEI endpoint already used by
  # knowledge-ingest through the proxy so external consumers (RAGAS
  # AnswerRelevancy, future query-rewriting SPECs) can reach it via
  # standard OpenAI-compatible /v1/embeddings.
  - model_name: klai-bge-m3
    litellm_params:
      model: openai/bge-m3
      api_base: http://172.18.0.1:7997/v1
      api_key: "no-auth-needed"  # TEI does not require auth on the internal network
    rpm: 1000
    tpm: 1000000

search_tools:
  - search_tool_name: klai-web-search
    litellm_params:
      search_provider: searxng
      api_base: os.environ/SEARXNG_API_BASE

router_settings:
  # LiteLLM v1.96.2 filters to the lowest deployment order before applying
  # simple-shuffle, then advances on any failure except context-window and
  # content-policy errors, which follow their dedicated fallback paths --
  # including a persistent 429, which is why klai_mistral_pool_hook above is
  # needed to keep that advance FULL-gated instead of retry-exhaustion-gated.
  # Behavioral coverage: tests/test_litellm_mistral_failover.py.
  routing_strategy: simple-shuffle
  # Small (klai-primary, klai-fast) falls back to Mistral Large when it fails or
  # its budget is spent: Large is the next model up that costs less than Medium
  # on both input and output. Nothing falls back to Medium: that fallback served
  # Small-intended load at ~10x the input price from 2026-09-09. klai-fast also
  # carries user traffic (custom_router sends web-search and long turns there),
  # so it keeps a fallback. klai-ingest and klai-judge have no entry on
  # purpose: bulk/batch background work waits for its own key instead of
  # moving to another one.
  fallbacks: [{"klai-primary": ["klai-large"]}, {"klai-fast": ["klai-large"]}]
  optional_pre_call_checks:
    - enforce_model_rate_limits  # Queue requests when model RPM/TPM is hit
  allowed_fails: 2
  cooldown_time: 60
  # An account moves to the next one only when it is full (Mistral answers 402
  # at a spending limit; that is not retried and not cooled down). A 429 is a
  # rate limit: retry the same account with backoff and never cool it down, so
  # a busy minute does not push traffic to the next account.
  retry_policy:
    RateLimitErrorRetries: 3
  allowed_fails_policy:
    RateLimitErrorAllowedFails: 1000000

litellm_settings:
  drop_params: true             # vLLM/Ollama does not accept all OpenAI params
  request_timeout: 120
  # Avoid retry storms against Mistral when the upstream is already returning
  # 429/503. Callers with semantic retry needs keep their own backoff.
  num_retries: 1
  callbacks:
    # Keeps every klai-* Mistral alias on the lowest Pro organisation that
    # isn't FULL (Mistral 402): closes the gap where LiteLLM's own built-in
    # order-based fallback (router.py's "ORDER-BASED FALLBACKS") moves
    # traffic to the next `order` on a persistent 429 too, not just a 402.
    # Order-independent of the other callbacks below: it only touches
    # deployment SELECTION (async_filter_deployments) and post-hoc FULL-state
    # bookkeeping (log_success/failure_fallback_event), never the outbound
    # request/response payload those mutate. See klai_mistral_pool.py's
    # module docstring. Tests: tests/test_litellm_mistral_failover.py.
    - klai_mistral_pool.klai_mistral_pool_hook
    - klai_knowledge.klai_knowledge_hook
    - custom_router.token_router
    # SPEC-PRIVACY-MISTRAL-PII-001 Phase 2 (REQ-5, REQ-6): read-only PII
    # observer. Registered LAST so it sees the outbound payload after KB
    # context injection and router upgrade/downgrade, not the original
    # request. Calls presidio-analyzer's /analyze out of band (never
    # awaited by any hook), returns the payload unchanged, never calls
    # the anonymizer, and emits org_id/call_type/model/language/entity
    # counts only — no matched values, offsets, or hashes (REQ-6). Does
    # NOT honour `_klai_openai_passthrough` or missing org_id — see
    # klai_pii_observe.py's module docstring. NOT deleted by this PR despite
    # REQ-5's own instruction to remove it in the Phase 3 PR: this PR's hard
    # constraint is "add new modules, do not modify or delete existing
    # ones". Flagged as a deliberate deviation from the SPEC's own text in
    # the implementation report rather than silently actioned.
    - klai_pii_observe.klai_pii_observer
    # SPEC-PRIVACY-MISTRAL-PII-001 Phase 3 (REQ-7 through REQ-11): mask/map/
    # restore PII on the Mistral call path. Gated behind KLAI_PII_ENFORCE,
    # which is off unless the deployment sets it. GA since
    # 2026-08-25: docker-compose.yml's environment: block defaults it to
    # true for every org (KLAI_PII_ENFORCE_ORG_IDS defaults to `*`); see
    # that block's comment for the rollout history and the kill switch.
    # Registered last among the PII-phase hooks (after klai_pii_observe) for
    # two independent reasons, both verified against the installed
    # litellm==1.96.2 source and documented in klai_pii_enforce.py's module
    # docstring:
    #   1. async_post_call_streaming_iterator_hook / async_post_call_
    #      success_hook: last-registered is outermost / applied last, so
    #      its output is what the client actually receives. klai_prompt_cache
    #      below declares neither hook, so it cannot affect this ordering.
    #   2. async_pre_call_hook runs callbacks in strict registration order,
    #      each seeing the previous one's mutated `data`. Masking AFTER
    #      klai_pii_observe keeps Phase 2's telemetry measuring the
    #      pre-mask payload even once enforcement is enabled for individual
    #      orgs, rather than measuring its own placeholders.
    - klai_pii_enforce.klai_pii_enforcer
    # Derives a stable Mistral prompt_cache_key from the final routed model
    # and the final system-role content. Registered last so the key reflects
    # what klai_pii_enforce actually sent (post-mask), not a pre-mask draft.
    # Sets it under `extra_body`, not as a top-level field: see
    # klai_prompt_cache.py's module docstring for why a top-level
    # `prompt_cache_key` is silently dropped for Mistral on this litellm
    # version and `extra_body` is the verified working path.
    - klai_prompt_cache.prompt_cache_key_injector

# SPEC-PRIVACY-MISTRAL-PII-001 Phase 0 (REQ-0a/REQ-0b) — TEMPORARY,
# EXPERIMENTAL, NOT the production control.
#
# This registers the native Presidio guardrail so the Phase 0 round-trip
# harness (deploy/litellm/scripts/eval_pii_restore_live.py) can prove
# whether `output_parse_pii` restores masked values correctly on this
# LiteLLM version (v1.96.2) — both streaming and non-streaming — and
# measure Dutch token-survival rate, BEFORE any recognizer work (REQ-3,
# Phase 1) begins. Stock entities only (PERSON, PHONE_NUMBER,
# EMAIL_ADDRESS) — no Dutch recognizer pack exists yet.
#
# `default_on` is deliberately ABSENT (defaults to false): this guardrail
# does NOT run on production traffic. The harness opts in per-request via
# `"guardrails": ["presidio-pii-phase0"]` in the request body. Turning this
# on for everyone is Phase 2 (REQ-5, `logging_only` + `default_on: true`)
# and Phase 3 (REQ-7, enforcement) — separate PRs, gated on this
# experiment's result being written back into the SPEC.
#
# MUST NOT be left enabled by default after the Phase 0 experiment
# concludes. If REQ-0a's answer is negative (restore does not survive on
# this version), delete this block rather than leave it dangling —
# REQ-8's fallback is the KlaiKnowledgeHook streaming-iterator path, not
# this guardrail.
guardrails:
  - guardrail_name: "presidio-pii-phase0"
    litellm_params:
      guardrail: presidio
      mode: "pre_call"
      output_parse_pii: true
      # REQ-2 (Dutch NLP engine, nl_core_news_lg) is Phase 1 work. Presidio
      # does not support "nl" as a request language at all yet (SPEC
      # Motivation: "nl is not in supported_languages") — "en" is the only
      # option stock Presidio offers today. A name/phone the (English)
      # analyzer never detects is never masked into a placeholder at all,
      # and from the client-visible response alone a verbatim echo of the
      # unmasked original would look identical to a successful restore.
      # The harness closes this at measurement time rather than assuming
      # it away: scripts/eval_pii_restore_live.py calls the analyzer's own
      # /analyze endpoint directly before scoring any round trip, and
      # reports an undetected entity in its own not_masked bucket. See
      # klai_pii_restore_eval.py's module docstring ("Detection
      # precondition").
      presidio_language: "en"
      pii_entities_config:
        PERSON: "MASK"
        PHONE_NUMBER: "MASK"
        EMAIL_ADDRESS: "MASK"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
