# Negative fixture for deploy/tests/librechat-config-boot.sh: the boot check
# must FAIL on this file. LibreChat validates librechat.yaml strictly, so one
# top-level key it does not know is enough for it to exit at startup (the
# shape of the `projects` block that took down the pinned image in November
# 2026). If this ever boots, the check cannot go red and proves nothing.
version: 1.3.19
cache: true
unknownTopLevelKeyForBootCheck:
  enabled: true
