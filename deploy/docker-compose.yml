name: klai-core

networks:
  klai-net:
    driver: bridge
    name: klai-net
  socket-proxy:
    driver: bridge
    name: klai-socket-proxy
    internal: true   # portal-api + runtime-api-socket-proxy (socat) <-> docker-socket-proxy
  inference:
    driver: bridge
    name: klai-inference
    internal: true   # no outbound internet — only LiteLLM <-> Ollama
  monitoring:
    driver: bridge
    name: klai-monitoring
    internal: true   # VictoriaMetrics/VictoriaLogs/cAdvisor only via Alloy/Grafana
  net-mongodb:
    driver: bridge
    name: klai-net-mongodb
    internal: true   # only MongoDB <-> LibreChat containers
  net-postgres:
    driver: bridge
    name: klai-net-postgres
    internal: true   # only PostgreSQL <-> Zitadel, LiteLLM, GlitchTip
  net-redis:
    driver: bridge
    name: klai-net-redis
    internal: true   # only Redis <-> LiteLLM, GlitchTip, LibreChat
  net-listmonk:
    driver: bridge
    name: klai-net-listmonk
    internal: true   # only listmonk <-> its Postgres database
  net-meilisearch:
    driver: bridge
    name: klai-net-meilisearch
    internal: true   # only Meilisearch <-> LibreChat containers
  vexa12-internal:
    name: vexa12-internal
    driver: bridge
    internal: true   # only vexa12-meeting-api <-> vexa12-admin-api; no bot ever joins
  vexa12-storage:
    name: vexa12-storage
    driver: bridge
    internal: true
    # ONLY garage <-> vexa12-meeting-api. meeting-api's MINIO_* config points at
    # Garage, and its signal-tape janitor probes storage every sweep even with
    # RECORDING_ENABLED=false. Garage lives on klai-net; reaching it via klai-net
    # would undo the vexa12-portal boundary, so this is a dedicated two-party link.
  vexa12-portal:
    name: vexa12-portal
    driver: bridge
    internal: true
    # ONLY portal-api <-> vexa12-meeting-api. meeting-api has no auth of its own in
    # 0.12 (it trusts the X-User-Id header the absent gateway would set, and defaults
    # to AllowAllServiceAuthority), so whatever network it sits on IS its authorization
    # boundary. It was briefly on klai-net, which carries 70 containers including 42
    # tenant LibreChat instances — any one of them could read any tenant's transcript
    # with a forged X-User-Id. This network has exactly two members.
  vexa12-bots:
    name: vexa12-bots
    driver: bridge
    # SPEC-VEXA-004: separate bot network for the parallel 0.12 stack. MUST stay
    # separate from vexa-bots: a 0.12 bot resolves its lifecycle callback by the
    # literal name `meeting-api`, which on vexa-bots would hit the 0.10 service.
    # NOT internal — bot containers need internet egress to join meeting platforms

volumes:
  firecrawl-postgres-data:
  caddy-data:
  caddy-config:
  caddy-tenants:
  mongodb-data:
  postgres-data:
  redis-data:
  listmonk-postgres-data:
  listmonk-uploads-data:
  meilisearch-data:
  glitchtip-data:
  victoriametrics-data:
  victorialogs-data:
  grafana-data:
  gitea-data:
  qdrant-data:
  vexa12-redis-data:           # SPEC-VEXA-004 — separate instance, see the vexa12 block
  scribe-audio-data:
  runtime-api-docker-socket:   # SPEC-SEC-021 socat bridge socket (runtime-api <-> docker-socket-proxy)
  vaultwarden-data:            # Vaultwarden SQLite DB + attachments

# Default log rotation — prevents unbounded disk growth on json-file driver.
# Alloy captures logs in real-time via Docker socket, so rotated logs are only
# a local fallback. Configure Docker daemon default: /etc/docker/daemon.json
#   { "log-driver": "json-file", "log-opts": { "max-size": "50m", "max-file": "3" } }
# This applies to ALL containers without per-service config.

services:

  # ─── Caddy (reverse proxy + wildcard TLS) ────────────────────────────────
  caddy:
    image: ghcr.io/getklai/caddy-hetzner:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy-tenants:/etc/caddy/tenants
      - caddy-data:/data
      - caddy-config:/config
      - /opt/klai/portal-dist:/srv/portal:ro
      - /opt/klai/caddy-logs:/var/log/caddy
    environment:
      HETZNER_AUTH_API_TOKEN: ${HETZNER_AUTH_API_TOKEN}
      DOMAIN: ${DOMAIN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      GRAFANA_CADDY_USER: ${GRAFANA_CADDY_USER}
      GRAFANA_CADDY_HASH: ${GRAFANA_CADDY_HASH}
      VICTORIALOGS_INGEST_TOKEN: ${VICTORIALOGS_INGEST_TOKEN}
      VICTORIALOGS_BASIC_AUTH_B64: ${VICTORIALOGS_BASIC_AUTH_B64}
      # SPEC-SEC-008 F-018 — dev.getklai.com basic-auth credentials
      CADDY_DEV_USERNAME: ${CADDY_DEV_USERNAME:-}
      CADDY_DEV_PASSWORD_HASH: ${CADDY_DEV_PASSWORD_HASH:-}
    networks:
      - klai-net
      - monitoring

  # ─── MongoDB ──────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:8.2.12
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    volumes:
      - mongodb-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: klai
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    networks:
      - net-mongodb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_USER: klai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: klai
    networks:
      - net-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klai"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:8.10.0-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: redis-server --save 60 1 --appendonly yes --loglevel warning --requirepass ${REDIS_PASSWORD}
    networks:
      - net-redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $REDIS_PASSWORD --no-auth-warning ping | grep PONG"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── listmonk PostgreSQL (mailing.getklai.com) ───────────────────────────
  listmonk-db:
    image: postgres:17.10-alpine
    restart: unless-stopped
    volumes:
      - listmonk-postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: listmonk
      POSTGRES_PASSWORD: ${LISTMONK_DB_PASSWORD}
      POSTGRES_DB: listmonk
    networks:
      - net-listmonk
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listmonk -d listmonk"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── Meilisearch ──────────────────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.53.0
    restart: unless-stopped
    volumes:
      - meilisearch-data:/meili_data
    environment:
      MEILI_ENV: production
      MEILI_DB_PATH: /meili_data
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    networks:
      - net-meilisearch
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Zitadel ──────────────────────────────────────────────────────────────
  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.17.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    command: start-from-init --masterkey ${ZITADEL_MASTERKEY}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_DB_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: klai
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_EXTERNALDOMAIN: auth.${DOMAIN}
      ZITADEL_EXTERNALPORT: "443"
      ZITADEL_EXTERNALSECURE: "true"
      ZITADEL_DEFAULTINSTANCE_ORG_NAME: ${ZITADEL_ORG_NAME}
      ZITADEL_DEFAULTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_ADMIN_USERNAME}
      ZITADEL_DEFAULTINSTANCE_ORG_HUMAN_FIRSTNAME: ${ZITADEL_ADMIN_FIRSTNAME}
      ZITADEL_DEFAULTINSTANCE_ORG_HUMAN_LASTNAME: ${ZITADEL_ADMIN_LASTNAME}
      ZITADEL_DEFAULTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: ${ZITADEL_ADMIN_EMAIL}
      ZITADEL_DEFAULTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: "true"
      ZITADEL_DEFAULTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD}
      ZITADEL_DEFAULTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      # Zitadel >= v4.15.2 routes ALL outgoing HTTP (incl. the klai-mailer
      # notification webhook) through an SSRF denylist that blocks RFC1918
      # by default (CVE-2026-55671 hardening). klai-mailer and zitadel both
      # live on the klai-net Docker network, verified subnet 172.18.0.0/16
      # (docker network inspect klai-net, 2026-08-12; mailer=172.18.0.16,
      # zitadel=172.18.0.49). This override re-denies as much of the
      # upstream 172.16.0.0/12 RFC1918 block as possible, opening ONLY the
      # verified klai-net subnet — computed as 172.16.0.0/12 minus
      # 172.18.0.0/16 via Python ipaddress.address_exclude(): 172.16.0.0/15,
      # 172.19.0.0/16, 172.20.0.0/14, 172.24.0.0/13. There is no allowlist
      # mechanism (zitadel/zitadel#12326), so this is the narrowest
      # denylist that still lets the mailer webhook (and any other klai-net
      # service) through. Residual risk: Zitadel Actions can still reach
      # any other service on klai-net (172.18.0.0/16), not just the
      # mailer; acceptable because only Klai operators can configure
      # Actions on this instance. FRAGILITY WARNING: this hardcodes the
      # klai-net subnet rather than pinning it via the network's ipam
      # config — a live compose network's subnet cannot be changed without
      # recreating the entire stack (all containers down), which is not
      # worth it for this hardening. If klai-net is ever recreated with a
      # different subnet, Zitadel notification mails silently break again
      # exactly like the original 5-week outage; the Grafana alert on
      # "sending notification failed" (added in a sibling PR) is the
      # detection net for that regression.
      ZITADEL_HTTPCLIENT_DENYLIST: "localhost,0.0.0.0/8,10.0.0.0/8,100.64.0.0/10,127.0.0.0/8,169.254.0.0/16,172.16.0.0/15,172.19.0.0/16,172.20.0.0/14,172.24.0.0/13,192.168.0.0/16,198.18.0.0/15,::/128,::1/128,fc00::/7,fe80::/10"
    networks:
      - klai-net
      - net-postgres

  # ─── LiteLLM ──────────────────────────────────────────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:v1.96.2
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./litellm/klai_knowledge.py:/app/klai_knowledge.py:ro
      - ./litellm/klai_context.py:/app/klai_context.py:ro
      - ./litellm/klai_kb_answer_policy.py:/app/klai_kb_answer_policy.py:ro
      - ./litellm/klai_kb_chat_mode.py:/app/klai_kb_chat_mode.py:ro
      - ./litellm/klai_kb_citation_render.py:/app/klai_kb_citation_render.py:ro
      - ./litellm/klai_kb_confidence_policy.py:/app/klai_kb_confidence_policy.py:ro
      - ./litellm/klai_kb_context_prompt.py:/app/klai_kb_context_prompt.py:ro
      - ./litellm/klai_kb_llm_safety.py:/app/klai_kb_llm_safety.py:ro
      - ./litellm/klai_kb_portal_client.py:/app/klai_kb_portal_client.py:ro
      - ./litellm/klai_kb_query_rewrite.py:/app/klai_kb_query_rewrite.py:ro
      - ./litellm/klai_kb_render_policy.py:/app/klai_kb_render_policy.py:ro
      - ./litellm/klai_kb_request_context.py:/app/klai_kb_request_context.py:ro
      - ./litellm/klai_kb_safety_filter.py:/app/klai_kb_safety_filter.py:ro
      - ./litellm/klai_kb_scope_policy.py:/app/klai_kb_scope_policy.py:ro
      - ./litellm/klai_kb_system_prompt.py:/app/klai_kb_system_prompt.py:ro
      - ./litellm/klai_kb_traceability.py:/app/klai_kb_traceability.py:ro
      - ./litellm/klai_kb_urls.py:/app/klai_kb_urls.py:ro
      - ./litellm/klai_litellm_response.py:/app/klai_litellm_response.py:ro
      - ./litellm/klai_chat_attachments.py:/app/klai_chat_attachments.py:ro
      - ./litellm/custom_router.py:/app/custom_router.py:ro
      # SPEC-CHAT-GUARDRAILS-001: vendored package copy of klai-libs/llm-safety
      # (kept byte-identical via deploy/litellm/tests/test_klai_llm_safety_drift.py).
      # Directory mount at /app/klai_llm_safety puts the package on PYTHONPATH
      # next to klai_knowledge.py so ``import klai_llm_safety`` resolves
      # without a custom Dockerfile. Phase D plan: pip install in custom image.
      - ./litellm/klai_llm_safety:/app/klai_llm_safety:ro
      # SPEC-RAG-MULTILINGUAL-CHAT-001 Phase 4 (REQ-10): vendored single-file
      # copy of klai-libs/chat-prompts (kept in sync via deploy/litellm/tests/
      # test_klai_chat_prompts_drift.py). Stock upstream image, no pip-install
      # hook, so the file is mounted onto PYTHONPATH at /app/. Phase D plan:
      # replace the vendored files with a proper pip install in a custom image.
      - ./litellm/klai_chat_prompts.py:/app/klai_chat_prompts.py:ro
      # SPEC-MCP-RETRIEVAL-001 Phase 1: vendored single-file copy of
      # klai-libs/retrieval-telemetry (kept in sync via deploy/litellm/tests/
      # test_klai_retrieval_telemetry_drift.py). klai_knowledge.py imports
      # `from klai_retrieval_telemetry import ...` at module load — without
      # this mount the litellm container hits ModuleNotFoundError →
      # ImportError on `klai_knowledge.klai_knowledge_hook` → restart loop
      # → all chat traffic 500s with "Connection error". Same vendoring
      # rationale as klai_chat_prompts.py.
      - ./litellm/klai_retrieval_telemetry.py:/app/klai_retrieval_telemetry.py:ro
      # Shared deterministic citation rendering used by klai_knowledge.py.
      # The LiteLLM deploy workflow syncs klai-libs/citations/klai_citations/
      # here so this stock upstream image imports the canonical package
      # without a custom Dockerfile.
      - ./litellm/klai_citations:/app/klai_citations:ro
    environment:
      PYTHONPATH: /app
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@postgres:5432/litellm
      STORE_MODEL_IN_DB: "True"
      # LiteLLM image upgrades can add Prisma columns used by startup jobs
      # and model/tool sync. Run upstream's production migration path before
      # serving so the image and Postgres schema cannot drift.
      USE_PRISMA_MIGRATE: "True"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SEARXNG_API_BASE: ${SEARXNG_INSTANCE_URL}
      DISABLE_ADMIN_UI: "True"
      KNOWLEDGE_RETRIEVE_URL: http://retrieval-api:8040/retrieve
      KNOWLEDGE_RETRIEVE_TIMEOUT: "60.0"
      KNOWLEDGE_INGEST_SECRET: ${KNOWLEDGE_INGEST_SECRET}
      DOCLING_URL: http://docling-serve:5001
      KLAI_CHAT_PDF_MAX_BYTES: "20971520"
      KLAI_CHAT_PDF_MAX_EXTRACTED_TOKENS: "120000"
      KLAI_CHAT_PDF_CONVERSION_TIMEOUT_S: "45.0"
      PORTAL_API_URL: http://portal-api:8010
      # Two DIFFERENT secrets — one per receiver. portal-api validates the first
      # (entitlement check + templates fetch) against PORTAL_API_INTERNAL_SECRET;
      # retrieval-api validates the second (/retrieve call) against its own
      # INTERNAL_SECRET env var (sourced from RETRIEVAL_API_INTERNAL_SECRET in
      # SOPS). Until 2026-05-02 the hook used PORTAL_INTERNAL_SECRET for both,
      # which 401'd retrieve calls every time the two secrets diverged.
      PORTAL_INTERNAL_SECRET: ${PORTAL_API_INTERNAL_SECRET}
      RETRIEVAL_INTERNAL_SECRET: ${RETRIEVAL_API_INTERNAL_SECRET}
      # SPEC-RAG-EVIDENCE-INTEGRITY-001 REQ-CIT — citation-rescue flag +
      # thresholds for klai_citations (path A). Portal-api carries the SAME
      # three vars for path B; keep them in sync or the two chat surfaces
      # show diverging citations for identical KB answers.
      CITATION_RESCUE_MODE: ${CITATION_RESCUE_MODE:-shadow}
      RESCUE_ANSWER_SCORE_THRESHOLD: ${RESCUE_ANSWER_SCORE_THRESHOLD:-19}
      RESCUE_RETRIEVAL_RATIO: ${RESCUE_RETRIEVAL_RATIO:-0.4}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - klai-net
      - inference
      - net-postgres
      - net-redis

  # ─── LibreChat (tenant: getklai) ─────────────────────────────────────────
  librechat-getklai:
    # SPEC-LIBRECHAT-PATCH-MODEL-001 Phase 3 — the canary runs the Klai-owned
    # image, built in CI from the source diffs in deploy/librechat/patches-source/.
    # Tag for humans: v0.8.7-klai.1-f415a2515817 (upstream v0.8.7, agents v3.2.46).
    #
    # Pinned by DIGEST, and deploy/check-klai-librechat-digest.sh enforces that:
    # on 2026-08-14 the tag v0.8.7-klai.1 was pushed twice with different
    # content, so a tag-pinned canary could not be rolled back to what it ran.
    #
    # Rollback: put ghcr.io/danny-avila/librechat:v0.8.7 back here and restore
    # the four patch bind-mounts removed below (git revert this commit).
    image: ghcr.io/getklai/librechat@sha256:360770c500415ef56f915d2ff71b014604a0ddec46708118008cf5019c432793
    container_name: librechat-getklai
    restart: unless-stopped
    # Force light theme via the Klai entrypoint wrapper (LibreChat has no
    # server-side theme config — see deploy/librechat/klai-entrypoint.sh).
    # In Compose, `entrypoint:` CLEARS the image CMD, so `command:` MUST be set
    # explicitly; the wrapper passes it through ("$@") to docker-entrypoint.sh.
    # The script is synced to /opt/klai/librechat/klai-entrypoint.sh by
    # deploy-compose.yml's sync_and_recreate BEFORE this container is
    # (re)created, so the bind-mount source always exists (no empty-dir race).
    entrypoint: ["/bin/sh", "/klai-entrypoint.sh"]
    command: ["npm", "run", "backend"]
    env_file:
      - ./librechat/getklai/.env
    environment:
      REDIS_URI: ${REDIS_URI}
      KNOWLEDGE_INGEST_SECRET: ${KNOWLEDGE_INGEST_SECRET}
      CUSTOM_FOOTER: ""
      # LibreChat expects this env var name, but the value must be a
      # getklai-scoped Meili API key, not MEILI_MASTER_KEY.
      # This compose override wins over ./librechat/getklai/.env; keep
      # GETKLAI_MEILI_API_KEY in /opt/klai/.env synced when rotating the
      # getklai tenant key.
      MEILI_MASTER_KEY: "${GETKLAI_MEILI_API_KEY:?set a Meili key scoped to getklai_messages,getklai_convos}"
      MEILI_MESSAGES_INDEX: getklai_messages
      MEILI_CONVOS_INDEX: getklai_convos
      # SPEC-KB-015: wire the feedback-forward patch (deploy/librechat/getklai/entrypoint.sh)
      # to portal-api. KLAI_ORG_SLUG lets the patch derive librechat_tenant_id
      # (matches PortalOrg.librechat_container = "librechat-{slug}" naming,
      # see klai-portal/backend/app/core/provisioning_names.py) without relying
      # on a req.user.tenantId claim LibreChat never populates.
      KLAI_ORG_SLUG: getklai
      PORTAL_INTERNAL_URL: http://portal-api:8010
      PORTAL_INTERNAL_SECRET: ${PORTAL_API_INTERNAL_SECRET}
    volumes:
      - ./librechat/getklai/librechat.yaml:/app/librechat.yaml:ro
      - ./librechat/getklai/images:/app/client/public/images
      - ./librechat/getklai/entrypoint.sh:/klai-entrypoint.sh:ro
      # SPEC-LIBRECHAT-PATCH-MODEL-001 Phase 3: the four patch bind-mounts are
      # GONE from this service — they are baked into the image above, built from
      # the source diffs in deploy/librechat/patches-source/.
      #
      # They cannot coexist. A mount wins over the file in the image, so leaving
      # them would silently serve the old hand-edited bundles and make the whole
      # migration a no-op — the same shape as the createStreamServices mount that
      # sat inert for months.
      #
      # The entrypoint mount stays: it carries the two surfaces that remain
      # runtime transforms on purpose (per-tenant Meili index names, additive
      # client polish) — see the SPEC's inventory rows 7 and 8.
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - klai-net
      - net-mongodb
      - net-meilisearch
      - net-redis

  # ─── Ollama (CPU fallback) ────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:0.32.9
    restart: unless-stopped
    volumes:
      - /opt/klai/ollama/models:/root/.ollama
    networks:
      - inference    # only reachable via LiteLLM, not from LibreChat/Caddy
    deploy:
      resources:
        limits:
          cpus: '6'
          memory: 12G

  # ─── Docker socket proxy (limits portal-api + runtime-api to required Docker API calls only)
  # SPEC-SEC-021: routes portal-api + runtime-api through this proxy instead of mounting the socket directly.
  # SPEC-SEC-024: audit verified this minimum (CONTAINERS+NETWORKS+POST+DELETE) covers every
  # Docker API call portal-api actually makes — see .moai/specs/SPEC-SEC-024/plan.md Tabel C.
  # Runtime-api is black-box; unexpected 403's are caught by the permanent Grafana alert
  # "Security — Proxy Denials" (SPEC-SEC-024-R12). Fix-forward: add the specific verb here
  # if the alert fires. Never add a verb preventively.
  # FORBIDDEN — never enable any of these (see docker-socket-proxy.md pitfall rule):
  #   EXEC=1     → grants arbitrary shell in any container (the whole point of this proxy)
  #   BUILD=1    → arbitrary image build on the host
  #   IMAGES=1   → image pull/push/remove, bypasses deploy-time pinning
  #   VOLUMES=1  → host volume manipulation
  #   SYSTEM=1   → host-level Docker daemon info/control
  #   PLUGINS=1  → load arbitrary Docker plugins
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1   # GET /containers/json + /containers/{id}/json — list, inspect
      NETWORKS: 1     # GET /networks + /networks/{id} — list, inspect, connect
      POST: 1         # enables POST verbs: /containers/create+start+restart, /networks/connect
      DELETE: 1       # enables DELETE /containers/{id} — provisioning rollback + stale cleanup
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-proxy

  # ─── klai-mailer (Zitadel HTTP notification provider) ────────────────────
  klai-mailer:
    image: ghcr.io/getklai/klai-mailer:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    # SPEC-SEC-AUDIT-2026-04 B3 / SPEC-SEC-ENVFILE-SCOPE-001 — migrated off
    # env_file: ./klai-mailer/.env. Explicit environment block below scopes
    # the mailer's process env to exactly what app/config.py reads.
    # Reverse-check (2026-04-29): PORTAL_ENV and SMTP_FROM diverged from
    # code defaults in the service .env — both are now declared explicitly.
    environment:
      # SMTP — credentials from klai-infra/core-01/klai-mailer/.env.sops
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-noreply@getklai.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Klai}
      SMTP_TLS: ${SMTP_TLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      # Zitadel webhook HMAC secret — from klai-infra/core-01/klai-mailer/.env.sops
      WEBHOOK_SECRET: ${MAILER_WEBHOOK_SECRET}
      # Branding — prod overrides code defaults (example.com → getklai.com)
      # Canonical Klai logo per .claude/rules/klai/design/tokens.md § Logo.
      # NEVER point this at cdn.getklai.com/klai-logo.png (DNS no-op) or
      # klai-icon-square.png (old "ai" branding). Wordmark = logo-black.svg.
      LOGO_URL: ${LOGO_URL:-https://getklai.com/logo-black.svg}
      LOGO_WIDTH: ${LOGO_WIDTH:-120}
      BRAND_URL: ${BRAND_URL:-https://www.getklai.com}
      THEME_DIR: ${THEME_DIR:-theme}
      # Cross-service shared secret — single source of truth in /opt/klai/.env.
      # Portal-api sends `X-Internal-Secret: ${PORTAL_API_INTERNAL_SECRET}` when
      # calling /internal/send; mailer compares via hmac.compare_digest
      # (SPEC-SEC-MAILER-INJECTION-001 REQ-8).
      INTERNAL_SECRET: ${PORTAL_API_INTERNAL_SECRET}
      # Portal API — locale lookup for email links
      PORTAL_API_URL: ${MAILER_PORTAL_API_URL:-http://portal-api:8010}
      PORTAL_INTERNAL_SECRET: ${PORTAL_API_INTERNAL_SECRET}
      # Redis nonce store + per-recipient rate limiter
      # (SPEC-SEC-MAILER-INJECTION-001 REQ-4 + REQ-6). Mailer fails closed
      # with HTTP 503 when redis is unreachable, so it MUST share net-redis
      # with the redis service — same pattern as portal-api and litellm.
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Deployment environment — drives /debug route gate (SPEC-SEC-MAILER-INJECTION-001 REQ-5).
      # Code default is "development"; prod MUST be "production" to suppress the debug route.
      # Reverse-check divergence: service .env had PORTAL_ENV=production.
      PORTAL_ENV: ${PORTAL_ENV:-production}
      DEBUG: ${MAILER_DEBUG:-false}
    networks:
      - klai-net
      - net-redis

  # ─── listmonk (self-hosted mailing platform) ─────────────────────────────
  # UI: https://mailing.${DOMAIN}
  # Purpose: compose campaigns, manage templates/lists/subscribers, and receive
  # selected Twenty CRM People via workflow HTTP requests.
  listmonk:
    image: listmonk/listmonk:v6.2.0
    restart: unless-stopped
    hostname: mailing.${DOMAIN}
    depends_on:
      listmonk-db:
        condition: service_healthy
    command:
      - sh
      - -c
      - >
        ./listmonk --install --idempotent --yes --config '' &&
        ./listmonk --upgrade --yes --config '' &&
        ./listmonk --config ''
    environment:
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_db__host: listmonk-db
      LISTMONK_db__port: "5432"
      LISTMONK_db__user: listmonk
      LISTMONK_db__password: ${LISTMONK_DB_PASSWORD}
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
      LISTMONK_db__max_open: "25"
      LISTMONK_db__max_idle: "25"
      LISTMONK_db__max_lifetime: 300s
      LISTMONK_ADMIN_USER: ${LISTMONK_ADMIN_USER:-}
      LISTMONK_ADMIN_PASSWORD: ${LISTMONK_ADMIN_PASSWORD:-}
      TZ: Europe/Amsterdam
    volumes:
      - listmonk-uploads-data:/listmonk/uploads
    networks:
      - klai-net
      - net-listmonk
    deploy:
      resources:
        limits:
          memory: 512m

  # ─── Vaultwarden (team password manager — Klai shared admin credentials) ──
  # Bitwarden-API-compatible server. Bootstrap pattern: SIGNUPS_ALLOWED=true
  # with @getklai.com domain-whitelist for the first 3 admins (hello@,
  # jantine@, mark@, steven@), then flip SIGNUPS_ALLOWED=false via this
  # compose file once the team is in. Admin token in SOPS (env-first per
  # validator-env-parity).
  vaultwarden:
    image: vaultwarden/server:1.37.1
    restart: unless-stopped
    environment:
      DOMAIN: "https://vault.getklai.com"
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
      SIGNUPS_ALLOWED: "true"
      SIGNUPS_VERIFY: "true"
      SIGNUPS_DOMAINS_WHITELIST: "getklai.com"
      INVITATIONS_ALLOWED: "true"
      WEB_VAULT_ENABLED: "true"
      DATA_FOLDER: "/data"
      ROCKET_PORT: "80"
      LOG_LEVEL: "info"
      EXTENDED_LOGGING: "true"
      # SMTP — reuses klai-mailer's Cloud86 creds from /opt/klai/.env
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: "starttls"
      SMTP_FROM: ${SMTP_FROM:-hello@getklai.com}
      SMTP_FROM_NAME: "Klai Vault"
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    volumes:
      - vaultwarden-data:/data
    networks:
      - klai-net

  # ─── Portal API (FastAPI tenant provisioning) ─────────────────────────────
  portal-api:
    image: ghcr.io/getklai/portal-api:latest
    restart: unless-stopped
    # SPEC-SEC-ENVFILE-SCOPE-001 — portal-api's process env is scoped
    # to what app/core/config.py reads. Previously `env_file: .env`
    # injected all ~120 host secrets (VictoriaLogs auth, Hetzner API
    # token, Vexa DB secrets, GlitchTip, Gitea admin, KUMA_TOKEN_*,
    # Garage S3 creds, crawl4ai internal key, etc.) — portal is the
    # orchestrator so its scope is legitimately wide, but the leaked
    # set was ~3× what the code reads.
    #
    # New vars below (vs pre-SPEC compose) were previously silently
    # inherited via env_file. The validators in config.py assert
    # VEXA_WEBHOOK_SECRET and MONEYBIRD_WEBHOOK_TOKEN at startup — a
    # missing MONEYBIRD_WEBHOOK_TOKEN here would crash boot.
    volumes:
      - caddy-tenants:/caddy/tenants
      - ./librechat:/librechat
    environment:
      # ─── Platform / domain ──────────────────────────────────────
      DOMAIN: ${DOMAIN}
      FRONTEND_URL: ${FRONTEND_URL:-}
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      # SPEC-SEC-HYGIENE-001 REQ-28.4: explicit deployment-environment marker.
      # Pydantic Settings reads PORTAL_ENV; the in-code default is "production"
      # (REQ-28.2). The validator at config.py:_no_debug_in_production refuses
      # to boot if DEBUG=true is set together with PORTAL_ENV=production.
      PORTAL_ENV: ${PORTAL_ENV:-production}
      # SPEC-SEC-CORS-001 REQ-1 — explicit credentialed CORS allowlist for
      # portal-api. Today (pre-SPEC) the in-code default is "http://localhost:5174"
      # and the prod compose did not pass CORS_ORIGINS at all, so the wildcard
      # regex r".*" was the only thing keeping prod browsers from my.getklai.com
      # working. Once REQ-1 lands and removes the wildcard, prod browsers from
      # my.getklai.com would receive no Access-Control-Allow-Origin header
      # without this var. Same-deploy regression class as
      # SPEC-SEC-WEBHOOK-001 / SPEC-SEC-ENVFILE-SCOPE-001.
      # ${DOMAIN} resolves to "getklai.com" in prod; widget.${DOMAIN} matches
      # the existing api-gateway widget host. The dynamic single-label
      # tenant-subdomain pattern (acme.getklai.com) is matched by the
      # compiled regex inside config.py, NOT by this list.
      CORS_ORIGINS: ${CORS_ORIGINS:-https://my.${DOMAIN}}
      # ─── Database (portal schema) ───────────────────────────────
      DATABASE_URL: postgresql+asyncpg://portal_api:${PORTAL_API_DB_PASSWORD}@postgres:5432/klai
      # ─── Auth — Zitadel ─────────────────────────────────────────
      # SPEC-REPO-SANITIZE-001 (ce31a119) cleared hardcoded fallbacks for
      # the three Zitadel identifiers below — they are public-but-leak-
      # identifying values, sourced from SOPS only. Pydantic validators
      # in app/core/config.py refuse to boot if any of them is empty
      # (SPEC-REPO-SANITIZE-001 followup), so a missing SOPS entry fails
      # loud at startup instead of silently breaking signup at first use.
      ZITADEL_PAT: ${PORTAL_API_ZITADEL_PAT}
      ZITADEL_PROJECT_ID: ${ZITADEL_PROJECT_ID}
      ZITADEL_PORTAL_ORG_ID: ${ZITADEL_PORTAL_ORG_ID}
      ZITADEL_PORTAL_CLIENT_ID: ${ZITADEL_PORTAL_CLIENT_ID}
      ZITADEL_PORTAL_CLIENT_SECRET: ${PORTAL_API_ZITADEL_PORTAL_CLIENT_SECRET:-}
      ZITADEL_IDP_GOOGLE_ID: ${ZITADEL_IDP_GOOGLE_ID}
      ZITADEL_IDP_MICROSOFT_ID: ${ZITADEL_IDP_MICROSOFT_ID}
      # ─── Auth — session / BFF (SPEC-AUTH-008) ───────────────────
      SSO_COOKIE_KEY: ${PORTAL_API_SSO_COOKIE_KEY}
      # SPEC-SEC-VALIDATOR-COVERAGE-001 REQ-10: BFF_SESSION_KEY is a
      # required env var, validated fail-closed at portal-api startup.
      # Empty default here means an absent SOPS entry crashes the boot
      # — that is the contract; no silent fallback to SSO_COOKIE_KEY.
      BFF_SESSION_KEY: ${PORTAL_API_BFF_SESSION_KEY:-}
      # ─── Internal service-to-service secrets ────────────────────
      INTERNAL_SECRET: ${PORTAL_API_INTERNAL_SECRET}
      KLAI_CONNECTOR_SECRET: ${PORTAL_API_KLAI_CONNECTOR_SECRET}
      DOCS_INTERNAL_SECRET: ${DOCS_INTERNAL_SECRET}
      KNOWLEDGE_INGEST_SECRET: ${KNOWLEDGE_INGEST_SECRET}
      RETRIEVAL_API_INTERNAL_SECRET: ${RETRIEVAL_API_INTERNAL_SECRET}
      # SPEC-RAG-EVIDENCE-INTEGRITY-001 REQ-CIT — citation-rescue config
      # for klai_citations on path B (widget/partner chat). Mirrors the
      # litellm block (path A); keep the two in sync.
      CITATION_RESCUE_MODE: ${CITATION_RESCUE_MODE:-shadow}
      RESCUE_ANSWER_SCORE_THRESHOLD: ${RESCUE_ANSWER_SCORE_THRESHOLD:-19}
      RESCUE_RETRIEVAL_RATIO: ${RESCUE_RETRIEVAL_RATIO:-0.4}
      # ─── Mailer (notifications, onboarding drip) ────────────────
      # Internal Docker-network URL for klai-mailer's /internal/send.
      # Auth is X-Internal-Secret: ${PORTAL_API_INTERNAL_SECRET}; mailer
      # validates via hmac.compare_digest.
      MAILER_URL: ${MAILER_URL:-http://klai-mailer:8000}
      # ─── listmonk mailing lists / transactional sends ───────────
      LISTMONK_URL: ${LISTMONK_URL:-http://listmonk:9000}
      LISTMONK_API_USER: ${LISTMONK_API_USER:-}
      LISTMONK_API_TOKEN: ${LISTMONK_API_TOKEN:-}
      LISTMONK_LIST_CRM_SELECTED_ID: ${LISTMONK_LIST_CRM_SELECTED_ID:-3}
      LISTMONK_LIST_SIGNUPS_ID: ${LISTMONK_LIST_SIGNUPS_ID:-0}
      LISTMONK_LIST_USERS_ID: ${LISTMONK_LIST_USERS_ID:-0}
      LISTMONK_LIST_UPDATES_OPT_IN_ID: ${LISTMONK_LIST_UPDATES_OPT_IN_ID:-0}
      LISTMONK_TX_ONBOARDING_TEMPLATE_ID: ${LISTMONK_TX_ONBOARDING_TEMPLATE_ID:-5}
      # ─── Application-level encryption (secrets at rest) ─────────
      PORTAL_SECRETS_KEY: ${PORTAL_API_PORTAL_SECRETS_KEY}
      ENCRYPTION_KEY: ${PORTAL_API_ENCRYPTION_KEY}
      WIDGET_JWT_SECRET: ${WIDGET_JWT_SECRET}
      # ─── Vexa (meeting bot) ─────────────────────────────────────
      VEXA_API_KEY: ${VEXA_BOT_MANAGER_API_KEY}
      VEXA_WEBHOOK_SECRET: ${VEXA_WEBHOOK_SECRET}
      # Vexa meeting-api base URL. Prod routes through the api-gateway
      # (:8000) — NOT the raw meeting-api (:8080). Overrides the
      # config.py default to match pre-SPEC-SEC-ENVFILE-SCOPE-001 behaviour.
      VEXA_MEETING_API_URL: ${VEXA_MEETING_API_URL:-http://api-gateway:8000}
      # Reserved for Vexa admin-API calls (tenant provisioning, quota).
      # @MX:NOTE in config.py — no runtime reader yet; kept declared so
      # a future admin-api caller picks up the real token, matching the
      # pre-migration env-shape.
      # ─── Garage S3 — KB-image auth-proxy (SPEC-TI-009 + SPEC-PORTAL-DOCS-IMAGE-PASTE-001) ─
      # portal-api is the auth-proxy for /kb-images/{org_id}/{kb_slug}/{filename}
      # (read: SPEC-TI-009 GET; write: SPEC-PORTAL-DOCS-IMAGE-PASTE-001 POST).
      # Without these vars the route 503s with "Image storage not configured".
      # Missing from compose pre-fix because SPEC-SEC-ENVFILE-SCOPE-001 didn't
      # include them when portal-api's environment block was made explicit —
      # the read-route was never browser-fetched until 2026-05-12, so nobody
      # noticed. Same env shape as klai-connector + klai-knowledge-ingest.
      GARAGE_S3_ENDPOINT: garage:3900
      GARAGE_S3_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_S3_SECRET_KEY: ${GARAGE_SECRET_KEY}
      GARAGE_KB_BUCKET: ${GARAGE_BUCKET:-klai-images}
      # ─── Billing — Moneybird ────────────────────────────────────
      # Validator in config.py requires MONEYBIRD_WEBHOOK_TOKEN at boot.
      MONEYBIRD_WEBHOOK_TOKEN: ${MONEYBIRD_WEBHOOK_TOKEN}
      # ─── MCP OAuth surface (SPEC-MCP-AUTH-001) ──────────────────
      # Validators in config.py require both URLs at boot (REQ-7 + REQ-14).
      MCP_OAUTH_ISSUER_BASE_URL: ${MCP_OAUTH_ISSUER_BASE_URL}
      MCP_OAUTH_RESOURCE_URL: ${MCP_OAUTH_RESOURCE_URL}
      # ─── Meeting ingress — IMAP calendar-invite listener ────────
      IMAP_HOST: mail.getklai.com
      IMAP_PORT: "993"
      IMAP_USERNAME: meet@getklai.com
      IMAP_POLL_INTERVAL_SECONDS: "60"
      IMAP_PASSWORD: ${PORTAL_API_IMAP_PASSWORD}
      # ─── LibreChat tenant provisioning ──────────────────────────
      LIBRECHAT_MONGO_ROOT_URI: ${LIBRECHAT_MONGO_ROOT_URI}
      MONGODB_CONTAINER_NAME: ${MONGODB_CONTAINER_NAME}
      MONGO_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_GENERAL_CHAT_KEY: ${LITELLM_GENERAL_CHAT_KEY}
      LITELLM_ANALYTICS_DATABASE_URL: ${LITELLM_ANALYTICS_DATABASE_URL:-}
      # ─── Redis (BFF session store + rate limiter + provisioning) ─
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # ─── Qdrant (knowledge vector store) ────────────────────────
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      # ─── Knowledge services ─────────────────────────────────────
      KNOWLEDGE_RETRIEVE_URL: ${KNOWLEDGE_RETRIEVE_URL}
      FIRECRAWL_INTERNAL_KEY: ${FIRECRAWL_INTERNAL_KEY}
      # ─── OAuth — Drive / M365 (optional providers) ──────────────
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
      GOOGLE_DRIVE_PICKER_API_KEY: ${GOOGLE_DRIVE_PICKER_API_KEY:-}
      GOOGLE_DRIVE_PICKER_APP_ID: ${GOOGLE_DRIVE_PICKER_APP_ID:-}
      MS_DOCS_CLIENT_ID: ${MS_DOCS_CLIENT_ID:-}
      MS_DOCS_CLIENT_SECRET: ${MS_DOCS_CLIENT_SECRET:-}
      MS_DOCS_TENANT_ID: ${MS_DOCS_TENANT_ID:-common}
      # ─── HubSpot — internal widget human handoff pilot ──────────
      HUBSPOT_WEBCHAT_CLIENT_ID: ${PORTAL_API_HUBSPOT_WEBCHAT_CLIENT_ID:-}
      HUBSPOT_WEBCHAT_CLIENT_SECRET: ${PORTAL_API_HUBSPOT_WEBCHAT_CLIENT_SECRET:-}
      HUBSPOT_WEBCHAT_REFRESH_TOKEN: ${PORTAL_API_HUBSPOT_WEBCHAT_REFRESH_TOKEN:-}
      # ─── GitHub (org offboarding) ───────────────────────────────
      GITHUB_ADMIN_PAT: ${GITHUB_ADMIN_PAT}
      GITHUB_ORG: GetKlai
    networks:
      - klai-net
      - net-postgres
      - net-mongodb
      - net-redis
      - vexa12-portal   # SPEC-VEXA-004: reaches vexa12-meeting-api; nothing else may
      - net-meilisearch  # SPEC-INFRA-TENANT-DELETE-003 Bug A — deprovisioning step 6 (_delete_meilisearch_index) needs DNS for meilisearch:7700
      - socket-proxy

  # ─── GlitchTip (frontend error tracking) ────────────────────────────────
  glitchtip-web:
    image: glitchtip/glitchtip:6.2.6
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://glitchtip:${GLITCHTIP_DB_PASSWORD}@postgres:5432/glitchtip
      # GLITCHTIP_REDIS_URL: Redis password URL-encoded (special chars in password break redis:// parsing)
      REDIS_URL: ${GLITCHTIP_REDIS_URL}
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      PORT: "8000"
      GLITCHTIP_DOMAIN: https://errors.${DOMAIN}
      DEFAULT_FROM_EMAIL: errors@${DOMAIN}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL}
      ENABLE_USER_REGISTRATION: "False"
      CELERY_WORKER_AUTOSCALE: "1,3"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"
    volumes:
      - glitchtip-data:/code/uploads
    networks:
      - klai-net
      - net-postgres
      - net-redis
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys,urllib.error\ntry:\n urllib.request.urlopen('http://127.0.0.1:8000/api/0/projects/')\nexcept urllib.error.HTTPError:\n pass\nexcept Exception:\n sys.exit(1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  glitchtip-worker:
    image: glitchtip/glitchtip:6.2.6
    restart: unless-stopped
    command: ./bin/run-celery-with-beat.sh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://glitchtip:${GLITCHTIP_DB_PASSWORD}@postgres:5432/glitchtip
      REDIS_URL: ${GLITCHTIP_REDIS_URL}
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      GLITCHTIP_DOMAIN: https://errors.${DOMAIN}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL}
      ENABLE_USER_REGISTRATION: "False"
      CELERY_WORKER_AUTOSCALE: "1,3"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"
    volumes:
      - glitchtip-data:/code/uploads
    networks:
      - net-postgres
      - net-redis

  glitchtip-migrate:
    image: glitchtip/glitchtip:6.2.6
    command: "./manage.py migrate"
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://glitchtip:${GLITCHTIP_DB_PASSWORD}@postgres:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
    networks:
      - net-postgres

  # ─── Monitoring stack ─────────────────────────────────────────────────────
  # Note: runs on core-01 until monitor-01 is provisioned.
  # To migrate: update Alloy endpoint URLs to point to monitor-01.

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.149.0
    restart: unless-stopped
    volumes:
      - victoriametrics-data:/storage
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=30d
      - -httpListenAddr=:8428
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8428/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  victorialogs:
    image: victoriametrics/victoria-logs:v1.51.0
    restart: unless-stopped
    volumes:
      - victorialogs-data:/vlogs-data
    command:
      - -storageDataPath=/vlogs-data
      - -retentionPeriod=30d
      - -httpListenAddr=:9428
      - -httpAuth.username=${VICTORIALOGS_AUTH_USER}
      - -httpAuth.password=${VICTORIALOGS_AUTH_PASSWORD}
    # SPEC-SEC-ENVFILE-SCOPE-001 — VictoriaLogs reads its config from
    # command-line flags above; the container only needs
    # VICTORIALOGS_AUTH_{USER,PASSWORD} in its process env for the
    # authenticated healthcheck below (busybox wget builds the auth
    # header from $$VICTORIALOGS_AUTH_*). Previously `env_file: .env`
    # injected all host secrets — a log-store is a juicy pivot
    # primitive because it sits on the monitoring network.
    environment:
      VICTORIALOGS_AUTH_USER: ${VICTORIALOGS_AUTH_USER}
      VICTORIALOGS_AUTH_PASSWORD: ${VICTORIALOGS_AUTH_PASSWORD}
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    healthcheck:
      # Authenticated probe — VictoriaLogs requires basic auth on every path.
      # BusyBox wget (in this image) does NOT support --user/--password, so
      # credentials go inline in the URL. The double-$ keeps Compose from
      # interpolating the variables — they're resolved by the shell inside
      # the container against its own env at runtime.
      test:
        - CMD-SHELL
        - wget -q --spider "http://$$VICTORIALOGS_AUTH_USER:$$VICTORIALOGS_AUTH_PASSWORD@127.0.0.1:9428/health"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    restart: unless-stopped
    privileged: false
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/kmsg
    security_opt:
      - no-new-privileges:true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - -port=8080
      - -docker_only=true
      - -housekeeping_interval=60s
      - -max_housekeeping_interval=2m
      - -storage_duration=2m
      - -disable_metrics=advtcp,cpu_topology,cpuset,disk,diskIO,hugetlb,memory_numa,process,referenced_memory,resctrl,sched,tcp,udp
    networks:
      - monitoring

  alloy:
    image: grafana/alloy:v1.18.1
    restart: unless-stopped
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Host-side synthetic probes write JSON logs here for Alloy file scraping.
      - /opt/klai/logs:/opt/klai/logs:ro
      # SPEC-INFRA-005 Phase 6: textfile collector reads .prom files written
      # by /opt/klai/scripts/persistence-probe.sh (systemd timer).
      - /var/lib/node_exporter/textfile_collector:/var/lib/node_exporter/textfile_collector:ro
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - /etc/alloy/config.alloy
    user: root   # required for Docker socket + node exporter (prometheus.exporter.unix)
    environment:
      VICTORIALOGS_AUTH_USER: ${VICTORIALOGS_AUTH_USER}
      VICTORIALOGS_AUTH_PASSWORD: ${VICTORIALOGS_AUTH_PASSWORD}
    security_opt:
      - no-new-privileges:true
    depends_on:
      - victoriametrics
      - victorialogs
    networks:
      - klai-net
      - monitoring

  grafana:
    image: grafana/grafana:13.1.3
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: victoriametrics-logs-datasource
      GRAFANA_POSTGRES_PASSWORD: ${GRAFANA_POSTGRES_PASSWORD}
      # Zitadel OIDC — only users with the grafana_admin project role can log in
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Klai
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "365481665952219144"
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid email profile urn:zitadel:iam:org:projects:roles"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://auth.getklai.com/oauth/v2/authorize
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://auth.getklai.com/oauth/v2/token
      GF_AUTH_GENERIC_OAUTH_API_URL: https://auth.getklai.com/oidc/v1/userinfo
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "\"urn:zitadel:iam:org:project:roles\".grafana_admin && 'Admin' || ''"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "false"
      # VictoriaLogs basic-auth credentials — referenced by
      # grafana/provisioning/datasources/datasources.yaml via $VAR expansion.
      # Without this forward the datasource returns 401 on every query,
      # which breaks all log dashboards and the SPEC-SEC-024 alert rule.
      VICTORIALOGS_AUTH_USER: ${VICTORIALOGS_AUTH_USER}
      VICTORIALOGS_AUTH_PASSWORD: ${VICTORIALOGS_AUTH_PASSWORD}
      # SMTP — reuses the same Cloud86 outbound mailbox as klai-mailer (see
      # klai-infra/core-01/klai-mailer/.env.sops). GRAFANA_SMTP_PASSWORD was
      # added to core-01/.env.sops for this purpose; host/port/user/from are
      # non-secret and stay inline. Needed for SPEC-SEC-024-R13 (AC-9).
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: shared199.cloud86-host.io:587
      GF_SMTP_USER: hello@getklai.com
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: hello@getklai.com
      GF_SMTP_FROM_NAME: Klai
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
      # SPEC-OBS-001 — recipients + heartbeat endpoint referenced by
      # grafana/provisioning/alerting/contact-points.yaml via $VAR expansion.
      # ALERTS_EMAIL_RECIPIENTS: comma-separated list for klai-ops-alerts-email.
      # KUMA_HEARTBEAT_URL: full Uptime Kuma push URL incl. token for the
      # dead-man's-switch heartbeat (fires every 5 min from the synthetic rule).
      ALERTS_EMAIL_RECIPIENTS: ${ALERTS_EMAIL_RECIPIENTS}
      KUMA_HEARTBEAT_URL: ${KUMA_HEARTBEAT_URL}
    depends_on:
      - victoriametrics
      - victorialogs
    networks:
      - klai-net
      - monitoring
      # SPEC-PRIVACY-QUERY-SHADOW-001 follow-up (2026-05-08): grafana
      # needs net-postgres so the PortalPostgres datasource can resolve
      # `postgres:5432`. Without this, EVERY postgres-backed alert rule
      # and dashboard panel fails with "could not translate host name
      # 'postgres' to address: Temporary failure in name resolution".
      # Pre-existing bug — surfaced by the new privacy_tenant_stuck_in_full
      # alert + a non-SPEC UI-created alert (UID bfjbxm0h95q0wf) that
      # had been silently failing in the same way.
      - net-postgres
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ─── Research: document Q&A service ─────────────────────────────────────

  docling-serve:
    image: ghcr.io/docling-project/docling-serve:v1.30.0
    restart: unless-stopped
    environment:
      # Portal-api may need to retry /v1/result after a transient
      # knowledge-ingest failure or restart. Docling Serve's defaults are
      # single-use results, which are too fragile for our async poller.
      DOCLING_SERVE_SINGLE_USE_RESULTS: "false"
      DOCLING_SERVE_RESULT_REMOVAL_DELAY: "86400"
    networks:
      - klai-net
    # NOT exposed via Caddy — internal Docker network only

  searxng:
    image: searxng/searxng:2026.8.12-cdfdaa5a8
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: "${SEARXNG_SECRET}"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - klai-net
    # NOT exposed via Caddy — internal Docker network only

  retrieval-api:
    image: ghcr.io/getklai/retrieval-api:latest
    restart: unless-stopped
    # SPEC-SEC-ENVFILE-SCOPE-001 — retrieval-api's process env is scoped
    # to what retrieval_api/config.py reads. Previously `env_file: .env`
    # injected all ~120 host secrets including portal INTERNAL_SECRET,
    # ENCRYPTION_KEY, Moneybird/Vexa webhook tokens — an RCE primitive
    # in a query-crafting path would have forwarded Moneybird webhooks
    # and tampered tenants. The explicit block below is unchanged;
    # the only change is removing the env_file directive since every
    # var retrieval reads was already declared here.
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      TEI_URL: http://172.18.0.1:7997
      # Empty by default so OpenAI-compatible TEI uses its loaded snapshot
      # without warning about BAAI/bge-m3 vs snapshot-path model IDs.
      TEI_MODEL: ${TEI_MODEL:-}
      TEI_RERANKER_URL: http://172.18.0.1:7998
      LITELLM_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY}
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      GRAPHITI_ENABLED: "true"
      GRAPH_SEARCH_TIMEOUT: "60.0"
      # Graphiti LLM model for knowledge-graph extraction. klai-fast
      # points at Mistral Small 4 (same model the dropped klai-pipeline
      # alias used to point at). Override via env if a different tier
      # is required for graph extraction.
      GRAPHITI_LLM_MODEL: ${GRAPHITI_LLM_MODEL:-klai-fast}
      RERANKER_ENABLED: "true"
      RERANKER_TIMEOUT: "60.0"
      OPENAI_API_KEY: "dummy"
      SPARSE_SIDECAR_URL: http://172.18.0.1:8001
      PORTAL_EVENTS_HOST: postgres
      PORTAL_EVENTS_PASSWORD: ${POSTGRES_PASSWORD}
      # SEC-010 — authentication + rate limiting (SPEC-SEC-010)
      INTERNAL_SECRET: ${RETRIEVAL_API_INTERNAL_SECRET}
      ZITADEL_ISSUER: https://auth.${DOMAIN}
      ZITADEL_API_AUDIENCE: ${RETRIEVAL_API_ZITADEL_AUDIENCE:-}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RATE_LIMIT_RPM: ${RETRIEVAL_API_RATE_LIMIT_RPM:-600}
      # SPEC-SEC-IDENTITY-ASSERT-001 REQ-4: internal-secret callers'
      # body-identity claims are re-verified against portal-api before any
      # retrieval runs. Same pattern as klai-knowledge-mcp (Phase B).
      PORTAL_API_URL: http://portal-api:8010
      PORTAL_INTERNAL_SECRET: ${PORTAL_API_INTERNAL_SECRET}
      # SPEC-RAG-EVIDENCE-INTEGRITY-001 REQ-RANK — ranking contract ACTIVE
      # since 2026-07-08: serving order follows the post-rerank
      # final_rank_score truth. Activated early (day-1 shadow diffs showed
      # strictly more sensible source picks in every logged case; e.g.
      # request 4a5608fc: old S1 0.44 → new S1 0.87). Rollback = set this
      # back to shadow and recreate retrieval-api. Validated at boot
      # (shadow|active only).
      RANKING_CONTRACT_MODE: ${RANKING_CONTRACT_MODE:-active}
    networks:
      - klai-net
      - net-postgres
      - net-redis
    depends_on:
      - qdrant
      - falkordb
      - redis

  # ─── Klai Docs ────────────────────────────────────────────────────────────

  gitea:
    image: gitea/gitea:1.27.1
    restart: unless-stopped
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD}
      GITEA__server__DOMAIN: gitea.${DOMAIN}
      GITEA__server__ROOT_URL: http://gitea:3000/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__DISABLE_SSH: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__SECRET_KEY: ${GITEA_SECRET_KEY}
      GITEA__security__INTERNAL_TOKEN: ${GITEA_INTERNAL_TOKEN}
      GITEA__log__LEVEL: Warn
    volumes:
      - gitea-data:/data
    networks:
      - klai-net
      - net-postgres
    depends_on:
      postgres:
        condition: service_healthy
    # NOT exposed via Caddy — internal Docker network only
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  docs-app:
    image: ghcr.io/getklai/klai-docs:latest
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DATABASE: klai
      POSTGRES_USER: klai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GITEA_URL: http://gitea:3000
      GITEA_ADMIN_TOKEN: ${GITEA_ADMIN_TOKEN}
      AUTH_SECRET: ${DOCS_AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      AUTH_ZITADEL_ISSUER: https://auth.${DOMAIN}
      AUTH_ZITADEL_CLIENT_ID: ${DOCS_ZITADEL_CLIENT_ID}
      AUTH_ZITADEL_CLIENT_SECRET: ${DOCS_ZITADEL_CLIENT_SECRET}
      NEXT_PUBLIC_BASE_DOMAIN: ${DOMAIN}
      CADDY_TENANTS_DIR: /caddy/tenants
      DOCS_INTERNAL_SECRET: ${DOCS_INTERNAL_SECRET}
      KNOWLEDGE_INGEST_URL: http://knowledge-ingest:8000
      KNOWLEDGE_INGEST_SECRET: ${KNOWLEDGE_INGEST_SECRET}
    volumes:
      - caddy-tenants:/caddy/tenants
    networks:
      - klai-net
      - net-postgres
    depends_on:
      - gitea
      - postgres

  # ─── Klai Knowledge MCP ───────────────────────────────────────────────────
  klai-knowledge-mcp:
    image: ghcr.io/getklai/klai-knowledge-mcp:latest
    restart: unless-stopped
    environment:
      KLAI_DOCS_API_BASE: http://docs-app:3010/docs
      DOCS_INTERNAL_SECRET: ${DOCS_INTERNAL_SECRET}
      KNOWLEDGE_INGEST_URL: http://knowledge-ingest:8000
      KNOWLEDGE_INGEST_SECRET: ${KNOWLEDGE_INGEST_SECRET}
      PERSONAL_KB_NAME: personal
      # SPEC-SEC-IDENTITY-ASSERT-001 REQ-2: caller-asserted X-User-ID /
      # X-Org-ID / X-Org-Slug headers are no longer trusted. The MCP calls
      # portal-api /internal/identity/verify and only forwards the verified
      # identity to upstream services (knowledge-ingest, klai-docs).
      PORTAL_API_URL: http://portal-api:8010
      PORTAL_INTERNAL_SECRET: ${PORTAL_API_INTERNAL_SECRET}
      # SPEC-MCP-RETRIEVAL-001: retrieval-api endpoint + secret for the
      # search_knowledge tool. retrieval-api validates against its own
      # INTERNAL_SECRET (sourced from RETRIEVAL_API_INTERNAL_SECRET in SOPS) —
      # different from KNOWLEDGE_INGEST_SECRET and PORTAL_INTERNAL_SECRET.
      # Without this, every search_knowledge call HTTP 401s upstream.
      KNOWLEDGE_RETRIEVE_URL: http://retrieval-api:8040/retrieve
      RETRIEVAL_INTERNAL_SECRET: ${RETRIEVAL_API_INTERNAL_SECRET}
    networks:
      - klai-net
    depends_on:
      - docs-app
    # NOT exposed via Caddy — internal Docker network only

  # ─── Scribe: transcription service ───────────────────────────────────────
  scribe-api:
    image: ghcr.io/getklai/scribe-api:latest
    restart: unless-stopped
    # SPEC-SEC-ENVFILE-SCOPE-001 — scribe's process env is scoped to what
    # scribe reads. Previously `env_file: .env` injected all ~120 host
    # secrets (portal INTERNAL_SECRET, ENCRYPTION_KEY, ZITADEL_PAT,
    # Moneybird token, Vexa secrets, VictoriaLogs auth, etc.) — any RCE
    # in scribe's media pipeline would exfiltrate the full shared set.
    # Reads: app/core/config.py (pydantic-settings).
    environment:
      # Database
      POSTGRES_DSN: postgresql+asyncpg://klai:${POSTGRES_PASSWORD}@postgres:5432/klai
      # Auth
      ZITADEL_ISSUER: https://auth.${DOMAIN}
      # Whisper STT
      WHISPER_SERVER_URL: http://172.18.0.1:8000
      # LiteLLM gateway (AI summarization)
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # Knowledge-ingest (KB push of transcripts)
      KNOWLEDGE_INGEST_URL: http://knowledge-ingest:8000
      KNOWLEDGE_INGEST_SECRET: ${KNOWLEDGE_INGEST_SECRET}
      # SPEC-SEC-AUDIT-2026-04 B1: portal identity-verify coordinates.
      # scribe replaces JWT resourceowner trust with portal lookup so a
      # multi-org user's token can never route their transcript into the
      # wrong tenant KB. PORTAL_API_INTERNAL_SECRET already in SOPS;
      # wired here so the startup validator does not trigger a 502 on deploy.
      PORTAL_API_URL: http://portal-api:8010
      PORTAL_INTERNAL_SECRET: ${PORTAL_API_INTERNAL_SECRET}
    volumes:
      - scribe-audio-data:/data/audio
    networks:
      - klai-net
      - net-postgres
    depends_on:
      - postgres

  # ─── socat bridge: exposes docker-socket-proxy's TCP as a Unix socket ─────
  # SPEC-SEC-021 — Vexa runtime-api uses requests_unixsocket and cannot speak
  # TCP directly. This sidecar bridges the gap: it listens on a Unix socket
  # (shared via named volume with runtime-api) and forwards every byte to
  # docker-socket-proxy:2375, which enforces the CONTAINERS/NETWORKS/POST/DELETE
  # whitelist. Runtime-api never sees the real host docker socket.
  runtime-api-socket-proxy:
    image: alpine/socat:1.8.1.3
    restart: unless-stopped
    command: >
      UNIX-LISTEN:/var/run/docker.sock,fork,reuseaddr,unlink-early,mode=0660,user=999,group=999
      TCP:docker-socket-proxy:2375
    volumes:
      - runtime-api-docker-socket:/var/run   # shared with vexa12-runtime
    depends_on:
      docker-socket-proxy:
        condition: service_started
    networks:
      - socket-proxy
    deploy:
      resources:
        limits:
          memory: 32M
    security_opt:
      - no-new-privileges:true

  # ══════════════════════════════════════════════════════════════════════════
  # Vexa 0.12.22 — meeting capture (SPEC-VEXA-004)
  #
  # Migrated from 0.10.6.3.14 on 2026-08-14. The old stack ran in parallel until a
  # real meeting was proven end to end (bot joined, Dutch transcript with speaker
  # attribution, meeting.completed delivered to portal-api, portal status `done`),
  # then removed. History: git log deploy/docker-compose.yml.
  #
  # Deliberately NOT deployed from upstream's compose: gateway, agent-api,
  # agent-worker, mcp, terminal, dashboard, minio, and its own postgres.
  # Klai uses the meeting-capture brick and nothing else.
  #   - gateway   → portal-api calls meeting-api:8080 directly on klai-net.
  #                 Consequence: meeting-api has NO auth of its own in 0.12 (it
  #                 trusts the gateway's X-User-Id header and defaults to
  #                 AllowAllServiceAuthority), so klai-net isolation is the only
  #                 boundary. Accepted deliberately; revisit if meeting-api ever
  #                 gains a non-portal-api caller.
  #   - minio     → Garage already speaks S3.
  #
  # admin-api IS deployed, despite Klai using none of its endpoints: it owns
  # ensure_schema() and its Base declares meetings/transcriptions/meeting_sessions.
  # meeting-api ships no alembic and never calls create_all, so without admin-api
  # the database stays empty.
  #
  # DEPLOY PREREQUISITE: the bot image must be present on the host BEFORE the first
  # spawn. docker-socket-proxy has IMAGES disabled (SPEC-SEC-024), so vexa12-runtime
  # cannot pull it — POST /containers/create fails with "No such image". The bot
  # image is an env value, not a compose service, so `compose up` does not fetch it
  # either. Run on core-01:
  #     docker pull vexaai/vexa-bot:v0.12.22
  # Enforced by scripts/check-vexa12-deploy-preconditions.sh.
  # ══════════════════════════════════════════════════════════════════════════

  # ─── Vexa 0.12 Redis (bot state, pub/sub, streams) ──────────────────────
  # Dedicated instance. Redis pub/sub is not scoped by SELECT, and Vexa publishes
  # `bm:meeting:{id}:status` / `bot_commands:meeting:{id}` with ids from its own
  # database — so a second Vexa deployment sharing this instance would collide on
  # channel names even on a different DB index. Vexa offers no channel prefix.
  vexa12-redis:
    image: redis:8.10.0-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${VEXA_REDIS_PASSWORD}", "--appendfsync", "everysec"]
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - vexa12-bots   # bot containers resolve vexa12-redis via this network
    volumes:
      - vexa12-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $VEXA_REDIS_PASSWORD --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── Vexa 0.12 admin-api (schema owner) ─────────────────────────────────
  # Klai calls none of its endpoints. It runs because ensure_schema() lives here
  # and converges vexa_v012 to the SQLAlchemy metadata at boot (create_all in FK
  # order + additive column/index sync, never dropping). meeting-api depends on
  # it being healthy so the tables exist before the first query.
  vexa12-admin-api:
    image: vexaai/v012-admin-api:v0.12.22
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: vexa_v012
      DB_USER: vexa
      DB_PASSWORD: ${VEXA_DB_PASSWORD}
      # Distinct from the 0.10 stack's VEXA_ADMIN_TOKEN: separate deployment,
      # separate trust boundary. Never reuse a token across both stacks.
      ADMIN_API_TOKEN: ${VEXA12_ADMIN_TOKEN}
      INTERNAL_API_SECRET: ${VEXA12_INTERNAL_SECRET}
      LOG_LEVEL: info
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - net-postgres
      # NOT on vexa12-bots. Bot containers run Chromium inside arbitrary external
      # meetings — the least-trusted thing in the stack — and admin-api holds the
      # identity/token surface. This dedicated internal link is meeting-api's reach
      # to it, and nothing else.
      - vexa12-internal
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Vexa 0.12 runtime (Docker-socket bot orchestrator) ─────────────────
  # Same requests_unixsocket constraint as runtime-api 0.10 (upstream compose
  # mounts the raw docker.sock; we do not). Reuses the existing socat bridge —
  # its listener is `fork,reuseaddr`, so a second client is fine.
  vexa12-runtime:
    image: vexaai/v012-runtime:v0.12.22
    restart: unless-stopped
    environment:
      DOCKER_NETWORK: vexa12-bots
      BROWSER_IMAGE: vexaai/vexa-bot:v0.12.22
      # Agent/worker images are the 0.12 "second kind" — not deployed by Klai.
      AGENT_IMAGE: ""
      AGENT_WORKER_IMAGE: ""
      REDIS_URL: redis://:${VEXA_REDIS_PASSWORD}@vexa12-redis:6379/0
      INTERNAL_API_SECRET: ${VEXA12_INTERNAL_SECRET}
      LOG_LEVEL: info
    volumes:
      - runtime-api-docker-socket:/var/run   # socat-provided docker.sock (SPEC-SEC-021)
    init: true
    depends_on:
      vexa12-redis:
        condition: service_healthy
      runtime-api-socket-proxy:
        condition: service_started
    networks:
      - vexa12-bots
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8090/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── Vexa 0.12 meeting-api (bot lifecycle + transcript collector) ───────
  vexa12-meeting-api:
    image: vexaai/v012-meeting-api:v0.12.22
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: vexa_v012          # own database — the 0.10 `vexa` DB is untouched
      DB_USER: vexa
      DB_PASSWORD: ${VEXA_DB_PASSWORD}
      REDIS_URL: redis://:${VEXA_REDIS_PASSWORD}@vexa12-redis:6379/0
      RUNTIME_API_URL: http://vexa12-runtime:8090
      INTERNAL_API_SECRET: ${VEXA12_INTERNAL_SECRET}
      # MeetingToken is signed here and verified by admin-api — must equal the
      # ADMIN_API_TOKEN on vexa12-admin-api.
      ADMIN_TOKEN: ${VEXA12_ADMIN_TOKEN}
      ADMIN_API_URL: http://vexa12-admin-api:8001
      DEFAULT_BOT_NAME: Klai
      # GDPR (REQ-U-001, carried over from SPEC-VEXA-003): transcript only,
      # never audio at rest. portal-api also sends recording_enabled=false per
      # spawn; this is the deployment-level floor under that.
      RECORDING_ENABLED: "false"
      TRANSCRIBE_ENABLED: "true"
      BOT_AUTHENTICATED: "false"
      TRANSCRIPTION_SERVICE_URL: http://172.18.0.1:8000/v1/audio/transcriptions
      TRANSCRIPTION_SERVICE_TOKEN: ${WHISPER_SERVICE_TOKEN:-internal}
      # Storage backend: Garage speaks S3. Unused while RECORDING_ENABLED=false,
      # but the service still wants the config to boot (same as 0.10).
      MINIO_ENDPOINT: garage:3900
      MINIO_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      MINIO_SECRET_KEY: ${GARAGE_SECRET_KEY}
      MINIO_BUCKET: vexa-recordings
      MINIO_SECURE: "false"
      # ─── Operator system webhook ─────────────────────────────────────────
      # 0.12 splits webhooks in two: CUSTOMER webhooks (per-user, behind an SSRF
      # guard that hard-blocks 172.16/12 — portal-api is unreachable that way)
      # and this OPERATOR sink, which is frozen at boot from deployment config
      # and may opt into private HTTP for exactly this in-cluster case.
      #
      # It delivers only meeting.completed and bot.failed, HMAC-signed, with a
      # Redis retry queue. Klai's handler needs no change: the sink also sends
      # `Authorization: Bearer <secret>` (upstream keeps it for back-compat),
      # which is what _require_webhook_secret already validates, and the
      # envelope is the same shape VexaWebhookPayload parses today.
      #
      # NOTE: credentials-in-URL are REJECTED by the sink, so the 0.10
      # `http://vexa:<secret>@portal-api:...` form must not be reused here.
      #
      # Intermediate statuses (joining/active) do NOT arrive on this sink —
      # bot_poller.py already polls GET /bots/status every 10s and owns those
      # transitions, so the webhook is a latency optimisation, not a dependency.
      VEXA_SYSTEM_WEBHOOK_URL: http://portal-api:8010/api/bots/internal/webhook
      VEXA_SYSTEM_WEBHOOK_SECRET: ${VEXA_WEBHOOK_SECRET}
      VEXA_SYSTEM_WEBHOOK_ALLOW_PRIVATE_HTTP: "true"
      VEXA_SYSTEM_WEBHOOK_TIMEOUT_S: "10"
      LOG_LEVEL: info
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      vexa12-redis:
        condition: service_healthy
      vexa12-admin-api:
        condition: service_healthy   # schema owner — tables must exist first
      vexa12-runtime:
        condition: service_started
    networks:
      # NOT klai-net — see the vexa12-portal network comment. meeting-api's network
      # membership is its only authorization boundary.
      vexa12-portal: {}
      net-postgres: {}
      vexa12-internal: {} # reaches vexa12-admin-api without exposing it to bots
      vexa12-storage: {}  # reaches garage for the S3 config it boots with
      vexa12-bots:
        aliases:
          - meeting-api   # the name a spawned 0.12 bot dials for its callback
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─── Qdrant (vector store for Klai Knowledge) ────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    networks:
      - klai-net
    # NOT exposed via Caddy — internal Docker network only
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # ─── FalkorDB (knowledge graph for Graphiti) ─────────────────────────────
  # Persistence: FALKORDB_DATA_PATH=/var/lib/falkordb/data in the image (NOT /data).
  # Mount MUST bind to /var/lib/falkordb/data or RDB is ephemeral and wiped on recreate.
  # The previous /data mount was cosmetic and caused total graph loss on 2026-04-19
  # when the container was recreated during the falkordb:latest -> v4.18.1 pin (5d12587e).
  falkordb:
    image: falkordb/falkordb:v4.20.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - /opt/klai/falkordb-data:/var/lib/falkordb/data
    networks:
      - klai-net
    healthcheck:
      # Redis-protocol ping — proves the server responds, including the graph
      # module load. No auth (falkordb is klai-net-only).
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ─── Knowledge Ingest (RAG ingestion + retrieval for LiteLLM hook) ──────────
  knowledge-ingest:
    image: ghcr.io/getklai/knowledge-ingest:latest
    restart: unless-stopped
    # SPEC-PROCRASTINATE-ZOMBIE-001: graphiti enrichment tasks call LiteLLM
    # which can take 30-60s. Docker default 10s SIGTERM-to-SIGKILL window
    # would interrupt those mid-call and orphan the procrastinate job in
    # 'doing' state forever. 90s lets nearly all in-flight LLM calls
    # finish gracefully on deploy. Recovery for the residual cases lives
    # in knowledge_ingest.zombie_recovery (runs at next worker startup).
    stop_grace_period: 90s
    environment:
      POSTGRES_DSN: postgresql+asyncpg://klai:${POSTGRES_PASSWORD}@postgres:5432/klai
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      # crawl4ai >= 0.9.0 enforces bearer auth on /crawl (part of the
      # CVE-2026-57571/57572/57573 fixes). Same token the connector and the
      # crawl4ai server already share; on 0.8.9 the empty default worked only
      # because the server never checked.
      CRAWL4AI_API_KEY: ${CRAWL4AI_INTERNAL_KEY}
      TEI_URL: http://172.18.0.1:7997
      SPARSE_SIDECAR_URL: http://172.18.0.1:8001
      # BGE-M3 sparse sidecar on GPU (~100ms/batch). Generous timeout as safety margin.
      SPARSE_SIDECAR_TIMEOUT: "30"
      GITEA_URL: http://gitea:3000
      GITEA_TOKEN: ${GITEA_ADMIN_TOKEN}
      DOCS_INTERNAL_SECRET: ${DOCS_INTERNAL_SECRET}
      KNOWLEDGE_INGEST_SECRET: ${KNOWLEDGE_INGEST_SECRET}
      GITEA_WEBHOOK_SECRET: ${GITEA_WEBHOOK_SECRET}
      LITELLM_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY}
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      GRAPHITI_ENABLED: "true"
      # Mistral Small is 100 RPM / 100k TPM for our production key. Graphiti
      # performs several sequential LLM calls per episode, while enrichment and
      # user-facing traffic share the same klai-fast upstream budget.
      GRAPHITI_LLM_RPS: ${GRAPHITI_LLM_RPS:-0.5}
      GRAPHITI_EPISODE_DELAY: ${GRAPHITI_EPISODE_DELAY:-10.0}
      PORTAL_URL: http://portal-api:8010
      PORTAL_INTERNAL_TOKEN: ${PORTAL_API_INTERNAL_SECRET}
      # SPEC-RAG-EVAL-001 — RAGAS evaluation harness calls /retrieve on
      # klai-retrieval-api. Same secret as the litellm-hook uses for
      # /retrieve auth (see deploy/litellm/klai_knowledge.py).
      RETRIEVAL_API_INTERNAL_SECRET: ${RETRIEVAL_API_INTERNAL_SECRET}
      # SPEC-CRAWLER-004 Fase A — shared Garage S3 image pipeline.
      # Empty GARAGE_S3_ENDPOINT disables image extraction silently.
      GARAGE_S3_ENDPOINT: garage:3900
      GARAGE_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_SECRET_KEY: ${GARAGE_SECRET_KEY}
      GARAGE_BUCKET: ${GARAGE_BUCKET:-klai-images}
      GARAGE_REGION: garage
      # SPEC-CRAWLER-004 Fase C — KEK for decrypting connector cookies
      # via POST /ingest/v1/crawl/sync. Shares portal-api's KEK so every
      # service decrypts the same blobs. Empty disables the endpoint.
      ENCRYPTION_KEY: ${PORTAL_API_ENCRYPTION_KEY}
      # SPEC-INGEST-LOGIN-WALL-DETECT-001 — anonymous-crawl auth-wall
      # detection. Production target: enabled=true + mode=reject. Override
      # KLAI_INGEST_LOGIN_WALL_DETECT_MODE=audit_only in /opt/klai/.env
      # for the canary window, then remove the override to fall back to
      # "reject" once FP-rate is verified. The default values in
      # knowledge_ingest/config.py match the compose defaults below.
      KLAI_INGEST_LOGIN_WALL_DETECT_ENABLED: ${KLAI_INGEST_LOGIN_WALL_DETECT_ENABLED:-true}
      KLAI_INGEST_LOGIN_WALL_DETECT_MODE: ${KLAI_INGEST_LOGIN_WALL_DETECT_MODE:-reject}
    networks:
      - klai-net
      - net-postgres
    depends_on:
      - qdrant
      - postgres
      - falkordb
      - garage

  # ─── Garage S3 (image storage for knowledge pipeline) ────────────────────────
  # Garage serves images via two endpoints:
  #   - S3 API on :3900 (authenticated uploads from klai-connector)
  #   - Web endpoint on :3902 (anonymous reads via Caddy /kb-images/ route)
  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    volumes:
      - /opt/klai/garage-meta:/var/lib/garage/meta
      - /opt/klai/garage-data:/var/lib/garage/data
      - /opt/klai/garage/garage.toml:/etc/garage.toml:ro
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    networks:
      - klai-net
      - vexa12-storage   # dedicated link to vexa12-meeting-api; see that network's comment
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ─── Klai Connector (external source sync to knowledge layer) ───────────────
  klai-connector:
    image: ghcr.io/getklai/klai-connector:latest
    restart: unless-stopped
    # SPEC-SEC-AUDIT-2026-04 B3 / SPEC-SEC-ENVFILE-SCOPE-001 — migrated off
    # env_file: ./klai-connector/.env. Explicit environment block below scopes
    # the connector's process env to exactly what app/core/config.py reads.
    # Reverse-check (2026-04-29): PORTAL_API_URL diverged (code default 8100 vs
    # compose 8010); all other fields were already in the explicit block or have
    # safe code defaults. No divergences found for vars with in-code defaults.
    environment:
      DATABASE_URL: postgresql+asyncpg://klai:${POSTGRES_PASSWORD}@postgres:5432/klai
      ZITADEL_INTROSPECTION_URL: https://auth.${DOMAIN}/oauth/v2/introspect
      ZITADEL_CLIENT_ID: ${CONNECTOR_ZITADEL_CLIENT_ID}
      ZITADEL_CLIENT_SECRET: ${CONNECTOR_ZITADEL_CLIENT_SECRET}
      # SPEC-SEC-AUDIT-2026-04 B2: audience verification is MANDATORY.
      # KLAI_CONNECTOR_ZITADEL_AUDIENCE must be set in SOPS (verified present).
      # Empty value causes startup ValidationError (fail-closed).
      ZITADEL_API_AUDIENCE: ${KLAI_CONNECTOR_ZITADEL_AUDIENCE}
      # GitHub App credentials for connector adapter
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY}
      # Encryption key for connector credential storage (KEK)
      ENCRYPTION_KEY: ${CONNECTOR_ENCRYPTION_KEY}
      KNOWLEDGE_INGEST_URL: http://knowledge-ingest:8000
      KNOWLEDGE_INGEST_SECRET: ${KNOWLEDGE_INGEST_SECRET}
      CRAWL4AI_API_URL: http://crawl4ai:11235
      CRAWL4AI_INTERNAL_KEY: ${CRAWL4AI_INTERNAL_KEY}
      # PORTAL_API_URL: code default is 8100; prod uses 8010 (portal's public
      # internal port). Reverse-check divergence: declared explicitly to prevent
      # regression if code default ever changes.
      PORTAL_API_URL: http://portal-api:8010
      PORTAL_CALLER_SECRET: ${PORTAL_API_KLAI_CONNECTOR_SECRET}
      PORTAL_INTERNAL_SECRET: ${PORTAL_API_INTERNAL_SECRET}
      # CORS origins — empty disables CORS (code default); prod .env may set this
      CORS_ORIGINS: ${CONNECTOR_CORS_ORIGINS:-}
      GARAGE_S3_ENDPOINT: garage:3900
      GARAGE_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_SECRET_KEY: ${GARAGE_SECRET_KEY}
      GARAGE_BUCKET: ${GARAGE_BUCKET:-klai-images}
      GARAGE_REGION: garage
      # Google Drive OAuth (SPEC-KB-025) — empty client_id disables the connector
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
      # Microsoft 365 OAuth (SPEC-KB-MS-DOCS-001) — empty client_id disables the connector.
      MS_DOCS_CLIENT_ID: ${MS_DOCS_CLIENT_ID:-}
      MS_DOCS_CLIENT_SECRET: ${MS_DOCS_CLIENT_SECRET:-}
      MS_DOCS_TENANT_ID: ${MS_DOCS_TENANT_ID:-common}
      # Per-org rate limiting (SPEC-SEC-HYGIENE-001 HY-32) — empty disables rate limiting
      REDIS_URL: ${CONNECTOR_REDIS_URL:-}
      SYNC_REQUIRE_ORG_ID: ${SYNC_REQUIRE_ORG_ID:-false}
      LOG_LEVEL: INFO
    networks:
      - klai-net
      - net-postgres
    depends_on:
      postgres:
        condition: service_healthy
      knowledge-ingest:
        condition: service_started
      garage:
        condition: service_healthy

  # ─── Crawl4AI (internal web crawler for klai-connector) ─────────────────────
  # Klai-built image (deploy/crawl4ai/Dockerfile, built on core-01): stock
  # 0.8.9 plus an env-tunable body-visibility wait. Stock crawl4ai burns a
  # fixed 30s per page on sites whose <body> never becomes visible
  # (AngularJS ng-cloak et al.) and then discards the result. Upstream
  # report: https://github.com/unclecode/crawl4ai/issues/2129 — drop this
  # local build when a configurable timeout ships upstream.
  crawl4ai:
    image: ghcr.io/getklai/crawl4ai:0.9.2-local-260813-1211
    restart: unless-stopped
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_INTERNAL_KEY}
      CRAWL4AI_HOOKS_ENABLED: "false"
      # Max ms to wait for <body> visibility. 2000 measured byte-identical
      # to the stock 30000 on affected sites, ~5x faster wall-clock; pages
      # with a visible body exit this wait immediately and are unaffected.
      CRAWL4AI_BODY_VISIBILITY_TIMEOUT: "2000"
    networks:
      - klai-net
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # ─── Web search stack (LibreChat web mode) ───────────────────────────────────

  # Firecrawl v1.x: self-hosted web scraper for LibreChat full-page content extraction.
  # Requires dedicated Postgres (NUQ job queue) and RabbitMQ (worker coordination).
  # NUQ schema is auto-initialized via firecrawl-nuq-init.sql on first Postgres start.
  # Redis URL must use %-encoded password (special chars break ioredis URL parsing).
  # Image built from source — ghcr.io/mendableai/firecrawl is a private registry.
  # Build: cd /tmp/firecrawl/apps/api && docker build -t ghcr.io/mendableai/firecrawl:latest .
  firecrawl-postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: firecrawl
      POSTGRES_PASSWORD: ${FIRECRAWL_DB_PASSWORD}
      POSTGRES_DB: firecrawl
    networks:
      - klai-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firecrawl -d firecrawl"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - firecrawl-postgres-data:/var/lib/postgresql/data
      - ./firecrawl-nuq-init.sql:/docker-entrypoint-initdb.d/nuq-schema.sql:ro

  firecrawl-rabbitmq:
    image: rabbitmq:3-alpine
    restart: unless-stopped
    networks:
      - klai-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  firecrawl-api:
    image: ghcr.io/mendableai/firecrawl:latest
    restart: unless-stopped
    environment:
      PORT: "3002"
      HOST: "0.0.0.0"
      # Redis password contains special chars — must be %-encoded in the URL.
      # Plain ${REDIS_PASSWORD} substitution breaks ioredis URL parsing (falls back to 127.0.0.1).
      REDIS_URL: "${FIRECRAWL_REDIS_URL}"
      REDIS_RATE_LIMIT_URL: "${FIRECRAWL_REDIS_URL}"
      USE_DB_AUTHENTICATION: "false"
      FIRECRAWL_API_KEY: "${FIRECRAWL_INTERNAL_KEY}"
      NUM_WORKERS_PER_QUEUE: "2"
      LOGGING_LEVEL: "INFO"
      NUQ_DATABASE_URL: "postgresql://firecrawl:${FIRECRAWL_DB_PASSWORD}@firecrawl-postgres:5432/firecrawl"
      NUQ_RABBITMQ_URL: "amqp://firecrawl-rabbitmq:5672"
    networks:
      - klai-net
      - net-redis
    depends_on:
      redis:
        condition: service_healthy
      firecrawl-postgres:
        condition: service_healthy
      firecrawl-rabbitmq:
        condition: service_healthy
    # NOT exposed via Caddy — internal Docker network only
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  # ─── Cal.com (self-hosted scheduling) ────────────────────────────────────
  # Deployed at https://cal.getklai.com
  # DB: cal-db on klai-core-postgres-1 (role: cal_user).
  # Secrets in klai-infra/core-01/.env.sops (CAL_* prefix).
  # Deployment target and DNS records are environment-specific. Klai production
  # host details live in the private infra repository.
  cal-com:
    image: calcom/cal.com:v6.2.0
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_WEBAPP_URL: https://cal.${DOMAIN}
      NEXTAUTH_URL: https://cal.${DOMAIN}
      NEXTAUTH_SECRET: ${CAL_NEXTAUTH_SECRET}
      CALENDSO_ENCRYPTION_KEY: ${CAL_CALENDSO_ENCRYPTION_KEY}
      DATABASE_URL: ${CAL_DATABASE_URL}
      DATABASE_DIRECT_URL: ${CAL_DATABASE_URL}
      EMAIL_FROM: hello@getklai.com
      EMAIL_SERVER_HOST: ${SMTP_HOST}
      EMAIL_SERVER_PORT: ${SMTP_PORT:-587}
      EMAIL_SERVER_USER: ${SMTP_USERNAME}
      EMAIL_SERVER_PASSWORD: ${SMTP_PASSWORD}
    healthcheck:
      # /api/health returns 404 in Cal.com v6. Use wget which exits 0 for
      # any 2xx/3xx — a 307 to /auth/setup confirms the server is running.
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/auth/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - klai-net
      - net-postgres
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2g
