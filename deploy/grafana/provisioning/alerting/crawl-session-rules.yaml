# Crawl session alerts: a stored session cookie that is about to lapse.
#
# Routed via component=crawl -> klai-ops-alerts-email (policies.yaml).
#
#   R1  crawl_session_cookie_expiring  WARNING   a stored cookie of the site lapses
#                                                within 7 days
#
# Why: nothing re-issues a pasted cookie on its own, so a session the owner
# does not renew in time lapses and crawls ingest nothing. The keep-alive in
# knowledge-ingest (routes/crawl_sync.py, every 30 minutes per connector) logs
# the event below. Runbook: docs/runbooks/crawl-failures.md.
#
# It reads VictoriaLogs (service:knowledge-ingest), so deploy/scripts/
# verify-alert-datasource-access.py, which only reads Postgres rules, has
# nothing to check here.
#
# The event is logged on every tick until the cookie is replaced, and the
# series disappears when the owner pastes a fresh one.

apiVersion: 1

groups:
  - orgId: 1
    name: crawl-session
    folder: Klai
    interval: 5m
    rules:
      - uid: crawl-session-cookie-expiring
        title: crawl_session_cookie_expiring
        condition: threshold
        data:
          - refId: query
            datasourceUid: victorialogs
            queryType: stats
            relativeTimeRange:
              from: 86400
              to: 0
            model:
              refId: query
              datasource:
                type: victoriametrics-logs-datasource
                uid: victorialogs
              expr: |
                service:knowledge-ingest event:crawl_keepalive_cookie_expiring _time:24h
                  | stats by (connector_id, host, name) count() as n
              queryType: stats
          - refId: reduce
            datasourceUid: __expr__
            relativeTimeRange:
              from: 86400
              to: 0
            model:
              refId: reduce
              type: reduce
              reducer: last
              expression: query
          - refId: threshold
            datasourceUid: __expr__
            relativeTimeRange:
              from: 86400
              to: 0
            model:
              refId: threshold
              type: threshold
              expression: reduce
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 0s
        isPaused: false
        labels:
          severity: warning
          component: crawl
          service_group: knowledge
        annotations:
          summary: 'Cookie {{ $labels.name }} of {{ $labels.host }} (connector {{ $labels.connector_id }}) expires within 7 days: paste fresh cookies before then'
          runbook_url: 'docs/runbooks/crawl-failures.md'
          description: |
            Stored cookie {{ $labels.name }} for {{ $labels.host }} lapses within
            7 days; the date is the expires field of the log lines below. Nothing
            renews a pasted cookie that its host does not re-issue, so the owner
            of web connector {{ $labels.connector_id }} has to paste fresh cookies
            for that host in the connector wizard before that date. The alert
            clears when the cookie is replaced.

              service:knowledge-ingest event:crawl_keepalive_cookie_expiring connector_id:"{{ $labels.connector_id }}" name:"{{ $labels.name }}" | sort by (_time) desc | fields _time, host, name, expires, days_left | limit 5

            Runbook: docs/runbooks/crawl-failures.md.
