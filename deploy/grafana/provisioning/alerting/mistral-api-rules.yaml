# Mistral key state alerts, from the synthetic probe.
#
# The systemd timer `mistral-api-probe.timer` completes one token with every
# MISTRAL_API_KEY* key LiteLLM routes over, every 2 minutes. The script
# appends one JSON line per key to `/opt/klai/logs/mistral-api-probe.log`
# (fields status ok|full|error, key_env, key_fingerprint, keys_total,
# keys_not_full); Alloy ships them to VictoriaLogs with
# `service:mistral-api-probe`. It also writes the per-key state LiteLLM's
# klai_mistral_pool hook uses to skip a full key.
#
# The alerts hang on state, not on a counter: a workspace that is full stays
# firing until a probe run sees it complete again. The 5m window holds the
# last two runs, so an alert resolves within 5 minutes of the fix.
#
# Routed via component=mistral-api-probe -> klai-ops-alerts-email, repeat 1h
# (policies.yaml). Before October 2026 the critical rule here had no route,
# fell to the default receiver and sat unread for 2.5 days while a workspace
# was full; scripts/audit-alert-routes.py now fails CI on that.

apiVersion: 1

# File provisioning never removes a rule it stops listing; the old
# single-key probe_failed rule would otherwise keep firing on status:fail
# lines that no longer exist, i.e. never, while looking like coverage.
deleteRules:
  - orgId: 1
    uid: obs-003-mistral-api-probe-failed

groups:
  - orgId: 1
    name: mistral-api-probe
    folder: Klai
    interval: 1m
    rules:
      # One alert per key. `error` is in here as well as `full`: a key the
      # probe cannot complete with (401 revoked, 5xx, timeout) is reserve
      # that will not work when the other workspace fills up, and before the
      # rework the single probe rule paged on it too.
      - uid: obs-003-mistral-workspace-unavailable
        title: mistral_workspace_unavailable
        condition: threshold
        data:
          - refId: query
            datasourceUid: victorialogs
            queryType: stats
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: query
              datasource:
                type: victoriametrics-logs-datasource
                uid: victorialogs
              expr: |
                _time:5m service:mistral-api-probe event:mistral_api_probe status:in(full, error)
                  | stats by (key_env, key_fingerprint, status) count() as n
              queryType: stats
          - refId: reduce
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: reduce
              type: reduce
              reducer: last
              expression: query
          - refId: threshold
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: threshold
              type: threshold
              expression: reduce
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: OK
        execErrState: OK
        for: 0s
        isPaused: false
        labels:
          severity: warning
          service_group: litellm
          alert_type: synthetic
          component: mistral-api-probe
        annotations:
          summary: 'Mistral key {{ $labels.key_env }} is {{ $labels.status }}'
          runbook_url: 'docs/runbooks/litellm-provider-auth-failed.md'
          description: |
            The Mistral probe found {{ $labels.key_env }} (fingerprint
            {{ $labels.key_fingerprint }}) {{ $labels.status }} in its last
            run. full = HTTP 402, the workspace's spending limit is reached
            and LiteLLM already routes around this key. error = the key could
            not complete a request (401, 5xx or timeout).

            Triage in VictoriaLogs:
              _time:15m service:mistral-api-probe event:mistral_api_probe | sort by(_time) desc | limit 20

      - uid: obs-003-mistral-no-reserve
        title: mistral_no_reserve_left
        condition: threshold
        data:
          - refId: query
            datasourceUid: victorialogs
            queryType: stats
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: query
              datasource:
                type: victoriametrics-logs-datasource
                uid: victorialogs
              expr: |
                _time:5m service:mistral-api-probe event:mistral_api_probe keys_total:>0
                  | stats min(keys_not_full) as reserve
              queryType: stats
          - refId: reduce
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: reduce
              type: reduce
              reducer: last
              expression: query
          - refId: threshold
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: threshold
              type: threshold
              expression: reduce
              conditions:
                - evaluator: { params: [1], type: lt }
                  operator: { type: and }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: OK
        execErrState: OK
        for: 0s
        isPaused: false
        labels:
          severity: critical
          service_group: litellm
          alert_type: synthetic
          component: mistral-api-probe
        annotations:
          summary: 'No Mistral reserve left: every workspace is full'
          runbook_url: 'docs/runbooks/litellm-provider-auth-failed.md'
          description: |
            Every MISTRAL_API_KEY* key answered 402 in one probe run. LiteLLM
            has no workspace left for the klai-* chat aliases, so chat turns
            fail until someone raises a spending limit or adds a workspace.

            Triage in VictoriaLogs:
              _time:15m service:mistral-api-probe event:mistral_api_probe | sort by(_time) desc | limit 20

      - uid: obs-003-mistral-api-probe-missing
        title: mistral_api_probe_missing
        condition: threshold
        data:
          - refId: query
            datasourceUid: victorialogs
            queryType: stats
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: query
              datasource:
                type: victoriametrics-logs-datasource
                uid: victorialogs
              expr: |
                _time:10m service:mistral-api-probe event:mistral_api_probe
                  | stats count() as n
              queryType: stats
          - refId: reduce
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: reduce
              type: reduce
              reducer: last
              expression: query
          - refId: threshold
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: threshold
              type: threshold
              expression: reduce
              conditions:
                - evaluator: { params: [1], type: lt }
                  operator: { type: and }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: Alerting
        execErrState: OK
        for: 0s
        keepFiringFor: 10m
        isPaused: false
        labels:
          severity: warning
          service_group: litellm
          alert_type: synthetic
          component: mistral-api-probe
        annotations:
          summary: 'Mistral API probe logs missing'
          runbook_url: 'docs/runbooks/litellm-provider-auth-failed.md'
          description: |
            No Mistral API probe log was seen in the last 10 minutes, so the
            per-key state file LiteLLM reads goes stale too and LiteLLM falls
            back to finding full keys through failed user requests.
            Check `mistral-api-probe.timer`, `/opt/klai/logs/mistral-api-probe.log`,
            Alloy, and VictoriaLogs.
