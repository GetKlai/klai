# Automatic rollback alerts (SPEC-INFRA-AUTO-ROLLBACK-001).
#
# deploy-with-rollback.sh, rollback-rehearsal-assert.sh and
# datastore-restore-rehearsal.sh append one JSON line per event to
# /opt/klai/logs/auto-rollback.log on core-01; Alloy ships it to VictoriaLogs as
# `service:auto-rollback` (deploy/alloy/config.alloy). Fields: event
# (auto_rollback | rollback_rehearsal | datastore_restore_rehearsal), outcome
# (rolled_back | rollback_failed | ok | failed), deploy_service or store, gate,
# commit.
#
# All rules carry severity=critical and no component label, so policies.yaml
# sends them to klai-ops-alerts-email through its severity=critical route.
# Neither carries page="true": whether a rolled-back deploy should page is not
# decided. auto_rollback_event groups by service, gate and outcome, so one mail
# names what rolled back and why, and the text differs for rollback_failed.

apiVersion: 1

groups:
  - orgId: 1
    name: auto-rollback
    folder: Klai
    interval: 1m
    rules:
      # Any deploy that went red and was rolled back (outcome rolled_back) or
      # whose rollback failed too (rollback_failed, the one that needs a human
      # now). The weekly rehearsal rolls back the rollback-canary on purpose, so
      # its events are excluded here; they are proven by the rule below.
      # One alert instance per (deploy_service, gate, outcome): the labels feed
      # the mail text. No matches return no series, which is NoData, so
      # noDataState OK.
      - uid: obs-auto-rollback-event
        title: auto_rollback_event
        condition: threshold
        data:
          - refId: query
            datasourceUid: victorialogs
            queryType: stats
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: query
              datasource:
                type: victoriametrics-logs-datasource
                uid: victorialogs
              expr: |
                _time:15m service:auto-rollback event:auto_rollback -deploy_service:rollback-canary
                  | stats by (deploy_service, gate, outcome) count() as n
              queryType: stats
          - refId: reduce
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: reduce
              type: reduce
              reducer: last
              expression: query
          - refId: threshold
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: threshold
              type: threshold
              expression: reduce
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 0s
        isPaused: false
        labels:
          severity: critical
          spec: SPEC-INFRA-AUTO-ROLLBACK-001
          service_group: deploy
          alert_type: auto_rollback
        annotations:
          summary: '{{ if eq $labels.outcome "rollback_failed" }}ROLLBACK FAILED, human needed now: {{ $labels.deploy_service }} (gate {{ $labels.gate }}){{ else if eq $labels.outcome "not_started" }}Deploy not started, nothing changed: {{ $labels.deploy_service }} (gate {{ $labels.gate }}){{ else if eq $labels.outcome "shadow_failed" }}New image failed on a copy, nothing changed: {{ $labels.deploy_service }} (gate {{ $labels.gate }}){{ else }}Rolled back automatically: {{ $labels.deploy_service }} (gate {{ $labels.gate }}){{ end }}'
          runbook_url: 'https://github.com/GetKlai/klai/blob/main/docs/runbooks/auto-rollback.md#a-deploy-was-rolled-back'
          description: |
            Service: {{ $labels.deploy_service }}
            Failed gate: {{ $labels.gate }}
            Outcome: {{ $labels.outcome }}

            {{ if eq $labels.outcome "rollback_failed" }}The rollback did not hold (or there was no previous image to go back
            to), so production may be broken right now. This is the one outcome
            that needs a human immediately; nothing retries it.{{ else if eq $labels.outcome "not_started" }}The sync refused before it replaced a single file (not enough disk for
            a snapshot, or a snapshot that failed or did not read back). The host
            runs what it ran; the next sync tries again. The CI failure issue
            holds the reason.{{ else if eq $labels.outcome "shadow_failed" }}The new image of this data store was started on a copy of its latest
            snapshot and did not come up with the same data (or the dry flag
            /opt/klai/.datastore-dry forced it red), so the sync stopped before it
            replaced a single file: the live store, its consumers and the files are
            untouched. A revert PR excludes the version (not for gate
            datastore-shadow-dry, the dry proof); the CI failure issue
            (label shadow-failed) holds the run log with the difference.{{ else }}A new version failed its gate and the previous one is serving again. Nothing
            is broken now, but the new version is still on main: the next deploy
            of this service will fail the same way until it is fixed.{{ end }}

            Details: the CI failure issue labelled auto-rollback or
            rollback-failed (report attached), or on core-01 the report
            /opt/klai/deploy-reports/{{ $labels.deploy_service }}.json (compose
            syncs write compose.json) with the container log next to it as
            .log, and the ledger /opt/klai/deploy-ledger.log. In VictoriaLogs:
              _time:30m service:auto-rollback event:auto_rollback | sort by (_time) desc | limit 10

      # The dead-man's switch for the rehearsal itself: it writes one
      # event:rollback_rehearsal outcome:ok line when it passes, weekly. No line
      # for 8 days means a skipped schedule, a red run, or a broken log pipeline,
      # and in every case nothing is proving that rollback works. noDataState
      # and execErrState Alerting because a rule that exists to catch silence
      # must not go quiet itself. for: 30m only so a VictoriaLogs hiccup does not
      # mail; the 8-day window is the requirement. Dispatch the first rehearsal
      # by hand right after this rule is merged.
      - uid: obs-rollback-rehearsal-missing
        title: rollback_rehearsal_missing
        condition: threshold
        data:
          - refId: query
            datasourceUid: victorialogs
            queryType: stats
            relativeTimeRange:
              from: 691200
              to: 0
            model:
              refId: query
              datasource:
                type: victoriametrics-logs-datasource
                uid: victorialogs
              expr: |
                _time:8d service:auto-rollback event:rollback_rehearsal outcome:ok
                  | stats count() as n
              queryType: stats
          - refId: reduce
            datasourceUid: __expr__
            relativeTimeRange:
              from: 691200
              to: 0
            model:
              refId: reduce
              type: reduce
              reducer: last
              expression: query
          - refId: threshold
            datasourceUid: __expr__
            relativeTimeRange:
              from: 691200
              to: 0
            model:
              refId: threshold
              type: threshold
              expression: reduce
              conditions:
                - evaluator: { params: [1], type: lt }
                  operator: { type: and }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: Alerting
        execErrState: Alerting
        for: 30m
        keepFiringFor: 10m
        isPaused: false
        labels:
          severity: critical
          spec: SPEC-INFRA-AUTO-ROLLBACK-001
          service_group: deploy
          alert_type: synthetic
        annotations:
          summary: 'No passing rollback rehearsal for 8 days: nothing proves automatic rollback still works'
          runbook_url: 'https://github.com/GetKlai/klai/blob/main/docs/runbooks/auto-rollback.md#the-weekly-rehearsal-is-missing'
          description: |
            The weekly Rollback rehearsal workflow (rollback-rehearsal.yml) writes
            an event:rollback_rehearsal outcome:ok line when a bad image was rolled
            back and the good one serves again. None reached VictoriaLogs in 8 days.

            Check, in order:
              1. gh run list --workflow rollback-rehearsal.yml --limit 5
                 (red: read the failing step; skipped or absent: the schedule stopped)
              2. On core-01: tail -n 3 /opt/klai/logs/auto-rollback.log
                 (line present but not in VictoriaLogs: Alloy or VictoriaLogs is the break)
              3. Start it by hand: gh workflow run rollback-rehearsal.yml

      # The dead-man's switch for the datastore restore rehearsal (S8b): it
      # writes one event:datastore_restore_rehearsal line per store, outcome ok
      # when that store's snapshot restored and probed green. It runs on the 1st
      # and the 15th. 30 days is the longest window VictoriaLogs can answer (its
      # retention), so the rule fires after two missed runs, or when no store at
      # all restored for a month. A single failed store already ends its run red
      # and opens an issue. noDataState and execErrState Alerting for the same
      # reason as the rule above.
      - uid: obs-datastore-rehearsal-missing
        title: datastore_restore_rehearsal_missing
        condition: threshold
        data:
          - refId: query
            datasourceUid: victorialogs
            queryType: stats
            relativeTimeRange:
              from: 2592000
              to: 0
            model:
              refId: query
              datasource:
                type: victoriametrics-logs-datasource
                uid: victorialogs
              expr: |
                _time:30d service:auto-rollback event:datastore_restore_rehearsal outcome:ok
                  | stats count() as n
              queryType: stats
          - refId: reduce
            datasourceUid: __expr__
            relativeTimeRange:
              from: 2592000
              to: 0
            model:
              refId: reduce
              type: reduce
              reducer: last
              expression: query
          - refId: threshold
            datasourceUid: __expr__
            relativeTimeRange:
              from: 2592000
              to: 0
            model:
              refId: threshold
              type: threshold
              expression: reduce
              conditions:
                - evaluator: { params: [1], type: lt }
                  operator: { type: and }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: Alerting
        execErrState: Alerting
        for: 30m
        keepFiringFor: 10m
        isPaused: false
        labels:
          severity: critical
          spec: SPEC-INFRA-AUTO-ROLLBACK-001
          service_group: deploy
          alert_type: synthetic
        annotations:
          summary: 'No data store restored in a rehearsal for 30 days: nothing proves the data rollback points restore'
          runbook_url: 'https://github.com/GetKlai/klai/blob/main/docs/runbooks/auto-rollback.md#the-datastore-restore-rehearsal-is-missing'
          description: |
            The Datastore restore rehearsal workflow (datastore-restore-rehearsal.yml,
            1st and 15th of the month) writes an event:datastore_restore_rehearsal
            outcome:ok line per store whose snapshot restored into a throwaway
            container. None reached VictoriaLogs in 30 days.

            Check, in order:
              1. gh run list --workflow datastore-restore-rehearsal.yml --limit 5
                 (red: read the failing store; skipped or absent: the schedule stopped)
              2. On core-01: grep datastore_restore_rehearsal /opt/klai/logs/auto-rollback.log | tail -n 5
                 (lines present but not in VictoriaLogs: Alloy or VictoriaLogs is the break)
              3. Start it by hand: gh workflow run datastore-restore-rehearsal.yml
