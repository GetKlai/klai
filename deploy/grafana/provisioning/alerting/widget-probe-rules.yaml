# Customer widget probe alerts.
#
# The systemd timer `widget-probe.timer` asks the real widget path (token mint
# at /partner/v1/widget-config, then a streamed /partner/v1/chat/completions
# turn on the probe tenant) one fixed question every 30 minutes, asking once
# more after 30 s when the first turn fails. The script
# appends one verdict line to `/opt/klai/logs/widget-probe.log` (fields
# status ok|fail, reason, http_status, latency_ms, has_sources, answer_chars);
# Alloy ships it to VictoriaLogs as `service:widget-probe event:widget_probe`.
# Why: on 2026-10-23 the widget answered "Er ging iets mis" from about 03:00 to
# 10:40 UTC and the first signal was a customer.
#
# Both rules carry `page: "true"` (the external pager, see policies.yaml);
# widget_probe_failing also carries autofix="true". The email route in
# policies.yaml (component=widget-probe) stays as the second channel.

apiVersion: 1

groups:
  - orgId: 1
    name: widget-probe
    folder: Klai
    interval: 1m
    rules:
      # The newest verdict failed. A verdict is already two turns (the script
      # asks again after a failed turn), so one slow turn or a deploy restart
      # never pages. `sort | limit 1` keeps the rule firing until a run sees
      # the widget answer again; the 35m window holds one 30-minute run, and
      # no line at all belongs to the missing rule.
      - uid: obs-widget-probe-failing
        title: widget_probe_failing
        condition: threshold
        data:
          - refId: query
            datasourceUid: victorialogs
            queryType: stats
            relativeTimeRange:
              from: 2100
              to: 0
            model:
              refId: query
              datasource:
                type: victoriametrics-logs-datasource
                uid: victorialogs
              expr: |
                _time:35m service:widget-probe event:widget_probe
                  | sort by (_time) desc
                  | limit 1
                  | stats count() if (status:fail) as fails
              queryType: stats
          - refId: reduce
            datasourceUid: __expr__
            relativeTimeRange:
              from: 2100
              to: 0
            model:
              refId: reduce
              type: reduce
              reducer: last
              expression: query
          - refId: threshold
            datasourceUid: __expr__
            relativeTimeRange:
              from: 2100
              to: 0
            model:
              refId: threshold
              type: threshold
              expression: reduce
              conditions:
                - evaluator: { params: [1], type: gt }
                  operator: { type: and }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: OK
        execErrState: OK
        for: 0s
        isPaused: false
        labels:
          severity: critical
          page: "true"
          autofix: "true"
          service_group: portal
          alert_type: synthetic
          component: widget-probe
        annotations:
          summary: 'Customer widget is not answering: the last probe run failed twice'
          runbook_url: 'docs/runbooks/widget-probe.md'
          description: |
            The last widget probe verdict was fail, on both turns of the run: a visitor asking the
            probe widget a question got no good answer (reason in the verdict:
            http, unreachable, timeout, stream_error, empty_answer,
            no_sources or latency). Real customers see the same.

            What to check first, in VictoriaLogs:
              1. The verdicts and their reasons:
                 _time:3h service:widget-probe event:widget_probe | sort by (_time) desc | limit 10
              2. Where a turn spends its time (retrieval_ms high = retrieval or graph stall):
                 _time:30m service:portal-api event:partner_chat_turn_timing | sort by (_time) desc | limit 20
              3. Graph search timing out (FalkorDB, the 2026-10-23 cause):
                 _time:30m service:retrieval-api "graph_search_timeout" | stats count() as n
              4. LiteLLM out of budget (Mistral workspace full):
                 _time:30m service:litellm "crossed budget" | stats count() as n
              5. Caddy answering 5xx in front of portal-api:
                 _time:30m service:caddy status:5* | stats by (status) count() as n

      # No verdict line for 65 minutes: the probe itself is dead (timer,
      # unit, env file, Alloy or VictoriaLogs), which leaves the widget
      # unwatched. noDataState Alerting so an empty answer from the datasource
      # pages too. Two missed 30-minute runs plus the 300 s the unit allows,
      # so one run that ends late never trips it.
      - uid: obs-widget-probe-missing
        title: widget_probe_missing
        condition: threshold
        data:
          - refId: query
            datasourceUid: victorialogs
            queryType: stats
            relativeTimeRange:
              from: 3900
              to: 0
            model:
              refId: query
              datasource:
                type: victoriametrics-logs-datasource
                uid: victorialogs
              expr: |
                _time:65m service:widget-probe event:widget_probe
                  | stats count() as n
              queryType: stats
          - refId: reduce
            datasourceUid: __expr__
            relativeTimeRange:
              from: 3900
              to: 0
            model:
              refId: reduce
              type: reduce
              reducer: last
              expression: query
          - refId: threshold
            datasourceUid: __expr__
            relativeTimeRange:
              from: 3900
              to: 0
            model:
              refId: threshold
              type: threshold
              expression: reduce
              conditions:
                - evaluator: { params: [1], type: lt }
                  operator: { type: and }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: Alerting
        # A query error must not look like a healthy probe: this rule exists
        # to catch silence (observability.md, execErrState for silence rules).
        execErrState: Alerting
        for: 0s
        keepFiringFor: 10m
        isPaused: false
        labels:
          severity: critical
          page: "true"
          service_group: portal
          alert_type: synthetic
          component: widget-probe
        annotations:
          summary: 'Widget probe has written no verdict for 65 minutes'
          runbook_url: 'docs/runbooks/widget-probe.md'
          description: |
            No widget probe verdict reached VictoriaLogs in 65 minutes, so
            nobody is watching the customer widget.

            What to check first on core-01:
              systemctl status widget-probe.timer widget-probe.service
              journalctl -u widget-probe.service -n 30 --no-pager
              tail -n 3 /opt/klai/logs/widget-probe.log
            If the log file is fresh, Alloy or VictoriaLogs is the break:
              _time:30m service:alloy | limit 20
            The same VictoriaLogs queries as in widget_probe_failing apply
            once the probe runs again.
