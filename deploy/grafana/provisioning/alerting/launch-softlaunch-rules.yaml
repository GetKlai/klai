# SPEC-LAUNCH-SOFTLAUNCH-001 S-1 — launch-killer observability.
#
# Alerts that catch the "Klai silently broken for new users" class:
#
#   R1  signup-fail-rate             — portal-api signup endpoint raising in last 15m
#   R4  internal-retrieval-fail-rate — an internal chat turn lost its knowledge base
#
# (R2 retrieve-fail-rate and R3 kb-fallback-notice-fired watched the LiteLLM
# KB hook's log lines and were removed with the hook on 2026-10-21; R4 watches
# the same failure on the portal path that replaced it.)
#
# Routed via spec=SPEC-LAUNCH-SOFTLAUNCH-001 → klai-ops-alerts-email (same routing
# as SPEC-OBS-001 in portal-events-rules.yaml).
#
# UID convention (40-char ceiling): `spec-launch-001-<verb>`.
# Field shape mirrors portal-events-rules.yaml (service:foo AND _msg:bar patterns).

apiVersion: 1

# File provisioning never removes a rule it stops listing; the hook's two
# rules would stay live, and R2's query matched any litellm error line that
# mentions "retrieval".
deleteRules:
  - orgId: 1
    uid: spec-launch-001-retrieve-fail-rate
  - orgId: 1
    uid: spec-launch-001-kb-fallback-fired

groups:
  - orgId: 1
    name: spec-launch-001-readiness
    folder: Klai
    interval: 60s
    rules:

      # ── R1: signup-fail-rate ────────────────────────────────────────────
      # Any portal-api error/exception log that mentions "signup" or "creation
      # failed" in the last 15 minutes. Catches Zitadel-org-create failures,
      # Zitadel-user-create failures, role-grant failures, and DB-commit
      # failures in signup.py — all of which raise 502 and log via
      # logger.exception().
      - uid: spec-launch-001-signup-fail-rate
        title: signup_fail_rate
        condition: threshold
        data:
          - refId: query
            datasourceUid: victorialogs
            queryType: stats
            relativeTimeRange:
              from: 900   # 15 minutes
              to: 0
            model:
              refId: query
              datasource:
                type: victoriametrics-logs-datasource
                uid: victorialogs
              expr: 'service:portal-api AND (level:error OR level:exception) AND _msg:"signup" | stats count() as n'
              queryType: stats
          - refId: count
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: count
              type: reduce
              reducer: last
              expression: query
          - refId: threshold
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: threshold
              type: threshold
              expression: count
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: OK
        execErrState: Alerting
        for: 0s
        keepFiringFor: 30m
        isPaused: false
        labels:
          severity: warning
          spec: SPEC-LAUNCH-SOFTLAUNCH-001
          service_group: signup
        annotations:
          summary: 'Signup endpoint failing — new user(s) blocked from creating account'
          description: |
            One or more signup exceptions in the last 15 minutes. During a
            softlaunch this means a real user who clicked our invite cannot
            create their account.

            Investigate (Grafana → Explore → VictoriaLogs):
              service:portal-api AND (level:error OR level:exception) AND _msg:"signup"
                | sort by(_time) desc | limit 20

            Common causes:
              - Zitadel rate-limited (org-create or user-create returns 502)
              - DB rollback in portal_orgs/portal_users INSERT
              - free-email block firing for warm contacts (then add signup-token
                bypass, see SPEC-LAUNCH-SOFTLAUNCH-001 B-3)

      # ── R4: internal-retrieval-fail-rate ────────────────────────────────
      # An internal (LibreChat) chat turn whose /retrieve call failed. Strict
      # refuses the turn, Open answers from general knowledge only: the same
      # silent-degrade class R2 caught on the hook, which went unnoticed for
      # 7 days in the 2026-04-28 → 2026-05-05 incident.
      - uid: spec-launch-001-internal-retrieve-fail
        title: internal_retrieval_fail_rate
        condition: threshold
        data:
          - refId: query
            datasourceUid: victorialogs
            queryType: stats
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: query
              datasource:
                type: victoriametrics-logs-datasource
                uid: victorialogs
              # org 22 is the E2E organisation (slug e2e): its run hits the
              # restart of every deploy and paged on the first one (21 October).
              expr: 'service:portal-api AND event:partner_chat_internal_retrieval_failed AND NOT org_id:22 | stats count() as n'
              queryType: stats
          - refId: count
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: count
              type: reduce
              reducer: last
              expression: query
          - refId: threshold
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: threshold
              type: threshold
              expression: count
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: OK
        execErrState: Alerting
        for: 0s
        keepFiringFor: 30m
        isPaused: false
        labels:
          severity: warning
          spec: SPEC-LAUNCH-SOFTLAUNCH-001
          service_group: retrieval
        annotations:
          summary: 'Internal chat retrieval failing — Strict turns refused, Open turns answered without the KB'
          description: |
            portal-api failed to fetch knowledge-base context for at least one
            internal chat turn in the last 15 minutes. In Strict mode the user
            got a refusal; in Open mode an answer from general knowledge with a
            note that the knowledge base was unreachable. The `failure` field
            holds the HTTP status or the exception class; `identity_assertion`
            means retrieval-api rejected the employee's identity (the turn
            then errors instead of degrading), and `JSONDecodeError` a body
            that was not JSON.

            Investigate (Grafana → Explore → VictoriaLogs):
              service:portal-api AND event:partner_chat_internal_retrieval_failed
                | sort by(_time) desc | limit 20

            Then check the receiver:
              service:retrieval-api AND level:error
                | sort by(_time) desc | limit 20
