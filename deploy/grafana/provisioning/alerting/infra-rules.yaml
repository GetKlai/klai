# SPEC-OBS-001 Phase C — infrastructure alerts (PromQL via VictoriaMetrics).
#
# Three rules, all routed via spec=SPEC-OBS-001 → klai-ops-alerts-email
# (see policies.yaml).
#
#   R12  container_down              CRIT  cAdvisor staleness >2m
#   R13  container_restart_loop      CRIT  >=5 restarts in 30m, sustained 5m (pages)
#   R12b container_down_core         CRIT  a customer-facing container vanished (pages)
#   R17  core01_disk_usage_high      MED   <15% free on host root, sustained 30m
#
# Metric availability notes (probed 2026-04-22 against production VM):
#   - cAdvisor scrapes with `name` label (not `container`); `name=~"klai-core-.*"`
#     covers all klai-managed containers.
#   - cAdvisor does NOT export `container_restarts_total` (deprecated upstream).
#     Every restart puts the new start time on a NEW series (label
#     `container_label_restartcount` increments), so `changes()` of one series
#     is never above 1. Restarts are counted as distinct series per `name`.
#   - node-exporter runs containerized via Alloy `integrations/unix`. It does
#     NOT see the host root mountpoint=`/` directly. Instead it shows the
#     bind-mounts inside its own container (e.g. `/etc/hostname`), all of
#     which sit on the same underlying host device `/dev/md2`. Querying any
#     of those mountpoints with `device="/dev/md2"` gives the host root's
#     fill ratio. Brittle if the host's RAID layout changes — see follow-up.

apiVersion: 1

groups:
  - orgId: 1
    name: obs-001-infra
    folder: Klai
    interval: 1m
    rules:

      # ── R12: container_down ───────────────────────────────────────────────
      # cAdvisor updates `container_last_seen` every scrape (15s default).
      # If a container is gone, the metric goes stale and `time() - last_seen`
      # grows unbounded. >120s = container hasn't been seen for 2 minutes.
      - uid: obs-001-container-down
        title: container_down
        condition: threshold
        data:
          - refId: query
            datasourceUid: victoriametrics
            queryType: instant
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: query
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: '(time() - container_last_seen{name=~"klai-core-.*"}) > 120'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: threshold
              type: threshold
              expression: query
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  reducer: { params: [], type: last }
                  type: query
        # for: 2m absorbs post-recreate transients. cAdvisor's old container
        # time-series persists until VictoriaMetrics staleness window (~5m)
        # expires, so a freshly recreated container looks "down" briefly to
        # any rule scoped by `name=~"..."` (matches both old + new series).
        # Detection latency is now 2m + 2m = 4m worst case for an actually-
        # down container, still well within "fast" by ops standards. SPEC's
        # `for: 0s` made every grafana recreate self-fire this rule.
        noDataState: OK
        execErrState: Alerting
        for: 5m
        keepFiringFor: 5m
        isPaused: false
        labels:
          severity: critical
          spec: SPEC-OBS-001
          service_group: infra-containers
        annotations:
          summary: 'Container {{ $labels.name }} has not been seen for >7 min'
          runbook_url: 'https://github.com/GetKlai/klai-infra/blob/main/docs/runbooks/platform-recovery.md#container-down'
          description: |
            cAdvisor stopped seeing {{ $labels.name }} more than 2 minutes ago.
            Either the container has exited, the Docker daemon is unresponsive,
            or cAdvisor itself has lost scraping connectivity.

            Triage (in order):
              1. ssh core-01 "docker ps -a --filter name={{ $labels.name }}"
              2. If status is Exited: docker logs --tail 100 {{ $labels.name }}
              3. If status is Restarting: see container_restart_loop runbook.
              4. If container is gone: was this a planned removal? If yes,
                 update klai-core compose; if no, recreate via `docker compose up -d <service>`.

      # ── R12b: container_down_core ────────────────────────────────────────
      # Pages when a customer-facing container is gone. container_down above
      # keys on `time() - container_last_seen`, which also matches the stale
      # series of a container that was just recreated and misses a container
      # that simply vanished from cAdvisor, so it stays an email. This rule
      # asks the question directly: which of these containers has no series now
      # (VictoriaMetrics drops a series ~5m after the last scrape). A recreate
      # keeps the name, so it is not a hit once the new container is scraped.
      # The set is what a customer notices within minutes: caddy, portal-api,
      # zitadel (login), litellm and retrieval-api (chat), postgres, redis,
      # qdrant and falkordb (their stores).
      # Backtest over 14 days (1m steps): gaps of 2 to 7 minutes per container,
      # the longest a litellm recreate, so `for: 10m` leaves it at zero hits.
      # A renamed or retired container must leave this list in the same PR,
      # or the alert fires for good.
      - uid: obs-001-container-down-core
        title: container_down_core
        condition: threshold
        data:
          - refId: query
            datasourceUid: victoriametrics
            queryType: instant
            relativeTimeRange:
              from: 10800
              to: 0
            model:
              refId: query
              datasource:
                type: prometheus
                uid: victoriametrics
              # One absent() per expected container, so the alert stays firing for
              # as long as the container is missing; a "seen in the last N hours"
              # comparison went quiet once the container had been gone that long.
              expr: |
                absent(container_start_time_seconds{name="klai-core-caddy-1"})
                or absent(container_start_time_seconds{name="klai-core-portal-api-1"})
                or absent(container_start_time_seconds{name="klai-core-zitadel-1"})
                or absent(container_start_time_seconds{name="klai-core-litellm-1"})
                or absent(container_start_time_seconds{name="klai-core-retrieval-api-1"})
                or absent(container_start_time_seconds{name="klai-core-postgres-1"})
                or absent(container_start_time_seconds{name="klai-core-redis-1"})
                or absent(container_start_time_seconds{name="klai-core-qdrant-1"})
                or absent(container_start_time_seconds{name="klai-core-falkordb-1"})
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            relativeTimeRange:
              from: 10800
              to: 0
            model:
              refId: threshold
              type: threshold
              expression: query
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: OK
        execErrState: Alerting
        for: 10m
        keepFiringFor: 10m
        isPaused: false
        labels:
          severity: critical
          spec: SPEC-OBS-001
          service_group: infra-containers
          page: "true"
        annotations:
          summary: 'Customer-facing container {{ $labels.name }} is gone from cAdvisor'
          runbook_url: 'https://github.com/GetKlai/klai-infra/blob/main/docs/runbooks/platform-recovery.md#container-down'
          description: |
            {{ $labels.name }} has had no cAdvisor series for at least 10
            minutes: the container is stopped, removed or stuck in a recreate.
            Customers notice this one.

            Triage:
              1. ssh core-01 "docker ps -a --filter name={{ $labels.name }}"
              2. Exited: docker logs --tail 100 {{ $labels.name }}; then
                 `docker compose up -d <service>`.
              3. Missing after a deploy: check the deploy run and the compose file.

      # ── R13: container_restart_loop ──────────────────────────────────────
      # The previous expression, changes(container_start_time_seconds[15m]) > 0
      # for 15m, could never fire for a real loop: every restart is a new
      # series (restartcount label), so each series saw at most one change and
      # none stayed pending for 15m. On 2026-10-23 FalkorDB restarted ~150
      # times between 03:00 and 10:40 UTC and the rule showed seven separate
      # pending instances and zero firing.
      #
      # Now: count the distinct start-time series per container name that had
      # a sample in the last 30m. A steady container has 1; a planned
      # recreate has 2 (old + new); a deploy retry or two more adds up to 4.
      # 6 or more means at least 5 restarts in 30m. Backtest over 14 days
      # (1m steps): 421 minutes for falkordb on 2026-10-23 (first at 03:12,
      # 12 minutes after the loop began) and 51 minutes for litellm on
      # 2026-10-22 (a 71-restart loop that went unnoticed), nothing else.
      # Highest value on any ordinary deploy day was 5 (portal-api, four
      # deploys within 30m), so 6 stays quiet for deploys.
      # Ceiling: a loop slower than one restart per 6 minutes is not seen.
      - uid: obs-001-container-restart-loop
        title: container_restart_loop
        condition: threshold
        data:
          - refId: query
            datasourceUid: victoriametrics
            queryType: instant
            relativeTimeRange:
              from: 1800
              to: 0
            model:
              refId: query
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: 'count by (name) (last_over_time(container_start_time_seconds{name=~"klai-core-.*"}[30m])) >= 6'
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            relativeTimeRange:
              from: 1800
              to: 0
            model:
              refId: threshold
              type: threshold
              expression: query
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: OK
        execErrState: Alerting
        for: 5m
        keepFiringFor: 30m
        isPaused: false
        labels:
          severity: critical
          spec: SPEC-OBS-001
          service_group: infra-containers
          page: "true"
        annotations:
          summary: 'Container {{ $labels.name }} is in a restart loop ({{ $value }} start-time series in 30m, sustained 5m)'
          runbook_url: 'https://github.com/GetKlai/klai-infra/blob/main/docs/runbooks/platform-recovery.md#container-restart-loop'
          description: |
            {{ $labels.name }} has had {{ $value }} distinct start times in the
            last 30 minutes (a steady container has 1, a planned recreate 2),
            sustained for at least 5 minutes. This is a restart loop, not a
            single planned deploy.

            Triage:
              1. ssh core-01 "docker logs --tail 200 {{ $labels.name }}"
                 Look for crash-loop patterns: OOMKilled, panics, missing env vars.
              2. ssh core-01 "docker inspect {{ $labels.name }} | grep -A3 ExitCode"
                 Non-zero ExitCode + recent FinishedAt confirms the loop.
              3. If healthcheck is failing: ssh core-01 "docker inspect {{ $labels.name }} --format '{{`{{.State.Health.Log}}`}}'"
              4. Pause via Grafana silence while investigating; fix root cause; unpause.

      # ── R17: core01_disk_usage_high ──────────────────────────────────────
      # node-exporter (containerized via Alloy integrations/unix) does not see
      # host `/`. We query a bind-mount that exists in the alloy container and
      # filter by `device="/dev/md2"` — the host root's RAID device. Same
      # underlying fs, same avail/size values. Brittle if RAID layout changes.
      - uid: obs-001-core01-disk-usage-high
        title: core01_disk_usage_high
        condition: threshold
        data:
          - refId: query
            datasourceUid: victoriametrics
            queryType: instant
            relativeTimeRange:
              from: 1800
              to: 0
            model:
              refId: query
              datasource:
                type: prometheus
                uid: victoriametrics
              # max() collapses the redundant per-mountpoint series (all on
              # /dev/md2) into a single value. fstype filter excludes any
              # accidental tmpfs match.
              expr: |
                max(
                  node_filesystem_avail_bytes{device="/dev/md2",fstype="ext4",mountpoint=~"/etc/.*"}
                  /
                  node_filesystem_size_bytes{device="/dev/md2",fstype="ext4",mountpoint=~"/etc/.*"}
                ) < 0.15
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            relativeTimeRange:
              from: 1800
              to: 0
            model:
              refId: threshold
              type: threshold
              expression: query
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: OK
        execErrState: Alerting
        for: 30m
        keepFiringFor: 1h
        isPaused: false
        labels:
          severity: warning
          spec: SPEC-OBS-001
          service_group: infra-host
        annotations:
          summary: 'core-01 root disk under 15% free for >30m'
          runbook_url: 'https://github.com/GetKlai/klai-infra/blob/main/docs/runbooks/platform-recovery.md#core01-disk-usage-high'
          description: |
            The host root filesystem on core-01 (/dev/md2) has been below 15%
            free for at least 30 minutes.

            Triage:
              1. ssh core-01 "df -h /"
              2. ssh core-01 "sudo du -hx --max-depth=1 /var/lib /opt | sort -h | tail"
                 Not /var/lib/docker on its own. Docker runs the containerd
                 snapshotter here, so images live in /var/lib/containerd and
                 /var/lib/docker holds only container logs and volumes. On
                 2026-09-18 that was 224 GB against 50 GB, and looking at the
                 documented path alone hid the largest consumer entirely.
              3. Known consumers, measured 2026-09-18: images in
                 /var/lib/containerd, local backup sets in /opt/klai/backups,
                 and per-container json.log under /var/lib/docker/containers.
              4. Cleanup: take the targeted route. `docker image prune -f`
                 (dangling only) and truncating a named oversized json.log are
                 both safe. Never `docker system prune --volumes` — it deletes
                 customer data, and the daily docker-cleanup.timer already does
                 the safe subset.

      # ── R17b: core01_disk_usage_critical ─────────────────────────────────
      # R17 above fired continuously from 2026-09-04 and the disk still reached
      # 100% on 2026-09-18, taking a portal-api deploy down with it. A warning
      # that has been true for fourteen days is wallpaper; nothing escalated
      # because nothing could. This rule is the escalation: same query, same
      # series, a floor low enough that it cannot coexist with a healthy host.
      #
      # 8% of 436 GB is ~35 GB. That is above the largest single image pull we
      # do (docling-serve, 17.3 GB) and above one backup run's working set
      # (~10 GB: one 5 GiB day-set plus its encrypted copy), so a deploy or a
      # backup cannot trip it on its own. `for: 10m` rather than R17's 30m
      # because at this level the remaining headroom is measured in hours.
      - uid: obs-001-core01-disk-usage-critical
        title: core01_disk_usage_critical
        condition: threshold
        data:
          - refId: query
            datasourceUid: victoriametrics
            queryType: instant
            relativeTimeRange:
              from: 1800
              to: 0
            model:
              refId: query
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: |
                max(
                  node_filesystem_avail_bytes{device="/dev/md2",fstype="ext4",mountpoint=~"/etc/.*"}
                  /
                  node_filesystem_size_bytes{device="/dev/md2",fstype="ext4",mountpoint=~"/etc/.*"}
                ) < 0.08
              instant: true
              queryType: instant
          - refId: threshold
            datasourceUid: __expr__
            relativeTimeRange:
              from: 1800
              to: 0
            model:
              refId: threshold
              type: threshold
              expression: query
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: OK
        execErrState: Alerting
        for: 10m
        keepFiringFor: 1h
        isPaused: false
        labels:
          severity: critical
          spec: SPEC-OBS-001
          service_group: infra-host
          # A full root disk takes every container down within hours; the
          # rule has not fired in the last 14 days.
          page: "true"
        annotations:
          summary: 'core-01 root disk under 8% free — deploys will fail'
          runbook_url: 'https://github.com/GetKlai/klai-infra/blob/main/docs/runbooks/platform-recovery.md#core01-disk-usage-high'
          description: |
            The host root filesystem on core-01 (/dev/md2) is below 8% free.
            /tmp and the Docker data root share this filesystem, so at this
            level deploys fail mid-flight: on 2026-09-18 portal-api applied its
            Alembic migrations and then died at mktemp with ENOSPC.

            deploy-portal-api.sh now refuses to start under 4 GiB, so the
            likeliest symptom is a deploy that stops before it does anything.

            Act now, same triage as core01_disk_usage_high. Fastest safe wins,
            measured 2026-09-18: truncate an oversized container json.log
            (40 GB came back that way), then `docker image prune -f`.
