# SPEC-RAG-EVAL-001 — RAGAS quality alerts.
#
# Routed via spec=SPEC-RAG-EVAL-001 → klai-ops-alerts-email.
#
#   R1  rag_eval_faithfulness_low   HIGH  baseline faithfulness < 0.80 on
#                                         two consecutive nightly runs
#   R3  rag_eval_canary_dropped     HIGH  one or more expected_chunks
#                                         canaries missing in baseline eval
#
# Source: knowledge.rag_eval_results (PortalPostgres datasource).
# Variant scope is intentionally pinned to 'baseline' — variant runs are
# experiments and are allowed to score lower without paging.

apiVersion: 1

groups:
  - orgId: 1
    name: rag-eval-001
    folder: Klai
    interval: 6h
    rules:

      # ── R1: rag_eval_faithfulness_low ──────────────────────────────────
      # Catastrophic-regression detector. Reads the latest two nightly runs
      # per suite and fires when BOTH have faithfulness < 0.80. The 6h
      # interval keeps the alert evaluator cheap; baseline metrics only
      # change once per day after the 02:00 UTC nightly task lands.
      - uid: rag-eval-001-faithfulness-low
        title: rag_eval_faithfulness_low
        condition: faithfulness_below_threshold
        data:
          - refId: faithfulness_below_threshold
            datasourceUid: portal-postgres
            queryType: ""
            relativeTimeRange:
              from: 172800       # 48h: covers two nightly runs even with retries.
              to: 0
            model:
              datasource:
                type: postgres
                uid: portal-postgres
              format: table
              rawSql: |
                WITH last_two AS (
                  SELECT
                    suite,
                    AVG(faithfulness) AS faithfulness_avg,
                    date_trunc('day', run_at) AS day
                  FROM knowledge.rag_eval_results
                  WHERE variant = 'baseline'
                    AND run_at >= NOW() - INTERVAL '48 hours'
                    AND faithfulness IS NOT NULL
                  GROUP BY suite, date_trunc('day', run_at)
                ),
                ranked AS (
                  SELECT
                    suite,
                    faithfulness_avg,
                    ROW_NUMBER() OVER (PARTITION BY suite ORDER BY day DESC) AS rn
                  FROM last_two
                )
                SELECT COUNT(*) AS value
                FROM ranked
                WHERE rn <= 2
                  AND faithfulness_avg < 0.80
                HAVING COUNT(*) = 2;
              refId: faithfulness_below_threshold
        for: 0s
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: high
          spec: SPEC-RAG-EVAL-001
          alert_type: quality_regression
        annotations:
          summary: "RAG faithfulness baseline below 0.80 on two consecutive nightly runs"
          description: |
            The baseline `faithfulness` RAGAS metric has scored below 0.80 on
            BOTH of the last two nightly runs for at least one suite.
            Investigate: did the corpus change? Did retrieval-api or LiteLLM
            misbehave? Query knowledge.rag_eval_results for details.
          runbook_url: 'docs/runbooks/rag-quality.md#faithfulness-baseline-low'

      # ── R3: rag_eval_canary_dropped ────────────────────────────────────
      # Deterministic canary detector. Fires when the baseline nightly eval
      # writes any row whose expected_chunks canary failed before RAGAS
      # scoring. The 36h window covers one nightly run plus retries.
      #
      # State on 2026-10-23: firing since 2026-09-20, value 12 rows. Six
      # canary queries have failed on every run for the last 30 days (they
      # never passed): chat-pasted-correspondence-control-plain-question,
      # chat-brand-control-explicit, chat-brand-salesforce-bridging,
      # chat-pasted-correspondence-incident-shape, chat-easy-bubble-mobiele-app
      # and org-easy-fraude-politie. The rule is right: retrieval does not
      # return the expected chunk for them. It stays an email, it does not
      # page, and it will keep firing until those six are fixed in retrieval
      # or their expected_chunks are corrected in the suites.
      - uid: rag-eval-001-canary-dropped
        title: rag_eval_canary_dropped
        condition: canary_dropped
        data:
          - refId: canary_dropped
            datasourceUid: portal-postgres
            queryType: ""
            relativeTimeRange:
              from: 129600       # 36h: covers one nightly run even with retries.
              to: 0
            model:
              datasource:
                type: postgres
                uid: portal-postgres
              format: table
              rawSql: |
                SELECT COUNT(*) AS value
                FROM knowledge.rag_eval_results
                WHERE variant = 'baseline'
                  AND run_at >= NOW() - INTERVAL '36 hours'
                  AND meta::jsonb -> 'canary' ->> 'passed' = 'false'
                HAVING COUNT(*) > 0;
              refId: canary_dropped
        for: 0s
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: high
          spec: SPEC-RAG-EVAL-001
          alert_type: canary_dropped
        annotations:
          summary: "RAG eval expected_chunks canary dropped"
          description: |
            At least one baseline RAG eval query failed its expected_chunks
            canary before RAGAS scoring. This means retrieval no longer returned
            a known-good chunk marker from the suite.
          runbook_url: 'docs/runbooks/rag-quality.md#canary-dropped'

      # ── R2: rag_low_confidence_served_rate ─────────────────────────────
      # SPEC-RAG-LOW-CONFIDENCE-ABSTAIN-001 REQ-8b.
      # Fires when more than 20% of served retrieval responses are classified
      # confidence_band=low or confidence_band=unknown over the trailing 1h,
      # per tenant. This indicates either a KB coverage gap (the vocabulary-gap
      # failure class that motivated this SPEC), a mistune of the band
      # thresholds, or a degraded reranker / retrieval-api.
      # Evaluated every 5 minutes; fires after 5 minutes of sustained elevation.
      #
      # Backtest over 14 days (5m steps, rule semantics incl. the 20-request
      # gate): org 368884765035593759 above 20% for 46 of the 59 hours it had
      # enough traffic, org 372801852200189969 for 5 hours, org
      # 375926856798437393 for 4 hours. The main tenant's 14-day total is
      # 5,080 low of 12,673 responses (40%), which is the condition, not the
      # rule; whether eval-suite traffic inflates it is not visible in the
      # metric. Severity high, email only, no page.
      - uid: spec-rag-001-low-confidence-rate
        title: "RAG: Low-confidence served rate > 20%"
        condition: low_confidence_rate_above_threshold
        data:
          - refId: low_confidence_served
            datasourceUid: victoriametrics
            queryType: instant
            relativeTimeRange:
              from: 3600       # 1h window matches the PromQL aggregation range
              to: 0
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              # Instant, like every other VictoriaMetrics rule in this folder.
              # The earlier range query made Grafana reject the result with
              # "frame cannot uniquely be identified by its labels: has
              # duplicate results with labels {}", so the rule sat in
              # "Alerting (Error)" from 2026-10-18 on (execErrState Alerting)
              # without ever evaluating the 20% threshold.
              # The `and on (org_id)` gate needs 20 requests in the hour: a
              # tenant with 3 requests a day (org 372801852200189969) is at
              # 100% low/unknown on every one of them and is not a signal.
              expr: |
                ((sum by (org_id) (increase(retrieval_confidence_band_total{band=~"low|unknown"}[1h]))
                  / sum by (org_id) (increase(retrieval_confidence_band_total[1h])))
                 and on (org_id)
                 (sum by (org_id) (increase(retrieval_confidence_band_total[1h])) >= 20))
              instant: true
              queryType: instant
              refId: low_confidence_served
          - refId: low_confidence_rate_above_threshold
            datasourceUid: "-100"
            queryType: ""
            relativeTimeRange:
              from: 3600
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 0.20
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - low_confidence_served
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: "__expr__"
                uid: "-100"
              expression: low_confidence_served
              intervalMs: 1000
              maxDataPoints: 43200
              refId: low_confidence_rate_above_threshold
              type: threshold
        for: 5m
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: high
          spec: SPEC-RAG-LOW-CONFIDENCE-ABSTAIN-001
          alert_type: low_confidence_rate
        annotations:
          summary: "Low-confidence served rate {{ $value | humanizePercentage }} on {{ $labels.org_id }}"
          description: |
            More than 20% of retrieval responses for org {{ $labels.org_id }} are
            classified confidence_band=low or confidence_band=unknown over the last hour.
            This may indicate a KB coverage gap, a mistune of confidence thresholds,
            or a degraded reranker / retrieval-api.
            See runbook for triage steps.
          runbook_url: 'docs/runbooks/rag-quality.md#low-confidence-served-rate-alert-spec-rag-low-confidence-abstain-001'
