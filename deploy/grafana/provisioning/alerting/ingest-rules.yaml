# SPEC-OBS-001 Phase D — knowledge-ingest error-rate alerts (LogsQL).
#
# Routed via spec=SPEC-OBS-001 → klai-ops-alerts-email.
#
#   R16  ingest_error_rate_elevated   HIGH   >10 errors in 10m
#   R17  pg_qdrant_reconcile_failed   HIGH   PG/Qdrant shadow reconcile
#                                            found any discrepancy, or the
#                                            reconcile job itself crashed
#   R18  pg_qdrant_reconcile_missing  HIGH   no reconcile event in 36h
#        procrastinate_worker_lane_died HIGH a worker lane exited and is
#                                            being restarted
#
# Field shape verified against production VictoriaLogs (2026-04-22):
#   service:knowledge-ingest         → klai-core-knowledge-ingest-1
#   level:error / level:warning      → structured field

apiVersion: 1

groups:
  - orgId: 1
    name: obs-001-ingest
    folder: Klai
    interval: 1m
    rules:

      # ── R16: ingest_error_rate_elevated ──────────────────────────────────
      # Looks back 10m, fires when count of error-level logs exceeds 10.
      # for: 0s — once the count crosses, fire immediately. The 10m lookback
      # already smooths out single-job-failure spikes.
      - uid: obs-001-ingest-error-rate-elevated
        title: ingest_error_rate_elevated
        condition: threshold
        data:
          - refId: query
            datasourceUid: victorialogs
            queryType: stats
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: query
              datasource:
                type: victoriametrics-logs-datasource
                uid: victorialogs
              expr: 'service:knowledge-ingest AND level:error | stats count() as n'
              queryType: stats
          - refId: count
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: count
              type: reduce
              reducer: last
              expression: query
          - refId: threshold
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: threshold
              type: threshold
              expression: count
              conditions:
                - evaluator: { params: [10], type: gt }
                  operator: { type: and }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: OK
        execErrState: Alerting
        for: 0s
        keepFiringFor: 30m
        isPaused: false
        labels:
          severity: warning
          spec: SPEC-OBS-001
          service_group: ingest
        annotations:
          summary: 'knowledge-ingest emitted >10 errors in the last 10 min'
          runbook_url: 'https://github.com/GetKlai/klai-infra/blob/main/docs/runbooks/platform-recovery.md#knowledge-ingest-error-surge'
          description: |
            knowledge-ingest is emitting more than 10 error-level log lines
            per 10 minutes. Common causes: an upstream connector (Confluence,
            HubSpot, Notion) returning 401/429/500, a malformed document
            blocking a job, or graphiti/FalkorDB connectivity issues.

            Triage:
              1. VictoriaLogs query: service:knowledge-ingest AND level:error | sort by(_time) desc | limit 20
              2. Common patterns:
                 - "Job ... failed" → check the failing job's traceback
                 - "401 Unauthorized" → connector secret expired (see CONNECTOR_SECRET_ROTATION.md)
                 - "falkordb" or "graphiti" in error → check FalkorDB health
                   (docker logs --tail 100 klai-core-falkordb-1; a crash
                   line is also caught by datastore_process_crashed)
              3. If a single org_id dominates: their connector may be misconfigured.
                 ssh core-01 "docker logs --tail 200 klai-core-knowledge-ingest-1 | grep -i error"

      # ── R17: pg_qdrant_reconcile_failed ────────────────────────────────
      # Shadow consistency detector for GAP-SYNC-01. The nightly job is
      # read-only; this alert means PG and Qdrant disagree (status=failed)
      # OR the reconcile job itself crashed (status=error) — an operator
      # should inspect before choosing a repair path. R18 below is the
      # dead-man's switch for nights where the worker never logs any
      # reconcile event.
      #
      # State on 2026-10-23: this has fired every day for 30 days on the same
      # 17 discrepancies (8 artifacts missing in Qdrant, 9 orphaned in Qdrant,
      # out of 3,160 active artifacts), unchanged from run to run. The
      # condition is real and stays an email; it does not page. Cleaning up the
      # 17 rows is the way to make the alert go quiet.
      - uid: obs-001-pg-qdrant-divergence
        title: pg_qdrant_reconcile_failed
        condition: threshold
        data:
          - refId: query
            datasourceUid: victorialogs
            queryType: stats
            relativeTimeRange:
              from: 90000
              to: 0
            model:
              refId: query
              datasource:
                type: victoriametrics-logs-datasource
                uid: victorialogs
              expr: 'service:knowledge-ingest AND event:pg_qdrant_reconcile AND (status:failed OR status:error) | stats count() as n'
              queryType: stats
          - refId: count
            datasourceUid: __expr__
            relativeTimeRange:
              from: 90000
              to: 0
            model:
              refId: count
              type: reduce
              reducer: last
              expression: query
          - refId: threshold
            datasourceUid: __expr__
            relativeTimeRange:
              from: 90000
              to: 0
            model:
              refId: threshold
              type: threshold
              expression: count
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: OK
        execErrState: Alerting
        for: 0s
        keepFiringFor: 4h
        isPaused: false
        labels:
          severity: high
          spec: SPEC-OBS-001
          service_group: ingest
          alert_type: consistency_reconcile
        annotations:
          summary: 'PG/Qdrant reconciliation found inconsistent knowledge artifacts'
          runbook_url: 'https://github.com/GetKlai/klai/blob/main/docs/runbooks/pg-qdrant-reconcile.md'
          description: |
            The nightly read-only PG/Qdrant reconciliation job logged
            status=failed (drift found) or status=error (the job crashed).
            For failed: query the pg_qdrant_reconcile event for
            missing_in_qdrant, orphaned_in_qdrant, and sample artifact keys.
            For error: inspect the exception on the same event.

      # ── R18: pg_qdrant_reconcile_missing ───────────────────────────────
      # Dead-man's switch for R17. If the periodic task never runs (worker
      # down, task registration broken, periodic deferrer unhealthy), R17
      # sees no failed/error event and remains OK. This rule fires on
      # absence of any pg_qdrant_reconcile event over 36h.
      #
      # The window was 25h, which is wrong for this job: the cron fires at
      # 03:30 UTC but the event is logged when the run FINISHES, and over
      # 2026-09-23 to 2026-10-23 that ranged from 03:30 to 12:52 UTC. Gaps
      # between consecutive events reached 26.9h (22 -> 23 October) and 27.4h
      # (20 -> 21 October), so the rule fired on days the job ran. 36h clears
      # the worst observed gap by 8.6h and still fires on a missed day (the
      # 26 -> 28 September gap was 46.8h).
      - uid: obs-001-pg-qdrant-reconcile-missing
        title: pg_qdrant_reconcile_missing
        condition: no_recent_reconcile
        data:
          - refId: query
            datasourceUid: victorialogs
            queryType: stats
            relativeTimeRange:
              from: 129600
              to: 0
            model:
              refId: query
              datasource:
                type: victoriametrics-logs-datasource
                uid: victorialogs
              expr: 'service:knowledge-ingest AND event:pg_qdrant_reconcile | stats count() as n'
              queryType: stats
          - refId: count
            datasourceUid: __expr__
            relativeTimeRange:
              from: 129600
              to: 0
            model:
              refId: count
              type: reduce
              reducer: last
              expression: query
          - refId: no_recent_reconcile
            datasourceUid: __expr__
            relativeTimeRange:
              from: 129600
              to: 0
            model:
              refId: no_recent_reconcile
              type: threshold
              expression: count
              conditions:
                - evaluator: { params: [1], type: lt }
                  operator: { type: and }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: Alerting
        execErrState: Alerting
        for: 0s
        keepFiringFor: 4h
        isPaused: false
        labels:
          severity: high
          spec: SPEC-OBS-001
          service_group: ingest
          alert_type: consistency_reconcile_missing
        annotations:
          summary: 'PG/Qdrant reconciliation did not run in the last 36h'
          runbook_url: 'https://github.com/GetKlai/klai/blob/main/docs/runbooks/pg-qdrant-reconcile.md#missing-run-alert'
          description: |
            No pg_qdrant_reconcile event was logged in the last 36 hours.
            The periodic reconcile task may not be registered, the worker may
            be down, or the periodic deferrer may not be running.

      # ── procrastinate_worker_lane_died ─────────────────────────────────
      # WorkerLifecycle restarts a lane after 1-60 s backoff, so one event is
      # recovered automatically; the alert exists because 22-25 Sep 2026
      # showed the underlying cause (pool starvation, Postgres restart)
      # recurs, and a lane that keeps dying keeps logging this line.
      - uid: ingest-procrastinate-worker-lane-died
        title: procrastinate_worker_lane_died
        condition: threshold
        data:
          - refId: query
            datasourceUid: victorialogs
            queryType: stats
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: query
              datasource:
                type: victoriametrics-logs-datasource
                uid: victorialogs
              expr: 'service:knowledge-ingest AND event:procrastinate_worker_lane_died | stats count() as n'
              queryType: stats
          - refId: count
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: count
              type: reduce
              reducer: last
              expression: query
          - refId: threshold
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              refId: threshold
              type: threshold
              expression: count
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: OK
        execErrState: Alerting
        for: 0s
        keepFiringFor: 30m
        isPaused: false
        labels:
          severity: high
          spec: SPEC-OBS-001
          service_group: ingest
          alert_type: worker_lane_died
        annotations:
          summary: 'A knowledge-ingest procrastinate worker lane exited and is being restarted'
          description: |
            A procrastinate worker lane (io, interactive, llm or maintenance)
            exited while no shutdown was requested; WorkerLifecycle restarts
            it after an exponential backoff of up to 60 s and /health
            returns 503 until then.

            Triage:
              1. VictoriaLogs: service:knowledge-ingest AND (event:procrastinate_worker_lane_died OR event:~"Side task") | sort by (_time) desc | limit 20
              2. PoolTimeout in the side task → procrastinate pool exhausted
                 (WorkerLifecycle.POOL_MAX_SIZE); "database system is
                 shutting down" → Postgres restarted.
              3. Repeated events for one lane mean the restart does not
                 hold; check procrastinate_worker_lane_restarting and the
                 queue depth in procrastinate_jobs.
