# Notification routing for all Grafana-managed alerts.
#
# Fallback: grafana-default-email (Grafana auto-installed).
# Routes (evaluated in order, first match with continue:false wins):
#   - spec=SPEC-SEC-024                          → klai-dev-alerts-email (SEC-024-R12/R13)
#   - spec=SPEC-INFRA-005                        → klai-dev-alerts-email (SPEC-INFRA-005 persistence)
#   - spec=SPEC-OBS-001 + alert_type=heartbeat   → heartbeat-kuma (OBS-001-R22)
#   - spec=SPEC-OBS-001 + alert_type=disk_headroom → disk-headroom-kuma (inverted; push stops = alert)
#   - spec=SPEC-OBS-001                          → klai-ops-alerts-email (OBS-001-R4/R5)
#   - spec=SPEC-INFRA-CONTAINER-HYGIENE-001      → klai-ops-alerts-email (REQ-5 orphan-audit)
#   - spec=SPEC-INGEST-LOGIN-WALL-DETECT-001     → klai-ops-alerts-email (REQ-08 login-wall)
#   - spec=SPEC-KB-015                           → klai-ops-alerts-email (feedback-loop health)
#
# Grouping + repeat_interval tuning per route:
#   - SEC/INFRA: repeat 24h — suppress email-floods from a wedged call-path
#   - OBS heartbeat: repeat 5m — push must arrive every 5 min at Uptime Kuma
#   - OBS ops: repeat 4h — default Grafana behaviour; per-rule `for:` handles debounce
#   - HYGIENE orphan-audit: repeat 24h — orphans are weekly-detected and
#     stable; daily re-page is plenty of urgency, hourly would spam

apiVersion: 1

policies:
  - orgId: 1
    receiver: grafana-default-email   # existing default (installed by Grafana)
    group_by:
      - grafana_folder
      - alertname
    routes:
      - receiver: klai-dev-alerts-email
        matchers:
          - spec = SPEC-SEC-024
        group_by:
          - alertname
          - service
        group_wait: 10s
        group_interval: 1m
        repeat_interval: 24h
        continue: false

      - receiver: klai-dev-alerts-email
        matchers:
          - spec = SPEC-INFRA-005
        group_by:
          - alertname
          - service
        group_wait: 10s
        group_interval: 1m
        repeat_interval: 24h
        continue: false

      # OBS-001 heartbeat — MUST match BEFORE the general OBS-001 route.
      # repeat_interval: 2m gives Kuma a fresh push every ~2 min, well
      # within its 5m+retry window. Earlier 5m repeat aligned poorly
      # with the rule eval interval and produced 7-10m gaps.
      - receiver: heartbeat-kuma
        matchers:
          - spec = SPEC-OBS-001
          - alert_type = heartbeat
        group_by:
          - alertname
        group_wait: 0s
        group_interval: 2m
        repeat_interval: 2m
        continue: false

      # OBS-001 disk headroom — MUST match BEFORE the general OBS-001 route,
      # for the same reason as the heartbeat above: it is a push, not a page.
      #
      # An inverted rule (see disk-headroom-rules.yaml) fires while the disk is
      # healthy, so this route pushes to Uptime Kuma and losing the push is the
      # alert.
      #
      # repeat_interval 2m against Kuma's 300s window, matching the heartbeat
      # route above. 5m was tried first and is wrong: it equals the window
      # exactly, so ordinary dispatch jitter arrives late and Kuma reports DOWN
      # on a healthy disk. Observed 2026-09-18 — last push 18:58:09, monitor
      # down at 19:03:50. A false page here is worse than a missed one, because
      # it is the failure that teaches people to ignore the channel.
      #
      # Deliberately not a fourth email route: all three email contact points in
      # contact-points.yaml deliver to hello@getklai.com, and
      # core01_disk_usage_high already sent roughly 84 messages there over
      # fourteen days while the disk filled anyway. Kuma mails a personal
      # address, which is what makes this a different channel rather than the
      # same one repeated faster.
      - receiver: disk-headroom-kuma
        matchers:
          - spec = SPEC-OBS-001
          - alert_type = disk_headroom
        group_by:
          - alertname
        group_wait: 0s
        group_interval: 2m
        repeat_interval: 2m
        continue: false

      - receiver: klai-ops-alerts-email
        matchers:
          - spec = SPEC-OBS-001
        group_by:
          - alertname
          - service
        group_wait: 10s
        group_interval: 1m
        repeat_interval: 4h
        continue: false

      # SPEC-INFRA-CONTAINER-HYGIENE-001 REQ-5 — orphan-audit alerts.
      # Audit runs once a week (Sundays 03:00 via systemd timer), so a
      # daily repeat is the right cadence: enough to keep the on-call
      # aware of an unresolved orphan, not so much that it spams.
      - receiver: klai-ops-alerts-email
        matchers:
          - spec = SPEC-INFRA-CONTAINER-HYGIENE-001
        group_by:
          - alertname
          - service_group
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 24h
        continue: false

      # SPEC-INGEST-LOGIN-WALL-DETECT-001 REQ-08 — login-wall detection
      # alerts. Burst alert (R1) fires on >50 detections in 10m; config-
      # invalid alert (R2) fires on any mis-configured mode env. Both are
      # warning-severity and route to ops with a 4h repeat — long enough to
      # avoid noise while a tenant's first backfill drains, short enough to
      # keep on-call aware if the rate doesn't drop.
      - receiver: klai-ops-alerts-email
        matchers:
          - spec = SPEC-INGEST-LOGIN-WALL-DETECT-001
        group_by:
          - alertname
          - service_group
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        continue: false

      # SPEC-KB-015 — feedback-loop health. The rule evaluates a 30-day
      # window behind a >=5-event volume gate, so it cannot burst: at most one
      # firing state per day is meaningful. A 24h repeat matches that cadence
      # and keeps a genuine degradation visible without re-mailing hourly
      # about a window that barely moves between evaluations.
      - receiver: klai-ops-alerts-email
        matchers:
          - spec = SPEC-KB-015
        group_by:
          - alertname
        group_wait: 30s
        group_interval: 10m
        repeat_interval: 24h
        continue: false
