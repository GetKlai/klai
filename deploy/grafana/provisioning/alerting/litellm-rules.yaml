# LiteLLM gateway health alerts (added 2026-05-05).
#
# Routed via spec=SPEC-SEC-IDENTITY-ASSERT-001 -> klai-ops-alerts-email.
#
# The former R1 (litellm_retrieval_failed) watched the LiteLLM KB hook and was
# removed with the hook on 2026-10-21; R2 and R3 keep their numbers.
#
#   R2  litellm_provider_auth_failed   CRIT  ANY upstream provider auth failure
#                                            emitted by LiteLLM in the last 5m
#   R3  litellm_budget_exhausted       CRIT  ANY request refused because a
#                                            Mistral deployment spent its daily
#                                            max_budget (added 2026-09-26)
#   R4  litellm_chat_budget_exhausted  CRIT  the same, for klai-large, the last
#                                            alias in the customer chat
#                                            fallback chain (pages)
#
# Pitfall avoidance:
#   - UID stays well under the 40-char Grafana limit (see
#     `.claude/rules/klai/infra/observability.md`).
#   - The group keeps its historical name (litellm-knowledge-hook): renaming
#     a provisioned group would delete and recreate its rules.

apiVersion: 1

# File provisioning never removes a rule it stops listing.
deleteRules:
  - orgId: 1
    uid: obs-001-litellm-kb-retrieval-failed

groups:
  - orgId: 1
    name: litellm-knowledge-hook
    folder: Klai
    interval: 1m
    rules:

      # -- R2: litellm_provider_auth_failed --------------------------------
      - uid: obs-002-litellm-provider-auth-failed
        title: litellm_provider_auth_failed
        condition: threshold
        data:
          - refId: query
            datasourceUid: victorialogs
            queryType: stats
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: query
              datasource:
                type: victoriametrics-logs-datasource
                uid: victorialogs
              expr: |
                _time:5m service:litellm
                  ("AuthenticationError" OR "MistralException" OR "Unauthorized")
                  | stats count() as n
              queryType: stats
          - refId: reduce
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: reduce
              type: reduce
              reducer: last
              expression: query
          - refId: threshold
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: threshold
              type: threshold
              expression: reduce
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: OK
        execErrState: OK
        for: 0s
        keepFiringFor: 10m
        isPaused: false
        labels:
          severity: critical
          spec: SPEC-SEC-IDENTITY-ASSERT-001
          service_group: litellm
        annotations:
          summary: 'LiteLLM upstream provider authentication failed'
          runbook_url: 'docs/runbooks/litellm-provider-auth-failed.md'
          description: |
            LiteLLM logged an upstream provider authentication failure in the
            last 5m. Chat/search synthesis can fail even if retrieval-api and
            LiteLLM liveliness checks are healthy.

            Triage:
              1. VictoriaLogs (Grafana -> Explore):
                   _time:15m service:litellm
                     ("AuthenticationError" OR "MistralException" OR "Unauthorized")
                 Confirm model alias and upstream provider from the error.
              2. If the error contains `MistralException - {"detail":"Unauthorized"}`,
                 verify the deployed `MISTRAL_API_KEY` secret and recreate the
                 LiteLLM container so `deploy/litellm/config.yaml` resolves the
                 corrected environment variable.
              3. Remember that `klai-primary`, `klai-fast`, `klai-large`, and
                 `klai-medium` all read `os.environ/MISTRAL_API_KEY`; fallback
                 between those aliases does not mitigate a bad Mistral key.

      # -- R3: litellm_budget_exhausted -------------------------------------
      - uid: obs-004-litellm-budget-exhausted
        title: litellm_budget_exhausted
        condition: threshold
        data:
          - refId: query
            datasourceUid: victorialogs
            queryType: stats
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: query
              datasource:
                type: victoriametrics-logs-datasource
                uid: victorialogs
              # Raised by LiteLLM 1.96.2's RouterBudgetLimiting
              # (router_strategy/budget_limiter.py) when every deployment
              # left for a request has spent its max_budget.
              expr: |
                _time:5m service:litellm "No deployments available - crossed budget"
                  | stats count() as n
              queryType: stats
          - refId: reduce
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: reduce
              type: reduce
              reducer: last
              expression: query
          - refId: threshold
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: threshold
              type: threshold
              expression: reduce
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 0s
        keepFiringFor: 30m
        isPaused: false
        labels:
          severity: critical
          spec: SPEC-SEC-IDENTITY-ASSERT-001
          service_group: litellm
        annotations:
          summary: 'LiteLLM daily spend ceiling reached for a Mistral alias'
          description: |
            A klai-* Mistral deployment spent its daily max_budget
            (deploy/litellm/config.yaml) and LiteLLM refused requests for it
            in the last 5m. klai-primary and klai-fast fall back to klai-large;
            klai-medium and klai-large answer an error until the 24h window resets or LiteLLM
            restarts (spend is counted in process memory).

            Triage:
              1. VictoriaLogs (Grafana -> Explore):
                   _time:1h service:litellm "crossed budget"
                 The message names the model_name (alias) that ran out.
              2. Find the caller that drove the spend: which service sends
                 that alias, and whether its volume is expected (bulk ingest,
                 an eval run, a routing change).
              3. Normal traffic outgrew the budget: raise max_budget for that
                 alias in config.yaml. Unexpected traffic: stop the caller;
                 the ceiling is doing its job.

      # -- R4: litellm_chat_budget_exhausted ---------------------------------
      # litellm_budget_exhausted above fires for any alias, and the aliases that
      # actually run out are background ones: in the last 30 days klai-judge
      # (1,407 lines since 2026-09-28) and klai-medium (1,011 on 2026-10-23),
      # the RAG-eval judge and the enrichment model. Customers do not notice
      # those. klai-primary and klai-fast fall back to klai-large, so chat only
      # stops when klai-large itself is out of budget (and agentic/tool turns,
      # which go straight to it). That is the one worth waking someone for.
      # Backtest over 30 days: klai-large 0 lines, klai-primary 0, klai-fast 0.
      - uid: obs-004-litellm-chat-budget-exhausted
        title: litellm_chat_budget_exhausted
        condition: threshold
        data:
          - refId: query
            datasourceUid: victorialogs
            queryType: stats
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: query
              datasource:
                type: victoriametrics-logs-datasource
                uid: victorialogs
              expr: |
                _time:5m service:litellm "No deployments available - crossed budget" "model_name: klai-large,"
                  | stats count() as n
              queryType: stats
          - refId: reduce
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: reduce
              type: reduce
              reducer: last
              expression: query
          - refId: threshold
            datasourceUid: __expr__
            relativeTimeRange:
              from: 300
              to: 0
            model:
              refId: threshold
              type: threshold
              expression: reduce
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  reducer: { params: [], type: last }
                  type: query
        noDataState: OK
        execErrState: Error
        for: 0s
        keepFiringFor: 30m
        isPaused: false
        labels:
          severity: critical
          spec: SPEC-SEC-IDENTITY-ASSERT-001
          service_group: litellm
          page: "true"
        annotations:
          summary: 'LiteLLM daily spend ceiling reached for klai-large: customer chat has no model left'
          runbook_url: 'docs/runbooks/litellm-provider-auth-failed.md'
          description: |
            klai-large spent its daily max_budget (deploy/litellm/config.yaml).
            klai-primary and klai-fast fall back to it, so customer chat now
            answers errors until the 24h window resets or LiteLLM restarts
            (spend is counted in process memory).

            Triage:
              1. VictoriaLogs: _time:1h service:litellm "crossed budget" "model_name: klai-large,"
              2. Find the caller that drove the spend (bulk ingest, an eval run,
                 a routing change). Normal traffic that outgrew the budget:
                 raise max_budget for klai-large in config.yaml and recreate
                 the container. Unexpected traffic: stop the caller.
