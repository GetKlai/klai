# Contact points for Grafana-managed alerting.
#
# SMTP is configured in deploy/docker-compose.yml grafana service via GF_SMTP_*
# env vars (Cloud86 shared199.cloud86-host.io:587, from hello@getklai.com).
# GRAFANA_SMTP_PASSWORD lives in klai-infra/core-01/.env.sops.
#
# Defined here:
#   - grafana-default-email  — fall-through receiver for alerts without a
#                              matching notification-policy route. MUST be
#                              provisioned (Grafana's auto-installed default
#                              ships with a placeholder `<example@email.com>`
#                              that bounces, causing inbox flood).
#   - klai-dev-alerts-email  — SEC-024-R13: security/dev alerts (proxy denials)
#   - klai-ops-alerts-email  — OBS-001-R4:  operational alerts (golden signals)
#   - heartbeat-kuma         — OBS-001-R22: webhook to Uptime Kuma push-monitor
#                                           on public-01 for dead-man's switch
#
# All email contacts deliver to hello@getklai.com (the team mailbox at Cloud86).
# Separate receivers exist so the rules can later diverge without rewriting,
# but for now they share one destination.
#
# heartbeat-kuma posts to Uptime Kuma's push API every 5 min. If Grafana
# stops pushing (alerter is down), Kuma fires its own SMTP alert via a
# notification channel configured directly in Kuma (not via klai-mailer
# or Cloud86 from Grafana — see runbook alerter-down-recovery for the
# isolation guarantees).

apiVersion: 1

contactPoints:
  # Default fall-through receiver. Grafana auto-installs a "grafana-default-email"
  # contact point with `<example@email.com>` on first boot if none is provisioned
  # — that placeholder bounces at Cloud86 → mx84.mail.com (550 mailbox unavailable),
  # and the bounce DSN lands in hello@getklai.com. We explicitly provision it here
  # so the default points at a real mailbox instead.
  - orgId: 1
    name: grafana-default-email
    receivers:
      - uid: grafana-default-email-primary
        type: email
        settings:
          addresses: hello@getklai.com
          singleEmail: false
          # NOTE: `| default "x"` is a Sprig function that Grafana's alert
          # templating does NOT provide — it fails with `function "default"
          # not defined` on EVERY notification through this receiver and the
          # email falls back to partial/default content (found 2026-08-12 by
          # live-firing the mail-chain alert). Use if/else instead.
          subject: '[KLAI-ALERT fallback] {{ if .CommonLabels.alertname }}{{ .CommonLabels.alertname }}{{ else }}unknown{{ end }}'
        disableResolveMessage: false

  - orgId: 1
    name: klai-dev-alerts-email
    receivers:
      - uid: klai-dev-alerts-email-primary
        type: email
        settings:
          addresses: hello@getklai.com
          singleEmail: true
          subject: "[Klai alert] {{ .GroupLabels.alertname }} — {{ .GroupLabels.service }}"
          message: |
            {{ range .Alerts -}}
            [{{ .Status | toUpper }}] {{ .Labels.alertname }}
            Service: {{ .Labels.service }}
            Severity: {{ .Labels.severity }}

            {{ .Annotations.summary }}

            {{ .Annotations.description }}

            Started: {{ .StartsAt }}
            Dashboard: {{ .GeneratorURL }}
            {{- end }}
        disableResolveMessage: false

  - orgId: 1
    name: klai-ops-alerts-email
    receivers:
      - uid: klai-ops-alerts-email-primary
        type: email
        settings:
          addresses: hello@getklai.com
          singleEmail: false
          # See the `default`-is-not-a-Grafana-template-function note on the
          # fallback receiver above — same fix applied here (2026-08-12).
          subject: '[KLAI-ALERT-{{ if .CommonLabels.severity }}{{ .CommonLabels.severity }}{{ else }}info{{ end }}] {{ .CommonLabels.alertname }}'
          message: |
            {{ range .Alerts -}}
            [{{ .Status | toUpper }}] {{ .Labels.alertname }}
            Service: {{ .Labels.service }}
            Severity: {{ .Labels.severity }}
            {{ if .Labels.request_id }}request_id: {{ .Labels.request_id }}{{ end }}
            {{ if .Labels.slug }}slug: {{ .Labels.slug }}{{ end }}
            {{ if .Labels.container }}container: {{ .Labels.container }}{{ end }}

            {{ .Annotations.summary }}

            {{ .Annotations.description }}

            Runbook: {{ .Annotations.runbook_url }}
            Started: {{ .StartsAt }}
            Dashboard: {{ .GeneratorURL }}
            {{- end }}
        disableResolveMessage: false

  - orgId: 1
    name: heartbeat-kuma
    receivers:
      - uid: heartbeat-kuma-push
        type: webhook
        settings:
          url: ${KUMA_HEARTBEAT_URL}
          # Grafana webhook only supports PUT/POST (refuses GET with
          # "webhook only supports HTTP methods PUT or POST"). Uptime
          # Kuma push API accepts POST with the same query-string
          # params already in the URL — body is ignored on push routes.
          httpMethod: POST
        disableResolveMessage: true
