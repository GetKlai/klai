# SPEC-OBS-002 — vmauth config (DRAFT — not yet active in production)
#
# This config validates incoming JWTs against Zitadel via OIDC discovery
# and injects upstream basic-auth toward VictoriaLogs so VL itself sees
# the auth it expects (no VL changes needed).
#
# Reload-on-change: vmauth picks up edits within 30s
# (`-configCheckInterval=30s` in compose) — no container restart needed.
#
# Activation prerequisites (until ALL are met, this config is dormant
# because Caddy's `vlogs-test.{$DOMAIN}` route is also commented out):
#   1. Zitadel app `klai-vmauth/vlogs-cli` exists (see SPEC-OBS-002
#      notes/04-zitadel-app-setup.md).
#   2. Audience claim value confirmed (M2 work — pending Q5 resolution).
#   3. M2 smoke-tests pass: 401 with no JWT, 200 with valid JWT, 401
#      with wrong audience / signature / iss / exp.

users:
  - jwt:
      oidc:
        issuer: "https://auth.getklai.com"
      # match_claims constrains which JWTs vmauth accepts:
      # - aud must include the klai-vmauth project ID so JWTs minted for
      #   other Klai apps (portal, librechat, knowledge-mcp, etc.) don't
      #   grant log-query access. Zitadel includes the project_id in `aud`
      #   automatically when the auth-code flow uses scope
      #   `urn:zitadel:iam:org:project:id:<id>:aud` OR by default if the
      #   user has a project grant.
      # - iss equality is enforced by vmauth automatically when oidc.issuer
      #   is configured; listing it here is defense-in-depth.
      # match_claims temporarily REMOVED while we diagnose why vmauth
      # silently drops JWT users with match_claims set. The oidc.issuer
      # alone enforces signature + iss + exp; for the moment this is
      # adequate. After diagnosis, re-add audience match.
    # Forward all paths to VictoriaLogs select endpoint.
    url_prefix: "http://victorialogs:9428/"
    # NOTE — headers block temporarily removed while diagnosing why
    # vmauth silently drops the JWT user. Will reach VL without
    # upstream auth → VL returns 401 itself, but the test for vmauth
    # accepting the JWT works (we'll see vmauth → VL → 401 instead of
    # vmauth → 401).

# Unauthorized requests (no matching user) get 401 by default.
# No `unauthorized_user` block is set on purpose — log access requires
# authentication, period.
