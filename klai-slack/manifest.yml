# Slack app manifest for Klai in Slack (SPEC-SLACK-001 §7.4).
# Create the app from this file: api.slack.com/apps -> Create New App -> From a
# manifest. Request URLs point at the public api. host; Caddy routes /slack/* to
# klai-slack. Field names follow https://docs.slack.dev/reference/app-manifest
# (checked 2026-10-28). Builds on agent_view, not the retired assistant_view.
display_information:
  name: Klai
  # Slack shows one language to every user, so the app's own listing is in
  # English; the messages Klai sends follow each user's Slack language. The
  # icon is not part of a manifest: upload assets/app-icon.png under Basic
  # Information -> Display Information.
  description: Answers from your organisation's knowledge bases, with sources.
  long_description: >-
    Klai answers your team's questions from the knowledge bases your
    organisation has connected to Klai, and shows the sources behind every
    answer.


    Ask Klai in a direct message, where only you see the question and the
    answer, or mention @Klai in a channel. Klai always replies in a thread.


    By default Klai searches every knowledge base your organisation has
    released for Slack. Use "Choose knowledge bases" under an answer to narrow
    the search for that conversation. Workspace admins set the knowledge bases
    for a channel with /klai kb, and /klai help shows what Klai searches in a
    channel.


    Which knowledge bases Slack may use is decided by your Klai administrator
    in the Klai portal. Klai can make mistakes, so check important answers in
    the source.
  background_color: "#191918"
features:
  bot_user:
    display_name: Klai
    always_online: true
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  agent_view:
    # No suggested_prompts here: static prompts make Slack refuse the
    # per-language prompts the app sets on app_home_opened with
    # static_prompts_configured (seen in production on 2026-10-29).
    agent_description: >-
      Klai answers from every knowledge base your organisation has released
      for Slack and shows the sources. Want to search fewer? Use "Choose
      knowledge bases" under an answer. The Home tab lists which knowledge
      bases they are.
  slash_commands:
    - command: /klai
      url: https://api.getklai.com/slack/events
      description: Set up and use Klai
      usage_hint: kb | help
      should_escape: false
oauth_config:
  redirect_urls:
    - https://api.getklai.com/slack/oauth_redirect
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
      - im:write
      - channels:history
      - groups:history
      - commands
      - users:read
      - assistant:write
settings:
  event_subscriptions:
    request_url: https://api.getklai.com/slack/events
    bot_events:
      - app_mention
      - message.im
      - app_home_opened
      - app_uninstalled
      - tokens_revoked
  interactivity:
    is_enabled: true
    request_url: https://api.getklai.com/slack/events
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
