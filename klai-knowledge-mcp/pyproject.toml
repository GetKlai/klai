[project]
name = "klai-knowledge-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.9.0",
    "httpx>=0.27.0",
    "uvicorn[standard]>=0.30.0",
    "structlog>=25.0",
    # SPEC-SEC-IDENTITY-ASSERT-001 REQ-7.4: identity verification helper
    # consumed by save_personal_knowledge / save_org_knowledge / save_to_docs.
    # Editable install — mirrors klai-image-storage pattern in knowledge-ingest.
    "klai-identity-assert",
    # SPEC-SEC-INTERNAL-001 REQ-4 / REQ-8: shared sanitize_response_body +
    # secret-introspection helpers used by every upstream-error log/return path.
    "klai-log-utils",
    "klai-retrieval-telemetry",
    # SPEC-RAG-PERSONAL-SCOPE-001 REQ-1: canonical personal-KB slug helper.
    # Single source of truth shared with portal-api + retrieval-api +
    # knowledge-ingest. Used by save_personal_knowledge to build the
    # kb_slug for the user's canonical Persoonlijk-KB.
    "klai-kb-slugs",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pyright>=1.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.uv.sources]
klai-identity-assert = { path = "../klai-libs/identity-assert", editable = true }
klai-log-utils = { path = "../klai-libs/log-utils", editable = true }
# SPEC-MCP-RETRIEVAL-001 Phase 1: shared retrieval telemetry helpers used
# by the search_knowledge tool (gap-events, retrieval-log POSTs). Editable
# path-dep so changes to the canonical lib propagate without a republish.
klai-retrieval-telemetry = { path = "../klai-libs/retrieval-telemetry", editable = true }
klai-kb-slugs = { path = "../klai-libs/kb-slugs", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF", "G", "LOG"]
ignore = [
    "S101",  # assert is fine in tests
    "S105",  # hardcoded passwords — too many false positives on config defaults
]
