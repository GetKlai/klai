"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
# ~/bin/dev-code-tools (dotfiles repo ai-dev-workflow, shared by every repo
# on this machine) builds the per-worktree zvec-grep, Serena and
# codebase-memory-mcp indexes and records its state, so the SessionStart hook
# waits for a build that is still running instead of reporting a missing
# index: Conductor no longer holds the first chat for setup. It goes first,
# because the index takes ~45 s and npm/uv can take minutes, and is joined
# with ";" so a failed index never skips the dependency install. The dotfiles
# installer prepends the same command when it is absent, which is how this
# repo indexed every new workspace twice before 2026-10-29 — see
# docs/setup/code-intelligence.md.
setup = "~/bin/dev-code-tools setup \"$PWD\"; make setup"
# ~/bin/dev-code-tools archive drops this workspace's zvec-grep index from the
# shared daemon (which otherwise keeps the vanished root registered and refreshes
# a ghost: on 2026-10-29 two removed worktrees left it at 3.3 GB and unable to
# answer) and deletes the codebase-memory-mcp project, whose graph lives in
# ~/.cache and not in the workspace. It runs while the directory still exists.
#
# The guard is the second half and the one that matters beyond this repo:
# archiving is exactly the moment a shared daemon can be left rooted in a
# directory that is about to stop existing, which breaks indexing for EVERY
# repo on the machine while still reporting "ready". Running it here rehomes
# the daemon to $HOME while this directory is still there.
archive = "~/bin/dev-code-tools archive \"$PWD\" >/dev/null 2>&1 || true; ./scripts/code-daemon-guard.sh >/dev/null 2>&1 || true"
run_mode = "concurrent"

[scripts.run.dev]
# CONDUCTOR_PORT only exists in local workspaces, and this starts a Vite dev
# server on it.
available_in = ["local"]
command = "make local-dev-status && make frontend"
default = true
icon = "play"
